<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스킬 목록 — 인스턴트 스킬 한눈에</title>
<style>
  :root{ --bg:#1b1a22; --panel:#26242f; --line:#3a3848; --ink:#eae6f2; --dim:#a79fbb;
         --cy:#7fd7c4; --mark:#d8477e; --base:#6bd98f; --maj:#f2d74e; --up:#c79bf2;
         --gate:#f08ab0; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,"Segoe UI",sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
         padding:10px 14px;display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center}
  header h1{font-size:14px;margin:0 6px 0 0;font-weight:800}
  label.f{display:flex;gap:6px;align-items:center;color:var(--dim)}
  select,button,input{font:inherit;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:4px 8px}
  button{cursor:pointer} button:hover{border-color:var(--dim)}
  button.go{border-color:var(--cy);color:var(--cy)}
  input[type=search]{min-width:150px}
  /* 분류 고르개 — 누른 것만 켜집니다 */
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);
        color:var(--dim);cursor:pointer;font:inherit;font-size:12px}
  .chip.on{border-color:currentColor}
  .chip[data-k=base].on{color:var(--base)} .chip[data-k=maj].on{color:var(--maj)}
  .chip[data-k=all].on{color:var(--cy)}
  #status{padding:6px 14px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line)}
  #sum{padding:8px 14px;font-size:12px;color:var(--dim)}
  #sum b{color:var(--ink)}
  .tw{overflow:auto;max-height:calc(100vh - 132px);border-top:1px solid var(--line)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
  th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;
        white-space:nowrap}
  th{position:sticky;top:0;background:#221f2b;z-index:2;cursor:pointer;user-select:none;
     font-weight:700;color:var(--dim);border-bottom:1px solid var(--line)}
  th:hover{color:var(--ink)}
  th .ar{font-size:10px;opacity:.85;margin-left:3px}
  tbody tr:hover{background:#242230}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  td.d,td.cond{white-space:normal;min-width:170px;color:var(--dim)}
  td.d{min-width:260px;color:var(--ink)}
  td.cond{max-width:300px}
  td.k{color:#5d5870;font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
  .kd{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
  .kd.base{background:#28402f;color:var(--base)}
  .kd.maj{background:#403820;color:var(--maj)}
  .kd.gate{background:#4a2438;color:var(--gate)}
  .nm b{font-weight:700}
  .nm .plus{color:var(--up)}
  tr.up td{background:rgba(120,70,190,.10)}
  tr.maj td{background:rgba(200,170,50,.06)}
  .none{color:#5d5870}
  .hint{color:var(--dim);font-size:12px;padding:10px 14px;line-height:1.7}
</style>

<header>
  <h1>스킬 목록</h1>
  <div class="chips" id="kinds"></div>
  <label class="f">전공 <select id="maj"></select></label>
  <label class="f">갈래 <select id="br"></select></label>
  <label class="f"><input type="checkbox" id="showup" checked> 상위(+) 보기</label>
  <input type="search" id="q" placeholder="이름·효과·조건 검색">
  <button id="tsv">표 복사(TSV)</button>
  <button class="go" id="reload">index.html 다시 읽기</button>
</header>

<div id="status">index.html 읽는 중…</div>
<div id="sum"></div>
<div class="tw"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<div class="hint">
  머리글을 누르면 그 열로 정렬합니다(한 번 더 누르면 반대 순서). 처음에는 전공 → 갈래 → 단계 순입니다.<br>
  모든 값은 index.html 의 <code>INSTANTS</code> 에서 그때그때 읽어옵니다. 이 파일에는 스킬 자료를 따로 두지 않습니다.
</div>

<!-- index 의 render() 가 쓰는 자리. 여기서는 화면을 안 그리므로 숨겨 둡니다 -->
<div id="app" hidden></div>

<script>
/* ─────────────────────────────────────────────────────────────────────────
   아이템목록.html 과 같은 방식입니다 — index.html 의 <script> 를 통째로 읽어
   이 페이지에서 실행한 뒤 INSTANTS · MAJORS · GATES 를 그대로 읽어 표로 폅니다.
   자료를 베껴 두지 않으므로 표와 게임이 어긋날 일이 없습니다.
   file:// 로 열면 fetch 가 막히므로 파일 고르기로 넘어갑니다(크롬 계열).
   ───────────────────────────────────────────────────────────────────────── */
(function(){
"use strict";

const $=id=>document.getElementById(id);
const statusEl=$("status");
function setStatus(t,ok){ statusEl.textContent=t;
  statusEl.style.color = ok===true?"var(--cy)" : ok===false?"var(--mark)" : "var(--dim)"; }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── index.html 읽기: 저장된 파일 핸들 → fetch → 파일 고르기 ── */
const FS_OK=!!window.showOpenFilePicker;
let idxHandle=null;
function hdb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("uch-rig-tool",1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("h")) r.result.createObjectStore("h"); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function hget(){ try{ const d=await hdb(); return await new Promise((res,rej)=>{
  const t=d.transaction("h").objectStore("h").get("index");
  t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }catch(e){ return null; } }
async function hset(v){ try{ const d=await hdb(); await new Promise((res,rej)=>{
  const t=d.transaction("h","readwrite"); t.objectStore("h").put(v,"index");
  t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }catch(e){} }
async function perm(h,mode){
  if(!h.queryPermission) return true;
  if(await h.queryPermission({mode})==="granted") return true;
  return (await h.requestPermission({mode}))==="granted";
}
async function readIndexText(allowPick){
  if(idxHandle && await perm(idxHandle,"read"))
    return (await idxHandle.getFile()).text();
  try{
    const res=await fetch("index.html",{cache:"no-store"});
    if(res.ok) return res.text();
    throw new Error("HTTP "+res.status);
  }catch(err){
    if(!allowPick || !FS_OK) throw err;
    const [h]=await window.showOpenFilePicker({types:[{description:"HTML",accept:{"text/html":[".html",".htm"]}}]});
    idxHandle=h; await hset(h);
    return (await h.getFile()).text();
  }
}

let RAW="", booted=false;
async function loadIndex(allowPick){
  RAW=await readIndexText(allowPick);
  const code=[...RAW.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).join("\n");
  if(!/const\s+INSTANTS\s*=/.test(code)) throw new Error("index.html 에서 INSTANTS 를 못 찾음");
  if(booted){ location.reload(); return; }        // 두 번 주입하면 const 재선언으로 깨진다
  const s=document.createElement("script");
  s.textContent=code;
  document.body.appendChild(s);                    // 전역 스코프에서 동기 실행
  booted=true;
  if(!Array.isArray(INSTANTS)) throw new Error("index 스크립트가 실행되지 않음");
}

/* ═══════════ 갈래 이름 ═══════════
   br 은 저장용 열쇠라 그대로 두고, 보여줄 때만 우리말로 바꿉니다. */
const BRN={aspd:"공격 속도",atkP:"공격력%",atkF:"공격력 고정",hpF:"최대 체력",
           guardF:"피해 감소",dodge:"회피·이동",heal:"회복",rng:"사거리",crit:"치명타",
           mix:"복합",atk:"공격력",guard:"피해 감소",hp:"최대 체력"};
const brName=b=>BRN[b]||b||"—";

/* ── 획득 조건 ──
   maj·up·needAll·gate 는 자료에서 그대로 읽고, req 는 함수라서 소스를 읽어 다듬습니다
   (인내·숙련 둘뿐입니다). 조건이 붙는 자리가 늘면 여기만 손보면 됩니다. */
function reqText(fn){
  let s=String(fn).replace(/^[\s\S]*?=>\s*/,"");
  s=s.replace(/\((?:t\.)?(\w+)\s*\|\|\s*0\)/g,(m,k)=>brName(k));
  s=s.replace(/t\.(\w+)/g,(m,k)=>brName(k));
  s=s.replace(/\s*&&\s*/g," 그리고 ").replace(/\s*\|\|\s*/g," 또는 ");
  s=s.replace(/>=/g," ≥ ").replace(/\+/g," + ").replace(/\s+/g," ");
  return s.trim();
}
function condOf(s){
  const out=[];
  if(s.maj)out.push(`${(majorOf(s.maj)||{n:s.maj}).n} 대원이 파티에 있을 때`);
  if(s.gate){const g=GATES.find(x=>x.id===s.gate);out.push(`${g?g.n:s.gate} 안에서만`)}
  if(s.up)out.push(`${nameOf(s.up)} 을(를) 가졌을 때 · 고르면 그 자리를 대신함`);
  if(s.needAll)out.push(s.needAll.map(g=>g.map(nameOf).join(" 또는 ")).join(" 그리고 ")+" 를 가졌을 때");
  if(s.req)out.push("갈래 합계 "+reqText(s.req));
  return out.length?out:["처음부터"];
}
const nameOf=k=>{const s=INSTANTS.find(x=>x.k===k);return s?s.n:k};
/* 상위 사슬의 깊이 — 기본 0, + 1, ++ 2 */
function tier(s){let n=0,u=s.up;while(u){n++;u=(INSTANTS.find(x=>x.k===u)||{}).up}return n}
const TIER=["기본","상위 +","상위 ++"];

/* 열 정의 — key 는 정렬값, html 은 보이는 것 */
let COLS=[];
function makeCols(){
  COLS=[
    {id:"kind", t:"분류",  w:r=>r.maj?1:0,
     h:r=>r.maj?`<span class="kd maj">전공</span>`:`<span class="kd base">일반</span>`},
    {id:"major",t:"전공",  w:r=>r.majN,  h:r=>r.maj?esc(r.majN):dash()},
    {id:"br",   t:"갈래",  w:r=>brName(r.s.br), h:r=>esc(brName(r.s.br))},
    {id:"name", t:"이름",  w:r=>r.s.n,   h:r=>`<span class="nm">${nameHtml(r.s)}</span>`},
    {id:"tier", t:"단계",  w:r=>r.tier,  h:r=>esc(TIER[r.tier]||("상위 "+r.tier))},
    {id:"d",    t:"효과",  w:r=>r.s.d||"", cls:"d", h:r=>esc(r.s.d||"")},
    {id:"v",    t:"값",    w:r=>r.s.v||0, num:1, h:r=>r.s.v?String(r.s.v):dash()},
    {id:"up",   t:"선행",  w:r=>r.s.up?nameOf(r.s.up):"", h:r=>r.s.up?esc(nameOf(r.s.up)):dash()},
    {id:"cond", t:"획득 조건", w:r=>r.cond.join(", "), cls:"cond", h:r=>esc(r.cond.join(" · "))},
    {id:"k",    t:"열쇠",  w:r=>r.s.k, cls:"k", h:r=>esc(r.s.k)},
  ];
}
const dash=()=>'<span class="none">—</span>';
function nameHtml(s){
  const m=s.n.match(/^(.*?)(\++)$/);
  return m?`<b>${esc(m[1])}</b><span class="plus">${m[2]}</span>`:`<b>${esc(s.n)}</b>`;
}

let ROWS=[];
function buildRows(){
  ROWS=INSTANTS.map(s=>({
    s, maj:s.maj||null,
    majN:s.maj?((majorOf(s.maj)||{n:s.maj}).n):"",
    tier:tier(s), cond:condOf(s),
  }));
}

/* ═══════════ 거르기 · 정렬 · 그리기 ═══════════ */
let kindSel="all", majSel="", brSel="", showUp=true, q="";
let sortId="", sortDir=1;

/* 처음 차례 — 일반 먼저, 전공은 전공 이름순, 그 안에서 갈래·단계 순 */
function defaultCmp(a,b){
  return (a.maj?1:0)-(b.maj?1:0)
      || a.majN.localeCompare(b.majN,"ko")
      || brName(a.s.br).localeCompare(brName(b.s.br),"ko")
      || a.s.n.localeCompare(b.s.n,"ko")
      || a.tier-b.tier;
}
function visible(){
  const t=q.trim().toLowerCase();
  return ROWS.filter(r=>{
    if(!showUp&&r.tier>0)return false;
    if(kindSel==="maj"&&!r.maj)return false;
    if(kindSel==="base"&&r.maj)return false;
    if(majSel&&r.maj!==majSel)return false;
    if(brSel&&r.s.br!==brSel)return false;
    if(t){
      const hay=`${r.s.n} ${r.s.k} ${r.s.d||""} ${r.majN} ${r.cond.join(" ")}`.toLowerCase();
      if(!hay.includes(t))return false;
    }
    return true;
  }).sort((a,b)=>{
    if(!sortId)return defaultCmp(a,b);
    const c=COLS.find(x=>x.id===sortId)||COLS[0];
    const x=c.w(a), y=c.w(b);
    const d=(typeof x==="number"&&typeof y==="number")?x-y:String(x).localeCompare(String(y),"ko");
    return d*sortDir || defaultCmp(a,b);
  });
}

function draw(){
  $("head").innerHTML=COLS.map(c=>
    `<th data-c="${c.id}">${c.t}${sortId===c.id?`<span class="ar">${sortDir>0?"▲":"▼"}</span>`:""}</th>`).join("");
  const rows=visible();
  $("body").innerHTML=rows.map(r=>`<tr class="${r.tier?"up":r.maj?"maj":""}">`+
    COLS.map(c=>`<td class="${c.cls||""}${c.num?" n":""}">${c.h(r)}</td>`).join("")+`</tr>`).join("");
  $("head").querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const id=th.dataset.c;
    if(sortId===id)sortDir=-sortDir; else {sortId=id;sortDir=1;}
    draw();
  });
  /* 요약 — 얻을 수 있는 전공(학과사무실이 맡는 것)과 아직 못 얻는 전공을 갈라 셉니다 */
  const gen=ROWS.filter(r=>!r.maj).length, mj=ROWS.length-gen;
  const kinds=new Set(ROWS.filter(r=>r.maj).map(r=>r.maj)).size;
  $("sum").innerHTML=`스킬 <b>${ROWS.length}</b>종 · 일반 <b>${gen}</b> · 전공 <b>${mj}</b>`
    +` (전공 <b>${kinds}</b>가지) &nbsp;|&nbsp; 지금 보이는 것 <b>${rows.length}</b>줄`;
}

function fillFilters(){
  $("kinds").innerHTML=[{k:"all",n:"전체"},{k:"base",n:"일반"},{k:"maj",n:"전공"}].map(x=>
    `<button class="chip${x.k===kindSel?" on":""}" data-k="${x.k}">${x.n}</button>`).join("");
  $("kinds").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    kindSel=b.dataset.k; fillFilters(); draw();
  });
  const majs=[...new Set(ROWS.filter(r=>r.maj).map(r=>r.maj))]
    .sort((a,b)=>((majorOf(a)||{n:a}).n).localeCompare((majorOf(b)||{n:b}).n,"ko"));
  $("maj").innerHTML=`<option value="">전체</option>`
    +majs.map(id=>`<option value="${id}"${id===majSel?" selected":""}>${(majorOf(id)||{n:id}).n}</option>`).join("");
  const brs=[...new Set(ROWS.map(r=>r.s.br).filter(Boolean))]
    .sort((a,b)=>brName(a).localeCompare(brName(b),"ko"));
  $("br").innerHTML=`<option value="">전체</option>`
    +brs.map(b=>`<option value="${b}"${b===brSel?" selected":""}>${brName(b)}</option>`).join("");
}

/* 표를 그대로 스프레드시트에 붙여 넣을 수 있게 */
function toTSV(){
  const head=COLS.map(c=>c.t).join("\t");
  const body=visible().map(r=>COLS.map(c=>{
    const d=document.createElement("div"); d.innerHTML=c.h(r);
    return d.textContent.replace(/\s+/g," ").replace(/^—$/,"").trim();
  }).join("\t")).join("\n");
  return head+"\n"+body;
}

/* ═══════════ 시작 ═══════════ */
async function start(allowPick){
  try{
    setStatus("index.html 읽는 중…");
    await loadIndex(allowPick);
    makeCols(); buildRows(); fillFilters(); draw();
    setStatus(`index.html 에서 스킬 ${ROWS.length}종을 읽었습니다. 머리글을 눌러 정렬하세요.`,true);
  }catch(err){
    setStatus("불러오기 실패: "+err.message
      +(FS_OK?" — 'index.html 다시 읽기' 를 눌러 파일을 직접 고르세요."
             :" — 로컬 파일이면 브라우저가 fetch 를 막습니다. 서버로 여세요."),false);
  }
}
$("reload").onclick=()=>start(true);
$("maj").onchange=e=>{ majSel=e.target.value; draw(); };
$("br").onchange=e=>{ brSel=e.target.value; draw(); };
$("showup").onchange=e=>{ showUp=e.target.checked; draw(); };
$("q").oninput=e=>{ q=e.target.value; draw(); };
$("tsv").onclick=async()=>{
  try{ await navigator.clipboard.writeText(toTSV()); setStatus("표를 클립보드에 복사했습니다(TSV).",true); }
  catch(e){ setStatus("복사 실패: "+e.message,false); }
};
(async()=>{ if(FS_OK){ try{ idxHandle=await hget(); }catch(e){} } start(false); })();

})();
</script>
</html>
