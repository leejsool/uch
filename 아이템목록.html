<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이템 목록 — 인게임 물건 한눈에</title>
<style>
  :root{ --bg:#1b1a22; --panel:#26242f; --line:#3a3848; --ink:#eae6f2; --dim:#a79fbb;
         --cy:#7fd7c4; --mark:#d8477e; --perm:#6bd98f; --inst:#f08ab0; --junk:#a79fbb;
         --ammo:#e0c060; --dark:#c79bf2; --work:#7fd8f0; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,"Segoe UI",sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
         padding:10px 14px;display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center}
  header h1{font-size:14px;margin:0 6px 0 0;font-weight:800}
  label.f{display:flex;gap:6px;align-items:center;color:var(--dim)}
  select,button,input{font:inherit;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:4px 8px}
  button{cursor:pointer} button:hover{border-color:var(--dim)}
  button.go{border-color:var(--cy);color:var(--cy)}
  input[type=search]{min-width:150px}
  /* 분류 고르개 — 누른 것만 켜집니다 */
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);
        color:var(--dim);cursor:pointer;font:inherit;font-size:12px}
  .chip.on{border-color:currentColor}
  .chip[data-k=perm].on{color:var(--perm)} .chip[data-k=inst].on{color:var(--inst)}
  .chip[data-k=junk].on{color:var(--junk)} .chip[data-k=ammo].on{color:var(--ammo)}
  .chip[data-k=all].on{color:var(--cy)}
  #status{padding:6px 14px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line)}
  #sum{padding:8px 14px;font-size:12px;color:var(--dim)}
  #sum b{color:var(--ink)}
  .tw{overflow:auto;max-height:calc(100vh - 132px);border-top:1px solid var(--line)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
  th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;
        white-space:nowrap}
  th{position:sticky;top:0;background:#221f2b;z-index:2;cursor:pointer;user-select:none;
     font-weight:700;color:var(--dim);border-bottom:1px solid var(--line)}
  th:hover{color:var(--ink)}
  th .ar{font-size:10px;opacity:.85;margin-left:3px}
  tbody tr:hover{background:#242230}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  td.d,td.src,td.memo{white-space:normal;min-width:150px;color:var(--dim)}
  td.d{min-width:210px;color:var(--ink)}
  td.src{max-width:280px}
  td.memo{max-width:220px}
  .kd{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
  .kd.perm{background:#28402f;color:var(--perm)} .kd.inst{background:#4a2438;color:var(--inst)}
  .kd.inst.dk{background:#2c1345;color:var(--dark)}
  .kd.perm.wk{background:#12384a;color:var(--work)}
  .kd.junk{background:#3a3450;color:var(--junk)} .kd.ammo{background:#3d3520;color:var(--ammo)}
  .nm{display:flex;align-items:center;gap:8px}
  .nm b{font-weight:700}
  .nm .plus{color:var(--dark)} .nm .plus.wk{color:var(--work)}
  .ico{width:30px;height:30px;flex:0 0 30px;object-fit:contain;background:#1f1c29;
       border-radius:5px;padding:2px}
  .ico.none{display:inline-block;border:1px dashed var(--line);background:none}
  /* 강화판은 원본 그림에 아우라만 입혀 보여 줍니다 — 게임과 같은 방식.
     어둠 에너지 결정(현장품)은 검보라, 실습동(반출품)은 푸른색입니다. */
  .ico.dk{filter:brightness(.88) contrast(1.12) saturate(.8)
          drop-shadow(0 0 2px #000) drop-shadow(0 0 5px rgba(122,44,200,.9))}
  .ico.wk{filter:brightness(1.06) contrast(1.06) saturate(1.1)
          drop-shadow(0 0 2px rgba(0,30,50,.9)) drop-shadow(0 0 5px rgba(60,190,240,.9))}
  .ico.crys{background:radial-gradient(circle at 38% 32%,#c89bfa 0%,#6b2cae 44%,#170b29 100%);
            clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);padding:0}
  tr.dark td{background:rgba(90,40,140,.10)}
  tr.up td{background:rgba(30,120,170,.10)}
  .gold{color:var(--ammo)}
  .none{color:#5d5870}
  .hint{color:var(--dim);font-size:12px;padding:10px 14px;line-height:1.7}
</style>

<header>
  <h1>아이템 목록</h1>
  <div class="chips" id="kinds"></div>
  <label class="f">칸 <select id="slot"></select></label>
  <label class="f">성능 <select id="perf">
    <option value="both">설명+수치</option>
    <option value="num">수치만</option>
    <option value="txt">설명만</option>
  </select></label>
  <label class="f"><input type="checkbox" id="showdk" checked> 강화판(+) 보기</label>
  <input type="search" id="q" placeholder="이름·설명·획득처 검색">
  <button id="tsv">표 복사(TSV)</button>
  <button class="go" id="reload">index.html 다시 읽기</button>
</header>

<div id="status">index.html 읽는 중…</div>
<div id="sum"></div>
<div class="tw"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<div class="hint">
  머리글을 누르면 그 열로 정렬합니다(한 번 더 누르면 반대 순서). 분류는 반출 → 현장 → 잡화 → 탄약 순입니다.<br>
  모든 값은 index.html 에서 그때그때 읽어옵니다. 이 파일에는 아이템 자료를 따로 두지 않습니다.
</div>

<!-- index 의 render() 가 쓰는 자리. 여기서는 화면을 안 그리므로 숨겨 둡니다 -->
<div id="app" hidden></div>

<script>
/* ─────────────────────────────────────────────────────────────────────────
   index.html 의 <script> 를 통째로 읽어 이 페이지에서 실행한 뒤,
   거기 정의된 ITEMS · PLACES · SHOP · ITEM_ART 를 그대로 읽어 표로 폅니다.
   그래서 표와 게임이 어긋날 수 없습니다. 게임 화면은 그리지 않습니다.
   file:// 로 열면 fetch 가 막히므로 파일 고르기로 넘어갑니다(크롬 계열).
   ───────────────────────────────────────────────────────────────────────── */
(function(){
"use strict";

const $=id=>document.getElementById(id);
const statusEl=$("status");
function setStatus(t,ok){ statusEl.textContent=t;
  statusEl.style.color = ok===true?"var(--cy)" : ok===false?"var(--mark)" : "var(--dim)"; }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── index.html 읽기: 저장된 파일 핸들 → fetch → 파일 고르기 ── */
const FS_OK=!!window.showOpenFilePicker;
let idxHandle=null;
function hdb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("uch-rig-tool",1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("h")) r.result.createObjectStore("h"); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function hget(){ try{ const d=await hdb(); return await new Promise((res,rej)=>{
  const t=d.transaction("h").objectStore("h").get("index");
  t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }catch(e){ return null; } }
async function hset(v){ try{ const d=await hdb(); await new Promise((res,rej)=>{
  const t=d.transaction("h","readwrite"); t.objectStore("h").put(v,"index");
  t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }catch(e){} }
async function perm(h,mode){
  if(!h.queryPermission) return true;
  if(await h.queryPermission({mode})==="granted") return true;
  return (await h.requestPermission({mode}))==="granted";
}
async function readIndexText(allowPick){
  if(idxHandle && await perm(idxHandle,"read"))
    return (await idxHandle.getFile()).text();
  try{
    const res=await fetch("index.html",{cache:"no-store"});
    if(res.ok) return res.text();
    throw new Error("HTTP "+res.status);
  }catch(err){
    if(!allowPick || !FS_OK) throw err;
    const [h]=await window.showOpenFilePicker({types:[{description:"HTML",accept:{"text/html":[".html",".htm"]}}]});
    idxHandle=h; await hset(h);
    return (await h.getFile()).text();
  }
}

let RAW="", booted=false;
async function loadIndex(allowPick){
  RAW=await readIndexText(allowPick);
  const code=[...RAW.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).join("\n");
  if(!/const\s+ITEMS\s*=/.test(code)) throw new Error("index.html 에서 ITEMS 를 못 찾음");
  if(booted){ location.reload(); return; }        // 두 번 주입하면 const 재선언으로 깨진다
  const s=document.createElement("script");
  s.textContent=code;
  document.body.appendChild(s);                    // 전역 스코프에서 동기 실행
  booted=true;
  if(typeof ITEMS!=="object") throw new Error("index 스크립트가 실행되지 않음");
}

/* ═══════════ 표 만들기 ═══════════ */
const KINDS=[{k:"perm",n:"반출"},{k:"inst",n:"현장"},{k:"junk",n:"잡화"},{k:"ammo",n:"탄약"}];
const kindIdx=k=>KINDS.findIndex(x=>x.k===k);
const pct=v=>`${v<0?"−":"+"}${Math.round(Math.abs(v)*100)}%`;

/* 튜토리얼 지급품은 index 소스에서 직접 찾습니다 — markSeen("국자") 처럼
   아이디를 글자 그대로 적은 자리가 지급하는 길목입니다. 표가 저절로 따라옵니다. */
function tutorialIds(){
  return new Set([...RAW.matchAll(/markSeen\("(\w+)"\)/g)].map(m=>m[1]));
}
/* 감정으로만 나오는 것 — 알 수 없는 서류가방 → 빈/서류/현금 가방 */
function appraisalMap(){
  const m={};
  for(const it of Object.values(ITEMS)){
    if(!it.mystery||!it.mystery.into)continue;
    for(const [id,w] of it.mystery.into)(m[id]=m[id]||[]).push(`${it.n} 감정 ${w}%`);
  }
  return m;
}
function sourcesOf(it,tut,appr){
  if(it.dark) return [`어둠 에너지 결정 강화 (원본 ${ITEMS[it.dark].n})`];
  if(it.base) return [`실습동 ${(typeof WORK_UP!=="undefined"&&WORK_UP[it.base]?WORK_UP[it.base].g+" 골드":"")} (원본 ${ITEMS[it.base].n})`];
  if(it.campfire) return ["보스 전리품 (게이트가 닫히는 날은 제외)"];
  if(it.crystal){
    const a=(typeof CRYSTAL_RATE!=="undefined")?CRYSTAL_RATE:0.10;
    const b=(typeof CRYSTAL_RISK!=="undefined")?CRYSTAL_RISK:0.05;
    const hi=Math.max(...PLACES.map(p=>p.risk));
    return [`모든 장소 · 전리품 ${Math.round(a*100)}~${Math.round((a+hi*b)*100)}%`];
  }
  const out=[];
  for(const pl of PLACES){
    const t=[];
    if(pl.junk.includes(it.id))t.push("잡화");
    if(pl.gear.includes(it.id))t.push("장비");
    if(pl.special&&pl.special.ids.includes(it.id))t.push(Math.round(pl.special.chance*100)+"%");
    if(pl.ammo&&(pl.ammo.ids||pl.ammo).includes(it.id))t.push("탄약");
    if(t.length)out.push(`${pl.n}(${t.join("·")})`);
  }
  if(SHOP.includes(it.id)||SHOP_AMMO.includes(it.id))out.push("매점");
  if(tut.has(it.id))out.push("튜토리얼 지급");
  if(appr[it.id])out.push(...appr[it.id]);
  return out;
}
function memoOf(it){
  const m=[];
  if(it.req)m.push(it.req.map(x=>(majorOf(x)||{n:x}).n).join("·")+" 전용");
  if(it.ammo&&it.kind!=="ammo")m.push(`${AMMO_KIND[it.ammo]||it.ammo} 탄약을 씁니다`);
  if(it.kind==="ammo"&&it.qty)m.push(`한 묶음 ${it.qty}발 · 배낭 한 칸`);
  if(it.use&&it.use.hp)m.push(`먹으면 체력 +${it.use.hp}`);
  if(it.frail)for(const [t,c] of Object.entries(it.frail))m.push(`${t} ${Math.round(c*100)}% 파손`);
  if(it.mystery)m.push("감정해야 값이 정해집니다");
  if(it.style)m.push({swing:"휘두르기",thrust:"찌르기",gun:"사격"}[it.style]||it.style);
  return m;
}

/* 열 정의 — key 는 정렬값, html 은 보이는 것. num 이면 숫자 열(오른쪽 정렬) */
let COLS=[];
function makeCols(){
  COLS=[
    {id:"kind",  t:"분류",  w:r=>r.kindI,  h:r=>`<span class="kd ${r.it.kind}${r.it.dark?" dk":r.it.base?" wk":""}">${KINDS[r.kindI].n}</span>`},
    {id:"slot",  t:"칸",    w:r=>r.slotI,  h:r=>r.slotN?esc(r.slotN):`<span class="none">—</span>`},
    {id:"name",  t:"이름",  w:r=>r.it.n,   h:r=>`<div class="nm">${iconHtml(r.it)}<b>${nameHtml(r.it)}</b></div>`},
    {id:"d",     t:"성능",  w:r=>r.it.d||"", cls:"d", grp:"txt", h:r=>esc(r.it.d||"")},
    {id:"atk",   t:"공",    w:r=>r.it.atk||0,   num:1, grp:"num", h:r=>n(r.it.atk)},
    {id:"guard", t:"방",    w:r=>r.it.guard||0, num:1, grp:"num", h:r=>n(r.it.guard)},
    {id:"hp",    t:"체",    w:r=>r.it.hp||0,    num:1, grp:"num", h:r=>n(r.it.hp)},
    {id:"dodge", t:"회피",  w:r=>r.it.dodge||0, num:1, grp:"num", h:r=>r.it.dodge?r.it.dodge+"%":dash()},
    {id:"crit",  t:"치명",  w:r=>r.it.crit||0,  num:1, grp:"num", h:r=>r.it.crit?"+"+r.it.crit+"%":dash()},
    {id:"aspd",  t:"공속",  w:r=>r.it.aspdM||1, num:1, grp:"num",
     h:r=>(r.it.aspdM&&r.it.aspdM!==1)?pct(r.it.aspdM-1):dash()},
    {id:"rng",   t:"사거리",w:r=>r.range||0,    num:1, grp:"num", h:r=>r.range?String(r.range):dash()},
    {id:"dmg",   t:"피해",  w:r=>r.it.dmg||"",  grp:"num", h:r=>r.it.dmg?esc(r.it.dmg):dash()},
    {id:"buy",   t:"구매",  w:r=>r.buy===null?-1:r.buy, num:1,
     h:r=>r.buy===null?dash():`<span class="gold">${r.buy}</span>`},
    {id:"sell",  t:"판매",  w:r=>r.sellS,  num:1,
     h:r=>r.sell===null?dash():`<span class="gold">${esc(r.sell)}</span>`},
    {id:"src",   t:"획득처",w:r=>r.src.join(", "), cls:"src", h:r=>r.src.length?esc(r.src.join(", ")):dash()},
    {id:"memo",  t:"비고",  w:r=>r.memo.join(", "), cls:"memo", h:r=>r.memo.length?esc(r.memo.join(", ")):dash()},
  ];
}
const dash=()=>'<span class="none">—</span>';
const n=v=>v?String(v):dash();
/* 강화판 판별 — 어둠(dark)이든 실습동(base)이든 원본 id 가 한 칸에 들어 있습니다 */
const upBase=it=>it.dark||it.base||null;
const upCls=it=>it.dark?" dk":it.base?" wk":"";
function nameHtml(it){
  return upBase(it) ? `${esc(it.n.slice(0,-1))}<span class="plus${upCls(it)}">+</span>` : esc(it.n);
}
function iconHtml(it){
  const rel=ITEM_ART[upBase(it)||it.id];
  if(rel)return `<img class="ico${upCls(it)}" src="${ART+rel}" alt="">`;
  return `<span class="ico ${it.crystal?"crys":"none"}"></span>`;
}

let ROWS=[];
function buildRows(){
  const tut=tutorialIds(), appr=appraisalMap();
  ROWS=Object.values(ITEMS).map(it=>{
    const sl=SLOTS.find(s=>s.k===it.slot);
    const buy=(SHOP.includes(it.id)||SHOP_AMMO.includes(it.id))?(it.price||0):null;
    let sell=null, sellS=-1;
    if(it.kind==="junk"){
      if(it.mystery){ sell=`${it.mystery.lo}~${it.mystery.hi}`; sellS=it.mystery.lo; }
      else { sell=it.price||0; sellS=it.price||0; }
    }
    return {
      it, kindI:kindIdx(it.kind),
      slotI:it.slot?SLOTS.findIndex(s=>s.k===it.slot):99,
      slotN:sl?sl.n:(it.kind==="ammo"?"탄약":""),
      /* 근접 기본 사거리 7 — 무기만 값을 적습니다 */
      range:(it.slot==="rh"&&(it.atk||it.style))?7+(it.rng||0):0,
      buy, sell, sellS,
      src:sourcesOf(it,tut,appr), memo:memoOf(it),
    };
  });
}

/* ═══════════ 거르기 · 정렬 · 그리기 ═══════════ */
let kindSel="all", slotSel="", perfSel="both", showDk=true, q="";
let sortId="kind", sortDir=1;

function visible(){
  const t=q.trim().toLowerCase();
  return ROWS.filter(r=>{
    if(!showDk&&upBase(r.it))return false;
    if(kindSel!=="all"&&r.it.kind!==kindSel)return false;
    if(slotSel==="__none"){ if(r.it.slot)return false; }
    else if(slotSel&&r.it.slot!==slotSel)return false;
    if(t){
      const hay=`${r.it.n} ${r.it.id} ${r.it.d||""} ${r.src.join(" ")} ${r.memo.join(" ")}`.toLowerCase();
      if(!hay.includes(t))return false;
    }
    return true;
  }).sort((a,b)=>{
    const c=COLS.find(x=>x.id===sortId)||COLS[0];
    const x=c.w(a), y=c.w(b);
    const d=(typeof x==="number"&&typeof y==="number")?x-y:String(x).localeCompare(String(y),"ko");
    return d*sortDir || a.it.n.localeCompare(b.it.n,"ko");
  });
}
const shown=c=>!c.grp || (perfSel==="both") || (perfSel==="num"&&c.grp==="num") || (perfSel==="txt"&&c.grp==="txt");

function draw(){
  const cols=COLS.filter(shown);
  $("head").innerHTML=cols.map(c=>
    `<th data-c="${c.id}">${c.t}${sortId===c.id?`<span class="ar">${sortDir>0?"▲":"▼"}</span>`:""}</th>`).join("");
  const rows=visible();
  $("body").innerHTML=rows.map(r=>`<tr class="${r.it.dark?"dark":r.it.base?"up":""}">`+
    cols.map(c=>`<td class="${c.cls||""}${c.num?" n":""}">${c.h(r)}</td>`).join("")+`</tr>`).join("");
  $("head").querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const id=th.dataset.c;
    if(sortId===id)sortDir=-sortDir; else {sortId=id;sortDir=1;}
    draw();
  });
  /* 요약 — 강화판은 따로 셉니다 */
  const base=ROWS.filter(r=>!upBase(r.it));
  const cnt=KINDS.map(k=>`${k.n} <b>${base.filter(r=>r.it.kind===k.k).length}</b>`).join(" · ");
  $("sum").innerHTML=`원본 <b>${base.length}</b>종 · ${cnt}`
    +` · 강화판 <b>${ROWS.length-base.length}</b>종 &nbsp;|&nbsp; 지금 보이는 것 <b>${rows.length}</b>줄`;
}

function fillFilters(){
  $("kinds").innerHTML=[{k:"all",n:"전체"},...KINDS].map(x=>
    `<button class="chip${x.k===kindSel?" on":""}" data-k="${x.k}">${x.n}</button>`).join("");
  $("kinds").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    kindSel=b.dataset.k; fillFilters(); draw();
  });
  const cur=$("slot").value;
  $("slot").innerHTML=`<option value="">전체</option>`
    +SLOTS.map(s=>`<option value="${s.k}">${s.n}</option>`).join("")
    +`<option value="__none">칸 없음</option>`;
  $("slot").value=cur||"";
}

/* 표를 그대로 스프레드시트에 붙여 넣을 수 있게 */
function toTSV(){
  const cols=COLS.filter(shown);
  const head=cols.map(c=>c.t).join("\t");
  const body=visible().map(r=>cols.map(c=>{
    const d=document.createElement("div"); d.innerHTML=c.h(r);
    return d.textContent.replace(/\s+/g," ").replace(/^—$/,"").trim();
  }).join("\t")).join("\n");
  return head+"\n"+body;
}

/* ═══════════ 시작 ═══════════ */
async function start(allowPick){
  try{
    setStatus("index.html 읽는 중…");
    await loadIndex(allowPick);
    makeCols(); buildRows(); fillFilters(); draw();
    setStatus(`index.html 에서 아이템 ${ROWS.length}종을 읽었습니다. 머리글을 눌러 정렬하세요.`,true);
  }catch(err){
    setStatus("불러오기 실패: "+err.message
      +(FS_OK?" — 'index.html 다시 읽기' 를 눌러 파일을 직접 고르세요."
             :" — 로컬 파일이면 브라우저가 fetch 를 막습니다. 서버로 여세요."),false);
  }
}
$("reload").onclick=()=>start(true);
$("slot").onchange=e=>{ slotSel=e.target.value; draw(); };   /* "__none" 은 칸을 안 쓰는 물건 */
$("perf").onchange=e=>{ perfSel=e.target.value; draw(); };
$("showdk").onchange=e=>{ showDk=e.target.checked; draw(); };
$("q").oninput=e=>{ q=e.target.value; draw(); };
$("tsv").onclick=async()=>{
  try{ await navigator.clipboard.writeText(toTSV()); setStatus("표를 클립보드에 복사했습니다(TSV).",true); }
  catch(e){ setStatus("복사 실패: "+e.message,false); }
};
(async()=>{ if(FS_OK){ try{ idxHandle=await hget(); }catch(e){} } start(false); })();

})();
</script>
