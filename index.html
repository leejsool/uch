    }
    if(!live.length)continue;
    const t=live.reduce((b,o)=>D(u,o)<D(u,b)?o:b);
    if(D(u,t)>u.range+t.r-1)moveTo(u,t.x,t.y,dt);
    else{u.face=Math.atan2(t.y-u.y,t.x-u.x);u.cool-=dt*u.aspd;
      if(u.cool<=0){
        /* 제 배낭에서 한 발 소모 — 탄창 개조(기계공학과)는 가끔 그마저 아낍니다 */
        if(u.gun&&u.style==="gun"&&!(u.ammoSave&&Math.random()<u.ammoSave))u.ammoN--;
        u.cool=1;u.anim={t:0,hit:false,tgt:t};
        if(u.dmgType===DMG.THRUST&&Math.random()<THRUST_AGAIN)u.cool=1-THRUST_AGAIN_CUT;
        /* 연타 — 맨손 태권도. 찌르기와 같은 자리에서 다음 주먹을 당깁니다 */
        if(u.combo&&Math.random()<u.combo)u.cool=Math.min(u.cool,1-TKD_COMBO_CUT);
      }}
  }
  for(const f of live){
    f.wig+=dt*3;
    if(!lifeA.length)continue;
    /* 물러났다 돌아오는 패턴. 한 판에 한 번만(f.fled) 쓴다. */
    const FL=(ENEMIES[f.key]||{}).flee;
    if(FL&&!f.fled&&f.hp>0&&f.hp<=f.maxHp*FL.at){
      f.fled=true;f.flee="run";f.den=fleeDen(f);f.anim=null;
      say(`${f.name}이(가) 등을 보이며 물러난다.`);
    }
    if(f.flee==="run"){
      f.face=Math.atan2(f.den.y-f.y,f.den.x-f.x);
      moveTo(f,f.den.x,f.den.y,dt);
      if(D(f,f.den)<f.r+1.5){f.flee="heal";say(`${f.name}이(가) 웅크린 채 상처를 핥는다.`)}
      continue;
    }
    if(f.flee==="heal"){
      f.hp=Math.min(f.maxHp,f.hp+f.maxHp*FL.rate*dt);
      const n=lifeA.reduce((b,o)=>D(f,o)<D(f,b)?o:b);
      f.face=Math.atan2(n.y-f.y,n.x-f.x);          // 노려보기만 한다
      if(f.hp>=f.maxHp*FL.to){f.flee=null;say(`${f.name}이(가) 다시 달려든다.`)}
      continue;
    }
    const t=lifeA.reduce((b,o)=>D(f,o)<D(f,b)?o:b);
    // 서로 밀어내는 거리(반지름 합)보다 사거리가 짧으면 영영 못 때린다. 상대 덩치를 더해준다.
    const reach=f.range+t.r;
    if(D(f,t)>reach){
      if(f.key==="hopper"){
        f.face=Math.atan2(t.y-f.y,t.x-f.x);
        if(f.air>0){f.air-=dt;moveTo(f,t.x,t.y,dt)}
        else{f.hopCd=(f.hopCd||0)-dt;
          if(f.hopCd<=0){f.air=HOP_AIR;f.hopCd=HOP_AIR+.5+Math.random()*.35}}
      }else if(ZOMB_WALK.has(f.key)){
        // 성한 다리로 밀 때만 앞으로 나가고, 절뚝이는 쪽에서는 거의 멈춘다
        f.cp=(f.cp||0)+dt*2.3;
        f.limp=Math.sin(f.cp);
        const base=f.vspeed;
        f.vspeed=base*(f.limp>0?1.75:0.30);
        moveTo(f,t.x,t.y,dt);
        f.vspeed=base;
      }else if(f.key==="worm"){
        f.cp=(f.cp||0)+dt*3.1;
        const s=Math.max(0,Math.sin(f.cp));f.surge=s*s;
        const base=f.vspeed;f.vspeed=base*(0.12+1.85*f.surge);
        moveTo(f,t.x,t.y,dt);f.vspeed=base;
      }else moveTo(f,t.x,t.y,dt);
    }
    else{f.face=Math.atan2(t.y-f.y,t.x-f.x);f.air=0;f.cool-=dt*f.aspd;
      if(f.cool<=0){f.cool=1;f.strike=.24;
        if(f.key==="spider")B.shots.push({x0:f.x,y0:f.y,x1:t.x,y1:t.y,life:.42,max:.42});
        /* 매미처럼 우는 것은 실 대신 고리 세 겹이 퍼져 나갑니다 */
        if((ENEMIES[f.key]||{}).wave)B.shots.push({wave:true,x0:f.x,y0:f.y,x1:t.x,y1:t.y,life:.5,max:.5});
        hurt(t,f.atk,"#F25C5C",f.dmgType,f);
        /* 들이받는 것들 — 대원을 밀어내고 한동안 다리를 무겁게 만든다 */
        const E=ENEMIES[f.key]||{};
        if(E.push&&t.hp>0)knockBack(f,t,E.push);
        if(E.slow&&t.hp>0){
          if(!t.slowT)B.fx.push({x:t.x,y:t.y-3,t:"둔화",c:"#7FA8D9",life:1,off:0});
          t.slowT=Math.max(t.slowT||0,E.slow.sec);t.slowM=E.slow.mul;
        }
        say(`${f.name}이(가) ${t.name}을(를) 공격했다.`)}}
  }
  separate();
  for(const a of B.allies)if(a.hp<=0&&!a.dead){
    a.dead=true;B.fallen.push(a);
    const by=a.lastHitBy;
    if(by&&ZOMB_BITE.has(by.key)){
      B.foes.push(makeZombieOf(a));
      say(`${a.name}이(가) 다시 일어선다. 더 이상 우리 편이 아니다.`);
    }else say(`${a.name}이(가) 쓰러졌다. 돌아오지 못한다.`);
  }
  for(const u of [...B.allies,...B.foes]){if(u.flash>0)u.flash-=dt;if(u.strike>0)u.strike-=dt;
    if(u.slowT>0)u.slowT-=dt}
  B.fx=B.fx.filter(p=>{p.life-=dt;p.off+=26*dt;return p.life>0});
  if(B.shots)B.shots=B.shots.filter(w=>{w.life-=dt;return w.life>0});
  if(!B.over){
    if(!lifeA.length){B.over=1;stopLoop();setTimeout(()=>{G.scene="fail";render()},600)}
    else if(!live.length){B.over=1;stopLoop();setTimeout(finishBattle,700)}
  }
}

/* ═══════════ 그리기 ═══════════ */
let SX=4,SY=4;
function paint(){
  ctx.clearRect(0,0,W,H);SX=W/100;SY=H/100;
  const px=v=>v*SX,py=v=>v*SY;
  const bg=ROOM&&bgSprite(ROOM.id);
  if(bg){
    ctx.drawImage(bg,0,0,W,H);            // 배경 그림 — 도형 판정은 안 보이게, 계산에만 쓴다
  }else{
    ctx.fillStyle="#22212A";ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(255,255,255,.045)";ctx.lineWidth=1;
    for(let i=1;i<10;i++){
      ctx.beginPath();ctx.moveTo(px(i*10),0);ctx.lineTo(px(i*10),H);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,py(i*10));ctx.lineTo(W,py(i*10));ctx.stroke();
    }
    ctx.strokeStyle="rgba(216,71,126,.35)";ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,W-3,H-3);
    ctx.fillStyle="rgba(216,71,126,.30)";ctx.fillRect(px(DOOR.x),py(DOOR.y),px(DOOR.w),py(DOOR.h));
    ctx.fillStyle="rgba(234,230,242,.6)";ctx.font="700 9px system-ui";ctx.textAlign="center";
    ctx.fillText("입구",px(DOOR.x+DOOR.w/2),py(DOOR.y)-3);
    for(const o of ROOM.obs){
      if(o.mul){                              // 감속 지대 — 채우지 않고 빗금만
        ctx.fillStyle=o.mul<1?"rgba(90,180,200,.16)":"rgba(200,180,90,.16)";
        ctx.fillRect(px(o.x),py(o.y),px(o.w),py(o.h));
        ctx.setLineDash([2,3]);ctx.strokeStyle="rgba(120,205,225,.6)";ctx.lineWidth=1;
        ctx.strokeRect(px(o.x)+.5,py(o.y)+.5,px(o.w)-1,py(o.h)-1);ctx.setLineDash([]);
        ctx.fillStyle="rgba(200,235,245,.6)";ctx.font="700 9px system-ui";ctx.textAlign="center";
        ctx.fillText((o.l?o.l+" ":"")+"×"+o.mul,px(o.x+o.w/2),py(o.y+o.h/2)+3);
        continue;
      }
      const high=(o.lv&L3)!==0,mid=(o.lv&L2)!==0,low=(o.lv&L1)!==0;
      ctx.fillStyle=high?"#43414F":mid&&low?"#3A3948":"rgba(120,112,140,.32)";
      ctx.fillRect(px(o.x),py(o.y),px(o.w),py(o.h));
      if(!high&&!(mid&&low))ctx.setLineDash([3,3]);
      ctx.strokeStyle="rgba(255,255,255,.26)";ctx.lineWidth=1;
      ctx.strokeRect(px(o.x)+.5,py(o.y)+.5,px(o.w)-1,py(o.h)-1);
      ctx.setLineDash([]);
      if(o.l){ctx.fillStyle="rgba(234,230,242,.5)";ctx.font="700 10px system-ui";ctx.textAlign="center";
        ctx.fillText(o.l,px(o.x+o.w/2),py(o.y+o.h/2)+3.5)}
    }
  }
  for(const f of B.foes)if(f.hp>0)drawFoe(f);
  for(const a of B.allies)if(a.hp>0)drawAlly(a);
  if(B.shots)for(const w of B.shots)drawWeb(w);
  ctx.textAlign="center";ctx.font="800 13px system-ui";
  for(const p of B.fx){ctx.globalAlpha=Math.min(1,p.life*1.6);ctx.fillStyle=p.c;
    ctx.fillText(p.t,px(p.x),py(p.y)-10-p.off)}
  ctx.globalAlpha=1;
}
/* 공격 시 몸통을 앞뒤로 미는 양(−준비 뒤로 ~ +타격 앞으로 ~ 0 복귀). 총은 호출부에서 부호를 뒤집어 반동으로 쓴다 */
function bodyLunge(u){
  if(!u.anim)return 0;
  const t=u.anim.t, S=u.style==="thrust"?THRUST:u.style==="gun"?GUNA:SWING, go=S.down||S.go;
  if(t<S.up)return -0.12*(t/S.up);
  if(t<S.up+go)return -0.12+1.12*((t-S.up)/go);
  return Math.max(0,1-(t-S.up-go)/S.rec);
}
/* 공격 이펙트 — 무기 아이콘은 손에 고정된 채, 타겟 방향(u.face)으로 잔상만 그린다.
   원점은 대원 중심(drawAlly 의 translate(x,y) 프레임), 손 높이로 옮겨 face 로 회전. */
function drawAtkFx(u,r){
  if(!u.anim||u.style===undefined)return;
  const t=u.anim.t;
  ctx.save();
  ctx.translate(0,-r*1.35);
  ctx.rotate(u.face);
  ctx.lineCap="round";
  if(u.style==="gun"){
    if(t>=GUNA.up&&t<GUNA.up+GUNA.go+0.05){          // 총구 섬광
      ctx.fillStyle="rgba(255,236,160,.9)";
      ctx.beginPath();ctx.arc(r*2.0,0,r*0.5,0,7);ctx.fill();
      ctx.strokeStyle="rgba(255,236,160,.5)";ctx.lineWidth=r*0.2;
      ctx.beginPath();ctx.moveTo(r*1.5,0);ctx.lineTo(r*3.1,0);ctx.stroke();
    }
  }else if(u.style==="thrust"||u.wid==="spray"){
    const S=THRUST;
    if(t>S.up&&t<S.up+S.go+0.07){                     // 찌르기 섬광
      const p=Math.min(1,(t-S.up)/S.go);
      ctx.strokeStyle="rgba(242,215,78,.55)";ctx.lineWidth=r*0.5;
      ctx.beginPath();ctx.moveTo(r*0.6,0);ctx.lineTo(r*(1.4+2.1*p),0);ctx.stroke();
    }
  }else{
    const S=SWING;
    if(t>S.up&&t<S.up+S.down+0.06){                   // 휘두르기 호
      const p=(t-S.up)/S.down, a=-1.2+2.6*p;
      ctx.strokeStyle="rgba(242,215,78,.55)";ctx.lineWidth=r*0.7;
      ctx.beginPath();ctx.arc(0,0,r*2.0,a-0.95,a+0.15);ctx.stroke();
    }
  }
  ctx.restore();
}
function drawAlly(u){
  const x=u.x*SX,y=u.y*SY,r=u.r*Math.min(SX,SY);
  const fx=Math.cos(u.face),fy=Math.sin(u.face);
  const west=fx<0, back=fy<0;    // west=서쪽 절반, back=북쪽 절반(등 스프라이트)
  /* 대원 그림(앞·뒤)은 기본이 서쪽을 향해 있다. 그래서 동쪽을 볼 때 몸통을 좌우반전한다.
     손장비는 반전하지 않고 rdir 별 좌표를 그대로 쓴다(항상 오른손 무기). */
  const flip=!west;
  /* 걷는 중인지 — 지난 프레임과의 위치차로 판단. 공격 중엔 걷기 흔들림을 끈다 */
  const mv=Math.hypot(u.x-(u._px===undefined?u.x:u._px),u.y-(u._py===undefined?u.y:u._py));
  u._px=u.x;u._py=u.y;
  const walk=mv>0.015&&!u.anim;
  u.bob=(u.bob||0)+(walk?mv*0.9:0);
  const bobY=walk?-Math.abs(Math.sin(u.bob))*r*0.14:0;
  const P=bodyLunge(u), dir=u.style==="gun"?-0.45:1;
  const lx=fx*r*0.55*P*dir, ly=fy*r*0.55*P*dir;

  ctx.save();ctx.translate(x,y);

  /* 발밑 그림자 */
  ctx.save();ctx.translate(0,r*0.5);ctx.scale(1,0.42);
  ctx.beginPath();ctx.arc(0,0,r*0.95,0,7);
  ctx.fillStyle="rgba(0,0,0,.30)";ctx.fill();ctx.restore();

  /* 몸 + 손장비 — 대원 스프라이트를 기준으로 무기·방패를 얹는다.
     목표를 향하는 방향을 북동/북서/남동/남서로 4등분한다 (rdir = ne/nw/se/sw).
     몸통 스프라이트만 서쪽일 때 좌우반전하고, 손장비는 rdir 별 좌표로 직접 잡는다
     (항상 오른손에 무기라서 통째로 반전하지 않는다). */
  const img=allySprite((u.sex||"m")+(back?"-back":"-front"));
  const rdir=(back?"n":"s")+(west?"w":"e");

  const drawBody=()=>{
    ctx.save();ctx.translate(lx,ly+bobY);
    if(img){
      const h=r*4.2, w=h*(img.width/img.height);
      if(walk)ctx.rotate(Math.sin(u.bob)*0.05);
      ctx.scale((flip?-1:1)*(1+0.08*Math.max(0,P)),1-0.06*Math.max(0,P));
      if(u.flash>0)ctx.filter="brightness(0) invert(1)";
      ctx.drawImage(img,-w/2,-h+r*0.55,w,h);
      ctx.filter="none";
    }else{
      ctx.beginPath();ctx.arc(0,0,r,0,7);
      ctx.fillStyle=u.flash>0?"#fff":u.color;ctx.fill();
      ctx.lineWidth=2;ctx.strokeStyle="rgba(255,255,255,.85)";ctx.stroke();
    }
    ctx.restore();
  };
  const drawHand=(slot,id)=>{
    const rg=rigFor(id,slot,rdir), im=itemSprite(id);
    ctx.save();
    ctx.translate(lx+rg.x*r, ly+bobY+rg.y*r);   // 손 위치(몸통 런지만 따라감), 회전은 rig 고정
    ctx.rotate(rg.rot);
    if(rg.mir)ctx.scale(-1,1);                  // 손장비 좌우반전(회전만으론 안 되는 포즈용)
    if(u.flash>0)ctx.filter="brightness(0) invert(1)";
    if(im){
      const s=r*1.7*rg.scale, w=s*(im.width/im.height);
      /* 어둠 강화판 — 같은 그림을 그림자만 켠 채 두 번 덧그려 검은 아우라를 만든다.
         맞아서 하얗게 번쩍이는 동안에는 끈다(필터와 겹치면 지저분해진다). */
      const upIt=ITEMS[id];
      if(upIt&&(upIt.dark||upIt.base)&&!(u.flash>0)){
        const dk=!!upIt.dark;                      /* 어둠은 검보라, 실습동은 푸른색 */
        ctx.shadowColor=dk?"#12042A":"#02202E";ctx.shadowBlur=r*1.4;
        ctx.drawImage(im,-w/2,-s/2,w,s);
        ctx.shadowColor=dk?"rgba(140,54,224,.95)":"rgba(70,200,245,.95)";ctx.shadowBlur=r*0.8;
        ctx.drawImage(im,-w/2,-s/2,w,s);
        ctx.shadowBlur=0;ctx.shadowColor="transparent";
      }
      ctx.drawImage(im,-w/2,-s/2,w,s);
    }else{                                   // 아이콘이 아직 안 읽혔을 때 임시 도형
      ctx.fillStyle=u.flash>0?"#fff":"#9a92ad";
      if(slot==="lh"){ctx.beginPath();ctx.arc(0,0,r*0.6,0,7);ctx.fill();}
      else ctx.fillRect(0,-r*0.12,r*1.6,r*0.24);
    }
    ctx.filter="none";
    ctx.restore();
  };

  /* 겹침 순서: 대원 몸통은 z=0, 손장비는 rig 의 z (뒤 −2‥−1, 앞 1‥2). 옛 데이터의 behind 도 받는다 */
  const zOf=e=>e&&e.z!=null?+e.z:(e&&e.behind?-1:1);
  const layers=[{z:0,o:0,f:drawBody}];
  if(u.hasW&&u.wid)layers.push({z:zOf(rigFor(u.wid,"rh",rdir)),o:1,f:()=>drawHand("rh",u.wid)});
  if(u.hasS&&u.sid)layers.push({z:zOf(rigFor(u.sid,"lh",rdir)),o:2,f:()=>drawHand("lh",u.sid)});
  layers.sort((a,b)=>a.z-b.z||a.o-b.o);
  for(const l of layers)l.f();
  drawAtkFx(u,r);         // 무기는 고정, 잔상만

  ctx.restore();          // translate 해제
  const topY=img?r*3.0:r+7, botY=img?r*1.2:r+10;
  bar(u,x,y-topY,"#6BD98F",r);
  ctx.fillStyle="rgba(234,230,242,.7)";ctx.font="600 8.5px system-ui";ctx.textAlign="center";
  ctx.fillText(u.name,x,y+botY);
}
/* 몬스터 그림·도형은 옆모습(머리가 오른쪽)이다. face 를 그대로 rotate 하면
   왼쪽이나 아래를 향할 때 배가 하늘로 가서 뒤집힌 꼴이 된다.
   서쪽을 볼 때는 회전 대신 좌우반전으로 돌리고, 위아래 기울기는 ±90° 안으로만 준다.
   extra 는 애니메이션용 추가 회전 — 반전 시 부호도 뒤집어야 같은 방향으로 흔들린다. */
function faceFoe(g,ang,extra){
  const flip=Math.cos(ang)<0;
  const a=Math.atan2(Math.sin(ang),Math.abs(Math.cos(ang)));   // [-90°, +90°]
  g.scale(flip?-1:1,1);
  g.rotate(a+(flip?-(extra||0):(extra||0)));
}
function drawFoe(f){
  const x=f.x*SX,y=f.y*SY,r=f.r*Math.min(SX,SY);
  const bx=Math.cos(f.face),by=Math.sin(f.face);
  const col=f.flash>0?"#fff":f.color;
  if(f.key==="worm"){
    const sp=sprite("worm");
    const su=f.surge||0;
    if(sp){
      /* 그림 한 장을 세로로 잘게 썰어, 조각마다 어긋나게 그립니다.
         surge(0 웅크림 ~ 1 뻗음)로 길이를 줄였다 늘이고,
         머리에서 꼬리로 흐르는 사인파로 몸을 물결치게 합니다.
         판정 반지름 f.r 은 건드리지 않습니다 — 그림만 커집니다. */
      const N=20, sw=sp.width/N;
      const L=r*4.4;                     // 다 뻗었을 때의 몸 길이
      const HEAD=0.36;                   // 앞 36%는 딱딱한 머리 — 접히지 않는다
      const sq=0.60+0.40*su;             // 몸통만 이만큼 접힌다
      const back=1-HEAD;
      const mapU=u=>u>=back?u:back-(back-u)*sq;   // 꼬리 쪽만 끌어당긴다
      const hx=r*1.15;                   // 머리는 판정 원보다 조금 앞
      const wg=f.wig||0, amp=r*0.42*(0.25+su*0.9);
      ctx.save();
      ctx.translate(x,y);faceFoe(ctx,f.face);
      ctx.scale(1,-1);                                     // 애벌레 그림은 상하가 뒤집혀 있어 바로 세운다
      if(f.flash>0)ctx.filter="brightness(0) invert(1)";   // 맞으면 하얗게
      for(let i=0;i<N;i++){
        const u=i/N, un=(i+1)/N;         // 0 꼬리 ~ 1 머리
        const a=mapU(u),b=mapU(un);
        const t=Math.max(0,(back-u)/back);          // 머리 0 ~ 꼬리 1
        const dy=Math.sin(wg*1.7-(1-u)*5.4)*amp*t;  // 머리에서 꼬리로 흐르는 물결
        const H=r*2.5*(1+(1-su)*0.20*t);            // 접힌 만큼 몸통이 통통해진다
        ctx.drawImage(sp, i*sw,0, sw,sp.height,
          hx-L+a*L, dy-H/2, (b-a)*L*1.10, H);
      }
      ctx.restore();
    }else{
      const gap=r*(.55+.55*su),fat=1+(1-su)*.22;
      for(let i=2;i>=0;i--){
        const w=Math.sin((f.wig||0)-i*.7)*1.5*(0.4+su);
        ctx.beginPath();
        ctx.arc(x-bx*i*gap-by*w,y-by*i*gap+bx*w,(r-i*r*.15)*fat,0,7);
        ctx.fillStyle=f.flash>0?"#fff":(i===0?f.color:"#7E9E3C");ctx.fill();
      }
      ctx.fillStyle=f.flash>0?"#fff":"#3A4A22";
      ctx.beginPath();ctx.arc(x+bx*r*.45-by*r*.3,y+by*r*.45+bx*r*.3,r*.16,0,7);ctx.fill();
    }
  }else if(f.key==="hopper"){
    const j=f.air>0?Math.sin((1-f.air/HOP_AIR)*Math.PI):0;
    const crouch=f.air>0?0:Math.max(0,1-(f.hopCd||0)/.35);
    const flying=j>0.02;
    const spH=sprite("hopper"), spF=flying?sprite("hopperFly"):null;
    const sp=spF||spH;
    if(flying){                              // 뜬 만큼 그림자가 작아진다
      ctx.fillStyle="rgba(0,0,0,.35)";
      ctx.beginPath();ctx.ellipse(x,y,r*.9*(1-j*.3),r*.5*(1-j*.3),0,0,7);ctx.fill();
    }
    if(sp){
      const S=r*5.0*(1+j*0.20);              // 높이 뜰수록 커 보인다
      const flap=flying?1+Math.sin((f.wig||0)*7)*0.06:1;   // 날개 파닥임
      ctx.save();
      ctx.translate(x,y-j*r*1.7);            // 화면상 위로 뜬다
      faceFoe(ctx,f.face);
      ctx.translate(r*0.9,0);                // 눈이 판정 원보다 조금 앞
      /* 웅크리면 앞뒤로 짧아지고 옆으로 퍼집니다 */
      ctx.scale(1-crouch*0.22,(1+crouch*0.18)*flap);
      if(f.flash>0)ctx.filter="brightness(0) invert(1)";
      ctx.drawImage(sp,-S/2,-S/2,S,S);
      ctx.restore();
    }else{
      ctx.save();ctx.translate(x,y-j*r*1.6);faceFoe(ctx,f.face);ctx.scale(1+j*.12,1+j*.12);
      const spread=j>0?r*.9:-crouch*r*.35;
      ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(-r*.3,-r*.5);ctx.lineTo(-r*1.2,-r*1.0-spread);ctx.lineTo(-r*.3,-r*1.5-spread*.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-r*.3,r*.5);ctx.lineTo(-r*1.2,r*1.0+spread);ctx.lineTo(-r*.3,r*1.5+spread*.5);ctx.stroke();
      ctx.beginPath();ctx.ellipse(0,0,r*1.15*(1-crouch*.12),r*.72*(1+crouch*.15),0,0,7);
      ctx.fillStyle=col;ctx.fill();
      ctx.beginPath();ctx.arc(r*.8,0,r*.3,0,7);ctx.fillStyle=f.flash>0?"#fff":"#EFD98A";ctx.fill();
      ctx.restore();
    }
  }else if(f.key==="spider"){
    const spd=sprite("spider");
    if(spd){
      /* 그림은 머리가 오른쪽을 보게 잘라 두었습니다 — faceFoe 만 태우면 방향이 맞습니다.
         가로로 긴 그림이라 긴 쪽을 몸 방향에 맞춰 폭부터 잡습니다. */
      const sway=Math.sin((f.wig||0)*1.3)*0.045;
      const Wd=r*5.6, Ht=Wd*(spd.height/spd.width);
      ctx.save();ctx.translate(x,y);faceFoe(ctx,f.face,sway);
      if(f.strike>0){        // 뿜을 때 배를 들고 앞을 낮춘다 — 방적돌기에 실이 맺힌다
        const e=Math.sin((1-Math.max(0,f.strike)/.24)*Math.PI);
        ctx.rotate(-e*0.20);
        ctx.beginPath();ctx.ellipse(-r*1.7-e*r*0.3,0,r*0.5,r*0.42,0,0,7);
        ctx.fillStyle="rgba(238,238,252,.9)";ctx.fill();
      }
      if(f.flash>0)ctx.filter="brightness(0) invert(1)";
      ctx.drawImage(spd,-Wd/2,-Ht/2,Wd,Ht);
      ctx.restore();
      ctx.fillStyle="rgba(242,215,78,.9)";ctx.font="800 9px system-ui";ctx.textAlign="center";
      ctx.fillText("BOSS",x,y-r-12);
      bar(f,x,y-r-6,"#F25C5C",r);
      return;
    }
    ctx.save();ctx.translate(x,y);faceFoe(ctx,f.face);
    ctx.strokeStyle=col;ctx.lineWidth=2.1;ctx.lineCap="round";
    for(let i=0;i<8;i++){                       // 긴 다리 여덟 개
      const side=i<4?1:-1,k=i%4;
      const a=(0.45+k*0.62)*side+Math.sin(f.wig*2.2+i*1.3)*0.11;
      const kx=Math.cos(a)*r*1.45,ky=Math.sin(a)*r*1.45;
      const ex=Math.cos(a)*r*2.5,ey=Math.sin(a)*r*2.5;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.lineTo(kx-Math.abs(Math.sin(a))*r*0.4,ky);ctx.lineTo(ex,ey);ctx.stroke();
    }
    if(f.strike>0){          // 뿜을 때 배를 들어올리고 앞을 낮춘다
      const e=Math.sin((1-Math.max(0,f.strike)/.24)*Math.PI);
      ctx.save();ctx.rotate(-e*0.28);
      ctx.beginPath();ctx.ellipse(-r*1.0-e*r*0.3,0,r*0.5,r*0.42,0,0,7);
      ctx.fillStyle="rgba(238,238,252,.9)";ctx.fill();   // 방적돌기에 맺힌 실
      ctx.restore();
    }
    ctx.beginPath();ctx.ellipse(-r*.55,0,r*1.05,r*.9,0,0,7);ctx.fillStyle=col;ctx.fill();
    ctx.beginPath();ctx.arc(r*.55,0,r*.55,0,7);
    ctx.fillStyle=f.flash>0?"#fff":"#B79BEA";ctx.fill();
    ctx.fillStyle="#2A2A30";
    for(const e of [-.28,-.1,.1,.28]){ctx.beginPath();ctx.arc(r*.85,e*r,r*.1,0,7);ctx.fill()}
    ctx.restore();
    ctx.fillStyle="rgba(242,215,78,.9)";ctx.font="800 9px system-ui";ctx.textAlign="center";
    ctx.fillText("BOSS",x,y-r-12);
  }else if(ZOMB_WALK.has(f.key)){
    const lp=f.limp||0, tilt=lp*0.20;
    ctx.save();ctx.translate(x,y);faceFoe(ctx,f.face,tilt);
    // 끌리는 다리
    ctx.strokeStyle="#2F6B2A";ctx.lineWidth=r*0.30;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(-r*0.2,r*0.45);
    ctx.lineTo(-r*1.35-Math.max(0,-lp)*r*0.5,r*0.75);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-r*0.2,-r*0.45);
    ctx.lineTo(-r*0.95+lp*r*0.35,-r*0.8);ctx.stroke();
    // 앞으로 뻗은 팔 — 길이가 다르다
    ctx.strokeStyle=f.flash>0?"#fff":"#6FC25C";ctx.lineWidth=r*0.26;
    ctx.beginPath();ctx.moveTo(r*0.2,-r*0.55);
    ctx.lineTo(r*1.55+lp*r*0.2,-r*0.62);ctx.stroke();
    ctx.beginPath();ctx.moveTo(r*0.2,r*0.55);
    ctx.lineTo(r*1.15-lp*r*0.25,r*0.72);ctx.stroke();
    // 몸통과 머리
    ctx.beginPath();ctx.ellipse(-r*0.15,0,r*0.82,r*0.62,0,0,7);
    ctx.fillStyle=f.flash>0?"#fff":f.color;ctx.fill();
    ctx.strokeStyle="rgba(20,50,18,.75)";ctx.lineWidth=1.4;ctx.stroke();
    ctx.beginPath();ctx.arc(r*0.62,lp*r*0.10,r*0.46,0,7);
    ctx.fillStyle=f.flash>0?"#fff":"#7FCB6B";ctx.fill();ctx.stroke();
    ctx.fillStyle="#1E3A1A";
    ctx.beginPath();ctx.arc(r*0.85,-r*0.16,r*0.09,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(r*0.85,r*0.16,r*0.09,0,7);ctx.fill();
    ctx.restore();
    if(f.boss){ctx.fillStyle="rgba(242,215,78,.9)";ctx.font="800 9px system-ui";
      ctx.textAlign="center";ctx.fillText("BOSS",x,y-r-12)}
    else{ctx.fillStyle="rgba(140,220,120,.85)";ctx.font="600 8.5px system-ui";
      ctx.textAlign="center";ctx.fillText(f.name,x,y+r+11)}
  }else if(f.key==="bloodeyes"){
    // 빠르게 움직이므로 잔상을 깐다
    ctx.globalAlpha=.22;ctx.fillStyle=f.color;
    ctx.beginPath();ctx.arc(x-Math.cos(f.face)*r*.7,y-Math.sin(f.face)*r*.7,r*.85,0,7);ctx.fill();
    ctx.globalAlpha=1;
    ctx.save();ctx.translate(x,y);faceFoe(ctx,f.face);
    ctx.beginPath();                                  // 꿈틀대는 덩어리
    for(let i=0;i<=28;i++){
      const a=i/28*Math.PI*2;
      const rr=r*(0.94+Math.sin(a*3+f.wig*2.2)*0.11+Math.sin(a*5-f.wig*1.4)*0.06);
      const px2=Math.cos(a)*rr,py2=Math.sin(a)*rr;
      i?ctx.lineTo(px2,py2):ctx.moveTo(px2,py2);
    }
    ctx.closePath();ctx.fillStyle=f.flash>0?"#fff":f.color;ctx.fill();
    ctx.strokeStyle="rgba(40,8,14,.9)";ctx.lineWidth=1.5;ctx.stroke();
    const eyes=[[0.18,0,.44],[-0.42,-0.42,.30],[-0.38,0.46,.30],[0.44,-0.46,.25],
                [0.48,0.42,.25],[-0.06,-0.68,.21],[0.02,0.70,.21],[-0.72,0.04,.24]];
    for(let i=0;i<eyes.length;i++){
      const [ex,ey,es]=eyes[i];
      const blink=Math.sin(f.wig*1.7+i*2.1);
      const open=blink<-0.86?0.12:1;                  // 가끔 깜빡인다
      const cx2=ex*r,cy2=ey*r,rr=es*r;
      ctx.save();ctx.translate(cx2,cy2);ctx.scale(1,open);
      ctx.beginPath();ctx.arc(0,0,rr,0,7);
      ctx.fillStyle=f.flash>0?"#fff":"#F2E9E4";ctx.fill();
      ctx.beginPath();ctx.arc(rr*.34,0,rr*.55,0,7);ctx.fillStyle="#C2312F";ctx.fill();
      ctx.beginPath();ctx.arc(rr*.44,0,rr*.26,0,7);ctx.fillStyle="#1A0A0E";ctx.fill();
      ctx.restore();
    }
    if(f.strike>0){                                   // 시선이 터진다
      const e=Math.sin((1-Math.max(0,f.strike)/.24)*Math.PI);
      ctx.globalAlpha=e*.85;
      ctx.strokeStyle="#F25C5C";ctx.lineWidth=2.4;
      ctx.beginPath();ctx.arc(r*1.6,0,r*(0.5+e*1.1),0,7);ctx.stroke();
      ctx.globalAlpha=1;
    }
    ctx.restore();
    ctx.fillStyle="rgba(242,215,78,.9)";ctx.font="800 9px system-ui";ctx.textAlign="center";
    ctx.fillText("BOSS",x,y-r-12);
  }else{
    const sp=sprite(f.key);
    if(sp){
      /* 낫을 내리칠 때(strike) 앞으로 튀어나가고, 평소에는 좌우로 천천히 흔들립니다 */
      const st=f.strike>0?Math.sin((1-Math.max(0,f.strike)/.24)*Math.PI):0;
      const sway=Math.sin((f.wig||0)*0.9)*0.05*(1-st);
      const S=r*4.6;
      ctx.save();
      ctx.translate(x,y);
      faceFoe(ctx,f.face,sway);
      ctx.translate(st*r*0.55,0);            // 찌를 때 앞으로
      ctx.scale(1+st*0.10,1-st*0.06);
      if(f.flash>0)ctx.filter="brightness(0) invert(1)";
      ctx.drawImage(sp,-S/2,-S/2,S,S);
      ctx.restore();
    }else{
      ctx.save();ctx.translate(x,y);faceFoe(ctx,f.face);
      const sw=Math.sin(f.wig*1.1)*0.28;
      ctx.strokeStyle=col;ctx.lineWidth=3;ctx.lineCap="round";
      for(const s of [-1,1]){ctx.save();ctx.rotate(s*(0.5+sw));
        ctx.beginPath();ctx.moveTo(r*.4,0);ctx.lineTo(r*1.5,0);ctx.lineTo(r*1.9,-s*r*.7);ctx.stroke();
        ctx.restore()}
      ctx.beginPath();ctx.ellipse(-r*.2,0,r*1.05,r*.66,0,0,7);ctx.fillStyle=col;ctx.fill();
      ctx.beginPath();ctx.arc(r*.75,0,r*.42,0,7);ctx.fillStyle=f.flash>0?"#fff":"#8FE0BC";ctx.fill();
      ctx.restore();
    }
    /* 이 갈래는 원래 사마귀 하나뿐이라 BOSS 를 그냥 찍었습니다.
       매미처럼 보스가 아닌 것도 들어오므로 이름과 갈라 줍니다. */
    if(f.boss){ctx.fillStyle="rgba(242,215,78,.9)";ctx.font="800 9px system-ui";
      ctx.textAlign="center";ctx.fillText("BOSS",x,y-r-12)}
    else{ctx.fillStyle="rgba(140,220,120,.85)";ctx.font="600 8.5px system-ui";
      ctx.textAlign="center";ctx.fillText(f.name,x,y+r+11)}
  }
  const lift=(f.key==="hopper"&&f.air>0)?Math.sin((1-f.air/HOP_AIR)*Math.PI)*r*1.6:0;
  bar(f,x,y-r-6-lift,"#F25C5C",r);
}
/* 음파 — 우는 쪽에서 대상 쪽으로 고리 세 겹이 벌어지며 나아간다 */
function drawWave(w){
  const p=Math.min(1,(w.max-w.life)/w.max);
  const ang=Math.atan2(w.y1-w.y0,w.x1-w.x0);
  const far=Math.hypot(w.x1-w.x0,w.y1-w.y0);
  ctx.save();
  ctx.lineCap="round";
  for(let i=0;i<3;i++){
    const q=p-i*0.16;                       // 뒤 고리는 조금 늦게 출발한다
    if(q<=0||q>1)continue;
    const cx=(w.x0+(w.x1-w.x0)*q)*SX, cy=(w.y0+(w.y1-w.y0)*q)*SY;
    const rad=(2.2+q*3.4)*SX;
    ctx.globalAlpha=(1-q)*0.85;
    ctx.strokeStyle="#EBD9A6";ctx.lineWidth=2.2-q*1.1;
    ctx.beginPath();
    ctx.arc(cx,cy,rad,ang-0.85,ang+0.85);   // 나아가는 쪽만 벌어진 호
    ctx.stroke();
  }
  ctx.restore();ctx.globalAlpha=1;
}
function drawWeb(w){
  if(w.wave)return drawWave(w);
  const p=Math.min(1,(w.max-w.life)/(w.max*0.42));      // 뻗어 나가는 진행도
  const fade=Math.min(1,w.life/w.max*2.2);
  const ex=w.x0+(w.x1-w.x0)*p, ey=w.y0+(w.y1-w.y0)*p;
  let nx=-(w.y1-w.y0), ny=(w.x1-w.x0);
  const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
  ctx.strokeStyle=`rgba(232,232,248,${fade*0.95})`;
  ctx.lineWidth=1.7;ctx.lineCap="round";
  ctx.beginPath();
  for(let i=0;i<=10;i++){                                // 지그재그로 흔들리는 실
    const q=i/10;
    const wob=Math.sin(q*Math.PI*3.2)*1.7*(1-q*0.6);
    const bx=w.x0+(ex-w.x0)*q+nx*wob, by=w.y0+(ey-w.y0)*q+ny*wob;
    i?ctx.lineTo(bx*SX,by*SY):ctx.moveTo(bx*SX,by*SY);
  }
  ctx.stroke();
  if(p>=1){                                              // 착탄 — 들러붙은 거미줄
    const cx=w.x1*SX, cy=w.y1*SY, rr=7+(1-fade)*4;
    ctx.strokeStyle=`rgba(238,238,252,${fade*0.9})`;ctx.lineWidth=1.2;
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3+0.3;
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);ctx.stroke();
    }
    for(const ring of [0.45,0.85]){
      ctx.beginPath();
      for(let i=0;i<=6;i++){
        const a=i*Math.PI/3+0.3;
        const px2=cx+Math.cos(a)*rr*ring, py2=cy+Math.sin(a)*rr*ring;
        i?ctx.lineTo(px2,py2):ctx.moveTo(px2,py2);
      }
      ctx.stroke();
    }
  }
}
function bar(u,x,y,c,r){
  const w=Math.max(22,r*2.4);
  ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(x-w/2,y,w,3);
  ctx.fillStyle=c;ctx.fillRect(x-w/2,y,w*Math.max(0,u.hp/u.maxHp),3);
}
function loop(ts){
  if(!last)last=ts;
  const dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(B&&!B.over&&!B.paused)tick(dt);
  if(B)paint();
  if(B&&B.paused)paintPause();
  raf=requestAnimationFrame(loop);
}
function startLoop(){if(raf)return;last=0;raf=requestAnimationFrame(loop)}
function stopLoop(){if(raf)cancelAnimationFrame(raf);raf=null}
/* 전투 일시정지 — 화면 위에 덮개를 그린다. 계산(tick)만 멈추고 그리기는 계속한다 */
function paintPause(){
  if(!ctx)return;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font="bold 22px system-ui,sans-serif";
  ctx.fillText("일시정지",W/2,H/2-12);
  ctx.font="13px system-ui,sans-serif";ctx.fillStyle="rgba(255,255,255,.82)";
  ctx.fillText("화면을 누르면 계속",W/2,H/2+16);
  ctx.restore();
}
function togglePause(){
  if(!B||B.over)return;
  B.paused=!B.paused;
  if(!raf)startLoop();
}
/* ═══════════ 뒤로가기 (안드로이드 하드웨어 버튼 · Esc) ═══════════
   게이트 전투 중이면 일시정지 토글, 캠퍼스에서는 방 → 건물 → 캠퍼스 순으로 한 단계 올라간다.
   최상위 화면(캠퍼스·타이틀)에서는 한 번 더 누르면 종료. 그 밖(게이트 진행)은 무시. */
const BACK_FAC_SCENES=["office","shop","admissions","union","clinic","tower","arcade","dept","soon"];
let backExitArm=0;
function appExit(){
  try{
    const C=window.Capacitor;
    if(C&&C.Plugins&&C.Plugins.App&&C.Plugins.App.exitApp){C.Plugins.App.exitApp();return}
    if(navigator.app&&navigator.app.exitApp){navigator.app.exitApp();return}
  }catch(e){}
  history.go(-2);   // 웹에서는 트랩과 원래 항목을 건너뛴다 (최선)
}
function goBack(){
  /* 안내창이 떠 있으면 그것부터 닫는다. lock 이 걸린 것은 버튼으로만 닫힌다 */
  const pop=document.querySelector(".pop");
  if(pop){if(!pop.classList.contains("lock"))pop.remove();return}
  const S=G.scene;
  if(S==="battle"){togglePause();return}
  if(S==="spidergame"||S==="stargame"||S==="huntgame"){arcadeStop();AR=null;G.scene="arcade";render();return}
  if(S==="spiderend"||S==="starend"||S==="huntend"){AR=null;G.scene="arcade";render();return}
  if(S==="hall"||S==="gates"){G.scene="campus";render();return}
  if(BACK_FAC_SCENES.includes(S)){
    const b=BUILDINGS.find(x=>x.facs&&x.facs.includes(G.soonName));
    if(b){G.hallId=b.id;G.scene="hall"}else G.scene="campus";
    render();return;
  }
  if(S==="campus"||S==="title"){
    if(Date.now()-backExitArm<2000){appExit();return}

    toast("한 번 더 누르면 종료됩니다");
    return;
  }
  /* 게이트 진행 중 화면 — 그대로 둔다 */
}

/* ═══════════ 정산 ═══════════ */
function grantExp(list,amount){
  const out=[];
  for(const p of list){
    const b=p.lvl, e0=p.exp;      // 정산 화면 애니메이션이 '전투 전' 값을 쓴다
    p.exp+=amount;
    while(p.lvl<5&&p.exp>=nextExp(p.lvl)){p.exp-=nextExp(p.lvl);p.lvl++;p.points+=1;
      logAdd(p,`Lv ${p.lvl} 달성`)}
    out.push({p,up:p.lvl-b,lvl0:b,exp0:e0});
  }
  return out;
}
function finishBattle(){
  const exp=B.foes.reduce((s,f)=>s+f.exp,0);
  const dead=B.fallen.map(f=>f.ref);
  const alive=B.allies.filter(a=>a.hp>0);
  /* 쏜 만큼 줄어든 채로 돌아옵니다. 도중에 배낭 무기로 바꿔 들었어도 남은 총알은 그대로입니다 */
  for(const a of B.allies)
    if(a.ammoN!==undefined&&a.ref&&a.ref.ammo)a.ref.ammo[a.ammoType]=Math.max(0,a.ammoN);
  const broke=[];
  const hp0=new Map();                 // 전투 전 체력 — 정산 화면에서 여기서부터 깎아 보여준다
  for(const a of alive){
    hp0.set(a.ref,a.ref.hp);
    a.ref.hp=Math.round(a.hp);
    for(const slot of a.broken){
      const it=ITEMS[a.ref.gear[slot]];
      if(it){broke.push(`${a.ref.name}의 ${it.n}`);logAdd(a.ref,`${it.n} 파손`);a.ref.gear[slot]=null}
    }
  }
  /* 유품 — 사망자의 장비와 배낭이 바닥에 남는다 */
  const relic=[];
  if(dead.length){
    G.deaths+=dead.length;
    for(const d of dead){
      logAdd(d,`${G.day}일차 ${G.here?G.here.n:"게이트"}에서 사망`);
      G.memorial.push({name:d.name,lvl:d.lvl,stats:{...d.stats},
        gear:{...d.gear},where:G.here?G.here.n:"게이트",day:G.day,
        gate:G.gateName||"정문 게이트",log:(d.log||[]).slice()});
      for(const s of SLOTS)if(d.gear[s.k]){relic.push(d.gear[s.k]);d.gear[s.k]=null}
      for(const id of d.bag)relic.push(id);
      d.bag=[];
      /* 이고 있던 탄약은 온전한 뭉치만 남습니다 — 흩어진 것은 줍지 못합니다 */
      for(const t of Object.keys(AMMO_ID)){
        for(let k=Math.floor(roundsOf(d,t)/ammoQty(t));k>0;k--)relic.push(AMMO_ID[t]);
        if(d.ammo)d.ammo[t]=0;
      }
    }
    G.roster=G.roster.filter(r=>!dead.includes(r));
  }
  /* 마지막 날의 보스를 넘겼다 — 이 게이트는 여기서 끝난다 */
  if(G.mode==="run"&&G.day>=gateOf().days&&B.foes.some(f=>f.boss))G.gateClear=true;
  /* 복수전공 해금 — 서로 다른 네 전공이 살아서 10일차를 넘긴 순간 한 번만 */
  if(G.mode==="run"&&!G.dualOpen&&G.day>=DUAL_DAY&&alive.length>=DUAL_PARTY
     &&new Set(alive.flatMap(a=>majorsOf(a.ref))).size>=DUAL_PARTY){
    G.dualOpen=true;
    popup("복수전공",
      `서로 다른 네 전공이 한자리에서 ${DUAL_DAY}일차를 넘겼습니다.<br><br>
       행정실에서 전공을 하나 더 얹을 수 있습니다.`);
  }
  const found=G.mode==="tutorial"?[]:rollLoot(G.here,G.day);   // 탄약도 바닥에 그대로 놓입니다
  G.ground=[...found.map(id=>({id,src:"수확"})),...relic.map(id=>({id,src:"유품"}))];
  /* 보스를 넘긴 자리에는 불을 피울 거리가 남습니다. 게이트가 닫히는 날은 밖으로
     밀려나므로 쉴 밤이 없습니다. 챙겨 가는 사람이 있어야 캠프파이어가 열립니다. */
  if(G.mode==="run"&&!G.gateClear&&B.foes.some(f=>f.boss)){
    G.ground.push({id:"campkit",src:"수확"});
  }
  G.night=false;
  const results=grantExp(alive.map(a=>a.ref),exp);
  for(const r of results)r.hp0=hp0.has(r.p)?hp0.get(r.p):r.p.hp;
  G.lastGain={exp,results,dead,broke,
              boss:(B.foes.find(f=>f.boss)||{}).name||null,found:found.length,relic:relic.length};
  G.scene="reward";render();
}

/* ═══════════ 배낭·장비 조작 ═══════════ */
/* ─── 탄약 ───
   탄약은 본부에 쌓이지 않고 사람이 배낭에 이고 다닙니다. 한 칸이 한 뭉치이고,
   뭉치 크기는 ITEMS[…].qty 입니다 — 권총 탄약 12발들이면 13발은 두 칸을 씁니다.
   밸런스는 이 뭉치 크기로 잡습니다. */
const AMMO_ID={pistol:"ammoP",shotgun:"ammoS",rifle:"ammoR"};
const ammoQty=t=>ITEMS[AMMO_ID[t]].qty;
const roundsOf=(p,t)=>(p&&p.ammo&&p.ammo[t])||0;
const ammoSlots=p=>Object.keys(AMMO_ID).reduce((n,t)=>n+Math.ceil(roundsOf(p,t)/ammoQty(t)),0);
const bagRoom=p=>BAG_MAX-p.bag.length-ammoSlots(p);
/* 뭉치별 남은 발수 — 마지막 뭉치만 덜 찹니다. 배낭 화면이 한 줄씩 그립니다 */
function ammoStacks(p,t){
  const q=ammoQty(t),out=[];
  for(let left=roundsOf(p,t);left>0;left-=q)out.push(Math.min(q,left));
  return out;
}
/* 지금 뭉치의 빈 자리부터 채우고, 넘치면 새 칸을 씁니다 */
const ammoFits=(p,t,n)=>{
  const q=ammoQty(t),cur=roundsOf(p,t);
  return (Math.ceil(cur/q)*q-cur)+Math.max(0,bagRoom(p))*q>=n;
};
function giveAmmo(p,t,n){
  if(!p.ammo)p.ammo={pistol:0,shotgun:0,rifle:0};
  if(!ammoFits(p,t,n))return false;
  p.ammo[t]=roundsOf(p,t)+n;
  G.gunSeen[t]=true;markSeen(AMMO_ID[t]);
  return true;
}
/* 이 사람이 이걸 받을 수 있는가 — 탄약은 뭉치가 들어갈 자리가 있는지로 봅니다 */
function canTake(p,id){
  const it=ITEMS[id];
  return it.kind==="ammo"?ammoFits(p,it.ammo,it.qty):bagRoom(p)>0;
}
function giveItem(p,id){
  const it=ITEMS[id];
  if(it.kind==="ammo")return giveAmmo(p,it.ammo,it.qty);
  if(bagRoom(p)<=0)return false;
  if(it.ammo)G.gunSeen[it.ammo]=true;
  markSeen(id);tipInstItem(id);p.bag.push(id);return true;
}
function takeAllGround(list){
  for(const p of list){
    /* 자리가 없어 못 드는 것은 건너뛰고 다음 것을 봅니다 — 탄약과 물건이 섞여 있어서입니다 */
    for(let i=0;i<G.ground.length;){
      if(canTake(p,G.ground[i].id)&&giveItem(p,G.ground[i].id))G.ground.splice(i,1);
      else i++;
    }
  }
  G.sel=null;
}
function takeToBag(p,idx){
  const id=G.ground[idx].id, it=ITEMS[id];
  if(!canTake(p,id))return false;
  if(it.ammo)G.gunSeen[it.ammo]=true;      // 총을 손에 넣은 시점부터 탄약을 살 수 있다
  if(!giveItem(p,id))return false;
  G.ground.splice(idx,1);G.sel=null;return true;
}
/* 장비를 바꾸면 최대 체력만큼 현재 체력도 같이 오르내립니다.
   80/100에 체력 +4를 끼면 84/104가 되고, 벗으면 80/100으로 돌아옵니다.
   벗어서 체력이 0 이하가 되는 경우에는 아예 벗지 못하게 막습니다. */
function tryGear(p,fn){
  const g={...p.gear},bag=p.bag.slice(),hp0=p.hp,before=derive(p).maxHp;
  fn();
  const after=derive(p).maxHp,nhp=hp0+(after-before);
  if(nhp<1){p.gear=g;p.bag=bag;p.hp=hp0;return false}
  p.hp=Math.min(nhp,after);
  return true;
}
const GEAR_LOW="체력이 적어 아이템을 해제할 수 없습니다";
const GEAR_MAJ="전공이 적합하지 않습니다";
/* 안내창. render() 가 #app 을 갈아엎어도 남도록 body 에 붙입니다.
   lock 을 주면 버튼으로만 닫힙니다 — 닫는 것이 곧 다음 단계일 때 씁니다. */
function popup(title,html,btn,onOk,lock){
  const old=document.querySelector(".pop"); if(old)old.remove();
  const d=document.createElement("div");
  d.className="pop"+(lock?" lock":"");
  d.innerHTML=`<div class="card"><h2>${title}</h2><div class="txt">${html}</div>
    <div class="bar"><span class="tag"></span><button>${btn||"확인"}</button></div></div>`;
  d.querySelector("button").onclick=()=>{d.remove();if(onOk)onOk()};
  document.body.appendChild(d);
  return d;
}
/* 한 판에 한 번만 — 본 기록은 G.tips 에 남고 세이브에 그대로 실립니다 */
function tipOnce(key,title,html,btn){
  G.tips=G.tips||{};
  if(G.tips[key])return;
  G.tips[key]=true;
  popup(title,html,btn);
}
/* 현장 물건을 처음 손에 넣는 순간 — 반출과 무엇이 다른지 그때 알려 줍니다 */
function tipInstItem(id){
  const it=ITEMS[id];
  if(!it||it.kind!=="inst")return;
  tipOnce("inst","현장에서 주운 것",
    `<b style="color:var(--gate)">현장</b> 표시가 붙은 것은 게이트를 나가면 사라집니다.<br><br>
     <b style="color:var(--ok)">반출</b> 표시가 붙은 것만 살아서 나가야 지킬 수 있습니다.<br><br>
     사라질 물건이니 아끼지 말고 쓰십시오.`);
}
/* 화면을 다시 그려도 남도록 body 에 직접 띄웁니다 */
function toast(t){
  const d=document.createElement("div");
  d.className="toast";d.textContent=t;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),2400);
}
/* 성공하면 null, 못 들면 까닭을 돌려줍니다 */
function equipFromBag(p,bagIdx){
  const id=p.bag[bagIdx],it=ITEMS[id];
  if(!it.slot)return null;
  if(!canUse(p,it))return GEAR_MAJ;     // 총기는 전공이 맞아야 든다
  return tryGear(p,()=>{
    const old=p.gear[it.slot];
    p.bag.splice(bagIdx,1);
    p.gear[it.slot]=id;
    if(old)p.bag.push(old);
  })?null:GEAR_LOW;
}
/* ─── 어둠 에너지 결정 ───
   그 사람이 지금 지닌 현장 장비(찬 것 + 배낭에 든 것)만 강화 대상입니다.
   이미 강화된 것은 DARK_UP 에 없으므로 두 번 강화되지 않습니다. */
function darkTargets(p){
  const out=[];
  for(const s of SLOTS){const id=p.gear[s.k];if(id&&DARK_UP[id])out.push({w:"slot",k:s.k,id,sn:s.n})}
  p.bag.forEach((id,i)=>{if(DARK_UP[id])out.push({w:"bag",k:i,id,sn:"배낭"})});
  return out;
}
/* 결정 하나로 장비 하나. 같은 칸에 그대로 갈아 끼우므로 벗었다 낄 필요가 없습니다.
   체력 보정이 걸린 장비도 있어 tryGear 로 감쌉니다(문짝 체력 +10 → +16). */
function darkUse(p,bi,gi){
  const c=ITEMS[p.bag[bi]], g=darkTargets(p)[gi];
  if(!c||!c.crystal||!g)return false;
  const nid=darkId(g.id);
  const ok=tryGear(p,()=>{
    if(g.w==="slot")p.gear[g.k]=nid;else p.bag[g.k]=nid;
    p.bag.splice(bi,1);                       /* 자리를 바꾼 뒤에 결정을 뺍니다 */
  });
  if(!ok){toast(GEAR_LOW);return false}
  markSeen(nid);
  toast(`${ITEMS[g.id].n} → ${ITEMS[nid].n}`);
  return true;
}
/* ─── 실습동 ───
   캠퍼스에서 손볼 수 있는 것 — 창고에 있는 것과, 대원이 지금 지닌 반출 장비 전부.
   어둠 에너지 결정(darkTargets)이 한 사람 것만 보는 것과 달리 여기는 전부 모읍니다. */
function workTargets(){
  const out=[];
  for(const [id,n] of Object.entries(G.store))
    if(n>0&&WORK_UP[id])out.push({w:"store",id,n,sn:"창고",who:null});
  G.roster.forEach((r,ri)=>{
    for(const s of SLOTS){const id=r.gear[s.k];
      if(id&&WORK_UP[id])out.push({w:"slot",id,ri,k:s.k,sn:s.n,who:r})}
    r.bag.forEach((id,bi)=>{if(WORK_UP[id])out.push({w:"bag",id,ri,k:bi,sn:"배낭",who:r})});
  });
  return out;
}
/* 같은 칸에 그대로 갈아 끼웁니다. 체력 보정이 붙은 장비도 있어 tryGear 로 감쌉니다 */
function workUse(i){
  const t=workTargets()[i];
  if(!t)return false;
  const cost=workCost(t.id), nid=workId(t.id);
  if(G.gold<cost)return false;
  if(t.w==="store"){
    G.store[t.id]--; if(G.store[t.id]<=0)delete G.store[t.id];
    G.store[nid]=(G.store[nid]||0)+1;
  }else{
    const r=G.roster[t.ri];
    const ok=tryGear(r,()=>{if(t.w==="slot")r.gear[t.k]=nid;else r.bag[t.k]=nid});
    if(!ok){toast(GEAR_LOW);return false}
  }
  G.gold-=cost;markSeen(nid);
  toast(`${ITEMS[t.id].n} → ${ITEMS[nid].n}`);
  return true;
}
function useItem(p,bi){
  const it=ITEMS[p.bag[bi]];
  if(!it||!it.use)return;
  const m=derive(p).maxHp;
  if(p.hp>=m)return;
  p.hp=Math.min(m,p.hp+it.use.hp);
  p.bag.splice(bi,1);
}
function unequip(p,slot){
  const id=p.gear[slot];
  if(!id||bagRoom(p)<=0)return true;
  return tryGear(p,()=>{p.gear[slot]=null;p.bag.push(id)});
}


/* ═══════════ 미니게임 · 거미 잡기 ═══════════
   줄을 타고 내려오는 거미를 화면에서 눌러 잡습니다. 세 마리를 놓치면 끝. */
let AR=null,araf=null,arlast=0,acv,actx,AW=380,AH=470;
/* 요금을 못 내면 기계가 돌지 않습니다 */
function payFee(kind){
  const f=ARCADE_FEE[kind];
  if(G.gold<f)return false;
  G.gold-=f;return true;
}
function arcadeStop(){if(araf)cancelAnimationFrame(araf);araf=null}
function arcadeStart(){
  AR={kind:"spider",score:0,miss:0,t:0,spawn:.5,list:[],pops:[],over:false};
  acv=document.getElementById("acv");actx=acv.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  AW=acv.clientWidth;AH=Math.round(AW*1.22);
  acv.width=AW*dpr;acv.height=AH*dpr;acv.style.height=AH+"px";
  actx.setTransform(dpr,0,0,dpr,0,0);
  const grab=ev=>{
    if(!AR||AR.over)return;
    ev.preventDefault();
    const rc=acv.getBoundingClientRect();
    const pt=ev.touches?ev.touches[0]:ev;
    const mx=pt.clientX-rc.left,my=pt.clientY-rc.top;
    let best=null,bd=1e9;
    for(const s of AR.list){
      const d=Math.hypot(s.x-mx,s.y-my);
      if(d<s.r+16&&d<bd){bd=d;best=s}
    }
    if(best){
      AR.list=AR.list.filter(s=>s!==best);
      AR.score++;
      AR.pops.push({x:best.x,y:best.y,life:.5,t:"+1"});
    }else AR.pops.push({x:mx,y:my,life:.3,t:"헛손질"});
  };
  acv.onmousedown=grab;acv.ontouchstart=grab;
  arlast=0;arloop();
}
function arloop(ts){
  if(!AR){return}
  if(!arlast)arlast=ts||0;
  const dt=Math.min(.05,((ts||0)-arlast)/1000);arlast=ts||0;
  if(AR.kind==="star"){if(!AR.over)starStep(dt);starPaint()}
  else if(AR.kind==="hunt"){if(!AR.over)huntStep(dt);huntPaint()}
  else{if(!AR.over)arstep(dt);arpaint()}
  araf=requestAnimationFrame(arloop);
}
function arstep(dt){
  AR.t+=dt;
  AR.spawn-=dt;
  const gap=Math.max(0.34,0.95-AR.score*0.022);
  if(AR.spawn<=0){
    AR.spawn=gap;
    AR.list.push({x:24+Math.random()*(AW-48),y:-16,
      vy:66+AR.score*2.6+Math.random()*26,r:15,ph:Math.random()*6,sw:0.6+Math.random()*0.9});
  }
  for(const s of AR.list){s.y+=s.vy*dt;s.ph+=dt*3}
  const gone=AR.list.filter(s=>s.y>AH-14);
  if(gone.length){
    AR.miss+=gone.length;
    for(const g of gone)AR.pops.push({x:g.x,y:AH-24,life:.6,t:"놓침"});
    AR.list=AR.list.filter(s=>s.y<=AH-14);
  }
  AR.pops=AR.pops.filter(p=>{p.life-=dt;p.y-=26*dt;return p.life>0});
  if(AR.miss>=3){AR.over=true;setTimeout(()=>{G.scene="spiderend";render()},700)}
}
function arpaint(){
  actx.clearRect(0,0,AW,AH);
  const g=actx.createLinearGradient(0,0,0,AH);
  g.addColorStop(0,"#241E36");g.addColorStop(1,"#15121F");
  actx.fillStyle=g;actx.fillRect(0,0,AW,AH);
  actx.strokeStyle="rgba(216,71,126,.35)";actx.lineWidth=3;actx.strokeRect(1.5,1.5,AW-3,AH-3);
  // 바닥선
  actx.strokeStyle="rgba(200,120,120,.5)";actx.setLineDash([5,5]);actx.lineWidth=2;
  actx.beginPath();actx.moveTo(0,AH-14);actx.lineTo(AW,AH-14);actx.stroke();actx.setLineDash([]);
  for(const s of AR.list)arSpider(s);
  actx.textAlign="center";actx.font="800 14px system-ui";
  for(const p of AR.pops){
    actx.globalAlpha=Math.min(1,p.life*2.2);
    actx.fillStyle=p.t==="+1"?"#6BD98F":p.t==="놓침"?"#F25C5C":"#968CB0";
    actx.fillText(p.t,p.x,p.y);
  }
  actx.globalAlpha=1;
  actx.textAlign="left";actx.font="800 15px system-ui";actx.fillStyle="#F2D74E";
  actx.fillText(`잡은 수 ${AR.score}`,12,24);

const STAR_TIME=45;
function starStart(){
  acv=document.getElementById("acv");actx=acv.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  AW=acv.clientWidth;AH=Math.round(AW*1.28);
  acv.width=AW*dpr;acv.height=AH*dpr;acv.style.height=AH+"px";
  actx.setTransform(dpr,0,0,dpr,0,0);
  const F=AH-18;
  const plat=[
    {x:0,y:F,w:AW},
    {x:22,y:F-104,w:AW*0.30},
    {x:AW-22-AW*0.32,y:F-104,w:AW*0.32},
    {x:AW/2-AW*0.19,y:F-196,w:AW*0.38},
    {x:16,y:F-288,w:AW*0.27},
    {x:AW-16-AW*0.29,y:F-288,w:AW*0.29},
    {x:AW/2-AW*0.16,y:F-378,w:AW*0.32},
  ];
  AR={kind:"star",score:0,t:STAR_TIME,over:false,plat,stars:[],pops:[],
      p:{x:AW/2,y:F-20,vx:0,vy:0,w:15,h:22,ground:true,face:1,squash:0},
      touch:null};
  for(let i=0;i<3;i++)spawnStar();
  let downT=0,downX=0,downY=0,moved=0;
  const at=ev=>{
    const rc=acv.getBoundingClientRect();
    const pt=ev.touches&&ev.touches[0]?ev.touches[0]:ev;
    return{x:pt.clientX-rc.left,y:pt.clientY-rc.top};
  };
  const start=ev=>{
    if(!AR||AR.over)return;
    if(ev.cancelable)ev.preventDefault();
    const q=at(ev);downT=Date.now();downX=q.x;downY=q.y;moved=0;
    AR.drag=true;AR.touch=q.x;
  };
  const move=ev=>{
    if(!AR||AR.over||!AR.drag)return;
    if(ev.cancelable)ev.preventDefault();
    const q=at(ev);
    moved=Math.max(moved,Math.hypot(q.x-downX,q.y-downY));
    AR.touch=q.x;
  };
  const end=ev=>{
    if(!AR||AR.over)return;
    // 짧게 톡 치면 점프. 끌었으면 이동으로만 친다
    if(Date.now()-downT<260&&moved<14)starJump();
    AR.drag=false;AR.touch=null;
  };
  acv.addEventListener("touchstart",start,{passive:false});
  acv.addEventListener("touchmove",move,{passive:false});
  acv.addEventListener("touchend",end);
  acv.addEventListener("touchcancel",end);
  acv.addEventListener("mousedown",start);
  acv.addEventListener("mousemove",move);
  acv.addEventListener("mouseup",end);
  acv.addEventListener("mouseleave",end);
  arlast=0;arloop();
}
function spawnStar(){
  const pl=AR.plat[1+((Math.random()*(AR.plat.length-1))|0)];

}
let lastJump=0;
function starJump(){
  if(!AR||AR.kind!=="star"||AR.over)return;
  const now=Date.now();
  if(now-lastJump<130)return;              // 같은 탭이 두 번 들어오는 것 방지
  // 발판을 막 벗어난 직후에도 잠깐은 뛸 수 있게 (코요테 타임)
  if(AR.p.ground||AR.p.coyote>0){

function starStep(dt){

  // 좌우 이동 — 손가락 위치를 따라간다
  if(AR.touch!==null){
    const d=AR.touch-p.x;
    p.vx=Math.max(-300,Math.min(300,d*7));
    if(Math.abs(d)>3)p.face=d>0?1:-1;
  }else p.vx*=0.82;
  p.x=Math.max(p.w,Math.min(AW-p.w,p.x+p.vx*dt));
  // 중력
  p.vy+=1750*dt;
  const py=p.y;

  for(const pl of AR.plat){
    if(p.vy>=0 && py<=pl.y+1 && p.y>=pl.y && p.x>pl.x-6 && p.x<pl.x+pl.w+6){
      p.y=pl.y;p.vy=0;p.ground=true;
      if(p.squash<0)p.squash=0.3;

  p.coyote=p.ground?0.12:Math.max(0,(p.coyote||0)-dt);

  p.squash*=Math.pow(0.02,dt);

    if(Math.hypot(st.x-p.x,st.y-(p.y-p.h*0.6))<26){

  actx.textAlign="center";actx.font="800 14px system-ui";

const GUN_COOL=0.11;

function huntStart(){

function huntStep(dt){
  const h=AR.h;
  AR.t+=dt;
  // 손가락 따라 좌우 이동
  if(AR.touch!==null&&AR.drag){
    const d=AR.touch-h.x;
    h.x=Math.max(h.w,Math.min(AW-h.w,h.x+Math.max(-360,Math.min(360,d*8))*dt));
  }
  // 자동 사격
  AR.cool-=dt;
  if(AR.cool<=0){AR.cool=GUN_COOL;AR.b.push({x:h.x,y:h.y-20,vy:-700})}
  for(const b of AR.b)b.y+=b.vy*dt;
  AR.b=AR.b.filter(b=>b.y>-20);
  // 좀비 등장
  AR.spawn-=dt;
  if(AR.spawn<=0){
    AR.spawn=Math.max(0.42,1.15-AR.score*0.022);
    AR.z.push({x:26+Math.random()*(AW-52),y:-18,r:14,hp:1,
      vy:34+AR.score*1.5+Math.random()*18,ph:Math.random()*6});
  }
  // 25마리마다 보라 좀비
  if(AR.score>=AR.tankAt){
    AR.tankAt+=TANK_EVERY;
    AR.z.push({x:40+Math.random()*(AW-80),y:-30,r:23,hp:TANK_HP,maxHp:TANK_HP,tank:true,
      vy:26+AR.score*0.5,ph:Math.random()*6});

  // 명중 — 한 방이면 죽는다
  for(const b of AR.b.slice()){

      if(Math.hypot(z.x-b.x,z.y-b.y)<z.r+6){
        AR.b=AR.b.filter(x=>x!==b);

function huntZombie(z){

  actx.beginPath();actx.arc(r*0.6,lp*r*0.1,r*0.44,0,7);
  actx.fillStyle=head;actx.fill();actx.stroke();

  actx.beginPath();actx.arc(r*0.82,-r*0.15,r*0.09,0,7);actx.fill();
  actx.beginPath();actx.arc(r*0.82,r*0.15,r*0.09,0,7);actx.fill();

  }
}

/* ═══════════ 정산 화면 전용 막대 ═══════════
   전투 '전' 값에서 시작해 '후' 값으로 움직인다. 얼마나 깎이고 얼마나 자랐는지 눈에 보이게. */
const pctOf=(e,l)=>l>=5?100:Math.max(0,Math.min(100,e/nextExp(l)*100));

  const a=pctOf(exp0,lvl0), b=pctOf(p.exp,p.lvl), up=r.up>0;

/* 막대·숫자를 한 프레임씩 굴린다. 레벨업(wrap)이면 100까지 채웠다가 0에서 이어 채운다 */
function playGain(root,alive){
  const rt=root||el, live=alive||(()=>G.scene==="reward");
  const bars=[...rt.querySelectorAll("i[data-anim]")].map(n=>
    ({n,from:+n.dataset.from,to:+n.dataset.to,wrap:n.dataset.wrap==="1"}));
  const cnts=[...rt.querySelectorAll("[data-cnt]")].map(n=>
    ({n,from:+n.dataset.from,to:+n.dataset.to}));
  if(!bars.length&&!cnts.length)return;
  const DUR=900, t0=performance.now(), ease=x=>1-Math.pow(1-x,3);
  (function step(now){
    if(!live())return;                            // 화면을 떠났으면 그만
    const k=Math.min(1,(now-t0)/DUR), e=ease(k);
    for(const b of bars){
      let w;
      if(!b.wrap) w=b.from+(b.to-b.from)*e;
      else{ const first=100-b.from, got=(first+b.to)*e; w=got<first?b.from+got:got-first; }
      b.n.style.width=Math.max(0,Math.min(100,w))+"%";
    }
    for(const c of cnts) c.n.textContent=Math.round(c.from+(c.to-c.from)*e);
    if(k<1)requestAnimationFrame(step);
  })(t0);
}

function compareLine(p,id){
  const it=ITEMS[id];
  if(!it.slot)return "";
  if(it.req&&!majorsOf(p).some(m=>it.req.indexOf(m)>=0))
    return `<div class="cmp"><span class="dd">${p.name}은(는) 다룰 수 없습니다</span> · ${it.req.join(" / ")} 전용</div>`;

  if(cur&&cur.id===id)return `<div class="cmp">${p.name}이(가) 이미 끼고 있습니다</div>`;
  const ghost={stats:p.stats,gear:{...p.gear}};
  ghost.gear[it.slot]=id;
  const a=derive(p),b=derive(ghost),out=[];
  for(const f of [["atk","공격력"],["guard","피해감소"],["aspd","공속"],["speed","이동"],["maxHp","체력"]]){
    if(a[f[0]]===b[f[0]])continue;
    out.push(`${f[1]} ${a[f[0]]} <span class="${b[f[0]]>a[f[0]]?"du":"dd"}">→ ${b[f[0]]}</span>`);
  }
  if(it.slot==="rh"){
    if(a.dmg!==b.dmg)out.push(`피해 ${a.dmg} → <b>${b.dmg}</b>`);

  }
  return `<div class="cmp">지금 <b>${cur?cur.n:"맨몸"}</b> 자리 · ${out.length?out.join(" · "):"수치는 그대로"}</div>`;

      ${t.map((r,i)=>`<div class="app">${faceTag(r)}<div class="hd"><b>${r.name}</b><span>${majorName(r)} · Lv ${r.lvl}</span></div>
        ${hpLine(r)}${invPanel(r,G.roster.indexOf(r),"manage",t)}${gearLine(r)}</div>`).join("")}
      ${tut?"":`<div class="bar"><span class="tag"></span><button id="done">정리 끝</button></div>`}`;
    /* 줄 아무 데나 눌러 고릅니다. 버튼은 고른 줄 아래에만 나옵니다 */
    el.querySelectorAll("[data-gsel]").forEach(d=>d.onclick=e=>{
      if(e.target.closest("button"))return;
      const i=+d.dataset.gsel;G.sel=(G.sel===i?null:i);render()});
    el.querySelectorAll("[data-give]").forEach(b=>b.onclick=()=>{
      takeToBag(t[+b.dataset.give],G.sel);render()});
    el.querySelectorAll("[data-toss]").forEach(b=>b.onclick=()=>{
      G.ground.splice(G.sel,1);G.sel=null;render()});
    const ab=document.getElementById("all");
    if(ab)ab.onclick=()=>{takeAllGround(t);render()};
    bindInv();
    const done=document.getElementById("done");
    /* 정리를 끝낼 때 키트를 든 사람이 있으면 그 자리에서 타 버리고 캠프파이어로 넘어갑니다 */
    if(done)done.onclick=()=>{
      G.ground=[];G.sel=null;G.invSel=null;
      const k=kitHolder();
      if(k){
        k.p.bag.splice(k.i,1);
        popup("캠프파이어 키트",
          `당신은 전리품을 조사하던 중 캠프파이어로 쓸 만한 물건들을 찾았습니다.<br><br>
           이 캠프파이어 키트는 알 수 없는 에너지에 지나치게 노출되어 곧 바스라질 것만 같습니다.<br><br>
           오늘은 좀 쉬면서 다음 일정을 준비하는 게 좋겠습니다.`,
          "불을 피운다",()=>{G.scene="campfire";render()},true);
        return;
      }
      G.scene="afterloot";render()};
    /* 튜토리얼은 둘 다 차는 순간 애벌레가 다가옵니다. 안내창을 닫는 것이 곧 전투 시작이라
       lock 을 걸어 버튼으로만 닫히게 합니다. */
    if(tut&&p.gear.rh==="ladle"&&p.gear.lh==="lid"&&!G.tutWorm){
      G.tutWorm=true;
      popup("무언가 다가온다",
        `아이템을 줍는 동안 당신 근처에서 무언가 움직이는 것이 느껴집니다.<br><br>
         놀랍게도 그것은 거대한 녹색의 애벌레였습니다. 그것들은 꿈틀거리며 당신을 향해 다가옵니다.`,
        "확인",
        ()=>{G.ground=[];G.sel=null;G.invSel=null;
             ROOM=ROOMS[G.here.room];enterBattle([p],["worm","worm"])},
        true);
    }
    return;
  }
  /* ── 캠프파이어 ── 보스를 넘긴 밤, 세 가지 중 하나를 하고 다음 날로 넘어갑니다 */
  if(S==="campfire"){
    const t=party();
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">${G.gateName} · <b>${G.day}</b>일차 밤</span>
      <span class="tag">파티 ${t.length}명</span></div>
      <div class="bldbg soft" ${CAMPFIRE_ART?`style="background-image:url('${artUrl(CAMPFIRE_ART)}')"`:""}>
        <div class="card"><h2>모닥불</h2>
        <p>따뜻한 불 아래 모인 일행은 앞으로의 대책을 의논합니다.</p></div>
        <button class="place" data-c="skill"><h3>스킬 수련</h3></button>
        <button class="place" data-c="rest"><h3>휴식</h3></button>
        <button class="place" data-c="night"><h3>야간 탐색</h3></button>
      </div>
      <div class="card"><h2>파티</h2>
      ${t.map(r=>`<div class="app">${faceTag(r)}<div class="hd"><b>${r.name}</b><span>Lv ${r.lvl}</span></div>
        ${hpLine(r)}</div>`).join("")}</div>`;
    el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
      const c=b.dataset.c;
      if(c==="skill"){
        G.extraSkill=true;
        popup("스킬 수련",
          `불빛에 기대어 몸에 붙은 힘을 되짚어 봅니다.<br><br>
           내일 아침, 익힐 힘을 한 번 더 고를 수 있습니다.`,
          "확인",()=>{G.scene="afterloot";render()},true);
        return;
      }
      if(c==="rest"){
        const rows=[];
        for(const r of t){
          const m=derive(r).maxHp,was=r.hp;
          r.hp=Math.min(m,r.hp+Math.round(m*(0.25+Math.random()*0.10)));
          rows.push(`<div class="app"><div class="hd"><b>${r.name}</b>
            <span style="color:var(--ok)">체력 +${Math.round(r.hp-was)}</span></div>
            ${hpLineGain(r,was)}</div>`);
        }
        const d=popup("휴식",
          `번갈아 불을 지키며 눈을 붙였습니다.${rows.join("")}`,
          "확인",()=>{G.scene="afterloot";render()},true);
        playGain(d,()=>document.body.contains(d));
        return;
      }
      /* 야간 탐색 — 날짜는 그대로 두고 다음 날 배율의 적과 붙습니다 */
      const pl=nightPlace();
      pl.risk=rollNightRisk();
      G.night=true;G.here=pl;ROOM=ROOMS[pl.room];
      popup("야간 탐색",
        `불을 등지고 어두운 거리로 나섭니다.<br><br>위험도 ${"★".repeat(pl.risk+1)}`,
        "나선다",
        ()=>enterBattle(t,rollEncounter(G.day+1,pl.risk,t.length,true)),true);
    });
    return;
  }
  if(S==="afterloot"){
    const list=G.mode==="tutorial"?[p]:G.roster;
    G.scene=list.some(x=>x.points>0)?"levelup":(G.mode==="tutorial"?"retreat":"nextday");
    render();return;
  }
  if(S==="levelup"){
    const list=G.mode==="tutorial"?[p]:G.roster;
    const who=list.find(x=>x.points>0);
    if(!who){G.scene=G.mode==="tutorial"?"retreat":"nextday";render();return}
    allocScreen(who,`${who.name} · Lv ${who.lvl}`,
      `좀처럼 오르지 않는 레벨이 올랐습니다. 포인트 ${who.points}점.`,
      ()=>{G.scene=list.some(x=>x.points>0)?"levelup":(G.mode==="tutorial"?"retreat":"nextday");render()});
    return;
  }
  if(S==="nextday"){nextDay();return}

  if(S==="retreat"){
    const tut=G.mode==="tutorial";
    const keep=[],lose=[];
    for(const r of (tut?[p]:G.roster)){
      for(const s of SLOTS){const it=ITEMS[r.gear[s.k]];if(it&&it.kind==="inst")lose.push(it.n)}
      for(const id of r.bag){const it=ITEMS[id];
        if(it.kind==="inst")lose.push(it.n);else if(it.kind==="perm")keep.push(it.n)}
    }
    const junkVal=(tut?[p]:G.roster).reduce((s,r)=>s+r.bag.reduce((a,id)=>
      a+(ITEMS[id].kind==="junk"?ITEMS[id].price:0),0),0);
    const mystN=(tut?[p]:G.roster).reduce((s,r)=>s+r.bag.filter(id=>ITEMS[id].mystery).length,0);
    const cleared=!tut&&G.gateClear;
    const nextG=cleared?GATES.find(g=>g.need===gateOf().id):null;
    el.innerHTML=logo+`<div class="card"><h2>${tut?"일단 물러난다":cleared?"게이트가 닫힌다":"게이트를 나선다"}</h2>
      <p>${tut?"고작 벌레 두 마리였는데 손이 떨린다. 더 안쪽에는 무엇이 있을지 가늠이 되지 않는다.<br><br>두려움을 느낀 당신은 일단 귀환하기로 한다.":
        cleared?`${gateOf().n}의 가장 안쪽에 있던 것이 쓰러졌습니다. 문이 스스로 오므라들고, 당신들은 밖으로 밀려납니다.`
          +(nextG?`<br><br><b style="color:var(--gate)">${nextG.n}</b>가 열렸습니다.`:"")
          +`<br><br>몸에 붙었던 요령과 현장에서 주운 것들은 문을 나서는 순간 사라집니다.`:
        `${G.day}일차까지 버텼습니다. 몸에 붙었던 요령과 현장에서 주운 것들은 문을 나서는 순간 사라집니다.`}</p></div>
      <div class="card"><h2>가지고 나갈 것</h2>
      <div class="derived">팔 수 있는 잡화 <b>${junkVal}</b> 골드어치${mystN?` · 감정할 물건 <b>${mystN}</b>개`:""}${keep.length?` · 반출품 <b>${keep.join(", ")}</b>`:""}</div>
      ${lose.length?`<div class="tag" style="margin-top:8px;color:var(--bad)">사라짐 · ${lose.join(", ")}</div>`:""}</div>
      <div class="bar"><span class="tag"></span><button id="o">귀환한다</button></div>`;
    document.getElementById("o").onclick=()=>{
      if(G.fought)G.explores++;
      /* 깬 게이트를 적어 둔다 — 다음 게이트는 이걸 보고 열린다 */
      if(cleared&&!G.cleared.includes(gateOf().id))G.cleared.push(gateOf().id);
      G.gateClear=false;
      const went=tut?[p]:party();
      /* 총기를 손에 들었든 배낭에 넣었든, 살아서 캠퍼스까지 가져오면 ROTC가 열립니다 */
      const hasGun=r=>SLOTS.some(s=>{const it=ITEMS[r.gear[s.k]];return it&&it.ammo})
                    ||r.bag.some(id=>ITEMS[id].ammo);
      if(went.some(r=>r.hp>0&&hasGun(r)))G.gunHome=true;
      if(tut){G.roster=[p];G.mode="campus";if(!G.announced.includes("office"))G.announced.push("office")}
      for(const r of G.roster){
        for(const s of SLOTS){const it=ITEMS[r.gear[s.k]];if(it&&it.kind==="inst")r.gear[s.k]=null}
        const nb=[];
        for(const id of r.bag){const it=ITEMS[id];
          if(it.kind==="junk")G.loot[id]=(G.loot[id]||0)+1;
          else if(it.kind==="perm")nb.push(id)}
        r.bag=nb;
        const m=derive(r).maxHp;
        if(went.includes(r)&&r.hp/m<=0.5)G.woundedReturn=true;
        let rate=went.includes(r)?0.10:0.05;
        if(r.resting){
          if(G.gold>=10){G.gold-=10;rate=0.40;G.bedBill=(G.bedBill||0)+10}
          else{r.resting=false;rate=0.05;G.bedKick=r.name}
        }
        r.hp=Math.min(m,r.hp+Math.round(m*rate));
      }
      G.fought=false;G.instants=[];G.day=1;G.offer=null;G.here=null;G.ground=[];
      G.extraSkill=false;G.extraNow=false;G.night=false;
      G.scene=tut?"briefing":"campus";render()};
    return;
  }
  if(S==="fail"){
    el.innerHTML=logo+`<div class="card"><h2>돌아오지 못했다</h2>
      <p>파티가 전멸했습니다. 가지고 있던 것도 전부 안에 남았습니다.</p></div>
      <div class="bar"><span class="tag"></span><button id="r">처음부터</button></div>`;
    deleteSave(curSlot());                   // 전멸은 되돌릴 수 없습니다
    document.getElementById("r").onclick=()=>{G={scene:"title"};render()};
    return;
  }
  if(S==="briefing"){
    el.innerHTML=logo+`
      <div class="card"><h2>폐쇄된 캠퍼스</h2>
      <p>정문을 나오자 몸을 감싸던 기운이 걷힙니다. 남은 사람들은 건물 안으로 숨어들어, 길에는 아무도 없습니다.<br><br>
      주워온 것을 팔 수 있는 곳이 <b style="color:var(--mark)">본관</b>에 있다고 들었습니다.
      나머지는 가 보면 알겠지요.</p></div>
      <div class="bar"><span class="tag">잡화 <b>${lootTotal()}</b> 골드어치</span><button id="ok">캠퍼스로</button></div>`;
    document.getElementById("ok").onclick=()=>{
      G.mapMsg="본관으로 가 봅시다. 주워온 것을 사 줄 사람이 있습니다.";
      G.scene="campus";render()};
    return;
  }
  if(S==="talk"){
    const id=G.talkFor,np=NPCS[id],ls=np.first,last=G.talkLine>=ls.length-1;
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">${np.role}</span><span class="tag">${G.talkLine+1} / ${ls.length}</span></div>
      <div class="card">${npcHead(id)}<p class="say">${ls[G.talkLine]}</p></div>
      <div class="bar"><button class="ghost" id="sk">건너뛴다</button><button id="nx">${last?"들어간다":"계속"}</button></div>`;
    const go=()=>{G.metNpc[id]=true;G.npcSay=pick(np.again);G.npcSayFor=id;G.scene=G.talkNext;render()};
    document.getElementById("nx").onclick=()=>{if(last)go();else{G.talkLine++;render()}};
    document.getElementById("sk").onclick=go;
    return;
  }
  if(S==="campus"){
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">본진 · 탐색 ${G.explores}회 · 사망 ${G.deaths}명${DEV_SHOW_UNLOCK?' <b style="color:var(--gate)">DEV</b>':""}</span>
      <span class="tag">골드 <b>${G.gold}</b></span></div>
      <div id="map"><img src="${artUrl(CAMPUS_ART)}" alt="캠퍼스">
      ${BUILDINGS.map(b=>{const lit=bldLit(b),x=b.box;
        return `<button class="pin ${lit?"":"lock"} ${b.id==="gate"?"gate":""}" data-b="${b.id}"
          style="left:${x[0]}%;top:${x[1]}%;width:${x[2]-x[0]}%;height:${x[3]-x[1]}%"
          >${lit?b.n:"???"}</button>`}).join("")}</div>
      ${G.mapMsg?`<div class="tag" style="color:var(--dim)">${G.mapMsg}</div>`:""}
      <div class="card"><h2>명단 · ${G.roster.length}명</h2>
      ${G.bedKick?`<div class="tag" style="color:var(--bad);margin-bottom:8px">골드가 모자라 ${G.bedKick}이(가) 퇴원했습니다</div>`:""}
      ${G.roster.map(r=>{
        const on=party().includes(r);
        const st=r.resting?'<span style="color:var(--ok)">입원</span>':on?'<span style="color:var(--mark)">출동</span>':"대기";
        return `<div class="app ${r.resting?"":on?"sel":"out"}">
          ${faceTag(r)}<div class="hd"><b>${r.name}</b><span>${st} · ${majorName(r)} · Lv ${r.lvl}</span></div>
          ${hpLine(r)}${statGrid(r)}${invPanel(r,G.roster.indexOf(r),"manage",G.roster)}${gearLine(r)}${expBar(r)}</div>`}).join("")}</div>`;
    bindInv();
    el.querySelectorAll("[data-b]").forEach(bt=>bt.onclick=()=>{
      const b=BUILDINGS.find(x=>x.id===bt.dataset.b);
      if(b.facs===null){G.mapMsg=null;G.scene="gates";render();return}   // 정문 = 게이트
      /* ??? 로 뜨는 건물은 들어갈 수 없습니다. 시설이 없는 건물도 같은 말만 합니다 —
         둘을 다른 말로 알려주면 어느 쪽이 언젠가 열릴 건물인지 티가 납니다. */
      if(!bldLit(b)){G.mapMsg="잠겨 있습니다.";render();return}
      G.mapMsg=null;
      G.hallId=b.id;G.scene="hall";render()});
    return;
  }
  if(S==="hall"){
    const b=BUILDINGS.find(x=>x.id===G.hallId)||BUILDINGS.find(x=>x.id==="main");
    const bg=BLD_ART[b.id]?`style="background-image:url('${artUrl(BLD_ART[b.id])}')"`:"";
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">${b.n}</span><span class="tag">골드 <b>${G.gold}</b></span></div>
      <div class="bldbg" ${bg}>
      ${b.facs.map(id=>{const f=facOf(id),o=f.cond(G);
        return `<button class="fac ${o?"":"lock"}" ${o?`data-f="${id}"`:"disabled"}>
          <span class="ic">${o?facIcon(id,f.ic):"🔒"}</span>
          <span class="tx"><b>${o||DEV_SHOW_UNLOCK?f.n:"잠겨 있다"}</b><span>${
            o?f.d:`<i>${f.prog(G)}</i>`}</span></span></button>`}).join("")}
      </div>
      <div class="bar"><span class="tag"></span><button class="ghost" id="bk">밖으로</button></div>`;
    el.querySelectorAll("[data-f]").forEach(bt=>bt.onclick=()=>enterFac(bt.dataset.f));
    document.getElementById("bk").onclick=()=>{G.scene="campus";render()};
    return;
  }
  if(S==="office"){
    const dorm=dormMax(),dcost=dormCost(),sq=squadMax(),scost=squadCost();
    const tfOpen=majorKinds()>=TRANSFER_KINDS;
    const ent=Object.entries(G.loot).filter(([,n])=>n>0);
    const rows=ent.filter(([id])=>!ITEMS[id].mystery);
    const myst=ent.filter(([id])=>ITEMS[id].mystery);
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">행정실</span><span class="tag">골드 <b>${G.gold}</b></span></div>
      ${npcBar("office")}
      ${myst.length?`<div class="card" style="border-color:var(--gate)"><h2>감정</h2>
      <p>값을 알 수 없는 물건을 행정실에서 감정할 수 있습니다.</p>
      ${myst.map(([id,n])=>{const o=G.rowSel==="app:"+id;
        return `<div class="buyrow tap ${o?"open":""}" data-row="app:${id}">
        <div><b>${itemIcon(id)}${ITEMS[id].n}</b> × ${n}<span class="tag"> · 추정 ${ITEMS[id].mystery.lo}~${ITEMS[id].mystery.hi} 골드</span></div>
        <span class="caret">${o?"▴":"▾"}</span>
        ${o?`<div class="acts"><button data-app="${id}">열어본다</button></div>`:""}</div>`}).join("")}
      ${G.appraisal?`<div class="tag" style="margin-top:10px;color:var(--mark)">${G.appraisal}</div>`:""}</div>`:
      (G.appraisal?`<div class="tag" style="color:var(--mark)">${G.appraisal}</div>`:"")}
      <div class="card"><h2>회수품 매입</h2>
      <p>게이트에서 가져온 물품은 행정실에서 돈으로 교환할 수 있습니다.</p>
      ${rows.length?rows.map(([id,n])=>`<div class="buyrow">
        <div><b>${itemIcon(id)}${ITEMS[id].n}</b> × ${n}<span class="tag"> · 개당 ${ITEMS[id].price} 골드</span></div>
        <div class="tag">${ITEMS[id].price*n} 골드</div></div>`).join("")
        :`<div class="tag" style="margin-top:10px">팔 것이 없습니다.</div>`}
      <div class="bar" style="margin-top:12px"><span class="tag">받을 금액 <b>${lootTotal()}</b> 골드</span>
      <button id="sell" ${rows.length?"":"disabled"}>전부 판다</button></div></div>
      <div class="card"><h2>정원</h2>
      ${dorm>=DORM_MAX?`<p>${DORM_MAX}명이 한계입니다. 학적부에 더 낼 자리가 없습니다.</p>`
       :`<p>학적부에 자리를 한 칸 더 냅니다. 자리값은 한 칸 늘 때마다 50 골드씩 붙습니다.</p>
         <div class="bar" style="margin-top:10px"><span class="tag">지금 ${dorm}명 → ${dorm+1}명 · 명단 ${G.roster.length}명</span>
         <button id="updorm" ${G.gold<dcost?"disabled":""}>${dcost} 골드로 늘린다</button></div>`}</div>
      <div class="card"><h2>학적</h2>
      ${tfOpen?`<p>전공을 옮기거나, 하나 더 얹습니다.</p>
        <div class="bar" style="margin-top:10px"><span class="tag"></span>
        <button id="tf">전과를 하고 싶어요</button></div>`

    el.querySelectorAll("[data-hand]").forEach(b=>b.onclick=()=>{G.rowSel=null;
      const [id,i]=b.dataset.hand.split("|");const r=G.roster[+i];
      if(!(G.store[id]>0)||!giveItem(r,id))return;
      G.store[id]--; if(G.store[id]<=0)delete G.store[id];
      render()});
    bindInv();
    document.getElementById("no").onclick=()=>{G.scene="gates";render()};
    document.getElementById("yes").onclick=()=>{
      G.mode="run";G.day=1;G.instants=[];G.offer=null;G.ground=[];G.sel=null;
      G.extraSkill=false;G.extraNow=false;G.night=false;
      G.gate=G.picked||"front";G.gateClear=false;
      G.gateName=G.pickedGate;G.scene="gateforce";render()};
    return;
  }
}
addEventListener("keydown",onKeyJump);
addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();goBack()}});
addEventListener("resize",()=>{if(G.scene==="battle")fitCanvas()});
bootGame();

</script>
</body>
</html>
