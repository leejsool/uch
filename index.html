    const [pi,slot]=b.dataset.un.split("|");
    G.gearMsg=unequip(G.roster[+pi],slot)?null:{pi:+pi,t:GEAR_LOW};render()});
  el.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>{G.invSel=null;
    const [pi,bi]=b.dataset.eq.split("|");
    const why=equipFromBag(G.roster[+pi],+bi);
    if(why)toast(why);
    G.gearMsg=why?{pi:+pi,t:why}:null;render()});
  /* 차고 있는 장비를 동료에게 — 받는 쪽 칸이 비었으면 바로 입히고, 아니면 배낭으로.
     벗는 쪽 체력이 모자라면(tryGear) 움직이지 않습니다 */
  el.querySelectorAll("[data-gmv]").forEach(b=>b.onclick=()=>{G.invSel=null;
    const [fi,slot,ti]=b.dataset.gmv.split("|");
    const from=G.roster[+fi],to=G.roster[+ti],id=from.gear[slot];
    if(!id||!(canWearNow(to,id)||canTake(to,id)))return;
    if(!tryGear(from,()=>{from.gear[slot]=null})){G.gearMsg={pi:+fi,t:GEAR_LOW};render();return}
    if(!handTo(to,id))from.gear[slot]=id;
    G.gearMsg=null;render()});
  el.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{G.invSel=null;
    const [fi,bi,ti]=b.dataset.mv.split("|");
    const from=G.roster[+fi],to=G.roster[+ti];
    const id=from.bag[+bi];
    /* 받는 쪽의 그 칸이 비어 있으면 배낭을 거치지 않고 바로 입힙니다 */
    if(canWearNow(to,id)){
      from.bag.splice(+bi,1);
      if(!handTo(to,id))to.bag.push(id);
      from.hp=Math.min(from.hp,derive(from).maxHp);render();return;
    }
    if(bagRoom(to)<=0)return;
    to.bag.push(from.bag.splice(+bi,1)[0]);
    from.hp=Math.min(from.hp,derive(from).maxHp);render()});
  el.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{G.invSel=null;
    const [pi,bi]=b.dataset.st.split("|");const p=G.roster[+pi];
    const id=p.bag.splice(+bi,1)[0];
    G.store[id]=(G.store[id]||0)+1;G.gearMsg=null;render()});
  el.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{G.invSel=null;
    const [pi,bi]=b.dataset.use.split("|");useItem(G.roster[+pi],+bi);render()});
  /* 어둠 에너지 결정+ — 그 자리에서 힘을 고르는 창이 한 번 열리고 사라집니다 */
  el.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{G.invSel=null;
    const [pi,bi]=b.dataset.sc.split("|");const p=G.roster[+pi];
    if(!(ITEMS[p.bag[+bi]]||{}).skill)return;
    p.bag.splice(+bi,1);
    G.skillBack=G.scene;G.skillOffer=null;G.extraNow=true;
    G.scene="instant";render()});
  el.querySelectorAll("[data-dk]").forEach(b=>b.onclick=()=>{G.invSel=null;
    const [pi,bi,gi]=b.dataset.dk.split("|");
    darkUse(G.roster[+pi],+bi,+gi);G.gearMsg=null;render()});
  el.querySelectorAll("[data-dr]").forEach(b=>b.onclick=()=>{G.invSel=null;
    const [pi,where,key]=b.dataset.dr.split("|");const p=G.roster[+pi];
    if(where!=="slot"){p.bag.splice(+key,1);G.gearMsg=null;render();return}
    G.gearMsg=tryGear(p,()=>{p.gear[key]=null})?null:{pi:+pi,t:GEAR_LOW};render()});
  /* ── 탄약 뭉치 줄 — 누른 줄에 적힌 발수만큼 옮기거나 버립니다 ── */
  el.querySelectorAll("[data-adr]").forEach(b=>b.onclick=()=>{G.invSel=null;
    const [pi,t,n]=b.dataset.adr.split("|");const p=G.roster[+pi];
    p.ammo[t]=Math.max(0,roundsOf(p,t)-(+n));render()});
  el.querySelectorAll("[data-ast]").forEach(b=>b.onclick=()=>{G.invSel=null;
    const [pi,t,n]=b.dataset.ast.split("|");const p=G.roster[+pi];
    p.ammo[t]=Math.max(0,roundsOf(p,t)-(+n));
    G.store[AMMO_ID[t]]=(G.store[AMMO_ID[t]]||0)+1;render()});
  el.querySelectorAll("[data-amv]").forEach(b=>b.onclick=()=>{G.invSel=null;
    const [fi,t,n,ti]=b.dataset.amv.split("|");
    const from=G.roster[+fi],to=G.roster[+ti];
    if(!giveAmmo(to,t,+n))return;
    from.ammo[t]=Math.max(0,roundsOf(from,t)-(+n));render()});
}
/* 장비 6칸 — 보기만. 칸에 마우스를 올리면 능력치가 뜹니다(invPanel 과 같은 모양, 누르는 기능은 없음) */
const gearCellsView=p=>`<div class="gear6">${SLOTS.map(s=>{const id=p.gear[s.k],it=ITEMS[id];
  return `<div class="gc ${it?`has kind-${it.kind}`:""}" ${it?`title="${itemTip(it)}"`:""}>
    <span class="sn">${s.n}</span>${it?itemIcon(id):'<span class="ico empty"></span>'}
    <span class="nm">${it?it.n:"—"}</span></div>`}).join("")}</div>`;
function allocScreen(p,title,note,after){
  const d=derive(p);
  el.innerHTML=logo+`
    <div class="app">${faceTag(p)}<div class="hd"><b>${title}</b><span>${majorName(p)}</span></div>
      <p>${note}</p>
      <div class="inv"><div class="invh">장비</div>${gearCellsView(p)}</div></div>
    <div>${STATS.map(s=>{
      const v=p.stats[s.k],on=openAt(s,p.lvl),sp=p.spent&&p.spent[s.k];
      return `<div class="stat ${on?"":"locked"}">
        <span class="nm">${s.n}<span>${on?s.d:`${s.d} · Lv ${s.need}부터`}</span></span>
        <span class="vl">${v}</span>
        <button class="ghost" data-dn="${s.k}" ${sp?"":"disabled"}>−</button>
        <button data-up="${s.k}" ${on&&p.points>0?"":"disabled"}>+</button></div>`}).join("")}</div>
    <div class="derived">최대 체력 <b>${d.maxHp}</b> · 공격력 <b>${d.atk}</b> · 공격속도 <b>${d.aspd}</b> · 이동 <b>${d.speed}</b> · 치명타 <b>${d.crit}%</b></div>
    <div class="bar"><span class="tag">남은 포인트 <b>${p.points}</b></span>
    <button id="ok" ${p.points>0?"disabled":""}>확정</button></div>`;
  el.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.up;p.stats[k]++;p.points--;p.spent=p.spent||{};p.spent[k]=(p.spent[k]||0)+1;
    if(k==="vit")p.hp+=6;render()});
  el.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.dn;p.stats[k]--;p.points++;p.spent[k]--;
    p.hp=Math.min(derive(p).maxHp,p.hp);render()});
  document.getElementById("ok").onclick=()=>{delete p.spent;after()};
}
/* 익힌 힘 — 줄에 마우스를 올리거나 눌러 보면 그 힘이 무엇을 하는지 툴팁으로 나옵니다 */
/* ── 출동 명단 ── 게이트 화면 맨 위에 고용된 사람을 전부 늘어놓습니다.
   노랑 = 출동 · 초록 = 입원 · 나머지는 반투명. 이름을 누르면 출동 여부가 바뀝니다. */
function partyStrip(){
  const t=party();
  return `<div class="card"><div class="cardhead"><h2>출동 명단</h2>
    <span class="tag">${t.length} / ${squadMax()}명</span></div>
    <div class="chips">${rosterOrder().map(r=>{
      const cls=away(r)?"rest":t.includes(r)?"on":"off";
      return `<button class="pickb ${cls}" data-pt="${G.roster.indexOf(r)}"${away(r)?" disabled":""}>${r.name}</button>`;
    }).join("")}</div></div>`;
}
/* 게이트 선택 화면의 출동 명단 — 칸마다 이름과 초상.
   칸을 누르면 아래에 그 사람의 개요(전공·레벨·체력·경험치·능력치·장비)가 펼쳐지고,
   거기서 출동에 넣고 뺍니다. 입원 중인 사람은 펼쳐 보기만 합니다. */
function squadCards(){
  const t=party(), list=rosterOrder();
  const sel=G.sqSel!=null?G.roster[G.sqSel]:null;
  const cells=list.map(r=>{
    const ri=G.roster.indexOf(r), st=away(r)?"rest":t.includes(r)?"on":"off";
    return `<div class="sq ${st} ${sel===r?"open":""}" data-sq="${ri}">
      <b>${r.name}</b>${r.face?`<img src="${artUrl(r.face)}" alt="">`:'<span class="nf"></span>'}
      <span class="st">${r.resting?"입원":r.studying?"학습중":r.teaching?"교육중":st==="on"?"출동":"대기"}</span></div>`}).join("");
  let more="";
  if(sel&&list.includes(sel)){
    const on=t.includes(sel), full=!on&&t.length>=squadMax();
    more=`<div class="app sqd">${faceTag(sel)}<div class="hd"><b>${sel.name}</b>
        <span>${majorName(sel)} · Lv.${sel.lvl} · ${bagName(sel)} ${sel.bag.length+ammoSlots(sel)}/${bagMax(sel)}</span></div>
      ${barRows(sel)}${statGrid(sel)}${gearLine(sel)}
      <div class="acts">${away(sel)?`<span class="tag">${sel.resting?"입원":sel.teaching?"교육":"학습"} 중이라 나갈 수 없습니다</span>`
        :`<button class="mini" data-pt="${G.roster.indexOf(sel)}" ${full?"disabled":""}>${on?"출동에서 뺀다":full?"자리가 찼습니다":"출동에 넣는다"}</button>`}</div></div>`;
  }
  return `<div class="card"><div class="cardhead"><h2>출동 명단</h2>
    <span class="tag">${t.length} / ${squadMax()}명</span></div>
    <div class="sqgrid">${cells}</div>${more}</div>`;
}
function bindStrip(){
  el.querySelectorAll("[data-sq]").forEach(d=>d.onclick=()=>{
    const i=+d.dataset.sq;G.sqSel=(G.sqSel===i?null:i);render()});
  el.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{
    const r=G.roster[+b.dataset.pt];
    if(away(r))return;
    /* 아무도 안 고른 판에서는 party() 가 앞에서부터 자동으로 뽑습니다.
       한 명을 건드리는 순간 지금 나가는 사람들을 그대로 표로 굳혀 둡니다. */
    if(!G.roster.some(x=>x.inParty&&!away(x)))for(const x of party())x.inParty=true;
    if(!r.inParty&&G.roster.filter(x=>x.inParty&&!away(x)).length>=squadMax())return;
    r.inParty=!r.inParty;render()});
}
const chips=()=>G.instants.length?`<div class="chips">${G.instants.map((s,i)=>
  `<button class="chip${G.chipSel===i?" on":""}" data-chip="${i}">${s.n}<span class="tip">${skillText(s)}</span></button>`
  ).join("")}</div>`:"";
function bindChips(){
  el.querySelectorAll("[data-chip]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.chip;G.chipSel=(G.chipSel===i?null:i);render()});
}
/* ── 대화 이벤트는 캠퍼스에 한 번 올 때마다 하나만 ──
   조건이 여럿 겹쳐도 줄지어 대화가 이어지지 않게 합니다(앞뒤 대화가 이어진 이야기로 읽히기도 합니다).
   G.visit 은 게이트에서 돌아올 때마다 하나씩 늘고, 대화를 띄우면 G.talkAt 에 그 값을 적습니다.
   남은 대화는 다음에 돌아왔을 때 뜹니다. 플레이어가 직접 한 일에 바로 붙는 대화(활 첫 구매)는 세지 않습니다. */
const talkFree=()=>G.talkAt!==(G.visit||0);
const talkUse=()=>{G.talkAt=G.visit||0};
function pendingUnlock(){return FACILITIES.find(f=>f.cond(G)&&!G.announced.includes(f.id)&&(!f.intro||talkFree()))}
/* ── 해금 안내 ──
   화면을 통째로 가로채지 않고 팝업으로 띄웁니다. 본진 화면에 닿는 순간에만 도므로
   게이트 안에서 조건이 차도 캠퍼스로 돌아온 뒤에야 뜹니다(입학처·응급의학 실습실). */
function showUnlock(){
  const f=pendingUnlock();
  if(!f)return false;
  G.announced.push(f.id);
  G.unlockFrom=G.scene;
  if(f.onUnlock)f.onUnlock();          /* 안내를 닫기 전에 효과부터 겁니다 */
  const done=()=>{
    if(G.freeRecruit){G.scene="volunteer";render();return}
    if(f.introTo){G.hallId=f.introTo;G.scene="hall"}
    render();
  };
  if(f.intro){talkUse();popupTalk(f.intro,done)}          /* 대사로 연출하는 시설 */
  else popup(`${f.ic} ${f.n}`,f.msg,"확인",done,true);
  return true;
}
/* ── 캠퍼스로 돌아왔을 때 한 번씩 알리는 것들 ──
   조건은 게이트 안에서 차지만, 알림은 문을 나선 뒤에 뜹니다.
   해금 안내창이 떠 있으면 그것부터 닫게 두고 다음 그리기에서 다시 봅니다. */
function campusNotes(){
  if(document.querySelector(".pop"))return;
  if(!G.bowOpen&&(G.gateDay||{}).front>=BOW_OPEN_DAY&&G.explores>=BOW_OPEN_EXP){
    G.bowOpen=true;
    popup("소문","학생회에는 다양한 취미와 좋은 손재주를 가진 학생들이 있습니다. 그들이 기어코 활을 만들었다는 소문이 들립니다. 매점에서 팔 지도 모릅니다.");
    return;
  }
  if((G.gotNew||[]).length){
    const ids=G.gotNew;G.gotNew=[];
    popup("소문",`${ids.map(id=>ITEMS[id].n).join(", ")}을(를) 자주 주워 온다는 소문이 돌았습니다.<br><br>매점에서도 팔기 시작합니다.`);
    return;
  }
  if(talkFree()&&!G.wingQ&&(G.cicadaKills||0)>=1&&facOf("union").cond(G)){wingQuest();return}
  if(talkFree()&&!G.hornQ&&(G.beetleKills||0)>=1&&facOf("union").cond(G)){
    G.hornQ=1;markSeen(HORN);talkUse();
    popupTalk([
      ["union","곤충 중 최강곤충이 뭔지 아니?"],
      ["pc","갑자기 무슨 소리야 뜬금없이."],
      ["union","매끈한 몸, 우람한 뿔, 웅장한 날갯짓. 장수풍뎅이야말로 최강의 곤충이지."],
      ["pc","아니 갑자기 그렇게 말해도..."],
      ["union","뭐야? 너는 장수풍뎅이의 아름다움을 모르는 건가? 장수풍뎅이의 아름다움을 모르는 당신, 불쌍해요."],
      ["pc","보통은 곤충을 보고 아름답다고 생각하지 않는다고."],
      ["union","쳇."],
      ["union","어쨌든 장수풍뎅이 껍데기를 가져왔으면 좋겠어. 만들고 싶은 게 있으니."],
      ["pc","회장이 좋아하는 우람한 뿔을 가져와 볼게."],
      ["union","이제야 말이 통하는군!"],
    ],render);
    return;
  }
  /* 경찰 본부 의뢰 — 행정실이 열려 있어야 행정실장이 있습니다 */
  if(talkFree()&&facOf("office").cond(G)&&G.policeSeen&&!G.policeQ){policeQuest();return}
  if(talkFree()&&G.policeQ===1&&policeBeen()){policeQuestPay();return}
  G.tips=G.tips||{};
  if(G.foodHeal&&!G.tips.majFood){
    G.tips.majFood=true;
    popup("이공대학","이공대학에서 식품공학과 전공을 고를 수 있게 되었습니다.");
    return;
  }
  if(humOpen(G).includes("phil")&&!G.tips.majPhil){
    G.tips.majPhil=true;
    popup("인문사회대학","인문대학에 철학과 전공이 해금되었습니다.");
    return;
  }
  if(medOpen(G)&&!G.tips.majMed){
    G.tips.majMed=true;
    popup("의학대학","의학대학에서 의예과 전공을 고를 수 있게 되었습니다.<br><br>매점에 회복스프레이가 들어오기 시작합니다.");
    return;
  }
  if(fkOpen(G)&&!G.tips.fkShop){
    G.tips.fkShop=true;
    popup("소문","화학과 학생이 헤어스프레이를 보더니 혀를 찼다고 합니다. 학생회가 더 독한 것을 구해 왔다는 소문이 들립니다.<br><br>매점에 에프킬라가 들어오기 시작합니다. 화학과만 다룰 수 있습니다.");
  }
}
/* ── 경찰 본부 의뢰 (행정실장) ──
   게이트에서 경찰 본부를 **후보로 본 적만 있어도**(G.policeSeen) 캠퍼스에 돌아왔을 때 부릅니다.
   G.policeQ — 0 아직 · 1 의뢰를 받음 · 2 보상까지 받음.
   이미 다녀왔으면(G.placesSeen 에 police) 그 자리에서 보상까지 나갑니다. */
const POLICE_ROOM="police";
const POLICE_PAY=["ammoP","ammoS","ammoR"];   /* 총알 3종 한 뭉치씩 */
const policeBeen=()=>(G.placesSeen||[]).includes(POLICE_ROOM);
const POLICE_PAY_LINES=[
  ["office","벌써 다녀오다니. 위험했을 텐데 정말 고생 많았네."],
  ["office","위험한 곳은 그만큼의 보상이 따르는 법이라네. 여기, 보상일세."],
  ["na",`<div class="gotitem">${POLICE_PAY.map(id=>itemIconN(id,ITEMS[id].qty)).join("")}<span>${
    POLICE_PAY.map(id=>ITEMS[id].n).join(" · ")}을 한 뭉치씩 받았다.</span></div>`],
];
function policePay(){
  for(const id of POLICE_PAY){
    G.store[id]=(G.store[id]||0)+1;
    markSeen(id);G.gunSeen[ITEMS[id].ammo]=true;
  }
  G.policeQ=2;
}
function policeQuest(){
  const been=policeBeen();
  const lines=[
    ["office","자네, 경찰 본부에 대해 알고있나?"],
    ["pc","게이트 내에서 본 적 있어요."],
    ["office","이 험난한 세상, 해쳐나가려면 총이 반드시 필요하네. 경찰 본부에서 아마 총을 얻을 수 있을지도 몰라."],
    ["pc","총이란 게 그렇게 막 가져가서 써도 되는 물건인가요?"],
    ["office","나는 총을 맞는 사람과 쏘는 사람 중 한 사람이 되라고 한다면, 총을 쏘는 사람이 되겠네."],
    ["pc","그렇네요 죽는 것보단 낫죠."],
    ["office","경찰 본부를 탐색하고 오게. 기왕이면 총을 구해오면 더 좋고."],
  ];
  if(been)lines.push(["pc","일단 다녀오긴 했는데요."],...POLICE_PAY_LINES);
  G.policeQ=1;talkUse();             /* 대사가 끝나기 전에 세워 둡니다 — 다시 그려도 또 뜨지 않게 */

/* 어디에 있든 하나를 걷어 갑니다 — 손 · 배낭 · 창고 순서 */
function takeItem(id){
  for(const r of (G.roster||[])){
    for(const sl of SLOTS)if(r.gear[sl.k]===id){tryGear(r,()=>{r.gear[sl.k]=null});return true}
    const i=r.bag.indexOf(id);
    if(i>=0){r.bag.splice(i,1);return true}
  }
  if((G.store||{})[id]>0){G.store[id]--;if(G.store[id]<=0)delete G.store[id];return true}
  return false;
}

/* 감정 — 가중치대로 하나를 뽑아 확정 물건으로 바꿉니다 */
function appraise(id){
  const t=ITEMS[id].mystery.into;
  let r=Math.random()*t.reduce((a,x)=>a+x[1],0);
  for(const e of t){if((r-=e[1])<0)return e[0]}
  return t[t.length-1][0];
}

/* 버튼을 누르면 화면을 통째로 다시 그리므로, 그 자리에서 애니메이션을 걸면 곧바로 지워집니다.
   그래서 "무엇을 눌렀고 얼마가 나갔는지"만 적어 두었다가 다시 그린 뒤에 재생합니다. */
let tapFx=null;
function markTap(sel,amount,plus){tapFx={sel,amount,plus:!!plus}}
function playTap(){
  if(!tapFx)return;
  const fx=tapFx;tapFx=null;
  const b=document.querySelector(fx.sel);
  if(!b)return;
  b.classList.add("tapped");
  const ring=document.createElement("span");ring.className="tapring";
  const fly=document.createElement("span");fly.className="costfly"+(fx.plus?" plus":"");
  fly.textContent=(fx.plus?"+":"−")+fx.amount+" G";
  b.appendChild(ring);b.appendChild(fly);
  setTimeout(()=>b.classList.remove("tapped"),280);
  setTimeout(()=>{ring.remove();fly.remove()},1000);
  /* 상단 골드도 한 번 튀게 해서 어디로 갔는지 눈이 따라갑니다 */
  const g=document.getElementById("goldnum");
  if(g){g.classList.add("goldbump");setTimeout(()=>g.classList.remove("goldbump"),420)}
}

        :`<div class="card"><h2>더 열리는 것이 없습니다</h2><p>이 게이트에서 고를 수 있는 힘을 전부 익혔습니다.</p></div>`}
      ${chips()}
      <div class="bar">
        ${(tut||G.skillBack||!G.fought)?`<span class="tag"></span>`:`<button class="ghost" id="home">캠퍼스로</button>`}
        ${(tut||G.skillBack||!G.skillOffer.length)?`<button id="skip">계속</button>`:`<span class="tag"></span>`}</div>`;
    /* 캠프파이어에서 수련을 골랐으면 그 아침에만 한 번 더 고릅니다 */
    const go=()=>{
      if(G.extraSkill&&!tut&&G.skillOffer.length){
        G.extraSkill=false;G.extraNow=true;G.skillOffer=null;render();return}
      G.extraSkill=false;G.extraNow=false;
      G.skillOffer=null;
      /* 어둠 에너지 결정+ 로 연 창이면 원래 있던 화면으로 돌아갑니다 */
      if(G.skillBack){const b=G.skillBack;G.skillBack=null;G.scene=b;render();return}
      G.scene=tut?"tutplace":"encounter";render()};
    el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{learnSkill(G.skillOffer[+b.dataset.s]);go()});
    const sk=document.getElementById("skip"); if(sk)sk.onclick=go;
    const hm=document.getElementById("home");
    /* 첫 전투 전에는 나갈 수 없습니다 — 버튼도 그리지 않습니다 */
    if(hm)hm.onclick=()=>{if(!G.fought)return;G.skillOffer=null;G.scene="retreat";render()};
    bindChips();
    return;
  }
  if(S==="tutplace"){
    el.innerHTML=logo+`
      <div class="bar"><span class="tag"><b>1</b>일차</span><span class="tag">발견한 장소 1곳</span></div>
      <div class="place"><h3>이름이 지워진 음식점</h3>
      <p>골목 안쪽, 문이 반쯤 열려 있습니다. 안에서 식은 기름 냄새가 납니다.</p></div>
      <div class="bar"><button class="ghost" disabled>지나친다</button><button id="in">들어간다</button></div>`;
    /* 전리품 화면은 게이트 안과 똑같은 것을 씁니다 — 처음부터 진짜 조작을 익히도록 */
    document.getElementById("in").onclick=()=>{
      G.here=PLACES[0];
      G.ground=[{id:"tuna",src:"수확"},{id:"ladle",src:"수확"},{id:"lid",src:"수확"}];
      G.sel=null;G.invSel=null;G.scene="spoils";render()};
    return;
  }
  if(S==="encounter"){
    if(!G.offer){
      // 첫날은 위험도 ★ 장소만 나옵니다. 초반에 손쓸 새 없이 잃는 일을 막기 위해서입니다.
      // 밤 거리(night)는 캠프파이어에서만 가므로 낮 후보에서 뺍니다.
      const day=placesOf(G.gate);
      const pool=G.day===1?day.filter(p=>p.risk===0):day;
      G.offer=[...pool].sort(()=>Math.random()-.5).slice(0,2+(archLv()?1:0));   /* 구조 파악 +1 */
    }
    /* 경찰 본부는 **후보로 뜨기만 해도** 본 것으로 칩니다 — 행정실장의 의뢰가 이 표시를 봅니다.
       다시 그려도 같은 값이라 저장을 불러온 판에서도 그대로 섭니다 */
    if(G.offer.some(pl=>pl.room===POLICE_ROOM))G.policeSeen=true;
    const t=party();
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">${G.gateName} · <b>${G.day}</b>일차</span>
      <span class="tag">가방 ${t.reduce((s,r)=>s+r.bag.length+ammoSlots(r),0)} / ${t.reduce((s,r)=>s+bagMax(r),0)}</span></div>
      ${chips()}
      <div class="card"><h2>어디로 갈까</h2>${(()=>{
        /* 할 말이 없는 날은 문단째 안 그립니다 */
        const t=[bossHint(G.day).trim(),
                 G.day===1?"비교적 안전한 장소들인 것 같습니다. 하지만 안심할 순 없습니다. 조심히 살펴보세요.":""]
                .filter(Boolean).join(" ");
        return t?`<p>${t}</p>`:"";})()}</div>
      ${t.length===1&&G.day>=2?`<div class="card" style="border-color:var(--bad)">
        <h2>혼자입니다</h2><p>여기서 더 들어가면 쓰러졌을 때 아무도 끌어내 줄 사람이 없습니다.
        지금 나가면 오늘 챙긴 것은 지킬 수 있습니다.</p></div>`:""}
      ${G.offer.map((pl,i)=>`<button class="place" data-p="${i}">
        <h3>${pl.n}</h3><p>${pl.d}</p>
        <span class="risk">위험도 ${"★".repeat(pl.risk+1)}</span>
        <span class="finds">나올 만한 것 · ${placeItems(pl).map(id=>
          `<i class="${itemKnown(id)?"kn":"unk"}">${archLv()>=2?ITEMS[id].n:itemLabel(id)}</i>`).join(" ")}</span></button>`).join("")}
      <div class="bar"><span class="tag"></span>
      <button class="ghost" id="out" ${G.fought?"":"disabled"}>게이트에서 나간다</button></div>
      <div class="card"><h2>파티</h2>
      ${t.map((r,i)=>`<div class="app">${faceTag(r)}<div class="hd"><b>${r.name}</b>
        <span>${majorName(r)} · Lv.${r.lvl} · ${bagName(r)} ${r.bag.length+ammoSlots(r)}/${bagMax(r)}</span></div>
        ${barRows(r)}${invPanel(r,G.roster.indexOf(r),"manage",t)}${gearLine(r)}</div>`).join("")}</div>`;
    el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
      const pl=G.offer[+b.dataset.p];G.here=pl;ROOM=ROOMS[pl.room];seePlace(pl);
      enterBattle(party(),rollEncounter(G.day,pl.risk,party().length))});
    /* 들어왔으면 최소 한 번은 싸웁니다 — 첫 전투 전에는 나갈 수 없습니다(지나치기도 없습니다) */
    document.getElementById("out").onclick=()=>{if(!G.fought)return;G.scene="retreat";render()};
    bindInv();bindChips();
    return;
  }
  if(S==="battleload"){
    const imgs=battleImgs(),ok=imgs.filter(s=>s.done).length;
    if(ok>=imgs.length||Date.now()-(G._blAt||0)>4000){G.scene="battle";render();return}
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">${G.here?G.here.n:"음식점"} · ${G.mode==="tutorial"?1:G.day}일차</span></div>
      <div class="card"><h2>전투 준비</h2><p>그림을 불러오는 중입니다… ${ok}/${imgs.length}</p></div>`;
    setTimeout(render,90);
    return;
  }
  if(S==="battle"){
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">${G.here?G.here.n:"음식점"} · ${G.mode==="tutorial"?1:G.day}일차</span>
      <span class="tag">적 ${B.foes.filter(f=>f.hp>0).length}</span></div>
      <canvas id="cv"></canvas>
      <div id="feed">${feed.map(x=>`<div>${x}</div>`).join("")}</div>
      `;
    fitCanvas();startLoop();
    cv.onclick=()=>{if(B&&B.paused)B.paused=false};
    return;
  }
  if(S==="reward"){
    const g=G.lastGain;
    el.innerHTML=logo+`
      <div class="card"><h2>${g.boss?`${g.boss}를 쓰러뜨렸다`:"전투 종료"}</h2>
      <p>${g.boss==="사마귀"?"낫 같은 앞다리가 힘없이 접힙니다.":
          g.boss==="거미"?"긴 다리가 안쪽으로 하나씩 오므라듭니다.":"숨을 고릅니다."}</p></div>
      <div class="card"><h2>정산</h2>
      <div class="derived">획득 경험치 <b>${g.exp}</b>${g.found?` · 주운 물건 <b>${g.found}</b>개`:""}${g.relic?` · 유품 <b>${g.relic}</b>개`:""}</div>
      ${g.ammoGot&&g.ammoGot.length?`<div class="tag" style="margin-top:6px;color:var(--mark)">수습한 탄약 · ${g.ammoGot.join(", ")} — 바닥에 떨어졌습니다</div>`:""}
      ${g.broke.length?`<div class="tag" style="margin-top:8px;color:var(--bad)">파손 · ${g.broke.join(", ")}</div>`:""}
      ${g.dead.length?`<div class="tag" style="margin-top:8px;color:var(--bad)">사망 · ${g.dead.map(d=>d.name).join(", ")}</div>`:""}
      ${g.results.map(r=>`<div class="app" style="margin-top:9px">
        ${faceTag(r.p)}<div class="hd"><b>${r.p.name}</b><span>${r.up?`Lv ${r.p.lvl-r.up} → Lv ${r.p.lvl}`:`Lv ${r.p.lvl}`}</span></div>
        ${hpLineGain(r.p,r.hp0===undefined?r.p.hp:r.hp0)}${expBarGain(r)}
        ${r.up?`<div class="tag" style="margin-top:6px;color:var(--mark)">레벨 상승 · 포인트 ${r.up}점</div>`:""}
      </div>`).join("")}</div>
      <div class="bar"><span class="tag"></span><button id="nx">계속</button></div>`;
    playGain();
    document.getElementById("nx").onclick=()=>{
      G.scene=(G.mode!=="tutorial"&&G.ground.length)?"spoils":"afterloot";render()};
    return;
  }

  /* ── 전리품 정리 ── */
  if(S==="spoils"){
    /* 튜토리얼도 이 화면을 씁니다. 다른 것은 안내 문구와, 끝내는 방법뿐입니다 —
       튜토리얼은 '정리 끝' 버튼 대신 국자·냄비뚜껑을 다 차면 안내창이 뜨고 전투로 넘어갑니다. */
    const tut=G.mode==="tutorial";
    const t=party();
    const free=t.reduce((n,r)=>n+bagRoom(r),0);
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">${G.here.n} · ${G.day}일차</span>
      <span class="tag">바닥에 <b>${G.ground.length}</b>개</span></div>
      <div class="card">
      <div class="cardhead"><h2>${tut?"주방을 뒤졌다":"바닥에 남은 것"}</h2>
        <button class="ghost" id="all" ${G.ground.some(g=>t.some(r=>canTakeGround(r,g)||canWearNow(r,g.id)))?"":"disabled"}>${
          free>=G.ground.length?"모두 가져가기":`가능한 만큼 (빈칸 ${free})`}</button></div>
      <p>${tut?"쓸 만한 것 세 개를 찾았습니다. <b>국자</b>와 <b>냄비뚜껑</b>을 챙기세요."
            :"챙겨가지 않은 물품은 사라집니다."}</p>
      ${G.ground.length?G.ground.map((gd,i)=>{
        const it=ITEMS[gd.id], o=G.sel===i;
        return `<div class="slot has tap ${o?"open":""}" data-gsel="${i}">
          <span class="sn">${slotName(gd.id)}</span>
          <span class="si">${it.kind==="ammo"?itemIconN(gd.id,gd.n):itemIcon(gd.id)}${it.n} ${kindTag(it)}${
            gd.src==="유품"?' <span class="kd">유품</span>':""}<small>${
            it.kind==="ammo"?`${gd.n}발 · 한 칸에 ${it.qty}발`:it.d}</small></span>
          <span class="caret">${o?"▴":"▾"}</span>
          ${o?`<div class="acts"><span class="tag">누구 배낭에</span>
            ${t.map((r,ri)=>`<button class="mini" data-give="${ri}" ${(canTakeGround(r,gd)||canWearNow(r,gd.id))?"":"disabled"}>${r.name} ${r.bag.length+ammoSlots(r)}/${bagMax(r)}</button>`).join("")}
            <button class="mini bad" data-toss="1">버린다</button></div>`:""}
        </div>`}).join("")
        :`<div class="tag" style="margin-top:8px">전부 정리했습니다.</div>`}
      </div>
      ${t.map((r,i)=>`<div class="app">${faceTag(r)}<div class="hd"><b>${r.name}</b><span>${majorName(r)} · Lv ${r.lvl}</span></div>
        ${hpLine(r)}${invPanel(r,G.roster.indexOf(r),"manage",t)}${gearLine(r)}</div>`).join("")}
      ${tut?"":`<div class="bar"><span class="tag"></span><button id="done">정리 끝</button></div>`}`;
    /* 줄 아무 데나 눌러 고릅니다. 버튼은 고른 줄 아래에만 나옵니다 */
    el.querySelectorAll("[data-gsel]").forEach(d=>d.onclick=e=>{
      if(e.target.closest("button"))return;
      const i=+d.dataset.gsel;G.sel=(G.sel===i?null:i);render()});
    el.querySelectorAll("[data-give]").forEach(b=>b.onclick=()=>{
      takeToBag(t[+b.dataset.give],G.sel);render()});
    el.querySelectorAll("[data-toss]").forEach(b=>b.onclick=()=>{
      G.ground.splice(G.sel,1);G.sel=null;render()});
    const ab=document.getElementById("all");
    if(ab)ab.onclick=()=>{takeAllGround(t);render()};
    bindInv();
    const done=document.getElementById("done");
    /* 정리를 끝낼 때 키트를 든 사람이 있으면 그 자리에서 타 버리고 캠프파이어로 넘어갑니다 */
    if(done)done.onclick=()=>{
      G.ground=[];G.sel=null;G.invSel=null;
      const k=kitHolder();
      if(k){
        k.p.bag.splice(k.i,1);
        popup("캠프파이어 키트",
          `당신은 전리품을 조사하던 중 캠프파이어로 쓸 만한 물건들을 찾았습니다.<br><br>
           이 캠프파이어 키트는 알 수 없는 에너지에 지나치게 노출되어 곧 바스라질 것만 같습니다.<br><br>
           오늘은 좀 쉬면서 다음 일정을 준비하는 게 좋겠습니다.`,
          "불을 피운다",()=>{G.scene="campfire";render()},true);
        return;
      }
      G.scene="afterloot";render()};
    /* 튜토리얼은 둘 다 차는 순간 애벌레가 다가옵니다. 안내창을 닫는 것이 곧 전투 시작이라
       lock 을 걸어 버튼으로만 닫히게 합니다. */
    if(tut&&p.gear.rh==="ladle"&&p.gear.lh==="lid"&&!G.tutWorm){
      G.tutWorm=true;
      popup("무언가 다가온다",
        `아이템을 줍는 동안 당신 근처에서 무언가 움직이는 것이 느껴집니다.<br><br>
         놀랍게도 그것은 거대한 녹색의 애벌레였습니다. 그것들은 꿈틀거리며 당신을 향해 다가옵니다.`,
        "확인",
        ()=>{G.ground=[];G.sel=null;G.invSel=null;
             ROOM=ROOMS[G.here.room];enterBattle([p],["worm","worm"])},
        true);
    }
    return;
  }
  /* ── 캠프파이어 ── 보스를 넘긴 밤, 세 가지 중 하나를 하고 다음 날로 넘어갑니다 */
  if(S==="campfire"){
    const t=party();
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">${G.gateName} · <b>${G.day}</b>일차 밤</span>
      <span class="tag">파티 ${t.length}명</span></div>
      <div class="bldbg soft" ${CAMPFIRE_ART?`style="background-image:url('${artUrl(CAMPFIRE_ART)}')"`:""}>
        <div class="card"><h2>모닥불</h2>
        <p>따뜻한 불 아래 모인 일행은 앞으로의 대책을 의논합니다.</p></div>
        <button class="place" data-c="skill"><h3>스킬 수련</h3></button>
        <button class="place" data-c="rest"><h3>휴식</h3></button>
        <button class="place" data-c="night"><h3>야간 탐색</h3></button>
      </div>
      <div class="card"><h2>파티</h2>
      ${t.map(r=>`<div class="app">${faceTag(r)}<div class="hd"><b>${r.name}</b><span>Lv ${r.lvl}</span></div>
        ${hpLine(r)}</div>`).join("")}</div>`;
    el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
      const c=b.dataset.c;
      if(c==="skill"){
        G.extraSkill=true;
        popup("스킬 수련",
          `불빛에 기대어 몸에 붙은 힘을 되짚어 봅니다.<br><br>
           내일 아침, 익힐 힘을 한 번 더 고를 수 있습니다.`,
          "확인",()=>{G.scene="afterloot";render()},true);
        return;
      }
      if(c==="rest"){
        const rows=[];
        for(const r of t){
          const m=derive(r).maxHp,was=r.hp;
          r.hp=Math.min(m,r.hp+Math.round(m*(0.25+Math.random()*0.10)));
          rows.push(`<div class="app"><div class="hd"><b>${r.name}</b>
            <span style="color:var(--ok)">체력 +${Math.round(r.hp-was)}</span></div>
            ${hpLineGain(r,was)}</div>`);
        }
        const d=popup("휴식",
          `번갈아 불을 지키며 눈을 붙였습니다.${rows.join("")}`,
          "확인",()=>{G.scene="afterloot";render()},true);
        playGain(d,()=>document.body.contains(d));
        return;
      }
      /* 야간 탐색 — 날짜는 그대로 두고 다음 날 배율의 적과 붙습니다 */
      const pl=nightPlace();
      pl.risk=rollNightRisk();
      G.night=true;G.here=pl;ROOM=ROOMS[pl.room];seePlace(pl);
      popup("야간 탐색",
        `불을 등지고 어두운 거리로 나섭니다.<br><br>위험도 ${"★".repeat(pl.risk+1)}`,
        "나선다",
        ()=>enterBattle(t,rollEncounter(G.day+1,pl.risk,t.length,true)),true);
    });
    return;
  }
  if(S==="afterloot"){
    const list=G.mode==="tutorial"?[p]:G.roster;
    G.scene=list.some(x=>x.points>0)?"levelup":(G.mode==="tutorial"?"retreat":"nextday");
    render();return;
  }
  if(S==="levelup"){
    const list=G.mode==="tutorial"?[p]:G.roster;
    const who=list.find(x=>x.points>0);
    if(!who){G.scene=G.mode==="tutorial"?"retreat":"nextday";render();return}
    allocScreen(who,`${who.name} · Lv ${who.lvl}`,
      `좀처럼 오르지 않는 레벨이 올랐습니다. 포인트 ${who.points}점.`,
      ()=>{G.scene=list.some(x=>x.points>0)?"levelup":(G.mode==="tutorial"?"retreat":"nextday");render()});
    return;
  }
  if(S==="nextday"){nextDay();return}

  if(S==="retreat"){
    const tut=G.mode==="tutorial";
    const keep=[],lose=[];
    for(const r of (tut?[p]:G.roster)){
      for(const s of SLOTS){const it=ITEMS[r.gear[s.k]];if(it&&it.kind==="inst")lose.push(it.n)}
      for(const id of r.bag){const it=ITEMS[id];
        if(it.kind==="inst")lose.push(it.n);else if(it.kind==="perm")keep.push(it.n)}
    }
    const junkVal=(tut?[p]:G.roster).reduce((s,r)=>s+r.bag.reduce((a,id)=>
      a+(ITEMS[id].kind==="junk"?ITEMS[id].price:0),0),0);
    const mystN=(tut?[p]:G.roster).reduce((s,r)=>s+r.bag.filter(id=>ITEMS[id].mystery).length,0);
    const cleared=!tut&&G.gateClear;
    /* 아직 전투를 시작하지 않은 일차는 세지 않습니다 — 2일차를 마치고 나서면 '2일차까지' */

    const sellId=(id,n)=>{

  /* ── 학적 · 전과와 복수전공 ──

    const prize=huntPrize(sc),fee=ARCADE_FEE.hunt;
    if(sc>(G.huntBest||0))G.huntBest=sc;
    if(prize>0&&AR&&!AR.paid){G.gold+=prize;G.goldEarned+=prize;AR.paid=true}
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">좀비 헌터</span><span class="tag">최고 <b>${G.huntBest||0}</b>마리</span></div>
      <div class="card"><h2>${sc>=20?"방어선을 지켰다":sc>=10?"그럭저럭 버텼다":"금방 뚫렸다"}</h2>
      <p>좀비 <b style="color:var(--mark)">${sc}</b>마리를 쓰러뜨렸습니다.</p>
      <div class="derived">상금 <b>${prize}</b> 골드 · 요금 ${fee} 골드 ·
        <b style="color:${prize-fee>=0?"var(--ok)":"var(--bad)"}">${prize-fee>=0?"+":""}${prize-fee}</b> 골드</div></div>
      <div class="bar"><button class="ghost" id="again" ${G.gold<fee?"disabled":""}>한 판 더 · ${fee}골드</button><button id="bk">게임장으로</button></div>`;
    document.getElementById("again").onclick=()=>{if(!payFee("hunt"))return;AR=null;G.scene="huntgame";render()};
    document.getElementById("bk").onclick=()=>{AR=null;G.scene="arcade";render()};
    return;
  }
  if(S==="spiderend"||S==="arcadeend"){
    const sc=AR?AR.score:0;
    const prize=arcadePrize(sc),fee=ARCADE_FEE.spider;
    if(sc>G.arcadeBest)G.arcadeBest=sc;
    if(prize>0&&AR&&!AR.paid){G.gold+=prize;G.goldEarned+=prize;AR.paid=true}
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">거미 잡기</span><span class="tag">최고 <b>${G.arcadeBest}</b>마리</span></div>
      <div class="card"><h2>${sc>=20?"기계가 삑삑거린다":sc>=10?"제법이다":"손이 느리다"}</h2>
      <p>거미 <b style="color:var(--mark)">${sc}</b>마리를 잡았습니다.</p>
      <div class="derived">상금 <b>${prize}</b> 골드 · 요금 ${fee} 골드 ·
        <b style="color:${prize-fee>=0?"var(--ok)":"var(--bad)"}">${prize-fee>=0?"+":""}${prize-fee}</b> 골드</div></div>
      <div class="bar"><button class="ghost" id="again" ${G.gold<fee?"disabled":""}>한 판 더 · ${fee}골드</button><button id="bk">게임장으로</button></div>`;
    document.getElementById("again").onclick=()=>{if(!payFee("spider"))return;AR=null;G.scene="spidergame";render()};
    document.getElementById("bk").onclick=()=>{AR=null;G.scene="arcade";render()};
    return;
  }
  if(S==="starend"){
    const sc=AR?AR.score:0;
    const prize=starPrize(sc),fee=ARCADE_FEE.star;
    if(sc>(G.starBest||0))G.starBest=sc;
    if(prize>0&&AR&&!AR.paid){G.gold+=prize;G.goldEarned+=prize;AR.paid=true}
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">별 줍기</span><span class="tag">최고 <b>${G.starBest||0}</b>개</span></div>
      <div class="card"><h2>${sc>=14?"기계가 축포를 쏜다":sc>=7?"제법 뛰어다녔다":"발이 무겁다"}</h2>
      <p>별 <b style="color:var(--mark)">${sc}</b>개를 모았습니다.</p>
      <div class="derived">상금 <b>${prize}</b> 골드 · 요금 ${fee} 골드 ·
        <b style="color:${prize-fee>=0?"var(--ok)":"var(--bad)"}">${prize-fee>=0?"+":""}${prize-fee}</b> 골드</div></div>
      <div class="bar"><button class="ghost" id="again" ${G.gold<fee?"disabled":""}>한 판 더 · ${fee}골드</button><button id="bk">게임장으로</button></div>`;
    document.getElementById("again").onclick=()=>{if(!payFee("star"))return;AR=null;G.scene="stargame";render()};
    document.getElementById("bk").onclick=()=>{AR=null;G.scene="arcade";render()};
    return;
  }
  if(S==="dept"){
    /* 학과사무실 — 그 사무실이 맡은 전공 하나만 고를 수 있습니다 */
    const fac=facOf(G.soonName)||FACILITIES.find(f=>f.major||f.majors);
    /* majors 가 있는 사무실(이공대학)은 그때까지 열린 전공을 전부 내놓습니다 */
    const pool=(fac.majors?fac.majors(G):fac.major?[fac.major]:[]).map(majorOf).filter(Boolean);
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">${fac.n}</span><span class="tag">Lv ${MAJOR_LV}부터 전공 선택</span></div>
      ${npcBar(fac.id)}
      <div class="card"><h2>전공 배정</h2>
      <p>${pool.length>1
        ?`이곳에서 정할 수 있는 전공은 ${pool.map(m=>`<b style="color:var(--mark)">${m.n}</b>`).join(" · ")} 입니다.`
        :pool.length===1
        ?`이곳에서 정할 수 있는 전공은 <b style="color:var(--mark)">${pool[0].n}</b> 하나입니다.`
        :`총을 다루려면 적합한 전공이 필요합니다.`}</p>
      <div class="derived" style="margin-top:8px">${pool.map(m=>
        `${m.n} <b>${majorCount(m.id)} / ${majorCap(m.id)}</b>`).join(" · ")}</div>${
        capNext()?`<div class="tag" style="margin-top:6px">${capNext()} 전공마다 한 자리씩 더 열립니다.</div>`:""}
      ${pool.filter(m=>PASSIVES[m.id]).map(m=>
        `<div class="tag" style="margin-top:6px">${m.n} 패시브 · ${passiveText(PASSIVES[m.id])}</div>`).join("")}${
        pool.some(m=>PASSIVES[m.id])?`<div class="tag" style="margin-top:6px">패시브는 전공활용 10 기준 · ${MAJ_STEP} 많을 때마다 +${MAJ_STEP_RATE*100|0}%, ${MAJ_STEP} 모자랄 때마다 −${MAJ_STEP_RATE*100|0}%</div>`:""}</div>
      ${G.roster.map((r,i)=>`<div class="app">
        ${faceTag(r)}<div class="hd"><b>${r.name}</b><span>${r.major?majorName(r):`Lv ${r.lvl}`}</span></div>
        ${r.major?`<div class="tag">${majorOf(r.major).d}</div>${majorsOf(r).filter(m=>PASSIVES[m]).map(m=>
            `<div class="tag">패시브(전공활용 ${r.stats.maj}) · ${passiveText(PASSIVES[m],passiveRate(r))}</div>`).join("")}`
          :r.lvl<MAJOR_LV?`<div class="tag">Lv ${MAJOR_LV}이 되어야 전공을 정할 수 있습니다 (현재 Lv ${r.lvl})</div>`
          :`<div class="chips" style="margin-top:6px">${pool.map(m=>
            `<button class="pickb" data-maj="${i}|${m.id}" ${majorRoom(m.id)>0?"":"disabled"}>${m.n
              } <small style="opacity:.6">${majorCount(m.id)}/${majorCap(m.id)}</small></button>`).join("")}</div>`}
      </div>`).join("")||`<div class="card"><p>명단이 비었습니다.</p></div>`}
      <div class="bar"><span class="tag"></span><button class="ghost" id="bk">캠퍼스로</button></div>`;
    el.querySelectorAll("[data-maj]").forEach(b=>b.onclick=()=>{
      const [i,id]=b.dataset.maj.split("|");
      const r=G.roster[+i];
      if(r.lvl<MAJOR_LV||r.major||majorRoom(id)<=0)return;
      r.major=id;logAdd(r,`${majorOf(id).n} 전공 선택`);
      /* 서로 다른 전공이 셋 모이면 행정실에서 전과를 받아 줍니다 */
      if(majorKinds()>=TRANSFER_KINDS)
        tipOnce("transfer","전과",
          `서로 다른 전공이 ${TRANSFER_KINDS}개 모였습니다.<br><br>행정실에서 전과를 받아 줍니다.`);
      render()});
    document.getElementById("bk").onclick=()=>{G.scene="campus";render()};
    return;
  }
  /* ── 실습동 · 골드로 반출 장비를 한 단계 손봅니다 ── */
  if(S==="work"){
    const t=workTargets();
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">실습동</span><span class="tag">골드 <b>${G.gold}</b></span></div>
      ${npcBar("work")}
      <div class="card"><h2>장비 손보기</h2>
      ${t.length?itemCells(t.map((g,i)=>{
        const it=ITEMS[g.id],up=ITEMS[workId(g.id)],cost=workCost(g.id);
        /* 칸에는 그림·이름·값만. 누르면 누구 것인지와 수치가 어떻게 바뀌는지가 펼쳐집니다 */
        return {row:"w:"+i,id:g.id,top:"",sub:`<b>${cost}G</b>`,
          extra:`<span class="tag">${g.who?`${g.who.name} · ${g.sn}`:`창고 ${g.n}개`} → ${up.n}</span>
            <div class="cmp">${upDiff(it,up)}</div>`,
          acts:`<button data-w="${i}" ${G.gold<cost?"disabled":""}>${cost} 골드에 손본다</button>`}}))
        :`<p>손볼 것이 없습니다.</p>`}</div>
      <div class="bar"><span class="tag"></span><button class="ghost" id="bk">캠퍼스로</button></div>`;
    bindRows();
    /* 손보고 나면 목록이 통째로 바뀌므로(자리 번호가 밀립니다) 줄을 접고 다시 그립니다.
       결과는 workUse 가 띄우는 알림으로 알려 줍니다 */
    el.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{
      workUse(+b.dataset.w);G.rowSel=null;render()});
    document.getElementById("bk").onclick=()=>{G.scene="campus";render()};
    return;
  }
  if(S==="tower"){
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">메모리얼 홀</span><span class="tag">새겨진 이름 <b>${G.memorial.length}</b></span></div>
      ${npcBar("tower")}
      <div class="card"><h2>돌아오지 못한 사람들</h2>
      <p>게이트 안에서 잃은 사람들의 기록입니다.</p></div>
      ${G.memorial.length?[...G.memorial].reverse().map(m=>`<div class="app mem" style="border-left-color:var(--bad)">
        ${faceTag(m)}<div class="hd"><b>${m.name}</b><span>Lv ${m.lvl} · ${m.gate} ${m.day}일차</span></div>
        <div class="tag" style="margin-bottom:8px">${m.where}에서 쓰러짐</div>
        <div class="grid">${STATS.map(s=>`<div class="g">${s.n}<b>${m.stats[s.k]}</b></div>`).join("")}</div>
        <div class="gearline">마지막 장비 · ${SLOTS.map(s=>m.gear[s.k]?ITEMS[m.gear[s.k]].n:null).filter(Boolean).join(", ")||"없음"}</div>
        ${m.log.length?`<div class="tag" style="margin-top:8px">기록</div>
          <div class="rec">${m.log.map(l=>`<div>· ${l}</div>`).join("")}</div>`:""}
      </div>`).join(""):`<div class="card"><p>아직 아무 이름도 새겨지지 않았습니다.</p></div>`}
      <div class="bar"><span class="tag"></span><button class="ghost" id="bk">캠퍼스로</button></div>`;
    document.getElementById("bk").onclick=()=>{G.scene="campus";render()};
    return;
  }
  if(S==="library"){
    /* 도서관 — 게임 안의 지식을 LIBRARY 에 한 권씩 채워 넣을 자리입니다 */
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">도서관</span></div>
      ${npcBar("library")}
      ${LIBRARY.length?LIBRARY.map(b=>`<div class="card"><h2>${b.n}</h2><p>${b.d}</p></div>`).join("")
        :`<div class="card"><p>서가가 비어 있습니다.</p></div>`}
      <div class="bar"><span class="tag"></span><button class="ghost" id="bk">캠퍼스로</button></div>`;
    document.getElementById("bk").onclick=()=>{G.scene="campus";render()};
    return;
  }
  if(S==="soon"){
    const f=FACILITIES.find(x=>x.id===G.soonName);
    el.innerHTML=logo+`${npcBar(G.soonName)}
      <div class="card"><h2>${f.n}</h2>
      <p>해금은 됐지만 안쪽은 아직 비어 있습니다. ${f.d} 기능이 여기에 들어갈 자리입니다.</p></div>
      <div class="bar"><span class="tag"></span><button class="ghost" id="bk">캠퍼스로</button></div>`;
    document.getElementById("bk").onclick=()=>{G.scene="campus";render()};
    return;
  }
  if(S==="gates"){
    const done=G.cleared||[];
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">게이트 선택</span><span class="tag">골드 <b>${G.gold}</b></span></div>
      <div class="card"><h2>입장할 게이트를 고르세요.</h2></div>
      <div class="bldbg gatebg" ${BLD_ART.gate?`style="background-image:url('${artUrl(BLD_ART.gate)}')"`:""}>
      ${GATES.map((g,i)=>{
        const op=gateOpen(g), can=op&&!g.wip;
        const why = !op ? `${GATES.find(x=>x.id===g.need).n}의 마지막 보스를 잡으면 열림`
                  : g.wip ? "열렸지만 안쪽을 아직 아무도 못 그렸다"
                  : (done.includes(g.id)?"넘어섰다":"미답");
        return `<button class="fac ${can?"":"lock"}" ${can?`data-g="${i}"`:"disabled"}>
        <span class="ic">${can?"🚪":op?"🚧":"🔒"}</span>
        <span class="tx"><b>${g.n}</b><span>${g.d} · ${why}</span></span></button>`;}).join("")}
      </div>
      ${squadCards()}
      <div class="bar"><span class="tag"></span><button class="ghost" id="bk">캠퍼스로</button></div>`;
    el.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      G.picked=GATES[+b.dataset.g].id;G.pickedGate=GATES[+b.dataset.g].n;
      G.scene="confirm";render()});
    bindStrip();
    document.getElementById("bk").onclick=()=>{G.scene="campus";render()};
    return;
  }
  if(S==="confirm"){
    const t=party();
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">${G.pickedGate}</span><span class="tag">골드 <b>${G.gold}</b></span></div>
      ${partyStrip()}
      ${t.map(r=>`<div class="app">${faceTag(r)}<div class="hd"><b>${r.name}</b>
        <span>${r.major?majorOf(r.major).n:"새내기"} · Lv ${r.lvl}</span></div>
        ${statGrid(r)}${invPanel(r,G.roster.indexOf(r),"manage",t)}${gearLine(r)}${hpLine(r)}</div>`).join("")}
      ${t.some(r=>!r.gear.rh)?`<div class="tag" style="color:var(--bad)">맨손인 사람이 있습니다.</div>`:""}
      <div class="tag">탄약 · ${ammoLine(t)}</div>
      ${t.some(r=>{const g=ITEMS[r.gear.rh];return g&&g.ammo&&roundsOf(r,g.ammo)<10})?
        `<div class="tag" style="color:var(--bad)">탄약이 부족한 총이 있습니다. 떨어지면 배낭의 무기를, 그것도 없으면 맨손으로 싸웁니다.</div>`:""}
      <div class="card"><h2>창고에서 꺼내기</h2>
      ${storeCells(t,null)}</div>
      <div class="card"><h2>정말 들어가시겠습니까?</h2>
      <p>${G.pickedGate} 안쪽은 아직 아무도 지도를 그리지 못했습니다.</p></div>
      <div class="bar"><button class="ghost" id="no">아니오</button><button id="yes">들어간다</button></div>`;
    el.querySelectorAll("[data-hand]").forEach(b=>b.onclick=()=>{G.rowSel=null;
      const [id,i]=b.dataset.hand.split("|");const r=G.roster[+i];
      if(!(G.store[id]>0)||!handTo(r,id))return;
      G.store[id]--; if(G.store[id]<=0)delete G.store[id];
      render()});
    bindInv();bindStrip();
    document.getElementById("no").onclick=()=>{G.scene="gates";render()};
    document.getElementById("yes").onclick=()=>{
      /* 들어가는 사람을 표로 굳혀 둡니다. 아무도 안 고른 판은 party() 가 앞에서부터 뽑는데,
         안에서 누가 죽으면 밖에 있던 사람이 그 자리를 채워 전리품을 더 들게 되기 때문입니다 */
      const go=party();
      for(const r of G.roster)r.inParty=go.includes(r);
      G.mode="run";G.day=1;G.dayOn=false;G.instants=[];G.offer=null;G.ground=[];G.sel=null;
      G.extraSkill=false;G.extraNow=false;G.night=false;
      G.armDrop=false;                 /* 사마귀 앞발 — 게이트마다 한 번씩 다시 굴립니다 */
      G.gate=G.picked||"front";G.gateClear=false;
      G.gateName=G.pickedGate;G.scene="gateforce";render()};
    return;
  }
}
addEventListener("keydown",onKeyJump);
addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();goBack()}});
addEventListener("resize",()=>{if(G.scene==="battle")fitCanvas()});
bootGame();

</script>
</body>
</html>
