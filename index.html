/* 몸집을 세 단계로 나눠 각각 다른 통행 지도를 씁니다.
   전부 반지름 3으로 계산하면, 사람이 겨우 지나는 틈을 지도가 "뚫려 있다"고
   알려 주고 덩치 큰 것이 그리로 들어갔다가 끼어 제자리걸음을 합니다. */
/* 실제 몸집: 벌 2.6 ~ 사마귀 5.2 ~ 다리가 부러진 좀비 5.6 ~ 좀비 6.2 ~ Blood Eyes 6.6.
   맨 위 칸을 7로 잡았더니 방 전체가 막힌 것으로 나와 큰 것들이 영영 굳었습니다. */
const rBucket=r=>r<=3.5?3:(r<=5.5?5:6.5);
function passGrid(mask,rb){
  const key=mask+"#"+rb;
  let p=PASS_CACHE.get(key);
  if(p)return p;
  p=new Uint8Array(GN*GN);
  for(let cy=0;cy<GN;cy++)for(let cx=0;cx<GN;cx++){
    const x=cx*CELL+CELL/2,y=cy*CELL+CELL/2;
    p[cIdx(cx,cy)]=blocked(x,y,rb,mask)?0:1;
  }
  PASS_CACHE.set(key,p);
  return p;
}
function distField(mask,rb,tx,ty){
  const tcx=toCell(tx),tcy=toCell(ty);
  const key=mask+"#"+rb+":"+tcx+","+tcy;
  let d=FIELD_CACHE.get(key);
  if(d)return d;
  const pass=passGrid(mask,rb);
  d=new Int16Array(GN*GN).fill(-1);
  let s=cIdx(tcx,tcy);
  if(!pass[s]){                       // 목표가 막힌 칸이면 가장 가까운 빈 칸을 쓴다
    let best=-1,bd=1e9;
    for(let cy=0;cy<GN;cy++)for(let cx=0;cx<GN;cx++){
      if(!pass[cIdx(cx,cy)])continue;
      const dd=(cx-tcx)**2+(cy-tcy)**2;
      if(dd<bd){bd=dd;best=cIdx(cx,cy)}
    }
    if(best<0)return d;
    s=best;
  }
  d[s]=0;
  const q=[s];
  for(let h=0;h<q.length;h++){
    const cur=q[h],cx=cur%GN,cy=(cur/GN)|0,nd=d[cur]+1;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const nx=cx+dx,ny=cy+dy;
      if(nx<0||ny<0||nx>=GN||ny>=GN)continue;
      const ni=cIdx(nx,ny);
      if(!pass[ni]||d[ni]>=0)continue;
      if(dx&&dy&&(!pass[cIdx(cx+dx,cy)]||!pass[cIdx(cx,cy+dy)]))continue;  // 모서리 통과 금지
      d[ni]=nd;q.push(ni);
    }
  }
  if(FIELD_CACHE.size>240)FIELD_CACHE.clear();   /* 몸집별로 나뉘어 종류가 늘었습니다 */
  FIELD_CACHE.set(key,d);
  return d;
}
function clearLine(x0,y0,x1,y1,r,mask){
  const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy);
  const steps=Math.max(1,Math.ceil(len/2));
  for(let i=1;i<=steps;i++){
    const q=i/steps;
    if(blocked(x0+dx*q,y0+dy*q,r,mask))return false;
  }
  return true;
}
/* 다음에 밟을 칸을 골라 줍니다.
   force가 켜지면 직선이 뚫려 보여도 무조건 지도를 따릅니다.
   ㄱ자 모서리에서는 직선이 "거의" 뚫린 것처럼 보여 계속 벽을 밀게 되는데,
   제자리걸음이 이어지면 이 쪽으로 넘어옵니다. */
function nextStep(u,tx,ty,force){
  if(!force&&clearLine(u.x,u.y,tx,ty,u.r*0.9,u.lvm))return null;
  const cx=toCell(u.x),cy=toCell(u.y);
  /* 거리가 같은 칸이 여럿일 때 목표 쪽으로 더 향한 칸을 고릅니다.
     8방향 BFS 에서는 '위'와 '왼쪽 위'의 거리가 같아서, 그냥 먼저 찾은 것을 쓰면
     목표가 정북이어도 북서로 비스듬히 갔다가 벽을 만나 되돌아옵니다. */
  const ax=tx-u.x, ay=ty-u.y, al=Math.hypot(ax,ay)||1;
  /* 제 몸집에 맞는 지도부터 보고, 그 지도로 갈 데가 없으면 한 단계씩 헐렁한 지도로
     내려갑니다. 넉넉하게만 보면 좁은 방에서는 길이 아예 없다고 나와 굳어 버립니다 —
     좁더라도 길이 있으면 가서 부딪는 편이 낫습니다(실제 이동은 blocked 가 막습니다). */
  const buckets=[...new Set([rBucket(u.r),5,3])];
  for(const rb of buckets){
    const d=distField(u.lvm,rb,tx,ty);
    const here=d[cIdx(cx,cy)];
    const cap=(here<0)?1e9:here;
    const pass=passGrid(u.lvm,rb);
    let bv=1e9, cand=[];
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const nx=cx+dx,ny=cy+dy;
      if(nx<0||ny<0||nx>=GN||ny>=GN)continue;
      const v=d[cIdx(nx,ny)];
      if(v<0||v>cap)continue;
      /* 대각선으로 모서리를 스치며 빠져나가지 못하게 막습니다 */
      if(dx&&dy&&(!pass[cIdx(cx+dx,cy)]||!pass[cIdx(cx,cy+dy)]))continue;
      if(v<bv){bv=v;cand=[]}
      if(v===bv)cand.push([nx,ny,(dx*ax+dy*ay)/(Math.hypot(dx,dy)*al)]);
    }
    if(!cand.length)continue;
    /* ── 같은 값이 여럿이면 직전에 골랐던 칸을 그대로 씁니다 ──
       이 한 줄이 없으면, 왼쪽과 오른쪽으로 도는 길의 거리가 똑같을 때
       반 칸 움직일 때마다 고르는 쪽이 뒤집혀 두 칸 사이에서 영영 왔다 갔다 합니다.
       실제로 골목길 위쪽의 애벌레가 그렇게 굳어 있었습니다. */
    let pick=null;
    if(u.wayCell)pick=cand.find(c=>c[0]===u.wayCell[0]&&c[1]===u.wayCell[1])||null;
    if(!pick){pick=cand[0];for(const c of cand)if(c[2]>pick[2])pick=c}
    u.wayCell=[pick[0],pick[1]];
    return{x:pick[0]*CELL+CELL/2,y:pick[1]*CELL+CELL/2};
  }
  return null;
}

function moveTo(u,tx,ty,dt){
  /* 0.2초 넘게 못 나아갔으면 직선을 포기하고 지도를 따릅니다 */
  const way=nextStep(u,tx,ty,(u.stuck||0)>0.20);
  if(way){tx=way.x;ty=way.y}
  const ox=u.x,oy=u.y;
  /* 둔화(장수풍뎅이에게 받힘)가 남아 있으면 그만큼 느려집니다 */
  const slow=(u.slowT>0)?(u.slowM||1):1;
  const vx=tx-u.x,vy=ty-u.y,d=Math.hypot(vx,vy)||1,st=u.vspeed*dt*terrainMul(u.x,u.y,u.lvm,u.side==="a"&&archLv()>=2)*slow;
  u.face=Math.atan2(vy,vx);
  const nx=u.x+vx/d*st,ny=u.y+vy/d*st;
  if(!blocked(nx,u.y,u.r,u.lvm))u.x=nx;
  if(!blocked(u.x,ny,u.r,u.lvm))u.y=ny;
  if(Math.hypot(u.x-ox,u.y-oy)<st*0.35){
    u.stuck=(u.stuck||0)+dt;
    /* 지도로 갈아타도 안 풀리면 벽을 따라 옆걸음을 칩니다 */
    if(u.stuck>0.45){
      if(u.slide===undefined)u.slide=Math.random()<.5?1:-1;
      const a=u.face+u.slide*Math.PI/2;
      const sx=u.x+Math.cos(a)*st*1.3,sy=u.y+Math.sin(a)*st*1.3;
      if(!blocked(sx,sy,u.r,u.lvm)){u.x=sx;u.y=sy}
      else{u.slide*=-1;
        /* 양옆이 다 막힌 막다른 골목이면 방향을 새로 잡습니다 */
        if(u.stuck>1.5){u.slide=Math.random()<.5?1:-1;u.stuck=0.5}
      }
    }
  }else{u.stuck=0;u.slide=undefined}
}
function separate(){
  const all=[...B.allies,...B.foes].filter(u=>u.hp>0);
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const a=all[i],b=all[j];
    if(!(a.lvm&b.lvm))continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01,min=a.r+b.r;
    if(d<min){
      const p=(min-d)/2,ux=dx/d*p,uy=dy/d*p;
      if(!blocked(a.x-ux,a.y-uy,a.r,a.lvm)){a.x-=ux;a.y-=uy}
      if(!blocked(b.x+ux,b.y+uy,b.r,b.lvm)){b.x+=ux;b.y+=uy}
    }
  }
}
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function makeFighter(p,i,n){
  const d=derive(p);
  const u={ref:p,name:p.name,sex:p.sex||"m",side:"a",face:-1.57,r:3.2,lvm:HUMAN,
    hp:Math.min(p.hp,d.maxHp),maxHp:d.maxHp,atk:d.atk,aspd:d.aspd,vspeed:d.speed*0.42,
    range:7+d.rng,guard:d.guard,guardVar:0,dodge:d.dodge,crit:d.crit,cool:.3+i*.15,anim:null,color:"#4FC3D9",
    style:d.style,dmgType:d.dmg,broken:[],wid:p.gear.rh,
    fall:d.fall,fallBase:d.fallBase,splash:d.splash,
    /* 활 — 빗나감·폭발·멀티샷은 스킬이 얹습니다 */
    miss:d.miss,bow:d.bow,boomP:0,multi:0,
    wearing:SLOTS.map(s=>({slot:s.k,it:ITEMS[p.gear[s.k]]})).filter(w=>w.it),
    hasW:!!p.gear.rh,hasS:!!p.gear.lh,sid:p.gear.lh};
  for(const s of G.instants)applySkill(s,u);   /* 전공 스킬은 전공활용으로 보정 */
  /* 먹은 것이 남긴 기운 — 이번 전투 한 번만. 빗나감은 무기 성질(u.miss)과 따로 들고 다닙니다 */
  const fb=p.foodBuff;
  if(fb){
    p.foodBuff=null;
    u.atk+=fb.atk||0;u.guard+=fb.guard||0;u.dodge+=fb.dodge||0;u.crit+=fb.crit||0;u.range+=fb.range||0;
    if(fb.aspdM)u.aspd*=fb.aspdM;
    if(fb.vspeedM)u.vspeed*=fb.vspeedM;
    if(fb.miss){u.drunkMiss=(u.drunkMiss||0)+fb.miss;u.miss=(u.miss||0)+fb.miss}
  }
  u.dodge=Math.min(60,u.dodge||0);      // 아무리 쌓아도 다 피하지는 못한다
  u.crit=Math.min(80,u.crit||0);
  u.hp=Math.min(u.hp,u.maxHp);
  const rh=ITEMS[p.gear.rh];
  if(rh&&rh.ammo){        // 총알은 그 사람이 이고 온 것만 씁니다. 떨어지면 배낭/맨손으로 갑니다
    u.gun={type:rh.ammo,range:u.range,style:"gun",dmg:rh.dmg,n:rh.n,aspdM:rh.aspdM||1,bow:!!rh.bow};
    u.ammoType=rh.ammo;u.ammoN=roundsOf(p,rh.ammo);
    u.atkFull=u.atk;
    u.meleeAtk=Math.max(1,+(u.atk-rh.atk).toFixed(1));
  }
  const AS=spawnAt().a, a=AS[Math.max(0,Math.floor((AS.length-n)/2))+i]||AS[i%AS.length];
  const sp=freeSpot(a[0],a[1],u.r,u.lvm);
  u.x=sp.x;u.y=sp.y;u._px=u.x;u._py=u.y;
  return u;
}
/* 총알이 떨어진 자리에서 배낭 맨 위의 오른손 무기를 뽑아 듭니다.
   바꾼 것은 전투가 끝난 뒤에도 그대로 남습니다 — 빈 총을 다시 들 이유가 없어서입니다.
   스킬로 붙은 배율은 그대로 두고 무기 몫만 갈아 끼웁니다(맨손 공격력 u.meleeAtk 기준). */
/* 탄약이 떨어진 총·활을 바닥에 떨어뜨립니다 — 전투 뒤 전리품 바닥(G.ground)에 놓입니다.
   전투 중인 몸은 맨손으로 돌아갑니다: 무기 몫 공속을 되돌리고 활·산탄총 성질과 손 그림을 지웁니다 */
function dropGun(u){
  const p=u.ref, g=u.gun;
  if(!g)return;
  const id=p&&p.gear.rh;
  if(id&&twoHand(id)){
    p.gear.rh=null;(B.drops=B.drops||[]).push(id);
    say(`${u.name}이(가) 빈 ${ITEMS[id].n}을(를) 떨어뜨렸다.`);
  }
  u.aspd=+(u.aspd/(g.aspdM||1)).toFixed(3);
  u.atk=u.meleeAtk;u.style="swing";u.range=7;u.dmgType=DMG.BLUNT;
  u.fall=null;u.fallBase=0;u.splash=0;u.bow=false;u.miss=0;u.multi=0;u.boomP=0;
  u.hasW=false;u.wid=null;u.gun=null;u.anim=null;
  u.wearing=u.wearing.filter(x=>x.slot!=="rh");
}
function swapToBagWeapon(u){
  const p=u.ref;
  if(!p)return false;
  const bi=p.bag.findIndex(id=>{const it=ITEMS[id];
    return it&&it.slot==="rh"&&!it.ammo&&canUse(p,it)});
  if(bi<0)return false;
  const nid=p.bag[bi],it=ITEMS[nid],old=p.gear.rh;
  p.gear.rh=nid;p.bag.splice(bi,1);
  if(old)p.bag.push(old);                 /* 빈 총·활은 dropGun 이 먼저 떨어뜨리므로 보통은 비어 있습니다 */
  u.atk=Math.max(1,+(u.meleeAtk+(it.atk||0)).toFixed(1));
  u.aspd=+(u.aspd*(it.aspdM||1)).toFixed(3);   /* 맨손 공속(dropGun 이 총 몫을 되돌려 둠)에 새 무기 몫 */
  u.range=7+(it.rng||0);
  u.style=it.style||"swing";u.dmgType=it.dmg||DMG.BLUNT;
  u.fall=it.fall||null;u.fallBase=it.atk||0;u.splash=it.splash||0;
  u.wid=nid;u.hasW=true;u.combo=u.comboAlly||0; /* 손에 무기가 있으면 연타는 꺼지고, 연타+ 몫만 남습니다 */
  u.bow=false;u.miss=0;u.multi=0;u.boomP=0;/* 활을 내려놓으면 활 성질도 같이 내려놓습니다 */
  const w=u.wearing.find(x=>x.slot==="rh");
  if(w)w.it=it; else u.wearing.push({slot:"rh",it});
  u.gun=null;u.anim=null;
  itemSprite(nid);
  say(`${u.name}이(가) 배낭에서 ${it.n}을(를) 뽑아 들었다.`);
  return true;
}
/* 양손 무기를 내려놓으면 왼손이 빕니다 — 근접무기로 바꿔 들었든 맨손이 됐든,
   배낭에 왼손 장비가 있으면 바로 찹니다. 수치는 전투 중인 몸에 그 몫만 더합니다(체력은 늘어난 만큼 같이 채웁니다) */
function drawShield(u){
  const p=u.ref;
  if(!p||p.gear.lh)return false;
  const li=p.bag.findIndex(id=>{const x=ITEMS[id];return x&&x.slot==="lh"&&canUse(p,x)});
  if(li<0)return false;
  const sid=p.bag[li],sh=ITEMS[sid];
  p.gear.lh=sid;p.bag.splice(li,1);
  /* 맨손이 된 경우엔 빈 활·총이 아직 오른손에 있습니다 — 방패를 빼낸 자리로 내립니다 */
  if(twoHand(p.gear.rh)){p.bag.push(p.gear.rh);p.gear.rh=null;u.wearing=u.wearing.filter(x=>x.slot!=="rh")}
  u.guard+=sh.guard||0;
  u.maxHp+=sh.hp||0;u.hp+=sh.hp||0;
  u.dodge=Math.max(0,u.dodge+(sh.dodge||0));
  u.aspd=+(u.aspd*(sh.aspdM||1)).toFixed(3);
  u.hasS=true;u.sid=sid;
  const ws=u.wearing.find(x=>x.slot==="lh");
  if(ws)ws.it=sh; else u.wearing.push({slot:"lh",it:sh});
  itemSprite(sid);
  say(`${u.name}이(가) 왼손에 ${sh.n}을(를) 들었다.`);
  return true;
}
const MOB_HP_GROW=1.10, MOB_ATK_GROW=1.08;
function makeEnemy(key,i,day){
  const E=ENEMIES[key];
  /* 보스는 등장 일차에 맞춰 이미 세게 잡혀 있으므로 날짜 배율을 태우지 않습니다 */
  /* 하루마다 체력 ×MOB_HP_GROW, 공격력 ×MOB_ATK_GROW (복리).
     예전 ×1.30/×1.20 은 4일차부터, ×1.15 는 8일차부터 누적 피해로 전멸이 쏟아졌습니다(2026-09-15 시뮬레이션) */
  const hs=(E.boss||E.noScale)?1:Math.pow(MOB_HP_GROW,day-1), as=(E.boss||E.noScale)?1:Math.pow(MOB_ATK_GROW,day-1);
  const spots=spawnAt().e, s=spots[i%spots.length];
  /* 튜토리얼에서는 한 대가 1만큼 덜 아픕니다 */
  const soft=G.mode==="tutorial"?1:0;
  const u={key,name:E.n,side:"e",face:1.57,r:E.r,lvm:E.lvm,boss:!!E.boss,exp:E.exp,dmgType:E.dmg,
    hp:Math.round(E.hp*hs),maxHp:Math.round(E.hp*hs),atk:Math.max(1,+(E.atk*as).toFixed(1)-soft),
    aspd:E.aspd,vspeed:E.speed,range:E.range,guard:0,cool:1+i*.5,color:E.c,wig:i*1.3};
  const sp=reachSpot(s[0],s[1],u.r,u.lvm);   /* 대원 쪽과 이어진 자리에만 세웁니다 */
  u.x=sp.x;u.y=sp.y;
  return u;
}
/* 도망칠 구석 — 살아 있는 대원들의 한가운데에서 가장 먼 모서리.
   그 자리가 막혀 있으면 freeSpot 이 근처의 설 수 있는 곳으로 밀어 준다. */
function fleeDen(f){
  const av=B.allies.filter(a=>a.hp>0);
  const cx=av.length?av.reduce((s,a)=>s+a.x,0)/av.length:50;
  const cy=av.length?av.reduce((s,a)=>s+a.y,0)/av.length:50;
  /* 모서리를 먼저 설 수 있는 자리로 옮긴 뒤에 고른다. 모서리가 벽 속이면
     freeSpot 이 한참 떨어진 데로 밀어내므로, 밀린 결과를 기준으로 재야 한다. */
  let best=null,bd=-1;
  for(const c of [[10,10],[90,10],[10,90],[90,90]]){
    const sp=freeSpot(c[0],c[1],f.r,f.lvm);
    const d=Math.hypot(sp.x-cx,sp.y-cy);
    if(d>bd){bd=d;best=sp}
  }
  return best;
}
/* 좀비에게 물려 죽은 대원이 그 자리에서 일어선다 */
function makeZombieOf(a){
  const E=ENEMIES.zomb;
  return{key:"zomb",name:"좀비 "+a.name,side:"e",face:a.face,r:E.r,lvm:E.lvm,
    exp:E.exp,dmgType:E.dmg,turned:true,
    hp:Math.round(a.maxHp*0.7),maxHp:Math.round(a.maxHp*0.7),
    atk:+(a.atk*0.8).toFixed(1),aspd:E.aspd,vspeed:E.speed,range:E.range,
    guard:0,cool:1.4,color:E.c,wig:0,cp:0,x:a.x,y:a.y};
}
/* 다음 날로 넘어갑니다. 마지막 날 보스를 잡았으면 게이트를 나가고,
   아직 못 잡았으면 날짜가 더 가지 않고 그 날에 머뭅니다 — 더 갈 데가 없습니다. */
/* 날이 바뀌어도 체력은 저절로 차지 않습니다(밤사이 회복은 2026-09-16 에 없앴습니다).
   게이트 안에서 체력을 채우는 길은 캠프파이어 휴식 · 음식 · 응급 키트 · 스킬뿐입니다. */
function nextDay(){
  if(G.gateClear){G.scene="retreat";render();return}
  if(G.day<gateOf().days)G.day++;
  /* 새 일차는 아직 시작하지 않았습니다 — 여기서 나가면 이 날은 세지 않습니다 */
  G.dayOn=false;
  G.offer=null;G.skillOffer=null;G.scene="instant";render();
}
/* 적을 얼마나 불릴지 재는 날짜. 야간 탐색은 날짜를 먹지 않는 대신
   다음 날 배율을 미리 받습니다 — 고른다고 그 다음 날이 더 세지지는 않습니다. */
const battleDay=()=>G.night?G.day+1:G.day;
function rollEncounter(day,risk,party,noBoss){
  /* 적 수는 데려간 인원에 맞춰 조정합니다.
     혼자 들어갔는데 넷이 갈 물량이 나오면 손쓸 방법이 없기 때문입니다. */
  const size=Math.max(1,Math.min(4,party||4));
  const base=2+Math.floor(day/2)+risk;
  const n=Math.max(1,Math.min(6,Math.round(base*(0.42+0.58*size/4)))),out=[];
  /* 잡몹은 게이트마다, 또 날짜마다 다릅니다 — 그날 나올 수 있는 것 중에서 무게대로 뽑습니다 */
  const gt=gateOf();
  const avail=gt.pool.filter(m=>day>=(m.from||1));
  /* ENEMIES 의 cap 은 한 판에 몇 마리까지 나올 수 있는지입니다(장수풍뎅이는 1) */
  const got={};
  const mob=()=>{
    const can=avail.filter(m=>{const c=(ENEMIES[m.k]||{}).cap;return !c||(got[m.k]||0)<c});
    const use=can.length?can:avail.filter(m=>!(ENEMIES[m.k]||{}).cap);
    let r=Math.random()*use.reduce((s,m)=>s+(m.w||1),0);
    let pickd=use[use.length-1];
    for(const m of use){if((r-=(m.w||1))<0){pickd=m;break}}
    got[pickd.k]=(got[pickd.k]||0)+1;
    return pickd.k};
  const boss=noBoss?null:gt.boss[day];
  if(boss){
    out.push(boss);
    const esc=BOSS_ADDS[boss];
    if(esc){for(let i=0;i<esc.count;i++)out.push(esc.key)}
    else{
      /* 게이트의 bossAdds 가 그날 호위 수를 막습니다 (없으면 인원·위험도대로) */
      const cap=(gt.bossAdds||{})[day], k=Math.max(2,n-1)-1;
      for(let i=0;i<(cap===undefined?k:Math.min(cap,k));i++)out.push(mob());
    }
  }else for(let i=0;i<n;i++)out.push(mob());
  return out;
}
function startBattle(list,keys){
  G.fought=true;
  clearPaths();
  preloadFoes(keys.concat(["zomb"]));   /* 좀비화에 대비해 무리도 같이 */
  B={allies:list.map((p,i)=>makeFighter(p,i,list.length)),
     foes:keys.map((k,i)=>makeEnemy(k,i,battleDay())),fx:[],shots:[],fallen:[],over:false};
  preloadAllies(B.allies);
  for(const u of B.allies){if(u.wid)itemSprite(u.wid);if(u.sid)itemSprite(u.sid);}
  if(ROOM)bgSprite(ROOM.id);
  feed=[];
  const bs=B.foes.find(f=>f.boss);
  say(bs?`${bs.name}이(가) 천천히 몸을 일으킨다. 적 ${keys.length}체.`:`적 ${keys.length}체가 다가온다.`);
}
/* ── 캠프파이어 ──
   밤 거리의 위험도는 나설 때마다 다시 굴립니다. 앞 숫자가 확률, 뒤가 위험도입니다. */
const NIGHT_RISK=[[0.40,1],[0.50,2],[0.10,3]];
function rollNightRisk(){
  let r=Math.random();
  for(const [q,v] of NIGHT_RISK)if((r-=q)<0)return v;
  return NIGHT_RISK[NIGHT_RISK.length-1][1];
}
/* 캠프파이어 키트를 배낭에 넣어 둔 사람. 없으면 null */
function kitHolder(){
  for(const r of party()){
    const i=r.bag.findIndex(id=>ITEMS[id]&&ITEMS[id].campfire);
    if(i>=0)return{p:r,i};

}
/* 이 전투에서 쓸 그림들(적·대원·손장비·배경)을 모은다.
   비어 있는 ART 항목은 Image 를 안 만들므로 캐시에 없고, 여기서도 빠진다. */
function battleImgs(){
  if(!B)return[];
  const out=[],add=s=>{if(s)out.push(s)};

    if(u.wid)add(ISPR[u.wid]);

/* startBattle 은 그림 로딩만 걸어 두므로, 싸우는 도중에 배경·대원 그림이
   뒤늦게 뜬다. 여기서 로딩이 끝날 때까지(최대 4초) 대기 화면을 거친다. */
function enterBattle(list,keys){
  /* 전투를 시작한 일차만 '버틴 날'로 셉니다 (귀환 화면의 일차 수) */

function say(t){feed.push(t);if(feed.length>3)feed.shift();
  const f=document.getElementById("feed");if(f)f.innerHTML=feed.map(x=>`<div>${x}</div>`).join("")}
function hurt(t,amt,c,type,src){
  if(src)t.lastHitBy=src;
  if(t.dodge&&Math.random()*100<t.dodge){        // 신발이 빠르면 몇 대는 흘린다
    say(`${t.name}이(가) 몸을 틀어 피했다.`);
    B.fx.push({x:t.x,y:t.y,t:"회피",c:"#6BD98F",life:.8,off:0});
    return;
  }
  if(t.wearing&&type){
    for(const w of t.wearing.slice()){
      const ch=w.it.frail&&w.it.frail[type];
      if(ch&&Math.random()<ch){
        say(`${t.name}의 ${w.it.n}이(가) ${type}에 부서졌다.`);
        B.fx.push({x:t.x,y:t.y,t:"파손",c:"#C87878",life:1.1,off:0});
        t.guard=Math.max(0,t.guard-(w.it.guard||0));
        t.broken.push(w.slot);
        t.wearing=t.wearing.filter(x=>x!==w);
        if(w.slot==="lh")t.hasS=false;
      }
    }
  }
  /* 항체(생명공학과) — 좀비 계열에게 물리기 전에 먼저 덜어냅니다 */
  if(t.zombCut&&src&&ZOMB_KIN.has(src.key))amt*=1-t.zombCut;
  let cut=t.guard||0;
  for(let i=0;i<(t.guardVar||0);i++)if(Math.random()<0.5)cut++;   // 흔들리는 방어
  amt=Math.max(1,amt-cut);
  const was=t.hp;
  t.hp=Math.max(0,t.hp-amt);t.flash=.18;
  /* 뿔 방패 — 맞으면 때린 적에게 정해진 만큼 돌려줍니다. src 를 넘기지 않아 되돌림이 되돌아오지 않습니다 */
  const th=t.side==="a"&&t.hasS&&ITEMS[t.sid]&&ITEMS[t.sid].thorns;
  if(th&&src&&src.side==="e"&&src.hp>0)hurt(src,th,"#E0A32F",null);
  /* 무엇으로 끝냈는지를 세어 둡니다 — 어떤 학과사무실은 이 기록을 보고 열립니다 */
  if(was>0&&t.hp<=0&&t.side==="e"&&type===DMG.CHEM)G.chemKills=(G.chemKills||0)+1;
  B.fx.push({x:t.x,y:t.y,t:Math.round(amt),c,life:.85,off:0});
}
/* 왼손 회복 장비(회복스프레이) — 공격을 시작할 때마다 세고, every 번째에
   r 이내(중심 거리, 본인 포함) 살아 있는 아군 중 체력이 가장 낮은 사람을 채웁니다. 다 찬 사람뿐이면 쉽니다 */
function sprayHeal(u,lifeA){
  const h=u.hasS&&ITEMS[u.sid]&&ITEMS[u.sid].heal;
  if(!h)return;
  u.healN=(u.healN||0)+1;
  if(u.healN<h.every)return;
  u.healN=0;
  const near=lifeA.filter(o=>o.hp>0&&o.hp<o.maxHp&&D(u,o)<=h.r);
  if(!near.length)return;
  const t=near.reduce((b,o)=>o.hp<b.hp?o:b);
  const add=Math.min(h.hp,t.maxHp-t.hp);
  t.hp+=add;
  B.fx.push({x:t.x,y:t.y-3,t:"+"+Math.round(add),c:"#6BD98F",life:.9,off:0});
  say(`${u.name}의 ${ITEMS[u.sid].n}이(가) ${t===u?"자신":t.name}의 체력을 ${Math.round(add)} 채웠다.`);
}
function tick(dt){
  const live=B.foes.filter(f=>f.hp>0),lifeA=B.allies.filter(a=>a.hp>0);
  for(const u of lifeA){
    /* 자가 재생(생명공학과) — 싸우는 내내 조금씩 아뭅니다 */
    if(u.regen)u.hp=Math.min(u.maxHp,u.hp+u.maxHp*u.regen*dt);
    /* 기절 — 풀릴 때까지 아무것도 하지 않습니다 */
    if(u.stunT>0){u.stunT-=dt;continue}
    if(u.gun){                            // 남은 탄약에 따라 총/배낭 무기/맨손을 오간다
      if((u.ammoN||0)>0){u.style="gun";u.range=u.gun.range;u.atk=u.atkFull;u.dmgType=u.gun.dmg;u.hasW=true;u.bow=u.gun.bow}
      else{
        /* 다 쏘면 배낭 맨 위의 오른손 무기를 뽑아 듭니다. 뽑고 나면 u.gun 이 없어집니다 */
        /* 경찰대학생 해금 — 탄약(화살 포함)이 떨어져 근접으로 넘어간 적이 있는가 */
        /* 빈 총·활은 그 자리에 떨어뜨려 곧바로 맨손이 됩니다(전리품 정리에서 다시 주울 수 있습니다).
           그다음 배낭에서 쓸 수 있는 오른손 무기와 왼손 장비를 찹니다. u.gun 이 없어지므로 한 번만 돕니다 */
        u.dry=true;G.ammoOut=true;
        say(`${u.name}의 ${u.gun.bow?"화살":`${u.gun.n} 탄약`}이 떨어졌다.`);
        dropGun(u);swapToBagWeapon(u);drawShield(u);
      }
    }
    if(u.anim){
      const a=u.anim,prev=a.t;a.t+=dt;
      const th=u.style==="thrust",gn=u.style==="gun";
      const imp=gn?GUNA.up+GUNA.go*.4:th?THRUST.up+THRUST.go*.9:SWING.up+SWING.down*.7;
      const total=gn?GUN_TOTAL:th?THRUST_TOTAL:SWING_TOTAL;
      if(!a.hit&&prev<imp&&a.t>=imp){
        a.hit=true;
        /* 활은 화살마다 따로 굴리고, 그 밖의 공격은 취기(소주)만 여기서 굴립니다 */
        const tipsy=!u.bow&&u.drunkMiss>0&&Math.random()<u.drunkMiss;
        if(!tipsy&&a.tgt&&a.tgt.hp>0&&D(u,a.tgt)<u.range+a.tgt.r){
          const cr=Math.random()*100<(u.crit||0);   // 운이 좋으면 급소가 열린다
          /* 산탄총처럼 거리에 따라 위력이 갈리는 무기는 무기 몫만 갈아 끼웁니다.
             스탯·스킬로 올린 몫은 그대로 두어야 배율이 이상하게 커지지 않습니다. */
          let raw=u.atk;
          if(u.fall){
            const dd=D(u,a.tgt);
            for(const [mx,v] of u.fall) if(dd<=mx){raw=u.atk-u.fallBase+v;break}
            raw=Math.max(1,raw);
          }
          const ch=u.dmgType===DMG.CHEM, bl=u.dmgType===DMG.BLUNT;
          /* 화학은 맞은 쪽마다 쌓인 정도가 달라, 대상별로 따로 셈합니다 */
          const hit=(o,rate)=>{
            const dmg=(ch?raw*chemMul(o,u):raw)*(cr?CRIT_MUL:1)*rate;
            const was=o.hp;
            hurt(o,dmg,rate<1?"#E9C46A":(cr?"#FF8A3D":"#F2D74E"),u.dmgType);
            /* 군인 해금 — 총으로 쓰러뜨린 수 (활은 bowKills 가 따로 셉니다) */
            if(u.style==="gun"&&!u.bow&&was>0&&o.hp<=0)G.gunKills=(G.gunKills||0)+1;
            if(ch)o.chem=(o.chem||0)+1;
            if(bl)knockBack(u,o,rate<1?KNOCK*0.6:KNOCK);
          };
          let swept=0;
          if(u.bow){
            /* ── 활 ──
               빗나감을 먼저 굴리고, 맞은 것만 회피 판정(hurt)으로 넘깁니다.
               천궁은 화살이 박힌 자리에서 터져 곁의 것들을 같이 긁습니다. */
            const shoot=tg=>{
              if(!tg||tg.hp<=0)return;
              const missed=u.miss>0&&Math.random()<u.miss;
              launchArrow(u,tg,missed);                /* 맞든 빗나가든 화살은 날아갑니다 */
              if(missed){say(`${u.name}의 화살이 빗나갔다.`);return}
              const was=tg.hp;
              hit(tg,1);
              if(was>0&&tg.hp<=0)G.bowKills=(G.bowKills||0)+1;
              if(u.boomP>0&&Math.random()<u.boomP){
                B.fx.push({x:tg.x,y:tg.y-3,t:"폭발",c:"#FF8A3D",life:.8,off:0});
                for(const o of B.foes){
                  if(o===tg||o.hp<=0)continue;
                  if(D(tg,o)<o.r+BOOM_PAD){const w2=o.hp;hit(o,BOOM_RATE);swept++;
                    if(w2>0&&o.hp<=0)G.bowKills=(G.bowKills||0)+1}
                }
              }
            };
            shoot(a.tgt);
            /* 멀티샷 — 화살 한 발로 둘을 뚫습니다. 하나뿐이면 상위만 두 번 쏩니다 */
            if(u.multi){
              const rest=B.foes.filter(o=>o.hp>0&&o!==a.tgt);
              if(rest.length)shoot(rest.reduce((b,o)=>D(u,o)<D(u,b)?o:b));
              else if(u.multi>=2)shoot(a.tgt);
            }
          }else{
            hit(a.tgt,1);
            /* 휘두르기는 반, 산탄총은 무기가 정한 비율만큼 곁에 있던 것들도 맞는다 */
            const sr=Math.max(u.style==="swing"?SPLASH_RATE:0,u.splash||0);
            if(sr>0){
              for(const o of B.foes){
                if(o===a.tgt||o.hp<=0)continue;
                if(D(u,o)<u.range+o.r+SPLASH_PAD){hit(o,sr);swept++}
              }
            }
          }
          if(cr)B.fx.push({x:a.tgt.x,y:a.tgt.y-4,t:"치명타",c:"#FF8A3D",life:.9,off:0});
          say(`${u.name}이(가) ${a.tgt.name}을(를) ${u.style==="gun"?"쐈다":u.dmgType==="찌르기"?"찔렀다":"때렸다"}.`
            +(cr?" 급소에 들어갔다!":"")+(swept?` 옆에 있던 ${swept}체도 휩쓸렸다.`:""));
        }else say(`${u.name}의 공격이 빗나갔다.`);
      }
      if(a.t>=total)u.anim=null;
      continue;
    }
    if(!live.length)continue;
    const t=live.reduce((b,o)=>D(u,o)<D(u,b)?o:b);
    if(D(u,t)>u.range+t.r-1)moveTo(u,t.x,t.y,dt);
    else{u.face=Math.atan2(t.y-u.y,t.x-u.x);u.cool-=dt*u.aspd;
      if(u.cool<=0){
        /* 제 배낭에서 한 발 소모 — 탄창 개조(기계공학과)는 가끔 그마저 아낍니다 */
        if(u.gun&&u.style==="gun"&&!(u.ammoSave&&Math.random()<u.ammoSave))u.ammoN--;
        u.cool=1;u.anim={t:0,hit:false,tgt:t};
        sprayHeal(u,lifeA);
        if(u.dmgType===DMG.THRUST&&Math.random()<THRUST_AGAIN)u.cool=1-THRUST_AGAIN_CUT;
        /* 연타 — 맨손 태권도. 찌르기와 같은 자리에서 다음 주먹을 당깁니다 */
        if(u.combo&&Math.random()<u.combo)u.cool=Math.min(u.cool,1-TKD_COMBO_CUT);
      }}
  }
  for(const f of live){
    f.wig+=dt*3;
    if(!lifeA.length)continue;
    /* 물러났다 돌아오는 패턴. 한 판에 한 번만(f.fled) 쓴다. */
    const FL=(ENEMIES[f.key]||{}).flee;
    if(FL&&!f.fled&&f.hp>0&&f.hp<=f.maxHp*FL.at){
      f.fled=true;f.flee="run";f.den=fleeDen(f);f.anim=null;
      say(`${f.name}이(가) 등을 보이며 물러난다.`);
    }
    if(f.flee==="run"){
      f.face=Math.atan2(f.den.y-f.y,f.den.x-f.x);
      moveTo(f,f.den.x,f.den.y,dt);
      if(D(f,f.den)<f.r+1.5){f.flee="heal";say(`${f.name}이(가) 웅크린 채 상처를 핥는다.`)}
      continue;
    }
    if(f.flee==="heal"){
      f.hp=Math.min(f.maxHp,f.hp+f.maxHp*FL.rate*dt);
      const n=lifeA.reduce((b,o)=>D(f,o)<D(f,b)?o:b);
      f.face=Math.atan2(n.y-f.y,n.x-f.x);          // 노려보기만 한다
      if(f.hp>=f.maxHp*FL.to){f.flee=null;say(`${f.name}이(가) 다시 달려든다.`)}
      continue;
    }
    if(f.key==="zombie"&&zbossStep(f,lifeA,dt))continue;
    const t=lifeA.reduce((b,o)=>D(f,o)<D(f,b)?o:b);
    // 서로 밀어내는 거리(반지름 합)보다 사거리가 짧으면 영영 못 때린다. 상대 덩치를 더해준다.
    const reach=f.range+t.r;
    if(D(f,t)>reach){
      if(f.key==="hopper"){
        f.face=Math.atan2(t.y-f.y,t.x-f.x);
        if(f.air>0){f.air-=dt;moveTo(f,t.x,t.y,dt)}
        else{f.hopCd=(f.hopCd||0)-dt;
          if(f.hopCd<=0){f.air=HOP_AIR;f.hopCd=HOP_AIR+.5+Math.random()*.35}}
      }else if(ZOMB_WALK.has(f.key)){
        // 성한 다리로 밀 때만 앞으로 나가고, 절뚝이는 쪽에서는 거의 멈춘다
        f.cp=(f.cp||0)+dt*ZOMB_PACE;
        f.limp=Math.sin(f.cp);
        const base=f.vspeed;
        f.vspeed=base*(f.limp>0?1.75:0.30);
        moveTo(f,t.x,t.y,dt);
        f.vspeed=base;
      }else if(f.key==="worm"){
        f.cp=(f.cp||0)+dt*3.1;
        const s=Math.max(0,Math.sin(f.cp));f.surge=s*s;
        const base=f.vspeed;f.vspeed=base*(0.12+1.85*f.surge);
        moveTo(f,t.x,t.y,dt);f.vspeed=base;
      }else moveTo(f,t.x,t.y,dt);
    }
    else{f.face=Math.atan2(t.y-f.y,t.x-f.x);f.air=0;f.cool-=dt*f.aspd;
      if(f.cool<=0){f.cool=1;f.strike=.24;
        if(f.key==="spider")B.shots.push({x0:f.x,y0:f.y,x1:t.x,y1:t.y,life:.42,max:.42});
        /* 매미처럼 우는 것은 실 대신 고리 세 겹이 퍼져 나갑니다 */
        if((ENEMIES[f.key]||{}).wave)B.shots.push({wave:true,x0:f.x,y0:f.y,x1:t.x,y1:t.y,life:.5,max:.5});
        hurt(t,f.atk,"#F25C5C",f.dmgType,f);
        /* 들이받는 것들 — 대원을 밀어내고 한동안 다리를 무겁게 만든다 */
        const E=ENEMIES[f.key]||{};
        if(E.push&&t.hp>0)knockBack(f,t,E.push);
        if(E.slow&&t.hp>0){
          if(!t.slowT)B.fx.push({x:t.x,y:t.y-3,t:"둔화",c:"#7FA8D9",life:1,off:0});
          t.slowT=Math.max(t.slowT||0,E.slow.sec);t.slowM=E.slow.mul;
        }
        say(`${f.name}이(가) ${t.name}을(를) 공격했다.`)}}
  }
  separate();
  for(const a of B.allies)if(a.hp<=0&&!a.dead){
    a.dead=true;B.fallen.push(a);
    const by=a.lastHitBy;
    if(by&&ZOMB_BITE.has(by.key)){
      B.foes.push(makeZombieOf(a));
      say(`${a.name}이(가) 다시 일어선다. 더 이상 우리 편이 아니다.`);
    }else say(`${a.name}이(가) 쓰러졌다. 돌아오지 못한다.`);
  }
  for(const u of [...B.allies,...B.foes]){if(u.flash>0)u.flash-=dt;if(u.strike>0)u.strike-=dt;
    if(u.slowT>0)u.slowT-=dt}
  B.fx=B.fx.filter(p=>{p.life-=dt;p.off+=26*dt;return p.life>0});
  if(B.shake>0)B.shake=Math.max(0,B.shake-dt);
  if(B.shots)B.shots=B.shots.filter(w=>{w.life-=dt;return w.life>0});
  if(!B.over){
    if(!lifeA.length){B.over=1;stopLoop();setTimeout(()=>{G.scene="fail";render()},600)}
    else if(!live.length){B.over=1;stopLoop();setTimeout(finishBattle,700)}
  }
}

/* ═══════════ 그리기 ═══════════ */
let SX=4,SY=4;
/* 화면 흔들림(B.shake, 초) — 좀비 보스의 걸음과 내려찍기 */
function paint(){
  const sh=B&&B.shake>0?Math.min(1,B.shake*2.5):0;
  if(!sh){paintScene();return}
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate((Math.random()-.5)*sh*9,(Math.random()-.5)*sh*9);
  paintScene();
  ctx.restore();
}
function paintScene(){
  ctx.clearRect(0,0,W,H);SX=W/100;SY=H/100;
  const px=v=>v*SX,py=v=>v*SY;
  const bg=ROOM&&bgSprite(ROOM.id);
  if(bg){
    ctx.drawImage(bg,0,0,W,H);            // 배경 그림 — 도형 판정은 안 보이게, 계산에만 쓴다
  }else{
    ctx.fillStyle="#22212A";ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(255,255,255,.045)";ctx.lineWidth=1;
    for(let i=1;i<10;i++){
      ctx.beginPath();ctx.moveTo(px(i*10),0);ctx.lineTo(px(i*10),H);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,py(i*10));ctx.lineTo(W,py(i*10));ctx.stroke();
    }
    ctx.strokeStyle="rgba(216,71,126,.35)";ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,W-3,H-3);
    ctx.fillStyle="rgba(216,71,126,.30)";ctx.fillRect(px(DOOR.x),py(DOOR.y),px(DOOR.w),py(DOOR.h));
    ctx.fillStyle="rgba(234,230,242,.6)";ctx.font="700 9px system-ui";ctx.textAlign="center";
    ctx.fillText("입구",px(DOOR.x+DOOR.w/2),py(DOOR.y)-3);
    for(const o of ROOM.obs){
      if(o.mul){                              // 감속 지대 — 채우지 않고 빗금만
        ctx.fillStyle=o.mul<1?"rgba(90,180,200,.16)":"rgba(200,180,90,.16)";
        ctx.fillRect(px(o.x),py(o.y),px(o.w),py(o.h));
        ctx.setLineDash([2,3]);ctx.strokeStyle="rgba(120,205,225,.6)";ctx.lineWidth=1;
        ctx.strokeRect(px(o.x)+.5,py(o.y)+.5,px(o.w)-1,py(o.h)-1);ctx.setLineDash([]);
        ctx.fillStyle="rgba(200,235,245,.6)";ctx.font="700 9px system-ui";ctx.textAlign="center";
        ctx.fillText((o.l?o.l+" ":"")+"×"+o.mul,px(o.x+o.w/2),py(o.y+o.h/2)+3);
        continue;
      }
      const high=(o.lv&L3)!==0,mid=(o.lv&L2)!==0,low=(o.lv&L1)!==0;
      ctx.fillStyle=high?"#43414F":mid&&low?"#3A3948":"rgba(120,112,140,.32)";
      ctx.fillRect(px(o.x),py(o.y),px(o.w),py(o.h));
      if(!high&&!(mid&&low))ctx.setLineDash([3,3]);
      ctx.strokeStyle="rgba(255,255,255,.26)";ctx.lineWidth=1;
      ctx.strokeRect(px(o.x)+.5,py(o.y)+.5,px(o.w)-1,py(o.h)-1);
      ctx.setLineDash([]);
      if(o.l){ctx.fillStyle="rgba(234,230,242,.5)";ctx.font="700 10px system-ui";ctx.textAlign="center";
        ctx.fillText(o.l,px(o.x+o.w/2),py(o.y+o.h/2)+3.5)}
    }
  }
  for(const f of B.foes)if(f.hp>0&&f.slam)drawSlamMark(f);
  for(const f of B.foes)if(f.hp>0)drawFoe(f);
  for(const a of B.allies)if(a.hp>0)drawAlly(a);
  if(B.shots)for(const w of B.shots)drawWeb(w);
  ctx.textAlign="center";ctx.font="800 13px system-ui";
  for(const p of B.fx){ctx.globalAlpha=Math.min(1,p.life*1.6);ctx.fillStyle=p.c;
    ctx.fillText(p.t,px(p.x),py(p.y)-10-p.off)}
  ctx.globalAlpha=1;
}
/* 공격 시 몸통을 앞뒤로 미는 양(−준비 뒤로 ~ +타격 앞으로 ~ 0 복귀). 총은 호출부에서 부호를 뒤집어 반동으로 쓴다 */
function bodyLunge(u){
  if(!u.anim)return 0;
  const t=u.anim.t, S=u.style==="thrust"?THRUST:u.style==="gun"?GUNA:SWING, go=S.down||S.go;
  if(t<S.up)return -0.12*(t/S.up);
  if(t<S.up+go)return -0.12+1.12*((t-S.up)/go);
  return Math.max(0,1-(t-S.up-go)/S.rec);
}
/* 공격 이펙트 — 무기 아이콘은 손에 고정된 채, 타겟 방향(u.face)으로 잔상만 그린다.
   원점은 대원 중심(drawAlly 의 translate(x,y) 프레임), 손 높이로 옮겨 face 로 회전. */
function drawAtkFx(u,r){
  if(!u.anim||u.style===undefined)return;
  const t=u.anim.t;
  ctx.save();
  ctx.translate(0,-r*1.35);
  ctx.rotate(u.face);
  ctx.lineCap="round";
  if(u.style==="gun"){
    if(u.bow){                                        // 활 — 섬광 대신 시위가 튕기는 옅은 호. 화살은 launchArrow 가 날립니다
      if(t>=GUNA.up&&t<GUNA.up+GUNA.go+0.08){
        ctx.strokeStyle="rgba(236,226,196,.55)";ctx.lineWidth=r*0.12;
        ctx.beginPath();ctx.arc(r*0.9,0,r*0.95,-1.1,1.1);ctx.stroke();
      }
    }else if(t>=GUNA.up&&t<GUNA.up+GUNA.go+0.05){    // 총구 섬광
      ctx.fillStyle="rgba(255,236,160,.9)";
      ctx.beginPath();ctx.arc(r*2.0,0,r*0.5,0,7);ctx.fill();
      ctx.strokeStyle="rgba(255,236,160,.5)";ctx.lineWidth=r*0.2;
      ctx.beginPath();ctx.moveTo(r*1.5,0);ctx.lineTo(r*3.1,0);ctx.stroke();
    }
  }else if(u.style==="thrust"||u.wid==="spray"){
    const S=THRUST;
    if(t>S.up&&t<S.up+S.go+0.07){                     // 찌르기 섬광
      const p=Math.min(1,(t-S.up)/S.go);
      ctx.strokeStyle="rgba(242,215,78,.55)";ctx.lineWidth=r*0.5;
      ctx.beginPath();ctx.moveTo(r*0.6,0);ctx.lineTo(r*(1.4+2.1*p),0);ctx.stroke();
    }
  }else{
    const S=SWING;
    if(t>S.up&&t<S.up+S.down+0.06){                   // 휘두르기 호
      const p=(t-S.up)/S.down, a=-1.2+2.6*p;
      ctx.strokeStyle="rgba(242,215,78,.55)";ctx.lineWidth=r*0.7;
      ctx.beginPath();ctx.arc(0,0,r*2.0,a-0.95,a+0.15);ctx.stroke();
    }
  }
  ctx.restore();
}
function drawAlly(u){
  const x=u.x*SX,y=u.y*SY,r=u.r*Math.min(SX,SY);
  const fx=Math.cos(u.face),fy=Math.sin(u.face);
  const west=fx<0, back=fy<0;    // west=서쪽 절반, back=북쪽 절반(등 스프라이트)
  /* 대원 그림(앞·뒤)은 기본이 서쪽을 향해 있다. 그래서 동쪽을 볼 때 몸통을 좌우반전한다.
     손장비는 반전하지 않고 rdir 별 좌표를 그대로 쓴다(항상 오른손 무기). */
  const flip=!west;
  /* 걷는 중인지 — 지난 프레임과의 위치차로 판단. 공격 중엔 걷기 흔들림을 끈다 */
  const mv=Math.hypot(u.x-(u._px===undefined?u.x:u._px),u.y-(u._py===undefined?u.y:u._py));
  u._px=u.x;u._py=u.y;
  const walk=mv>0.015&&!u.anim;
  u.bob=(u.bob||0)+(walk?mv*0.9:0);
  const bobY=walk?-Math.abs(Math.sin(u.bob))*r*0.14:0;
  const P=bodyLunge(u), dir=u.style==="gun"?-0.45:1;
  const lx=fx*r*0.55*P*dir, ly=fy*r*0.55*P*dir;

  ctx.save();ctx.translate(x,y);

  /* 발밑 그림자 */
  ctx.save();ctx.translate(0,r*0.5);ctx.scale(1,0.42);
  ctx.beginPath();ctx.arc(0,0,r*0.95,0,7);
  ctx.fillStyle="rgba(0,0,0,.30)";ctx.fill();ctx.restore();

  /* 몸 + 손장비 — 대원 스프라이트를 기준으로 무기·방패를 얹는다.
     목표를 향하는 방향을 북동/북서/남동/남서로 4등분한다 (rdir = ne/nw/se/sw).
     몸통 스프라이트만 서쪽일 때 좌우반전하고, 손장비는 rdir 별 좌표로 직접 잡는다
     (항상 오른손에 무기라서 통째로 반전하지 않는다). */
  const img=allySprite((u.sex||"m")+(back?"-back":"-front"));
  const rdir=(back?"n":"s")+(west?"w":"e");

  const drawBody=()=>{
    ctx.save();ctx.translate(lx,ly+bobY);
    if(img){
      const h=r*4.2, w=h*(img.width/img.height);
      if(walk)ctx.rotate(Math.sin(u.bob)*0.05);
      ctx.scale((flip?-1:1)*(1+0.08*Math.max(0,P)),1-0.06*Math.max(0,P));
      if(u.flash>0)ctx.filter="brightness(0) invert(1)";
      ctx.drawImage(img,-w/2,-h+r*0.55,w,h);
      ctx.filter="none";
    }else{
      ctx.beginPath();ctx.arc(0,0,r,0,7);
      ctx.fillStyle=u.flash>0?"#fff":u.color;ctx.fill();
      ctx.lineWidth=2;ctx.strokeStyle="rgba(255,255,255,.85)";ctx.stroke();
    }
    ctx.restore();
  };
  const drawHand=(slot,id)=>{
    const rg=rigFor(id,slot,rdir), im=itemSprite(id);
    ctx.save();
    ctx.translate(lx+rg.x*r, ly+bobY+rg.y*r);   // 손 위치(몸통 런지만 따라감), 회전은 rig 고정
    ctx.rotate(rg.rot);
    if(rg.mir)ctx.scale(-1,1);                  // 손장비 좌우반전(회전만으론 안 되는 포즈용)
    if(u.flash>0)ctx.filter="brightness(0) invert(1)";
    if(im){
      const s=r*1.7*rg.scale, w=s*(im.width/im.height);
      /* 어둠 강화판 — 같은 그림을 그림자만 켠 채 두 번 덧그려 검은 아우라를 만든다.
         맞아서 하얗게 번쩍이는 동안에는 끈다(필터와 겹치면 지저분해진다). */
      const upIt=ITEMS[id];
      if(upIt&&(upIt.dark||upIt.base)&&!(u.flash>0)){
        const dk=!!upIt.dark;                      /* 어둠은 검보라, 실습동은 푸른색 */
        ctx.shadowColor=dk?"#12042A":"#02202E";ctx.shadowBlur=r*1.4;
        ctx.drawImage(im,-w/2,-s/2,w,s);
        ctx.shadowColor=dk?"rgba(140,54,224,.95)":"rgba(70,200,245,.95)";ctx.shadowBlur=r*0.8;
        ctx.drawImage(im,-w/2,-s/2,w,s);
        ctx.shadowBlur=0;ctx.shadowColor="transparent";
      }
      ctx.drawImage(im,-w/2,-s/2,w,s);
    }else{                                   // 아이콘이 아직 안 읽혔을 때 임시 도형
      ctx.fillStyle=u.flash>0?"#fff":"#9a92ad";
      if(slot==="lh"){ctx.beginPath();ctx.arc(0,0,r*0.6,0,7);ctx.fill();}
      else ctx.fillRect(0,-r*0.12,r*1.6,r*0.24);
    }
    ctx.filter="none";
    ctx.restore();
  };

  /* 겹침 순서: 대원 몸통은 z=0, 손장비는 rig 의 z (뒤 −2‥−1, 앞 1‥2). 옛 데이터의 behind 도 받는다 */
  const zOf=e=>e&&e.z!=null?+e.z:(e&&e.behind?-1:1);
  const layers=[{z:0,o:0,f:drawBody}];
  if(u.hasW&&u.wid)layers.push({z:zOf(rigFor(u.wid,"rh",rdir)),o:1,f:()=>drawHand("rh",u.wid)});
  if(u.hasS&&u.sid)layers.push({z:zOf(rigFor(u.sid,"lh",rdir)),o:2,f:()=>drawHand("lh",u.sid)});
  layers.sort((a,b)=>a.z-b.z||a.o-b.o);
  for(const l of layers)l.f();
  drawAtkFx(u,r);         // 무기는 고정, 잔상만

  ctx.restore();          // translate 해제
  const topY=img?r*3.0:r+7, botY=img?r*1.2:r+10;
  bar(u,x,y-topY,"#6BD98F",r);
  if(u.stunT>0)drawStunStars(x,y-topY-r*.9,r);
  ctx.fillStyle="rgba(234,230,242,.7)";ctx.font="600 8.5px system-ui";ctx.textAlign="center";
  ctx.fillText(u.name,x,y+botY);
}
/* 기절 표시 — 머리 위에서 별 셋이 납작한 원을 그리며 돕니다. 뒤로 가는 별은 작고 흐립니다 */
function drawStunStars(cx,cy,r){
  const t=performance.now()/1000*5.5, rx=r*1.35, ry=r*.42;
  for(let i=0;i<3;i++){
    const a=t+i*Math.PI*2/3, z=Math.sin(a);
    const x=cx+Math.cos(a)*rx, y=cy+z*ry, s=r*(.58+.16*z);
    ctx.save();ctx.translate(x,y);ctx.rotate(t*1.4+i);
    ctx.globalAlpha=.65+.35*z;
    ctx.beginPath();
    for(let k=0;k<10;k++){const rr=k%2?s*.45:s, q=k*Math.PI/5-Math.PI/2;
      k?ctx.lineTo(Math.cos(q)*rr,Math.sin(q)*rr):ctx.moveTo(Math.cos(q)*rr,Math.sin(q)*rr)}
    ctx.closePath();
    ctx.fillStyle="#F7D84A";ctx.fill();
    ctx.strokeStyle="rgba(90,60,0,.8)";ctx.lineWidth=.8;ctx.stroke();
    ctx.restore();
  }
}
/* 몬스터 그림·도형은 옆모습(머리가 오른쪽)이다. face 를 그대로 rotate 하면
   왼쪽이나 아래를 향할 때 배가 하늘로 가서 뒤집힌 꼴이 된다.
   서쪽을 볼 때는 회전 대신 좌우반전으로 돌리고, 위아래 기울기는 ±90° 안으로만 준다.
   extra 는 애니메이션용 추가 회전 — 반전 시 부호도 뒤집어야 같은 방향으로 흔들린다. */
function faceFoe(g,ang,extra){
  const flip=Math.cos(ang)<0;
  const a=Math.atan2(Math.sin(ang),Math.abs(Math.cos(ang)));   // [-90°, +90°]
  g.scale(flip?-1:1,1);
  g.rotate(a+(flip?-(extra||0):(extra||0)));
}
const ZBOSS_SIZE=4.6;                            /* 좀비 보스 그림 크기(판정 반지름 배수) */
const KEEP_RATIO=new Set(["cicada"]);            /* 그림 비율대로 그리는 몬스터 */
function drawFoe(f){
  const x=f.x*SX,y=f.y*SY,r=f.r*Math.min(SX,SY);
  const bx=Math.cos(f.face),by=Math.sin(f.face);
  const col=f.flash>0?"#fff":f.color;
  if(f.key==="worm"){
    const sp=sprite("worm");
    const su=f.surge||0;
    if(sp){
      /* 그림 한 장을 세로로 잘게 썰어, 조각마다 어긋나게 그립니다.
         surge(0 웅크림 ~ 1 뻗음)로 길이를 줄였다 늘이고,
         머리에서 꼬리로 흐르는 사인파로 몸을 물결치게 합니다.
         판정 반지름 f.r 은 건드리지 않습니다 — 그림만 커집니다. */
      const N=20, sw=sp.width/N;
      const L=r*4.4;                     // 다 뻗었을 때의 몸 길이
      const HEAD=0.36;                   // 앞 36%는 딱딱한 머리 — 접히지 않는다
      const sq=0.60+0.40*su;             // 몸통만 이만큼 접힌다
      const back=1-HEAD;
      const mapU=u=>u>=back?u:back-(back-u)*sq;   // 꼬리 쪽만 끌어당긴다
      const hx=r*1.15;                   // 머리는 판정 원보다 조금 앞
      const wg=f.wig||0, amp=r*0.42*(0.25+su*0.9);
      ctx.save();
      ctx.translate(x,y);faceFoe(ctx,f.face);
      ctx.scale(1,-1);                                     // 애벌레 그림은 상하가 뒤집혀 있어 바로 세운다
      if(f.flash>0)ctx.filter="brightness(0) invert(1)";   // 맞으면 하얗게
      for(let i=0;i<N;i++){
        const u=i/N, un=(i+1)/N;         // 0 꼬리 ~ 1 머리
        const a=mapU(u),b=mapU(un);
        const t=Math.max(0,(back-u)/back);          // 머리 0 ~ 꼬리 1
        const dy=Math.sin(wg*1.7-(1-u)*5.4)*amp*t;  // 머리에서 꼬리로 흐르는 물결
        const H=r*2.5*(1+(1-su)*0.20*t);            // 접힌 만큼 몸통이 통통해진다
        ctx.drawImage(sp, i*sw,0, sw,sp.height,
          hx-L+a*L, dy-H/2, (b-a)*L*1.10, H);
      }
      ctx.restore();
    }else{
      const gap=r*(.55+.55*su),fat=1+(1-su)*.22;
      for(let i=2;i>=0;i--){
        const w=Math.sin((f.wig||0)-i*.7)*1.5*(0.4+su);
        ctx.beginPath();
        ctx.arc(x-bx*i*gap-by*w,y-by*i*gap+bx*w,(r-i*r*.15)*fat,0,7);
        ctx.fillStyle=f.flash>0?"#fff":(i===0?f.color:"#7E9E3C");ctx.fill();
      }
      ctx.fillStyle=f.flash>0?"#fff":"#3A4A22";
      ctx.beginPath();ctx.arc(x+bx*r*.45-by*r*.3,y+by*r*.45+bx*r*.3,r*.16,0,7);ctx.fill();
    }
  }else if(f.key==="hopper"){
    const j=f.air>0?Math.sin((1-f.air/HOP_AIR)*Math.PI):0;
    const crouch=f.air>0?0:Math.max(0,1-(f.hopCd||0)/.35);
    const flying=j>0.02;
    const spH=sprite("hopper"), spF=flying?sprite("hopperFly"):null;
    const sp=spF||spH;
    if(flying){                              // 뜬 만큼 그림자가 작아진다
      ctx.fillStyle="rgba(0,0,0,.35)";
      ctx.beginPath();ctx.ellipse(x,y,r*.9*(1-j*.3),r*.5*(1-j*.3),0,0,7);ctx.fill();
    }
    if(sp){
      const S=r*5.0*(1+j*0.20);              // 높이 뜰수록 커 보인다
      const flap=flying?1+Math.sin((f.wig||0)*7)*0.06:1;   // 날개 파닥임
      ctx.save();
      ctx.translate(x,y-j*r*1.7);            // 화면상 위로 뜬다
      faceFoe(ctx,f.face);
      ctx.translate(r*0.9,0);                // 눈이 판정 원보다 조금 앞
      /* 웅크리면 앞뒤로 짧아지고 옆으로 퍼집니다 */
      ctx.scale(1-crouch*0.22,(1+crouch*0.18)*flap);
      if(f.flash>0)ctx.filter="brightness(0) invert(1)";
      ctx.drawImage(sp,-S/2,-S/2,S,S);
      ctx.restore();
    }else{
      ctx.save();ctx.translate(x,y-j*r*1.6);faceFoe(ctx,f.face);ctx.scale(1+j*.12,1+j*.12);
      const spread=j>0?r*.9:-crouch*r*.35;
      ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(-r*.3,-r*.5);ctx.lineTo(-r*1.2,-r*1.0-spread);ctx.lineTo(-r*.3,-r*1.5-spread*.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-r*.3,r*.5);ctx.lineTo(-r*1.2,r*1.0+spread);ctx.lineTo(-r*.3,r*1.5+spread*.5);ctx.stroke();
      ctx.beginPath();ctx.ellipse(0,0,r*1.15*(1-crouch*.12),r*.72*(1+crouch*.15),0,0,7);
      ctx.fillStyle=col;ctx.fill();
      ctx.beginPath();ctx.arc(r*.8,0,r*.3,0,7);ctx.fillStyle=f.flash>0?"#fff":"#EFD98A";ctx.fill();
      ctx.restore();
    }
  }else if(f.key==="spider"){
    const spd=sprite("spider");
    if(spd){
      /* 그림은 머리가 오른쪽을 보게 잘라 두었습니다 — faceFoe 만 태우면 방향이 맞습니다.
         가로로 긴 그림이라 긴 쪽을 몸 방향에 맞춰 폭부터 잡습니다. */
      const sway=Math.sin((f.wig||0)*1.3)*0.045;
      const Wd=r*5.6, Ht=Wd*(spd.height/spd.width);
      ctx.save();ctx.translate(x,y);faceFoe(ctx,f.face,sway);
      if(f.strike>0){        // 뿜을 때 배를 들고 앞을 낮춘다 — 방적돌기에 실이 맺힌다
        const e=Math.sin((1-Math.max(0,f.strike)/.24)*Math.PI);
        ctx.rotate(-e*0.20);
        ctx.beginPath();ctx.ellipse(-r*1.7-e*r*0.3,0,r*0.5,r*0.42,0,0,7);
        ctx.fillStyle="rgba(238,238,252,.9)";ctx.fill();
      }
      if(f.flash>0)ctx.filter="brightness(0) invert(1)";
      ctx.drawImage(spd,-Wd/2,-Ht/2,Wd,Ht);
      ctx.restore();
      ctx.fillStyle="rgba(242,215,78,.9)";ctx.font="800 9px system-ui";ctx.textAlign="center";
      ctx.fillText("BOSS",x,y-r-12);
      bar(f,x,y-r-6,"#F25C5C",r);
      return;
    }
    ctx.save();ctx.translate(x,y);faceFoe(ctx,f.face);
    ctx.strokeStyle=col;ctx.lineWidth=2.1;ctx.lineCap="round";
    for(let i=0;i<8;i++){                       // 긴 다리 여덟 개
      const side=i<4?1:-1,k=i%4;
      const a=(0.45+k*0.62)*side+Math.sin(f.wig*2.2+i*1.3)*0.11;
      const kx=Math.cos(a)*r*1.45,ky=Math.sin(a)*r*1.45;
      const ex=Math.cos(a)*r*2.5,ey=Math.sin(a)*r*2.5;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.lineTo(kx-Math.abs(Math.sin(a))*r*0.4,ky);ctx.lineTo(ex,ey);ctx.stroke();
    }
    if(f.strike>0){          // 뿜을 때 배를 들어올리고 앞을 낮춘다
      const e=Math.sin((1-Math.max(0,f.strike)/.24)*Math.PI);
      ctx.save();ctx.rotate(-e*0.28);
      ctx.beginPath();ctx.ellipse(-r*1.0-e*r*0.3,0,r*0.5,r*0.42,0,0,7);
      ctx.fillStyle="rgba(238,238,252,.9)";ctx.fill();   // 방적돌기에 맺힌 실
      ctx.restore();
    }
    ctx.beginPath();ctx.ellipse(-r*.55,0,r*1.05,r*.9,0,0,7);ctx.fillStyle=col;ctx.fill();
    ctx.beginPath();ctx.arc(r*.55,0,r*.55,0,7);
    ctx.fillStyle=f.flash>0?"#fff":"#B79BEA";ctx.fill();
    ctx.fillStyle="#2A2A30";
    for(const e of [-.28,-.1,.1,.28]){ctx.beginPath();ctx.arc(r*.85,e*r,r*.1,0,7);ctx.fill()}
    ctx.restore();
    ctx.fillStyle="rgba(242,215,78,.9)";ctx.font="800 9px system-ui";ctx.textAlign="center";
    ctx.fillText("BOSS",x,y-r-12);
  }else if(f.key==="zombie"&&sprite("zombie")){
    /* 좀비 보스 — 정면을 보는 그림이라 돌리지 않고 좌우만 뒤집습니다.
       걸음마다 몸이 들렸다 쿵 내려앉고, 어깨가 좌우로 기웁니다. 발이 판정 원의 아래쪽에 닿습니다 */
    const c=f.cp||0, step=f.slam?0:Math.abs(Math.sin(c)), po=zbossPose(f);
    const S=r*ZBOSS_SIZE, img=sprite("zombie"), zp=cutParts(img,ZBOSS_LIMBS,ZBOSS_BASE);
    ctx.save();ctx.translate(x,y+r);
    if(Math.cos(f.face)<0)ctx.scale(-1,1);
    if(po.shake)ctx.translate((Math.random()-.5)*r*.35*po.shake,(Math.random()-.5)*r*.12*po.shake);
    ctx.rotate(f.slam?0:Math.sin(c)*0.07);
    ctx.translate(0,-step*r*0.22-po.lift*r*.18);
    ctx.scale(1+(1-step)*0.04*(f.slam?0:1)+po.squash*.12-po.lift*.02,
              1-(1-step)*0.04*(f.slam?0:1)-po.squash*.12+po.lift*.06);
    if(f.flash>0)ctx.filter="brightness(0) invert(1)";
    else if(po.shake)ctx.filter=`brightness(${1+po.shake*.15}) saturate(${1+po.shake*.4})`;
    if(!zp)ctx.drawImage(img,-S/2,-S,S,S);
    else{
      const k=S/ZBOSS_BASE;
      ctx.drawImage(zp.body,-S/2,-S,S,S);
      ZBOSS_LIMBS.forEach((L,i)=>{
        const jit=po.shake?(Math.random()-.5)*.08*po.shake:0;
        ctx.save();
        ctx.translate(L.px*k-S/2,L.py*k-S);ctx.rotate(L.dir*(po.arm*ZBOSS_RAISE+jit));
        ctx.drawImage(zp.limbs[i],-L.px*k,-L.py*k,S,S);
        ctx.restore();
      });
    }
    ctx.restore();
    if(f.boss){ctx.fillStyle="rgba(242,215,78,.9)";ctx.font="800 9px system-ui";
      ctx.textAlign="center";ctx.fillText("BOSS",x,y+r-S-8)}
  }else if(ZOMB_WALK.has(f.key)){
    const lp=f.limp||0, tilt=lp*0.20;
    ctx.save();ctx.translate(x,y);faceFoe(ctx,f.face,tilt);
    const zsp=sprite(f.key);
    if(zsp){
      /* 기어 오는 그림 한 장 — 절뚝일 때마다 앞뒤로 조금 밀리고 늘어납니다.
         팔다리는 잘라 둔 조각을 어깨·엉덩이를 축으로 흔듭니다(ZOMB_LIMBS) */
      const S=r*3.6;
      ctx.translate(lp*r*0.12,0);ctx.scale(1+lp*0.05,1-lp*0.03);
      if(f.flash>0)ctx.filter="brightness(0) invert(1)";
      zombDraw(ctx,zsp,S,f.cp||0);
    }else{
    // 끌리는 다리
    ctx.strokeStyle="#2F6B2A";ctx.lineWidth=r*0.30;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(-r*0.2,r*0.45);
    ctx.lineTo(-r*1.35-Math.max(0,-lp)*r*0.5,r*0.75);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-r*0.2,-r*0.45);
    ctx.lineTo(-r*0.95+lp*r*0.35,-r*0.8);ctx.stroke();
    // 앞으로 뻗은 팔 — 길이가 다르다
    ctx.strokeStyle=f.flash>0?"#fff":"#6FC25C";ctx.lineWidth=r*0.26;
    ctx.beginPath();ctx.moveTo(r*0.2,-r*0.55);
    ctx.lineTo(r*1.55+lp*r*0.2,-r*0.62);ctx.stroke();
    ctx.beginPath();ctx.moveTo(r*0.2,r*0.55);
    ctx.lineTo(r*1.15-lp*r*0.25,r*0.72);ctx.stroke();
    // 몸통과 머리
    ctx.beginPath();ctx.ellipse(-r*0.15,0,r*0.82,r*0.62,0,0,7);
    ctx.fillStyle=f.flash>0?"#fff":f.color;ctx.fill();
    ctx.strokeStyle="rgba(20,50,18,.75)";ctx.lineWidth=1.4;ctx.stroke();
    ctx.beginPath();ctx.arc(r*0.62,lp*r*0.10,r*0.46,0,7);
    ctx.fillStyle=f.flash>0?"#fff":"#7FCB6B";ctx.fill();ctx.stroke();
    ctx.fillStyle="#1E3A1A";
    ctx.beginPath();ctx.arc(r*0.85,-r*0.16,r*0.09,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(r*0.85,r*0.16,r*0.09,0,7);ctx.fill();
    }
    ctx.restore();
    if(f.boss){ctx.fillStyle="rgba(242,215,78,.9)";ctx.font="800 9px system-ui";
      ctx.textAlign="center";ctx.fillText("BOSS",x,y-r-12)}
  }else if(f.key==="bloodeyes"){
    // 빠르게 움직이므로 잔상을 깐다
    ctx.globalAlpha=.22;ctx.fillStyle=f.color;
    ctx.beginPath();ctx.arc(x-Math.cos(f.face)*r*.7,y-Math.sin(f.face)*r*.7,r*.85,0,7);ctx.fill();
    ctx.globalAlpha=1;
    ctx.save();ctx.translate(x,y);faceFoe(ctx,f.face);
    ctx.beginPath();                                  // 꿈틀대는 덩어리
    for(let i=0;i<=28;i++){
      const a=i/28*Math.PI*2;
      const rr=r*(0.94+Math.sin(a*3+f.wig*2.2)*0.11+Math.sin(a*5-f.wig*1.4)*0.06);
      const px2=Math.cos(a)*rr,py2=Math.sin(a)*rr;
      i?ctx.lineTo(px2,py2):ctx.moveTo(px2,py2);
    }
    ctx.closePath();ctx.fillStyle=f.flash>0?"#fff":f.color;ctx.fill();
    ctx.strokeStyle="rgba(40,8,14,.9)";ctx.lineWidth=1.5;ctx.stroke();
    const eyes=[[0.18,0,.44],[-0.42,-0.42,.30],[-0.38,0.46,.30],[0.44,-0.46,.25],
                [0.48,0.42,.25],[-0.06,-0.68,.21],[0.02,0.70,.21],[-0.72,0.04,.24]];
    for(let i=0;i<eyes.length;i++){
      const [ex,ey,es]=eyes[i];
      const blink=Math.sin(f.wig*1.7+i*2.1);
      const open=blink<-0.86?0.12:1;                  // 가끔 깜빡인다
      const cx2=ex*r,cy2=ey*r,rr=es*r;
      ctx.save();ctx.translate(cx2,cy2);ctx.scale(1,open);
      ctx.beginPath();ctx.arc(0,0,rr,0,7);
      ctx.fillStyle=f.flash>0?"#fff":"#F2E9E4";ctx.fill();
      ctx.beginPath();ctx.arc(rr*.34,0,rr*.55,0,7);ctx.fillStyle="#C2312F";ctx.fill();
      ctx.beginPath();ctx.arc(rr*.44,0,rr*.26,0,7);ctx.fillStyle="#1A0A0E";ctx.fill();
      ctx.restore();
    }
    if(f.strike>0){                                   // 시선이 터진다
      const e=Math.sin((1-Math.max(0,f.strike)/.24)*Math.PI);
      ctx.globalAlpha=e*.85;
      ctx.strokeStyle="#F25C5C";ctx.lineWidth=2.4;
      ctx.beginPath();ctx.arc(r*1.6,0,r*(0.5+e*1.1),0,7);ctx.stroke();
      ctx.globalAlpha=1;
    }
    ctx.restore();
    ctx.fillStyle="rgba(242,215,78,.9)";ctx.font="800 9px system-ui";ctx.textAlign="center";
    ctx.fillText("BOSS",x,y-r-12);
  }else{
    const sp=sprite(f.key);
    if(sp){
      /* 낫을 내리칠 때(strike) 앞으로 튀어나가고, 평소에는 좌우로 천천히 흔들립니다 */
      const st=f.strike>0?Math.sin((1-Math.max(0,f.strike)/.24)*Math.PI):0;
      const sway=Math.sin((f.wig||0)*0.9)*0.05*(1-st);
      const S=r*4.6;
      /* 매미는 그림 비율(가로로 긴 몸)을 지킵니다 — 정사각형에 넣으면 몸통이 두 배로 뚱뚱해집니다 */
      const SH=KEEP_RATIO.has(f.key)?S*sp.naturalHeight/sp.naturalWidth:S;
      ctx.save();
      ctx.translate(x,y);
      faceFoe(ctx,f.face,sway);
      ctx.translate(st*r*0.55,0);            // 찌를 때 앞으로
      ctx.scale(1+st*0.10,1-st*0.06);
      if(f.flash>0)ctx.filter="brightness(0) invert(1)";
      ctx.drawImage(sp,-S/2,-SH/2,S,SH);
      ctx.restore();
    }else{
      ctx.save();ctx.translate(x,y);faceFoe(ctx,f.face);
      const sw=Math.sin(f.wig*1.1)*0.28;
      ctx.strokeStyle=col;ctx.lineWidth=3;ctx.lineCap="round";
      for(const s of [-1,1]){ctx.save();ctx.rotate(s*(0.5+sw));
        ctx.beginPath();ctx.moveTo(r*.4,0);ctx.lineTo(r*1.5,0);ctx.lineTo(r*1.9,-s*r*.7);ctx.stroke();
        ctx.restore()}
      ctx.beginPath();ctx.ellipse(-r*.2,0,r*1.05,r*.66,0,0,7);ctx.fillStyle=col;ctx.fill();
      ctx.beginPath();ctx.arc(r*.75,0,r*.42,0,7);ctx.fillStyle=f.flash>0?"#fff":"#8FE0BC";ctx.fill();
      ctx.restore();
    }
    /* 적에게는 이름표를 달지 않습니다 — 보스만 BOSS */
    if(f.boss){ctx.fillStyle="rgba(242,215,78,.9)";ctx.font="800 9px system-ui";
      ctx.textAlign="center";ctx.fillText("BOSS",x,y-r-12)}
  }
  const lift=(f.key==="hopper"&&f.air>0)?Math.sin((1-f.air/HOP_AIR)*Math.PI)*r*1.6
    :(f.key==="zombie"&&sprite("zombie"))?r*(ZBOSS_SIZE-2):0;   // 좀비 보스는 서 있는 그림 위로
  bar(f,x,y-r-6-lift,"#F25C5C",r);
}
/* 음파 — 우는 쪽에서 대상 쪽으로 고리 세 겹이 벌어지며 나아간다 */
function drawWave(w){
  const p=Math.min(1,(w.max-w.life)/w.max);
  const ang=Math.atan2(w.y1-w.y0,w.x1-w.x0);
  const far=Math.hypot(w.x1-w.x0,w.y1-w.y0);
  ctx.save();
  ctx.lineCap="round";
  for(let i=0;i<3;i++){
    const q=p-i*0.16;                       // 뒤 고리는 조금 늦게 출발한다
    if(q<=0||q>1)continue;
    const cx=(w.x0+(w.x1-w.x0)*q)*SX, cy=(w.y0+(w.y1-w.y0)*q)*SY;
    const rad=(2.2+q*3.4)*SX;
    ctx.globalAlpha=(1-q)*0.85;
    ctx.strokeStyle="#EBD9A6";ctx.lineWidth=2.2-q*1.1;
    ctx.beginPath();
    ctx.arc(cx,cy,rad,ang-0.85,ang+0.85);   // 나아가는 쪽만 벌어진 호
    ctx.stroke();
  }
  ctx.restore();ctx.globalAlpha=1;
}
/* ── 화살 ── 쏠 때마다 하나가 날아갑니다(그림만 — 피해는 쏘는 순간 들어갑니다).
   비행 시간은 거리에 비례해 0.08~0.24초. 맞힌 화살은 잠깐 박혀 있다가 사라지고,
   빗나간 화살은 과녁 옆을 스쳐 조금 더 날아갑니다 */
function launchArrow(u,tg,missed){
  if(!B.shots)B.shots=[];
  const x0=u.x+Math.cos(u.face)*u.r*0.8, y0=u.y-u.r*1.1+Math.sin(u.face)*u.r*0.8;
  let x1=tg.x, y1=tg.y-tg.r*0.3;
  if(missed){
    const a=Math.atan2(y1-y0,x1-x0)+(Math.random()<.5?1:-1)*0.18, L=Math.hypot(x1-x0,y1-y0)+tg.r*3;
    x1=x0+Math.cos(a)*L;y1=y0+Math.sin(a)*L;
  }
  const fly=Math.max(0.08,Math.min(0.24,Math.hypot(x1-x0,y1-y0)/160)), stay=missed?0.06:0.18;
  B.shots.push({arrow:true,x0,y0,x1,y1,fly,life:fly+stay,max:fly+stay,missed});
}
function drawArrow(w){
  const el=w.max-w.life, p=Math.min(1,el/w.fly);
  const X0=w.x0*SX,Y0=w.y0*SY,X1=w.x1*SX,Y1=w.y1*SY;
  const a=Math.atan2(Y1-Y0,X1-X0), L=Math.max(10,Math.min(SX,SY)*4.2);
  const fade=p<1?1:Math.max(0,w.life/Math.max(0.01,w.max-w.fly));
  ctx.save();
  ctx.translate(X0+(X1-X0)*p,Y0+(Y1-Y0)*p);ctx.rotate(a);
  ctx.globalAlpha=fade;ctx.lineCap="round";
  if(p<1){                                               // 잔상
    ctx.strokeStyle="rgba(255,244,210,.3)";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-L*1.9,0);ctx.lineTo(-L,0);ctx.stroke();
  }else if(!w.missed)ctx.translate(-L*0.25,0);           // 박히면 촉이 몸에 조금 묻힙니다
  ctx.strokeStyle="#6B4A2E";ctx.lineWidth=2.2;           // 대
  ctx.beginPath();ctx.moveTo(-L,0);ctx.lineTo(-2,0);ctx.stroke();
  ctx.fillStyle="#D9DDE3";                               // 촉
  ctx.beginPath();ctx.moveTo(3.5,0);ctx.lineTo(-3,-3);ctx.lineTo(-2,0);ctx.lineTo(-3,3);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#C84A3C";ctx.lineWidth=1.6;           // 깃
  ctx.beginPath();ctx.moveTo(-L+4,0);ctx.lineTo(-L,-3.2);ctx.moveTo(-L+4,0);ctx.lineTo(-L,3.2);ctx.stroke();
  ctx.restore();
}
function drawWeb(w){
  if(w.wave)return drawWave(w);
  if(w.arrow)return drawArrow(w);
  const p=Math.min(1,(w.max-w.life)/(w.max*0.42));      // 뻗어 나가는 진행도
  const fade=Math.min(1,w.life/w.max*2.2);
  const ex=w.x0+(w.x1-w.x0)*p, ey=w.y0+(w.y1-w.y0)*p;
  let nx=-(w.y1-w.y0), ny=(w.x1-w.x0);
  const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
  ctx.strokeStyle=`rgba(232,232,248,${fade*0.95})`;
  ctx.lineWidth=1.7;ctx.lineCap="round";
  ctx.beginPath();
  for(let i=0;i<=10;i++){                                // 지그재그로 흔들리는 실
    const q=i/10;
    const wob=Math.sin(q*Math.PI*3.2)*1.7*(1-q*0.6);
    const bx=w.x0+(ex-w.x0)*q+nx*wob, by=w.y0+(ey-w.y0)*q+ny*wob;
    i?ctx.lineTo(bx*SX,by*SY):ctx.moveTo(bx*SX,by*SY);
  }
  ctx.stroke();
  if(p>=1){                                              // 착탄 — 들러붙은 거미줄
    const cx=w.x1*SX, cy=w.y1*SY, rr=7+(1-fade)*4;
    ctx.strokeStyle=`rgba(238,238,252,${fade*0.9})`;ctx.lineWidth=1.2;
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3+0.3;
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);ctx.stroke();
    }
    for(const ring of [0.45,0.85]){
      ctx.beginPath();
      for(let i=0;i<=6;i++){
        const a=i*Math.PI/3+0.3;
        const px2=cx+Math.cos(a)*rr*ring, py2=cy+Math.sin(a)*rr*ring;
        i?ctx.lineTo(px2,py2):ctx.moveTo(px2,py2);
      }
      ctx.stroke();
    }
  }
}
function bar(u,x,y,c,r){
  const w=Math.max(22,r*2.4);
  ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(x-w/2,y,w,3);
  ctx.fillStyle=c;ctx.fillRect(x-w/2,y,w*Math.max(0,u.hp/u.maxHp),3);
}
function loop(ts){
  if(!last)last=ts;
  const dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(B&&!B.over&&!B.paused)tick(dt);
  if(B)paint();
  if(B&&B.paused)paintPause();
  raf=requestAnimationFrame(loop);
}
function startLoop(){if(raf)return;last=0;raf=requestAnimationFrame(loop)}
function stopLoop(){if(raf)cancelAnimationFrame(raf);raf=null}
/* 전투 일시정지 — 화면 위에 덮개를 그린다. 계산(tick)만 멈추고 그리기는 계속한다 */
function paintPause(){
  if(!ctx)return;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font="bold 22px system-ui,sans-serif";
  ctx.fillText("일시정지",W/2,H/2-12);
  ctx.font="13px system-ui,sans-serif";ctx.fillStyle="rgba(255,255,255,.82)";
  ctx.fillText("화면을 누르면 계속",W/2,H/2+16);
  ctx.restore();
}
function togglePause(){
  if(!B||B.over)return;
  B.paused=!B.paused;
  if(!raf)startLoop();
}
/* ═══════════ 뒤로가기 (안드로이드 하드웨어 버튼 · Esc) ═══════════
   게이트 전투 중이면 일시정지 토글, 캠퍼스에서는 방 → 건물 → 캠퍼스 순으로 한 단계 올라간다.

function goBack(){

function fitCanvas(){

/* ═══════════ 정산 ═══════════ */
/* 한 사람 몫 — 레벨이 오르면 스탯 포인트도 같이 줍니다. 교육장 수업도 이 문을 지납니다 */
function addExp(p,amount){
  p.exp+=amount;
  while(p.lvl<MAX_LV&&p.exp>=nextExp(p.lvl)){p.exp-=nextExp(p.lvl);p.lvl++;p.points+=1;
    logAdd(p,`Lv ${p.lvl} 달성`)}
}
function grantExp(list,amount){
  const out=[];
  /* 눈높이 수업 — 파티 전원이 더 받고, + 단계에서는 레벨이 가장 낮은 대원이 한 번 더 받습니다.
     배율은 파티의 초등교육과 대원 중 전공활용이 가장 높은 사람을 따릅니다(bestMajRate) */
  const lv=elemLv(), rate=lv?bestMajRate("elem"):1;
  const low=lv>=2&&list.length?Math.min(...list.map(p=>p.lvl)):null;
  for(const p of list){
    const b=p.lvl, e0=p.exp;      // 정산 화면 애니메이션이 '전투 전' 값을 쓴다
    let m=1+ELEM_EXP[lv]*rate;
    if(low!==null&&p.lvl===low)m+=ELEM_LOW*rate;
    addExp(p,Math.round(amount*m));
    out.push({p,up:p.lvl-b,lvl0:b,exp0:e0});
  }
  return out;
}
/* ── 전투 뒤 탄약 수습 ──
   총이나 활을 들고 살아남은 사람이 있으면 그 탄약이 **전리품 바닥에 떨어집니다**.
   배낭에 바로 꽂지 않는 것은, 전리품 정리에서 누가 얼마나 이고 갈지 고르게 하기 위해서입니다.
   위험도(★ = risk+1)별 [확률, 뭉치의 몇 몫인지] — ★ 20%·반 뭉치가 기준입니다.
   사람마다 따로 굴리고, 같은 탄약은 바닥에서 한 줄로 합쳐집니다(mergeGroundAmmo). */
const SALVAGE=[[0.20,0.50],[0.30,0.65],[0.40,0.80],[0.50,1.00]];
function salvageAmmo(alive){
  const out=[];
  if(G.mode!=="run"||!G.here)return out;
  const [q,part]=SALVAGE[Math.max(0,Math.min(SALVAGE.length-1,G.here.risk||0))];
  for(const a of alive){
    const r=a.ref, rh=r&&ITEMS[r.gear.rh];
    if(!rh||!rh.ammo||Math.random()>=q)continue;
    out.push({id:AMMO_ID[rh.ammo],src:"수습",n:Math.max(1,Math.round(ammoQty(rh.ammo)*part))});
  }
  return out;
}
/* 바닥의 같은 탄약을 한 줄로 합칩니다 — 반 뭉치 둘이 따로 놓이지 않게.
   유품만 따로 둡니다(딱지가 붙고, 누구 것이었는지가 드러나야 해서). */
function mergeGroundAmmo(){
  const head={};
  G.ground=G.ground.filter(g=>{
    const it=ITEMS[g.id];
    if(!it||it.kind!=="ammo")return true;
    if(g.n===undefined)g.n=it.qty;
    const k=`${g.id}|${g.src==="유품"?"유품":"바닥"}`;
    if(head[k]){head[k].n+=g.n;return false}
    head[k]=g;return true;
  });
}
function finishBattle(){
  const exp=B.foes.reduce((s,f)=>s+f.exp,0);
  const dead=B.fallen.map(f=>f.ref);
  const alive=B.allies.filter(a=>a.hp>0);
  /* 쏜 만큼 줄어든 채로 돌아옵니다. 도중에 배낭 무기로 바꿔 들었어도 남은 총알은 그대로입니다 */
  for(const a of B.allies)
    if(a.ammoN!==undefined&&a.ref&&a.ref.ammo)a.ref.ammo[a.ammoType]=Math.max(0,a.ammoN);
  const broke=[];
  const hp0=new Map();                 // 전투 전 체력 — 정산 화면에서 여기서부터 깎아 보여준다
  for(const a of alive){
    hp0.set(a.ref,a.ref.hp);
    a.ref.hp=Math.round(a.hp);
    for(const slot of a.broken){
      const it=ITEMS[a.ref.gear[slot]];
      if(it){broke.push(`${a.ref.name}의 ${it.n}`);logAdd(a.ref,`${it.n} 파손`);a.ref.gear[slot]=null}
    }
    /* 전공 패시브의 전투 뒤 회복(식품공학과) — 게이트 안에서만. 부서진 장비를 뺀 최대 체력까지 */
    if(G.mode==="run"){
      const add=passivesOf(a.ref).reduce((s,v)=>s+(v.after||0),0);
      if(add)a.ref.hp=Math.min(derive(a.ref).maxHp,a.ref.hp+add);
    }
  }
  /* 유품 — 사망자의 장비와 배낭이 바닥에 남는다 */
  const relic=[];
  if(dead.length){
    G.deaths+=dead.length;
    for(const d of dead){
      logAdd(d,`${G.day}일차 ${G.here?G.here.n:"게이트"}에서 사망`);
      G.memorial.push({name:d.name,face:d.face||null,sex:d.sex||"m",lvl:d.lvl,stats:{...d.stats},
        gear:{...d.gear},where:G.here?G.here.n:"게이트",day:G.day,
        gate:G.gateName||"정문 게이트",log:(d.log||[]).slice()});
      for(const s of SLOTS)if(d.gear[s.k]){relic.push(d.gear[s.k]);d.gear[s.k]=null}
      for(const id of d.bag)relic.push(id);
      d.bag=[];
      /* 이고 있던 탄약은 온전한 뭉치만 남습니다 — 흩어진 것은 줍지 못합니다 */
      for(const t of Object.keys(AMMO_ID)){
        for(let k=Math.floor(roundsOf(d,t)/ammoQty(t));k>0;k--)relic.push(AMMO_ID[t]);
        if(d.ammo)d.ammo[t]=0;
      }
    }
    G.roster=G.roster.filter(r=>!dead.includes(r));
    /* 게이트 안의 파티는 살아남은 사람뿐입니다 — 밖에 있던 사람이 빈자리를 채우지 않게 */
    for(const r of G.roster)r.inParty=alive.some(a=>a.ref===r);
  }
  /* 게이트마다 몇 일차까지 치렀는지, 어떤 보스를 넘겼는지 적어 둡니다 —
     학생회장의 의뢰와 매점의 활 해금이 이 장부를 봅니다 */
  if(G.mode==="run"){
    G.gateDay=G.gateDay||{};
    G.gateDay[G.gate]=Math.max(G.gateDay[G.gate]||0,G.day);
    G.bossKilled=G.bossKilled||{};
    for(const f of B.foes)if(f.boss)G.bossKilled[f.key]=true;
    G.cicadaKills=(G.cicadaKills||0)+B.foes.filter(f=>f.key==="cicada"&&f.hp<=0).length;
    G.beetleKills=(G.beetleKills||0)+B.foes.filter(f=>f.key==="beetle"&&f.hp<=0).length;
  }
  /* 마지막 날의 보스를 넘겼다 — 이 게이트는 여기서 끝난다 */
  if(G.mode==="run"&&G.day>=gateOf().days&&B.foes.some(f=>f.boss))G.gateClear=true;
  /* 복수전공 해금 — 서로 다른 네 전공이 살아서 10일차를 넘긴 순간 한 번만 */
  if(G.mode==="run"&&!G.dualOpen&&G.day>=DUAL_DAY&&alive.length>=DUAL_PARTY
     &&new Set(alive.flatMap(a=>majorsOf(a.ref))).size>=DUAL_PARTY){
    G.dualOpen=true;
    popup("복수전공",
      `서로 다른 네 전공이 한자리에서 ${DUAL_DAY}일차를 넘겼습니다.<br><br>
       행정실에서 전공을 하나 더 얹을 수 있습니다.`);
  }
  const found=G.mode==="tutorial"?[]:rollLoot(G.here,G.day);   // 탄약도 바닥에 그대로 놓입니다
  /* 탄약이 떨어져 내려놓은 총·활(B.drops)도 바닥에 남습니다 */
  G.ground=[...found.map(id=>({id,src:"수확"})),...(B.drops||[]).map(id=>({id,src:"수확"})),...relic.map(id=>({id,src:"유품"}))];
  /* 사마귀 앞발 — 의뢰를 받은 동안, 사마귀를 넘긴 자리에 한 번만 남습니다.
     이미 하나를 가지고 있으면(어디에 있든) 더 나오지 않습니다 */
  if(G.mode==="run"&&G.armQ===1&&!G.armDrop&&!hasArm()&&B.foes.some(f=>f.boss&&f.key==="mantis")){
    G.armDrop=true;G.ground.push({id:ARM,src:"수확"});
  }
  /* 매미의 날개 — 의뢰를 받은 뒤부터(끝낸 뒤에도) 쓰러뜨린 매미마다 하나씩 */
  if(G.mode==="run"&&G.wingQ>=1)
    for(const f of B.foes)if(f.key==="cicada"&&f.hp<=0)G.ground.push({id:WING,src:"수확"});
  /* 투구뿔 — 같은 식으로, 쓰러뜨린 장수풍뎅이마다 하나씩 */
  if(G.mode==="run"&&G.hornQ>=1)
    for(const f of B.foes)if(f.key==="beetle"&&f.hp<=0)G.ground.push({id:HORN,src:"수확"});
  /* 보스를 넘긴 자리에는 불을 피울 거리가 남습니다. 게이트가 닫히는 날은 밖으로
     밀려나므로 쉴 밤이 없습니다. 챙겨 가는 사람이 있어야 캠프파이어가 열립니다. */
  if(G.mode==="run"&&!G.gateClear&&B.foes.some(f=>f.boss)){
    G.ground.push({id:"campkit",src:"수확"});
  }
  /* 응급 키트는 게이트 안에서 어둠 에너지에 먹힙니다 — 전투 한 번마다 굴립니다 */
  if(G.mode==="run"){
    let rot=0;
    for(const a of alive){const r=a.ref;if(!r)continue;
      r.bag.forEach((id,i)=>{if(id==="medkit"&&Math.random()<KIT_ROT){r.bag[i]="medkitD";rot++}})}
    if(rot){markSeen("medkitD");
      popup("응급 키트","응급 키트 아이템이 어둠 에너지에 침식되었습니다.")}
  }
  /* 수습한 탄약도 바닥으로. 정산 화면에 적을 몫은 합치기 전에 세어 둡니다 */
  const salv=salvageAmmo(alive), salvSum={};
  for(const g of salv){salvSum[g.id]=(salvSum[g.id]||0)+g.n;G.ground.push(g)}
  mergeGroundAmmo();
  const ammoGot=Object.entries(salvSum).map(([id,n])=>`${ITEMS[id].n} ${n}발`);
  G.night=false;
  const results=grantExp(alive.map(a=>a.ref),exp);
  for(const r of results)r.hp0=hp0.has(r.p)?hp0.get(r.p):r.p.hp;
  G.lastGain={exp,results,dead,broke,ammoGot,
              boss:(B.foes.find(f=>f.boss)||{}).name||null,found:found.length,relic:relic.length};
  G.scene="reward";render();
}

/* ═══════════ 배낭·장비 조작 ═══════════ */
/* ─── 탄약 ───
   탄약은 본부에 쌓이지 않고 사람이 배낭에 이고 다닙니다. 한 칸이 한 뭉치이고,
   뭉치 크기는 ITEMS[…].qty 입니다 — 권총 탄약 12발들이면 13발은 두 칸을 씁니다.
   밸런스는 이 뭉치 크기로 잡습니다. */
const AMMO_ID={pistol:"ammoP",shotgun:"ammoS",rifle:"ammoR",arrow:"ammoA"};
const EMPTY_AMMO=()=>({pistol:0,shotgun:0,rifle:0,arrow:0});
const ammoQty=t=>ITEMS[AMMO_ID[t]].qty;
const roundsOf=(p,t)=>(p&&p.ammo&&p.ammo[t])||0;
const ammoSlots=p=>Object.keys(AMMO_ID).reduce((n,t)=>n+Math.ceil(roundsOf(p,t)/ammoQty(t)),0);
const bagRoom=p=>bagMax(p)-p.bag.length-ammoSlots(p);
/* 뭉치별 남은 발수 — 마지막 뭉치만 덜 찹니다. 배낭 화면이 한 줄씩 그립니다 */
function ammoStacks(p,t){
  const q=ammoQty(t),out=[];
  for(let left=roundsOf(p,t);left>0;left-=q)out.push(Math.min(q,left));
  return out;
}
/* 지금 뭉치의 빈 자리부터 채우고, 넘치면 새 칸을 씁니다.
   ammoFree — 지금 더 이고 갈 수 있는 발수. 전투 뒤 탄약 수습이 이 값만큼만 챙깁니다 */
const ammoFree=(p,t)=>{
  const q=ammoQty(t),cur=roundsOf(p,t);
  return (Math.ceil(cur/q)*q-cur)+Math.max(0,bagRoom(p))*q;
};
const ammoFits=(p,t,n)=>ammoFree(p,t)>=n;
function giveAmmo(p,t,n){
  if(!p.ammo)p.ammo=EMPTY_AMMO();
  if(!ammoFits(p,t,n))return false;
  p.ammo[t]=roundsOf(p,t)+n;
  G.gunSeen[t]=true;markSeen(AMMO_ID[t]);
  return true;
}
/* 이 사람이 이걸 받을 수 있는가 — 탄약은 뭉치가 들어갈 자리가 있는지로 봅니다 */
function canTake(p,id){
  const it=ITEMS[id];
  return it.kind==="ammo"?ammoFits(p,it.ammo,it.qty):bagRoom(p)>0;
}
function giveItem(p,id){
  const it=ITEMS[id];
  if(it.kind==="ammo")return giveAmmo(p,it.ammo,it.qty);
  if(bagRoom(p)<=0)return false;
  if(it.ammo)G.gunSeen[it.ammo]=true;
  markSeen(id);tipInstItem(id);p.bag.push(id);return true;
}
/* 지금 이 사람의 그 칸이 비어 있어 바로 입힐 수 있는가 */
/* 활·총(탄약을 쓰는 오른손 무기)은 양손 무기입니다 — 들고 있는 동안 왼손은 비어 있어야 합니다 */
const twoHand=id=>{const it=ITEMS[id];return !!(it&&it.slot==="rh"&&it.ammo)};
/* 저절로 입히는 길(매점·창고·건네기)은 반대편 손을 건드리지 않습니다 — 막히면 배낭으로 갑니다 */
const handClash=(p,id)=>{const it=ITEMS[id];
  return !!(it&&((twoHand(id)&&p.gear.lh)||(it.slot==="lh"&&twoHand(p.gear.rh))))};
const canWearNow=(p,id)=>{const it=ITEMS[id];
  return !!(p&&it&&it.slot&&!p.gear[it.slot]&&canUse(p,it)&&!handClash(p,id))};
/* 물건을 사람에게 건네는 한 길목 —
   ① 입을 수 있고 그 칸이 비었으면 배낭을 거치지 않고 그 자리에서 입힙니다
   ② 아니면 배낭에 넣습니다.
   둘 다 안 되면 아무것도 바꾸지 않고 null 을 돌려줍니다. */
function handTo(p,id){
  if(canWearNow(p,id)){
    const it=ITEMS[id];
    if(tryGear(p,()=>{p.gear[it.slot]=id})){markSeen(id);tipInstItem(id);return "wear"}
  }
  if(p&&canTake(p,id)&&giveItem(p,id))return "bag";
  return null;
}
/* 매점에서 산 물건을 어디에 둘지 —
   판매대 위에서 고른 사람(to)에게 먼저 갑니다. 입을 수 있으면 바로 입히고, 아니면 배낭.
   배낭에도 자리가 없으면 창고. to 가 없으면 혼자 나가는 판에서만 그 한 사람에게 갑니다. */
function buyTo(id,to){
  const t=party(), r=to||(t.length===1?t[0]:null);
  const w=r?handTo(r,id):null;
  if(!w){G.store[id]=(G.store[id]||0)+1;markSeen(id)}
  const it=ITEMS[id];
  if(it.ammo&&G.gunSeen)G.gunSeen[it.ammo]=true;   /* 총·활을 사면 그 탄약이 판매대에 오릅니다 */
  return w||"store";
}
/* 바닥의 탄약 더미 — 이고 갈 수 있는 만큼만 챙기고, 남는 것은 그대로 바닥에 둡니다.
   배낭 안에서는 같은 탄약이 한 뭉치로 모이므로(p.ammo[종류]) 쓰던 뭉치의 빈 자리부터 찹니다. */
function takeAmmoPile(p,gd){
  const t=ITEMS[gd.id].ammo, have=gd.n===undefined?ammoQty(t):gd.n;
  const n=Math.min(have,ammoFree(p,t));
  if(n<=0)return 0;
  giveAmmo(p,t,n);
  gd.n=have-n;
  return n;
}
/* 바닥의 이 줄을 조금이라도 가져갈 수 있는가 — 탄약은 한 발이라도 들어가면 참입니다 */
function canTakeGround(p,gd){
  const it=ITEMS[gd.id];
  return it.kind==="ammo"?ammoFree(p,it.ammo)>0:canTake(p,gd.id);
}
function takeAllGround(list){
  for(const p of list){
    /* 자리가 없어 못 드는 것은 건너뛰고 다음 것을 봅니다 — 탄약과 물건이 섞여 있어서입니다 */
    /* 칸이 비어 입을 수 있는 것은 바로 입힙니다(handTo) */
    for(let i=0;i<G.ground.length;){
      const gd=G.ground[i], it=ITEMS[gd.id];
      if(it.kind==="ammo"){
        takeAmmoPile(p,gd);
        if(gd.n<=0)G.ground.splice(i,1);else i++;
        continue;
      }
      if(handTo(p,gd.id)){if(it.ammo)G.gunSeen[it.ammo]=true;noteGot(gd.id);G.ground.splice(i,1)}
      else i++;
    }
  }
  G.sel=null;
}
function takeToBag(p,idx){
  const gd=G.ground[idx], it=ITEMS[gd.id];
  /* 탄약은 더미에서 들어가는 만큼만 덜어 갑니다 — 남으면 줄이 그대로 남습니다 */
  if(it.kind==="ammo"){
    if(!takeAmmoPile(p,gd))return false;
    if(gd.n<=0){G.ground.splice(idx,1);G.sel=null}
    return true;
  }
  /* 칸이 비어 입을 수 있으면 바로 입히고, 아니면 배낭으로 */
  if(!handTo(p,gd.id))return false;
  if(it.ammo)G.gunSeen[it.ammo]=true;      // 총을 손에 넣은 시점부터 탄약을 살 수 있다
  noteGot(gd.id);
  G.ground.splice(idx,1);G.sel=null;return true;
}
/* 장비를 바꾸면 최대 체력만큼 현재 체력도 같이 오르내립니다.
   80/100에 체력 +4를 끼면 84/104가 되고, 벗으면 80/100으로 돌아옵니다.
   벗어서 체력이 0 이하가 되는 경우에는 아예 벗지 못하게 막습니다. */
function tryGear(p,fn){
  const g={...p.gear},bag=p.bag.slice(),hp0=p.hp,before=derive(p).maxHp;
  fn();
  const after=derive(p).maxHp,nhp=hp0+(after-before);
  if(nhp<1){p.gear=g;p.bag=bag;p.hp=hp0;return false}
  p.hp=Math.min(nhp,after);
  return true;
}
const GEAR_LOW="체력이 적어 아이템을 해제할 수 없습니다";
const GEAR_MAJ="전공이 적합하지 않습니다";
const GEAR_HANDS="양손 무기라 반대편 손의 장비를 내릴 배낭 자리가 없습니다";
/* 안내창. render() 가 #app 을 갈아엎어도 남도록 body 에 붙입니다.
   lock 을 주면 버튼으로만 닫힙니다 — 닫는 것이 곧 다음 단계일 때 씁니다. */
function popup(title,html,btn,onOk,lock){
  const old=document.querySelector(".pop"); if(old)old.remove();
  const d=document.createElement("div");
  d.className="pop"+(lock?" lock":"");
  d.innerHTML=`<div class="card"><h2>${title}</h2><div class="txt">${html}</div>
    <div class="bar"><span class="tag"></span><button>${btn||"확인"}</button></div></div>`;
  d.querySelector("button").onclick=()=>{d.remove();if(onOk)onOk()};
  document.body.appendChild(d);
  return d;
}
/* 한 판에 한 번만 — 본 기록은 G.tips 에 남고 세이브에 그대로 실립니다 */
function tipOnce(key,title,html,btn){
  G.tips=G.tips||{};
  if(G.tips[key])return;
  G.tips[key]=true;
  popup(title,html,btn);
}
/* 현장 물건을 처음 손에 넣는 순간 — 반출과 무엇이 다른지 그때 알려 줍니다 */
function tipInstItem(id){
  const it=ITEMS[id];
  if(!it||it.kind!=="inst")return;
  tipOnce("inst","현장에서 주운 것",
    `<b style="color:var(--gate)">현장</b> 표시가 붙은 것은 게이트를 나가면 사라집니다.<br><br>
     <b style="color:var(--ok)">반출</b> 표시가 붙은 것만 살아서 나가야 지킬 수 있습니다.<br><br>
     사라질 물건이니 아끼지 말고 쓰십시오.`);
}
/* 화면을 다시 그려도 남도록 body 에 직접 띄웁니다 */
function toast(t){
  const d=document.createElement("div");
  d.className="toast";d.textContent=t;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),2400);
}
/* 성공하면 null, 못 들면 까닭을 돌려줍니다 */
function equipFromBag(p,bagIdx){
  const id=p.bag[bagIdx],it=ITEMS[id];
  if(!it.slot)return null;
  if(!canUse(p,it))return GEAR_MAJ;     // 총기는 전공이 맞아야 든다
  /* 양손 무기를 들면 왼손 것이, 양손 무기를 든 채 왼손을 차면 그 무기가 배낭으로 내려갑니다 */
  const other=handClash(p,id)?(it.slot==="rh"?"lh":"rh"):null;
  if(other&&bagRoom(p)+1-(p.gear[it.slot]?1:0)-1<0)return GEAR_HANDS;
  return tryGear(p,()=>{
    const old=p.gear[it.slot];
    p.bag.splice(bagIdx,1);
    p.gear[it.slot]=id;
    if(old)p.bag.push(old);
    if(other){p.bag.push(p.gear[other]);p.gear[other]=null}
  })?null:GEAR_LOW;
}
/* ─── 어둠 에너지 결정 ───
   그 사람이 지금 지닌 현장 장비(찬 것 + 배낭에 든 것)만 강화 대상입니다.
   이미 강화된 것은 DARK_UP 에 없으므로 두 번 강화되지 않습니다. */
function darkTargets(p,self){
  const out=[];
  for(const s of SLOTS){const id=p.gear[s.k];if(id&&DARK_UP[id])out.push({w:"slot",k:s.k,id,sn:s.n})}
  /* 쓰는 결정 자신은 뺍니다 — 결정 둘이 있으면 서로를 키울 수 있습니다 */
  p.bag.forEach((id,i)=>{if(DARK_UP[id]&&i!==self)out.push({w:"bag",k:i,id,sn:"배낭"})});
  return out;
}
/* 결정 하나로 장비 하나. 같은 칸에 그대로 갈아 끼우므로 벗었다 낄 필요가 없습니다.
   체력 보정이 걸린 장비도 있어 tryGear 로 감쌉니다(문짝 체력 +10 → +16). */
function darkUse(p,bi,gi){
  const c=ITEMS[p.bag[bi]], g=darkTargets(p,bi)[gi];
  if(!c||!c.crystal||!g)return false;
  const nid=darkId(g.id);
  const ok=tryGear(p,()=>{
    if(g.w==="slot")p.gear[g.k]=nid;else p.bag[g.k]=nid;
    p.bag.splice(bi,1);                       /* 자리를 바꾼 뒤에 결정을 뺍니다 */
  });
  if(!ok){toast(GEAR_LOW);return false}
  markSeen(nid);
  toast(`${ITEMS[g.id].n} → ${ITEMS[nid].n}`);
  return true;
}
/* ─── 실습동 ───
   캠퍼스에서 손볼 수 있는 것 — 창고에 있는 것과, 대원이 지금 지닌 반출 장비 전부.
   어둠 에너지 결정(darkTargets)이 한 사람 것만 보는 것과 달리 여기는 전부 모읍니다. */
/* 손보기 전후 수치 — 달라지는 것만 "이전 → 이후" 로 적습니다. 없던 수치는 — */
function upDiff(a,b){
  const pc=v=>`${v<0?"−":"+"}${Math.round(Math.abs(v)*100)}%`, out=[];
  const F=[["atk","공격력",0,v=>`+${v}`],["aspdM","공속",1,v=>pc(v-1)],["rng","사거리",0,v=>`+${v}`],
           ["miss","빗나감",0,v=>`${Math.round(v*100)}%`],["guard","피해",0,v=>`−${v}`],["hp","체력",0,v=>`+${v}`],
           ["dodge","회피",0,v=>`${v<0?"−"+(-v):"+"+v}%`],["crit","치명",0,v=>`+${v}%`]];
  for(const [k,n,base,f] of F){
    const x=a[k]==null?base:a[k], y=b[k]==null?base:b[k];
    if(x===y)continue;
    if(k==="atk"&&b.fall)continue;   /* 산탄총처럼 거리별 위력이 있는 것은 아래 '거리별' 줄로만 적습니다 */
    out.push(`${n} ${x===base?"—":f(x)} → <b class="du">${y===base?"—":f(y)}</b>`);
  }
  if(b.fall)out.push(`거리별 공격력 ${(a.fall||[]).map(f=>f[1]).join("/")} → <b class="du">${b.fall.map(f=>f[1]).join("/")}</b>`);
  if(JSON.stringify(a.frail||{})!==JSON.stringify(b.frail||{}))out.push(`<b class="du">덜 부서짐</b>`);
  return out.join(" · ");
}
function workTargets(){
  const out=[];
  for(const [id,n] of Object.entries(G.store))
    if(n>0&&WORK_UP[id])out.push({w:"store",id,n,sn:"창고",who:null});
  G.roster.forEach((r,ri)=>{
    for(const s of SLOTS){const id=r.gear[s.k];
      if(id&&WORK_UP[id])out.push({w:"slot",id,ri,k:s.k,sn:s.n,who:r})}
    r.bag.forEach((id,bi)=>{if(WORK_UP[id])out.push({w:"bag",id,ri,k:bi,sn:"배낭",who:r})});
  });
  return out;
}
/* 같은 칸에 그대로 갈아 끼웁니다. 체력 보정이 붙은 장비도 있어 tryGear 로 감쌉니다 */
function workUse(i){
  const t=workTargets()[i];
  if(!t)return false;
  const cost=workCost(t.id), nid=workId(t.id);
  if(G.gold<cost)return false;
  if(t.w==="store"){
    G.store[t.id]--; if(G.store[t.id]<=0)delete G.store[t.id];
    G.store[nid]=(G.store[nid]||0)+1;
  }else{
    const r=G.roster[t.ri];
    const ok=tryGear(r,()=>{if(t.w==="slot")r.gear[t.k]=nid;else r.bag[t.k]=nid});
    if(!ok){toast(GEAR_LOW);return false}
  }
  G.gold-=cost;markSeen(nid);
  toast(`${ITEMS[t.id].n} → ${ITEMS[nid].n}`);
  return true;
}
/* 소모품 — 응급 키트(kit)는 최대 체력의 몇 %, 먹을 것은 정해진 만큼 채웁니다.
   식품공학과 스킬은 먹을 것에만 걸립니다. */
/* 기운이 붙은 것은 체력이 가득해도 쓸 수 있습니다 — 그러라고 있는 물건입니다 */
const useAnytime=it=>!!(it.use&&(it.use.buff||it.use.share||it.use.bag));
function useItem(p,bi){
  const it=ITEMS[p.bag[bi]];
  if(!it||!it.use)return;
  /* 배낭 확장 주머니 — 체력과 상관없이, 아직 안 늘린 사람만 */
  if(it.use.bag){
    if(p.bagPlus)return;
    p.bag.splice(bi,1);p.bagPlus=true;
    logAdd(p,"배낭 확장 주머니로 배낭+");
    popup("배낭+",`${p.name}의 배낭이 한 칸 늘었습니다. (${bagMax(p)}칸)`);
    return;
  }
  const m=derive(p).maxHp;
  if(p.hp>=m&&!useAnytime(it))return;
  const heal=n=>Math.round(n*(it.kit?1:1+(FOOD_HEAL[foodLv()]-1)*foodRate()));
  let amt=it.use.pct?Math.round(m*it.use.pct):heal(it.use.hp);
  /* 상한 것 — 회복 대신 앓습니다. 이걸로 죽지는 않습니다 */
  let spoiled=false;
  if(it.use.risky&&Math.random()<it.use.risky.q){spoiled=true;amt=it.use.risky.hp}
  p.hp=Math.max(1,Math.min(m,p.hp+amt));
  p.bag.splice(bi,1);
  /* 소주 — 철학과 해금 기록을 남깁니다 */
  if(it.use.soju)G.sojuDrunk=true;
  /* 상한 것은 기운도 남기지 않습니다 */
  if(it.use.buff&&!spoiled)addBuff(p,it.use.buff);
  /* 나눠 마시는 것 — 파티 전원이 같이 받습니다 */
  if(it.use.share&&!spoiled)for(const o of party())if(o!==p){
    const mm=derive(o).maxHp;o.hp=Math.min(mm,o.hp+heal(it.use.share))}
  if(!it.kit){
    /* 식품공학과 해금 — 게이트 안에서 응급 키트가 아닌 것으로 회복한 적이 있는가 */
    if(G.mode==="run"&&amt>0)G.foodHeal=true;
    /* 맛있는 불량식품+ — 나눠 먹은 나머지도 조금 낫습니다 */
    if(foodLv()>=2&&!spoiled)for(const o of party())if(o!==p){
      const mm=derive(o).maxHp;o.hp=Math.min(mm,o.hp+Math.round(mm*FOOD_SHARE*foodRate()))}
  }
  if(spoiled)popup("상했다",`${p.name}이(가) ${it.n}을(를) 먹고 배탈이 났습니다. 체력 ${-it.use.risky.hp} 감소.`);
}
function unequip(p,slot){
  const id=p.gear[slot];
  if(!id||bagRoom(p)<=0)return true;
  return tryGear(p,()=>{p.gear[slot]=null;p.bag.push(id)});
}


/* ═══════════ 미니게임 · 거미 잡기 ═══════════
   줄을 타고 내려오는 거미를 화면에서 눌러 잡습니다. 세 마리를 놓치면 끝. */
let AR=null,araf=null,arlast=0,acv,actx,AW=380,AH=470;
/* 요금을 못 내면 기계가 돌지 않습니다 */
function payFee(kind){
  const f=ARCADE_FEE[kind];
  if(G.gold<f)return false;
  G.gold-=f;return true;
}
function arcadeStop(){if(araf)cancelAnimationFrame(araf);araf=null}
function arcadeStart(){
  AR={kind:"spider",score:0,miss:0,t:0,spawn:.5,list:[],pops:[],over:false};
  acv=document.getElementById("acv");actx=acv.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  AW=acv.clientWidth;AH=Math.round(AW*1.22);
  acv.width=AW*dpr;acv.height=AH*dpr;acv.style.height=AH+"px";
  actx.setTransform(dpr,0,0,dpr,0,0);
  const grab=ev=>{
    if(!AR||AR.over)return;
    ev.preventDefault();
    const rc=acv.getBoundingClientRect();
    const pt=ev.touches?ev.touches[0]:ev;
    const mx=pt.clientX-rc.left,my=pt.clientY-rc.top;
    let best=null,bd=1e9;
    for(const s of AR.list){
      const d=Math.hypot(s.x-mx,s.y-my);
      if(d<s.r+16&&d<bd){bd=d;best=s}
    }
    if(best){
      AR.list=AR.list.filter(s=>s!==best);
      AR.score++;
      AR.pops.push({x:best.x,y:best.y,life:.5,t:"+1"});
    }else AR.pops.push({x:mx,y:my,life:.3,t:"헛손질"});
  };
  acv.onmousedown=grab;acv.ontouchstart=grab;
  arlast=0;arloop();
}
function arloop(ts){
  if(!AR){return}
  if(!arlast)arlast=ts||0;
  const dt=Math.min(.05,((ts||0)-arlast)/1000);arlast=ts||0;
  if(AR.kind==="star"){if(!AR.over)starStep(dt);starPaint()}
  else if(AR.kind==="hunt"){if(!AR.over)huntStep(dt);huntPaint()}
  else{if(!AR.over)arstep(dt);arpaint()}
  araf=requestAnimationFrame(arloop);
}
function arstep(dt){
  AR.t+=dt;
  AR.spawn-=dt;
  const gap=Math.max(0.34,0.95-AR.score*0.022);
  if(AR.spawn<=0){
    AR.spawn=gap;
    AR.list.push({x:24+Math.random()*(AW-48),y:-16,
      vy:66+AR.score*2.6+Math.random()*26,r:15,ph:Math.random()*6,sw:0.6+Math.random()*0.9});
  }
  for(const s of AR.list){s.y+=s.vy*dt;s.ph+=dt*3}
  const gone=AR.list.filter(s=>s.y>AH-14);
  if(gone.length){
    AR.miss+=gone.length;
    for(const g of gone)AR.pops.push({x:g.x,y:AH-24,life:.6,t:"놓침"});
    AR.list=AR.list.filter(s=>s.y<=AH-14);
  }
  AR.pops=AR.pops.filter(p=>{p.life-=dt;p.y-=26*dt;return p.life>0});

function arSpider(s){

  actx.save();actx.translate(x+sway*0.15,y);
  actx.strokeStyle="#8E6BD9";actx.lineWidth=2.2;actx.lineCap="round";
  // 다리 여덟 개 — 왼쪽 넷, 오른쪽 넷. 무릎을 위로 세웠다가 바깥으로 내린다
  for(const side of [-1,1]){
    for(let k=0;k<4;k++){
      const yo=(-1.15+k*0.75)*r*0.42;
      const w=Math.sin(s.ph*2.4+k*0.9+(side>0?0:1.6))*r*0.18;
      actx.beginPath();

      actx.lineTo(side*r*2.0,yo+r*0.40+w);

    }
  }
  actx.beginPath();actx.arc(0,-r*0.15,r*0.85,0,7);actx.fillStyle="#8E6BD9";actx.fill();
  actx.beginPath();actx.arc(0,r*0.6,r*0.5,0,7);actx.fillStyle="#B79BEA";actx.fill();
  actx.fillStyle="#2A2A30";
  for(const e of [-.3,-.1,.1,.3]){actx.beginPath();actx.arc(e*r,r*0.52,r*0.1,0,7);actx.fill()}
  actx.restore();
}

const STAR_TIME=45;
function starStart(){
  acv=document.getElementById("acv");actx=acv.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  AW=acv.clientWidth;AH=Math.round(AW*1.28);

  actx.setTransform(dpr,0,0,dpr,0,0);

  const plat=[
    {x:0,y:F,w:AW},

    {x:AW-22-AW*0.32,y:F-104,w:AW*0.32},
    {x:AW/2-AW*0.19,y:F-196,w:AW*0.38},
    {x:16,y:F-288,w:AW*0.27},
    {x:AW-16-AW*0.29,y:F-288,w:AW*0.29},
    {x:AW/2-AW*0.16,y:F-378,w:AW*0.32},
  ];
  AR={kind:"star",score:0,t:STAR_TIME,over:false,plat,stars:[],pops:[],
      p:{x:AW/2,y:F-20,vx:0,vy:0,w:15,h:22,ground:true,face:1,squash:0},
      touch:null};
  for(let i=0;i<3;i++)spawnStar();
  let downT=0,downX=0,downY=0,moved=0;
  const at=ev=>{
    const rc=acv.getBoundingClientRect();
    const pt=ev.touches&&ev.touches[0]?ev.touches[0]:ev;
    return{x:pt.clientX-rc.left,y:pt.clientY-rc.top};
  };
  const start=ev=>{
    if(!AR||AR.over)return;
    if(ev.cancelable)ev.preventDefault();
    const q=at(ev);downT=Date.now();downX=q.x;downY=q.y;moved=0;
    AR.drag=true;AR.touch=q.x;
  };
  const move=ev=>{
    if(!AR||AR.over||!AR.drag)return;
    if(ev.cancelable)ev.preventDefault();
    const q=at(ev);
    moved=Math.max(moved,Math.hypot(q.x-downX,q.y-downY));
    AR.touch=q.x;
  };
  const end=ev=>{
    if(!AR||AR.over)return;
    // 짧게 톡 치면 점프. 끌었으면 이동으로만 친다
    if(Date.now()-downT<260&&moved<14)starJump();
    AR.drag=false;AR.touch=null;
  };
  acv.addEventListener("touchstart",start,{passive:false});
  acv.addEventListener("touchmove",move,{passive:false});
  acv.addEventListener("touchend",end);
  acv.addEventListener("touchcancel",end);
  acv.addEventListener("mousedown",start);
  acv.addEventListener("mousemove",move);
  acv.addEventListener("mouseup",end);
  acv.addEventListener("mouseleave",end);

}

function starJump(){
  if(!AR||AR.kind!=="star"||AR.over)return;

  // 발판을 막 벗어난 직후에도 잠깐은 뛸 수 있게 (코요테 타임)
  if(AR.p.ground||AR.p.coyote>0){

function huntStep(dt){

function huntZombie(z){

const pctOf=(e,l)=>l>=MAX_LV?100:Math.max(0,Math.min(100,e/nextExp(l)*100));

/* 막대·숫자를 한 프레임씩 굴린다. 레벨업(wrap)이면 100까지 채웠다가 0에서 이어 채운다 */
function playGain(root,alive){
  const rt=root||el, live=alive||(()=>G.scene==="reward");
  const bars=[...rt.querySelectorAll("i[data-anim]")].map(n=>
    ({n,from:+n.dataset.from,to:+n.dataset.to,wrap:n.dataset.wrap==="1"}));
  const cnts=[...rt.querySelectorAll("[data-cnt]")].map(n=>
    ({n,from:+n.dataset.from,to:+n.dataset.to}));
  if(!bars.length&&!cnts.length)return;
  const DUR=900, t0=performance.now(), ease=x=>1-Math.pow(1-x,3);
  (function step(now){
    if(!live())return;                            // 화면을 떠났으면 그만
    const k=Math.min(1,(now-t0)/DUR), e=ease(k);
    for(const b of bars){
      let w;
      if(!b.wrap) w=b.from+(b.to-b.from)*e;
      else{ const first=100-b.from, got=(first+b.to)*e; w=got<first?b.from+got:got-first; }
      b.n.style.width=Math.max(0,Math.min(100,w))+"%";
    }
    for(const c of cnts) c.n.textContent=Math.round(c.from+(c.to-c.from)*e);
    if(k<1)requestAnimationFrame(step);
  })(t0);
}
