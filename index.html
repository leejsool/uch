<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniverCityHunter</title>
<style>
  :root{
    --bg:#1B1726;--panel:#2A2340;--panel2:#352C4E;--line:#4A3F69;
    --ink:#EAE6F2;--dim:#968CB0;--gate:#D8477E;--mark:#F2D74E;--ok:#6BD98F;--cy:#4FC3D9;--bad:#C87878;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;
    font-family:'Pretendard','Apple SD Gothic Neo',system-ui,'Malgun Gothic',sans-serif;
    padding:12px 12px calc(14px + env(safe-area-inset-bottom));}
  #app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
  .logo{font-size:19px;font-weight:800;letter-spacing:-.03em}
  .logo em{font-style:normal;color:var(--gate)}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tag{font-size:12px;color:var(--dim)}
  .tag b{color:var(--mark)}
  button{font-family:inherit;font-size:14px;font-weight:700;background:transparent;color:var(--mark);
    border:1px solid var(--mark);border-radius:3px;padding:10px 16px;cursor:pointer;transition:background .12s}
  button:hover:not(:disabled),button:focus-visible{background:var(--mark);color:var(--bg)}
  button.ghost{color:var(--dim);border-color:var(--line);font-weight:600}
  button.ghost:hover:not(:disabled),button.ghost:focus-visible{background:var(--line);color:var(--ink)}
  button:disabled{opacity:.3;cursor:not-allowed;background:transparent!important;color:var(--dim)!important;border-color:var(--line)!important}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:15px}
  .card h2{font-size:17px;font-weight:800;margin-bottom:7px}
  .card p{font-size:13.5px;color:var(--dim);line-height:1.75}

  /* 오프닝 — 배경 그림 위에 나레이션이 쌓입니다. 그림은 INTRO_ART에 경로만 넣으면 됩니다 */
  #intro{position:relative;min-height:min(62vh,560px);display:flex;flex-direction:column;justify-content:flex-end;
    background:var(--panel);background-size:cover;background-position:center 28%;
    border:1px solid var(--line);border-radius:4px;padding:20px;overflow:hidden}
  #intro .scrim{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(20,17,32,.20) 0%,rgba(20,17,32,.45) 38%,rgba(20,17,32,.90) 78%,rgba(20,17,32,.97) 100%)}
  #intro .lines{position:relative;display:flex;flex-direction:column;gap:13px}
  #intro .ln{font-size:14.5px;line-height:1.9;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  #intro .ln.q{color:var(--dim);font-size:13.5px}
  .cursor{display:inline-block;width:7px;height:16px;background:var(--gate);vertical-align:-2px;animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:0}}

  .stat{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
    border-radius:3px;padding:9px 11px;margin-bottom:5px}
  .stat.locked{opacity:.5}
  .stat .nm{flex:1;font-size:13.5px;font-weight:700}
  .stat .nm span{display:block;font-size:11px;font-weight:400;color:var(--dim);margin-top:2px}
  .stat .vl{font-size:16px;font-weight:800;color:var(--mark);min-width:28px;text-align:center}
  .stat button{padding:5px 11px;font-size:15px;line-height:1}
  .derived{font-size:12px;color:var(--dim);line-height:1.8;padding:2px}
  .derived b{color:var(--ink);font-weight:700}

  .place{width:100%;text-align:left;font-family:inherit;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gate);
    border-radius:3px;padding:13px;margin-bottom:7px;cursor:pointer;font-weight:400}
  .place:hover,.place:focus-visible{background:var(--panel2);color:var(--ink)}
  .place h3{font-size:15px;font-weight:800;margin-bottom:4px}
  .place p{font-size:12.5px;color:var(--dim);line-height:1.6}
  .place .risk{font-size:11.5px;color:var(--mark);margin-top:5px;display:block}
  /* 그 장소에서 나올 만한 것. 손에 넣어 본 적 없는 것은 ?? 로 남습니다 */
  .place .finds{font-size:11px;color:var(--dim);margin-top:4px;display:block;line-height:1.7}
  .place .finds i{font-style:normal;border:1px solid var(--line);border-radius:3px;padding:1px 5px;
    margin:0 3px 3px 0;display:inline-block}
  .place .finds .kn{color:var(--ink);border-color:var(--mark)}
  .place .finds .unk{color:var(--dim);opacity:.65}

  .loot{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .item{flex:1 1 30%;min-width:100px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;
    padding:9px;font-size:12.5px;font-weight:700;text-align:left;line-height:1.4;color:var(--dim)}
  .item small{display:block;font-weight:400;font-size:11px;color:var(--dim);margin-top:3px}
  .item.art{text-align:left;padding:10px;display:flex;align-items:center;gap:12px}
  .item.art .bigart{width:64px;height:64px;flex:0 0 64px;margin:0;
    background:#241E36;border-radius:4px;padding:3px}
  .loot .item{flex:1 1 100%}
  .item.equip{cursor:pointer;border-color:var(--cy);color:var(--ink);font-family:inherit}
  .item.equip.on{border-color:var(--mark);background:#463A5F}

  .fac{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
    border-radius:3px;padding:12px;margin-bottom:6px;width:100%;text-align:left;
    font-family:inherit;color:var(--ink);cursor:pointer}
  .fac.lock{opacity:.45;cursor:not-allowed}
  .fac.hot{border-color:var(--mark)}
  .fac .ic{width:34px;height:34px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);
    display:grid;place-items:center;font-size:15px;flex:0 0 auto}
  .fac .tx{flex:1}
  .fac .tx b{display:block;font-size:14.5px;font-weight:800}
  .fac .tx span{font-size:11.5px;color:var(--dim);font-weight:400}
  .fac .tx i{font-style:normal;color:var(--mark)}

  .app{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cy);
    border-radius:3px;padding:12px;margin-bottom:7px}
  .app.out{border-left-color:var(--line);opacity:.5}
  .app.sel{border-left-color:var(--mark)}
  /* 얼굴을 왼쪽에 띄우고, 이름과 두 막대가 그 오른쪽으로 흐릅니다 */
  .app .hd{display:flex;align-items:center;gap:8px;margin-bottom:2px;min-height:30px}
  .app .hd b{flex:1 1 auto}
  .app:after{content:"";display:block;clear:both}
  .pf{float:left;width:72px;height:72px;margin:0 11px 7px 0;border-radius:6px;object-fit:cover;
    border:1px solid var(--line);background:#241E36}
  .pf.none{display:block;border-style:dashed}
  /* 막대와 그 아래 글자는 한 덩어리로 움직입니다. 따로 놀면 줄이 어긋납니다 */
  .barwrap{overflow:hidden}
  .app .hd,.app .grid,.app .inv,.app .gearline{overflow:hidden}
  .app .grid,.app .inv{clear:both}
  .app .hd b{font-size:15px;font-weight:800}
  .app .hd span{font-size:11.5px;color:var(--dim)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .g{background:var(--panel2);border-radius:3px;padding:6px 7px;font-size:11px;color:var(--dim);line-height:1.4}
  .g b{display:block;font-size:14px;font-weight:800;color:var(--ink);margin-top:1px}
  .g.hi b{color:var(--mark)} .g.lo b{color:var(--bad)} .g.off b{color:var(--dim)}
  .expb{height:5px;background:#221C30;border-radius:3px;overflow:hidden;margin-top:7px}
  .expb i{display:block;height:100%;background:var(--cy)}
  .hpb{height:6px;background:#221C30;border-radius:3px;overflow:hidden;margin-top:6px}
  .hpb i{display:block;height:100%;background:var(--ok)}
  .hpb.low i{background:var(--bad)}
  .gearline{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.6}
  .gearline b{color:var(--ink)}
  .skl{width:100%;text-align:left;font-family:inherit;color:var(--ink);font-weight:400;
    background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:12px;margin-bottom:7px;cursor:pointer}
  .skl:hover,.skl:focus-visible{border-color:var(--mark);background:#463A5F;color:var(--ink)}
  .skl b{display:block;font-size:14.5px;font-weight:800;margin-bottom:3px}
  .skl span{font-size:12px;color:var(--dim)}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--mark)}

  .buyrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:10px;margin-top:8px}
  .buyrow.tap{cursor:pointer}
  .buyrow.open{border-color:var(--mark);background:#332B4A}
  .buyrow .caret{font-size:11px;color:var(--dim);flex:0 0 auto}
  .buyrow b{font-size:14px}
  .buyrow button{padding:7px 12px;font-size:12.5px;white-space:nowrap;position:relative}
  /* 눌렀다는 것이 보이도록 — 버튼이 한 번 눌리고 값이 위로 떠오릅니다 */
  @keyframes tapPulse{0%{transform:scale(1)}30%{transform:scale(.90)}100%{transform:scale(1)}}
  @keyframes costFly{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}
    18%{opacity:1;transform:translate(-50%,0) scale(1)}
    100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
  @keyframes tapRing{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
  .tapped{animation:tapPulse .26s ease;border-color:var(--mark)!important;color:var(--mark)!important}
  .tapring{position:absolute;inset:-2px;border-radius:4px;border:2px solid var(--mark);
    pointer-events:none;animation:tapRing .42s ease-out forwards}
  .costfly{position:absolute;left:50%;top:-4px;font-size:13px;font-weight:700;
    color:var(--bad);pointer-events:none;white-space:nowrap;z-index:5;
    text-shadow:0 1px 3px #000;animation:costFly .95s ease-out forwards}
  .costfly.plus{color:var(--ok)}
  /* 못 하는 까닭을 알리는 짧은 알림 — 화면을 다시 그려도 남습니다 */
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes toastOut{to{opacity:0;transform:translate(-50%,-8px)}}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,0);z-index:60;
    background:#3B2C3E;border:1px solid var(--bad);color:var(--ink);
    padding:11px 18px;border-radius:4px;font-size:13.5px;max-width:86vw;text-align:center;
    box-shadow:0 8px 22px rgba(0,0,0,.55);pointer-events:none;
    animation:toastIn .2s ease, toastOut .45s ease 1.9s forwards}
  @keyframes goldBump{0%,100%{transform:scale(1)}35%{transform:scale(1.25);color:var(--mark)}}
  .goldbump{display:inline-block;animation:goldBump .4s ease}
  .pickb{font-size:12px;font-weight:600;padding:6px 11px;border-radius:3px;
    border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer;font-family:inherit}
  .rec{font-size:11.5px;color:var(--dim);line-height:1.75;margin-top:4px}
  .pickb.on{border-color:var(--mark);color:var(--mark);background:#463A5F}
  .kd{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:99px;vertical-align:1px}
  .kd.perm{background:#28402F;color:var(--ok)} .kd.inst{background:#4A2438;color:#F08AB0}
  .kd.junk{background:#3A3450;color:var(--dim)}
  .inv{margin-top:9px} .invh{font-size:11px;color:var(--dim);font-weight:700;margin:8px 0 4px}
  .slot{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);
    border-radius:3px;padding:7px 9px;margin-bottom:4px;flex-wrap:wrap}
  .slot.tap{cursor:pointer}
  .slot.open{border-color:var(--mark);background:#332B4A}
  .slot .caret{font-size:11px;color:var(--dim);flex:0 0 auto;margin-left:auto}
  /* 고른 줄에서만 아래로 펼쳐지는 버튼 묶음 — 장비칸과 판매대가 같이 씁니다 */
  .acts{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px;
    padding-top:8px;border-top:1px solid var(--line)}
  .acts .chips{display:flex;flex-wrap:wrap;gap:5px;margin:0}
  .slot.pick{border-color:var(--mark)}
  .slot .sn{font-size:10.5px;color:var(--dim);min-width:44px;flex:0 0 auto}
  .slot .si{flex:1;font-size:12.5px;font-weight:700;line-height:1.35;min-width:0}
  .slot .si small{display:block;font-weight:400;font-size:10.5px;color:var(--dim);margin-top:1px}
  .slot:not(.has) .si{color:var(--dim);font-weight:400}
  .mv{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .mv .mini{font-size:10.5px;padding:3px 7px;color:var(--cy);border-color:#3C5566}
  .mini{font-size:11px;font-weight:600;padding:5px 9px;border-radius:3px;
    border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-family:inherit;flex:0 0 auto}
  .mini:disabled{opacity:.3} .mini.bad{color:#C87878;border-color:#5A3F4A}
  button.ghost.bad{color:#C87878;border-color:#5A3F4A}
  /* 제목 그림 — 지금은 캔버스로 그립니다. TITLE_ART에 경로를 넣으면 그 그림이 깔립니다 */
  /* 제목 화면 — 세로 그림을 화면 높이에 맞추고 버튼을 그 위에 얹습니다 */
  /* 본진 지도 — 그림 비율을 그대로 지켜야 표지판 자리가 맞습니다 */
  /* 건물 안 — 배경 위에 어두운 막을 덮어 글자가 읽히게 합니다 */
  .bldbg{position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;
    background-size:cover;background-position:center;padding:16px;margin-bottom:2px;
    min-height:min(72vh,660px);display:flex;flex-direction:column;justify-content:center;gap:10px}
  .bldbg:before{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(14,11,24,.30) 0%,rgba(14,11,24,.44) 42%,rgba(14,11,24,.64) 100%)}
  .bldbg>*{position:relative}
  .bldbg .fac{background:rgba(22,18,36,.86);border-color:rgba(255,255,255,.18);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    box-shadow:0 3px 14px rgba(0,0,0,.45)}
  .bldbg .fac .tx b{text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .bldbg h2{margin-bottom:11px;text-shadow:0 2px 6px rgba(0,0,0,.9)}
  #map{position:relative;width:100%;aspect-ratio:941/1672;border:1px solid var(--line);
    border-radius:5px;overflow:hidden;background:#1B2A3A}
  #map>img{display:block;width:100%;height:100%;object-fit:fill}
  .pin{position:absolute;display:flex;align-items:center;justify-content:center;
    background:none;border:none;padding:0 4px;cursor:pointer;font-family:inherit;
    font-size:13px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1.1;
    text-shadow:0 1px 3px rgba(0,0,0,.75)}
  .pin.lock{color:rgba(255,255,255,.7)}
  .pin:active{transform:scale(.96)}
  .pin.gate{border-radius:999px;animation:pinglow 2.2s ease-in-out infinite}
  @keyframes pinglow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}
    60%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
  /* 그림 조각 — art 표에 이름을 적으면 이 자리에 들어갑니다 */
  .ico{width:19px;height:19px;object-fit:contain;vertical-align:-4px;margin-right:5px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
  .ico.none{display:inline-block;border:1px dashed var(--line);border-radius:3px;filter:none}
  /* 목록 안에서는 그림이 왼쪽을 크게 차지하고 글이 그 오른쪽으로 흐릅니다 */
  .slot .si .ico,.buyrow .ico{float:left;width:44px;height:44px;vertical-align:top;
    margin:1px 10px 3px 0;background:#241E36;border-radius:4px;padding:2px}
  .buyrow .ico{width:48px;height:48px}
  .slot .si,.buyrow>div:first-child{overflow:hidden}
  .bigart{display:block;width:56px;height:56px;object-fit:contain;margin:0 auto 7px;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}
  .bigart.none{border:1px dashed var(--line);border-radius:4px;filter:none}
  .bigico{width:26px;height:26px;object-fit:contain;display:block}
  .face.img{padding:0;background:#221C33}
  .face.img img{width:100%;height:100%;object-fit:cover;border-radius:3px;display:block}
  #titlewrap{position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;
    background:#0E1830;height:calc(100vh - 26px - env(safe-area-inset-bottom));max-height:820px}
  #timg{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 32%}
  #tcv{display:block;width:100%;height:100%}
  #titlewrap .tshade{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;
    background:linear-gradient(180deg,rgba(8,12,26,0) 0%,rgba(8,12,26,.55) 55%,rgba(8,12,26,.88) 100%)}
  #titlewrap .cap{position:absolute;left:0;right:0;bottom:82px;padding:0 18px;text-align:center;pointer-events:none}
  #titlewrap .cap b{display:block;font-size:21px;font-weight:800;letter-spacing:.3px;
    text-shadow:0 2px 8px rgba(0,0,0,.9)}
  #titlewrap .cap span{font-size:11.5px;color:#C8C2D8;text-shadow:0 1px 4px rgba(0,0,0,.9)}
  #play{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);
    padding:14px 46px;font-size:16px;font-weight:800;letter-spacing:.6px;color:#fff;
    border-radius:999px;border:1.5px solid rgba(255,255,255,.6);
    background:rgba(16,26,54,.66);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    box-shadow:0 5px 22px rgba(0,0,0,.55);animation:playpulse 2.4s ease-in-out infinite}
  #play:active{transform:translateX(-50%) scale(.96);animation:none}
  @keyframes playpulse{
    0%,100%{box-shadow:0 5px 22px rgba(0,0,0,.55),0 0 0 0 rgba(255,255,255,.30)}
    55%{box-shadow:0 5px 22px rgba(0,0,0,.55),0 0 0 11px rgba(255,255,255,0)}
  }
  .cmp{font-size:11px;color:var(--dim);line-height:1.7;margin-top:6px;
    border-top:1px dashed var(--line);padding-top:5px}
  .cmp b{color:var(--ink)}
  .du{color:var(--ok);font-weight:700} .dd{color:var(--bad);font-weight:700}
  /* ── NPC · 얼굴 자리는 .face 하나뿐입니다. 나중에 <img>나 <canvas>로 갈아끼우면 됩니다 ── */
  .npc{display:flex;align-items:center;gap:12px;margin-bottom:11px}
  .face{width:74px;height:74px;flex:0 0 auto;border-radius:4px;border:1px solid var(--line);
    background:linear-gradient(160deg,#3B3157,#2A2340);display:grid;place-items:center;font-size:32px}
  .face.sm{width:38px;height:38px;font-size:18px;border-radius:3px}
  .npc .who b{display:block;font-size:15.5px;font-weight:800}
  .npc .who span{font-size:11.5px;color:var(--dim)}
  .say{font-size:14px;line-height:1.85;color:var(--ink)}
  .say:before{content:'\201C';color:var(--gate);margin-right:2px}
  .say:after{content:'\201D';color:var(--gate);margin-left:2px}
  .npcbar{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--gate);border-radius:3px;padding:9px 11px}
  .npcbar .line{flex:1;min-width:0}
  .npcbar .line b{display:block;font-size:12px;font-weight:800;color:var(--mark)}
  .npcbar .line span{font-size:12px;color:var(--dim);line-height:1.5}
  #acv{cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:none}
  #jump{touch-action:manipulation;user-select:none}
  canvas{width:100%;display:block;background:#12101A;border:1px solid var(--line);border-radius:4px;touch-action:manipulation}
  #feed{font-size:12px;color:var(--dim);line-height:1.7;min-height:56px}
  #feed div:last-child{color:var(--ink)}

function rollLoot(place,day){
  const out=[];
  const jn=1+((Math.random()<0.45)?1:0);
  for(let i=0;i<jn;i++) out.push(pick(place.junk));
  let gn=(Math.random()<0.55?1:0)+(Math.random()<0.25+place.risk*0.1?1:0)+(day>=3&&Math.random()<0.3?1:0);
  for(let i=0;i<gn;i++) out.push(pick(place.gear));
  if(place.special&&Math.random()<place.special.chance) out.push(pick(place.special.ids));
  if(place.ammo){
    const a=place.ammo, ids=a.ids||a;
    let n=(a.base!==undefined)?a.base:1;
    for(const q of (a.extra||[0.5])) if(Math.random()<q) n++;
    for(let i=0;i<n;i++) out.push(pick(ids));
  }
  return out;
}

const skillOf=k=>INSTANTS.find(s=>s.k===k);
/* 지금까지 쌓인 갈래별 수치. 상위 스킬이 선행을 대체하므로 겹쳐 세지 않습니다 */
function branchSum(){
  const t={};
  for(const s of G.instants)if(!s.maj&&s.br)t[s.br]=(t[s.br]||0)+(s.v||0);
  return t;
}
/* 오늘 나올 수 있는 카드
   · 전공 스킬은 그 전공 대원이 파티에 있을 때만
   · 상위 스킬은 선행 스킬을 가졌을 때만
   · 인내·숙련은 갈래 수치가 찼을 때만 */
function skillPool(){
  const majs=new Set((G.mode==="tutorial"?[G.player]:party()).map(r=>r.major).filter(Boolean));
  const have=new Set(G.instants.map(s=>s.k));
  /* 상위 스킬로 갈아탄 뒤 아래 단계가 다시 나오면 안 됩니다 */
  const past=new Set();
  for(const s of G.instants){let u=s.up;while(u){past.add(u);u=(skillOf(u)||{}).up}}
  const t=branchSum();
  return INSTANTS.filter(s=>{
    if(s.maj&&!majs.has(s.maj))return false;
    if(have.has(s.k)||past.has(s.k))return false;
    if(s.up&&!have.has(s.up))return false;
    if(s.req&&!s.req(t))return false;
    return true;
  });
}
/* 상위 스킬을 고르면 선행 스킬을 밀어내고 그 자리에 들어갑니다 */
function learnSkill(s){
  if(s.up)G.instants=G.instants.filter(x=>x.k!==s.up);
  G.instants.push(s);
}

/* ═══════════ 파생 스탯 ═══════════ */
function worn(p){return SLOTS.map(s=>ITEMS[p.gear[s.k]]).filter(Boolean)}
function derive(p){
  const s=p.stats;
  let atk=2+s.str*0.6,guard=0,hpAdd=0,aspdM=1,spdM=1,dodge=0,critAdd=0;
  for(const it of worn(p)){
    atk+=it.atk||0;guard+=it.guard||0;hpAdd+=it.hp||0;
    dodge+=it.dodge||0;critAdd+=it.crit||0;
    aspdM*=it.aspdM||1;spdM*=it.spdM||1;
  }
  const rh=ITEMS[p.gear.rh];
  return{maxHp:Math.round(20+s.vit*6+hpAdd),atk:+atk.toFixed(1),
    aspd:+((0.50+s.agi*0.05)*aspdM).toFixed(2),
    speed:Math.round((14+s.spd*3)*spdM),guard,
    dodge:+Math.max(0,Math.min(40,dodge+s.spd*DODGE_PER_SPD)).toFixed(1),
    crit:+Math.max(0,s.luk*0.5+critAdd).toFixed(1),
    style:rh?rh.style:"swing",dmg:rh?rh.dmg:DMG.BLUNT,rng:rh&&rh.rng?rh.rng:0};
}
function emptyGear(){const g={};SLOTS.forEach(s=>g[s.k]=null);return g}
/* 착용한 것을 전부 벗겨 매점 창고로 보냅니다. 배낭은 5칸뿐이라 창고로 갑니다. */
function stripGear(p){
  let n=0,kept=0;
  for(const sl of SLOTS){
    const id=p.gear[sl.k];
    if(!id)continue;
    /* 체력이 모자라 못 벗는 것은 그대로 둡니다 */
    if(!tryGear(p,()=>{p.gear[sl.k]=null})){kept++;continue}
    G.store[id]=(G.store[id]||0)+1;n++;
  }
  return{moved:n,kept:kept};
}
function logAdd(p,t){if(!p.log)p.log=[];p.log.push(t);if(p.log.length>24)p.log.shift()}

function rollStudent(){
  const keys=STATS.map(s=>s.k),st={};
  keys.forEach(k=>st[k]=10);
  for(let i=0;i<14;i++){
    const a=keys[(Math.random()*6)|0],b=keys[(Math.random()*6)|0];
    if(a!==b&&st[a]>6&&st[b]<15){st[a]--;st[b]++}
  }
  const d=[-1,0,0,0,1][(Math.random()*5)|0];
  if(d){const k=keys[(Math.random()*6)|0];st[k]=Math.max(6,Math.min(15,st[k]+d))}
  const nm=randName();
  const s={name:nm.name,sex:nm.sex,face:pickFace(nm.sex,st),
           lvl:1,exp:0,major:null,stats:st,gear:emptyGear(),bag:[],
           points:0,inParty:true,log:[]};
  s.hp=derive(s).maxHp;
  return s;
}

function openFacility(id){
  const dest=FAC_SCENE[id]||"soon";
  G.soonName=id;G.appraisal=null;G.stripMsg=null;G.mapMsg=null;
  if(!NPCS[id]){G.scene=dest;render();return}
  if(G.metNpc[id]){
    G.npcSay=pick(NPCS[id].again);G.npcSayFor=id;G.scene=dest;render();return;
  }
  G.talkFor=id;G.talkLine=0;G.talkNext=dest;G.scene="talk";render();
}

const topStat=st=>Object.keys(st).reduce((a,b)=>st[b]>st[a]?b:a);
const isAnon=f=>f===FACE_ART.anon.m||f===FACE_ART.anon.f;
/* 이미 나간 초상은 다시 주지 않습니다.
   지원자 명단에 걸려 있는 것도 그동안은 빼둡니다(같은 얼굴 셋이 나란히 서지 않게). */
function facesTaken(){
  const t=new Set((G&&G.facesUsed)||[]);
  for(const r of (G&&G.applicants)||[])if(r&&r.face)t.add(r.face);
  return t;
}
function pickFace(sex,st){
  const t=facesTaken();
  const free=a=>(a||[]).filter(f=>!t.has(f));
  const pool=free(FACE_ART[sex+"-"+topStat(st)]);
  const list=pool.length?pool:free(FACE_ART[sex]);
  if(list.length)return list[(Math.random()*list.length)|0];
  return FACE_ART.anon[sex]||"";     // 남은 초상이 없으면 어나니머스
}
/* 명단에 들어오는 순간 그 초상을 쓴 것으로 적어 둡니다 */
function claimFace(p){
  if(!p||!p.face||isAnon(p.face))return;
  G.facesUsed=G.facesUsed||[];
  if(!G.facesUsed.includes(p.face))G.facesUsed.push(p.face);
}

/* "○○Fly"는 그 몬스터가 날아오를 때 쓰는 그림입니다.
   메뚜기 두 장은 눈을 한가운데 두고 같은 배율로 맞춰 두었으므로,
   같은 자리에 같은 크기로 그리면 몸은 그대로 있고 날개만 펴집니다. */

/* 다 읽히기 전에는 null을 돌려주고, 그동안은 도형으로 그립니다 */
function sprite(key){
  const rel=FOE_ART[key];
  if(!rel)return null;

    s=new Image();s.ok=false;
    s.onload=()=>{s.ok=true};

    s.src=artUrl(rel);
    SPR[key]=s;
  }
  return s.ok?s:null;
}
const preloadFoes=keys=>{for(const k of new Set(keys)){sprite(k);sprite(k+"Fly")}};

/* ═══════════ 제목 그림 ═══════════
   그림이 준비되면 TITLE_ART에 경로만 넣으면 됩니다. 비어 있으면 아래 코드로 그립니다. */
const TITLE_ART=ART+"title.webp";
let traf=null,tcv=null,tctx=null,timg=null;
function titleStop(){if(traf)cancelAnimationFrame(traf);traf=null}
function titleStart(){
  titleStop();
  tcv=document.getElementById("tcv");
  if(!tcv)return;
  try{tctx=tcv.getContext("2d")}catch(e){tctx=null}
  if(!tctx)return;
  if(TITLE_ART&&!timg){timg=new Image();timg.src=TITLE_ART}
  const dpr=window.devicePixelRatio||1;
  const W=tcv.clientWidth||360,H=230;
  tcv.width=W*dpr;tcv.height=H*dpr;
  tctx.setTransform(dpr,0,0,dpr,0,0);
  let last=0,t=0;
  const loop=ts=>{
    const dt=last?Math.min(.05,(ts-last)/1000):0;last=ts;t+=dt;
    drawTitle(W,H,t);
    traf=requestAnimationFrame(loop);
  };
  traf=requestAnimationFrame(loop);
}
/* 달리는 사람 — 다리와 팔을 사인파로 흔듭니다 */
function drawRunner(c,x,y,s,t){
  const ph=t*11, bob=Math.abs(Math.sin(ph))*s*0.07;
  c.save();c.translate(x,y-bob);
  c.lineCap="round";c.lineJoin="round";
  const hipY=-s*0.52, shY=-s*1.02;
  // 뒤쪽 다리
  const legs=(a,col)=>{
    const knee=[Math.sin(a)*s*0.42, hipY+s*0.34-Math.abs(Math.cos(a))*s*0.10];
    const foot=[Math.sin(a-0.9)*s*0.60, hipY+s*0.74];
    c.strokeStyle=col;c.lineWidth=s*0.17;
    c.beginPath();c.moveTo(0,hipY);c.lineTo(knee[0],knee[1]);c.lineTo(foot[0],foot[1]);c.stroke();
  };
  const arms=(a,col)=>{
    const el2=[Math.sin(a)*s*0.34, shY+s*0.28];
    const hd=[Math.sin(a+0.7)*s*0.50, shY+s*0.16];
    c.strokeStyle=col;c.lineWidth=s*0.14;
    c.beginPath();c.moveTo(0,shY);c.lineTo(el2[0],el2[1]);c.lineTo(hd[0],hd[1]);c.stroke();
    return hd;
  };
  legs(ph+Math.PI,"#2B4A5E");
  arms(ph,"#2E6F82");
  // 몸통
  c.strokeStyle="#4FC3D9";c.lineWidth=s*0.30;
  c.beginPath();c.moveTo(-s*0.03,shY);c.lineTo(s*0.03,hipY);c.stroke();
  legs(ph,"#3A6480");
  const hand=arms(ph+Math.PI,"#4FC3D9");
  // 손에 들린 국자
  c.save();c.translate(hand[0],hand[1]);c.rotate(-0.5+Math.sin(ph)*0.35);
  c.strokeStyle="#C9C2D8";c.lineWidth=s*0.08;
  c.beginPath();c.moveTo(0,0);c.lineTo(s*0.46,-s*0.10);c.stroke();
  c.beginPath();c.arc(s*0.54,-s*0.12,s*0.11,0,7);c.fillStyle="#D8D2E4";c.fill();
  c.restore();
  // 머리
  c.beginPath();c.arc(s*0.07,shY-s*0.24,s*0.20,0,7);
  c.fillStyle="#E8C9A8";c.fill();
  c.beginPath();c.arc(s*0.05,shY-s*0.30,s*0.20,3.5,6.4);
  c.fillStyle="#2A2436";c.fill();
  c.restore();
}
function drawTitle(W,H,t){
  const c=tctx;
  if(TITLE_ART&&timg&&timg.complete&&timg.naturalWidth){
    const r=Math.max(W/timg.naturalWidth,H/timg.naturalHeight);
    const w=timg.naturalWidth*r,h=timg.naturalHeight*r;
    c.drawImage(timg,(W-w)/2,(H-h)/2,w,h);return;
  }
  const sky=c.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#251F38");sky.addColorStop(1,"#14111E");
  c.fillStyle=sky;c.fillRect(0,0,W,H);
  const gnd=H*0.80;
  // 게이트 빛무리
  const gx=W*0.76,gy=gnd-H*0.16;
  const pulse=0.50+0.14*Math.sin(t*1.7);
  const gl=c.createRadialGradient(gx,gy,3,gx,gy,H*0.62);
  gl.addColorStop(0,`rgba(158,116,242,${pulse})`);
  gl.addColorStop(.45,"rgba(124,91,217,.20)");
  gl.addColorStop(1,"rgba(124,91,217,0)");
  c.fillStyle=gl;c.fillRect(0,0,W,H);
  // 건물 실루엣
  c.fillStyle="#1B1728";
  const bl=[[0.02,.30],[0.14,.44],[0.29,.26],[0.42,.38],[0.55,.22],[0.90,.34]];
  for(const b of bl){
    const bw=W*0.13,bh=H*b[1],bx=W*b[0];
    c.fillRect(bx,gnd-bh,bw,bh);
    c.fillStyle="rgba(242,215,78,.13)";
    for(let i=0;i<3;i++)for(let j=0;j<2;j++)
      c.fillRect(bx+bw*(.20+j*.42),gnd-bh+bh*(.16+i*.24),bw*.18,bh*.10);
    c.fillStyle="#1B1728";
  }
  // 게이트
  c.save();c.translate(gx,gy);
  c.beginPath();
  c.moveTo(-30,H*0.16);c.lineTo(-30,-H*0.10);
  c.quadraticCurveTo(0,-H*0.30,30,-H*0.10);c.lineTo(30,H*0.16);c.closePath();
  const gg=c.createLinearGradient(0,-H*0.28,0,H*0.16);
  gg.addColorStop(0,`rgba(198,168,255,${0.30+0.10*Math.sin(t*2.3)})`);
  gg.addColorStop(1,"rgba(90,62,160,.55)");
  c.fillStyle=gg;c.fill();
  c.strokeStyle=`rgba(206,180,255,${0.55+0.20*Math.sin(t*2.3)})`;c.lineWidth=2.4;c.stroke();
  c.restore();
  // 지면
  c.fillStyle="#100D18";c.fillRect(0,gnd,W,H-gnd);
  c.strokeStyle="rgba(234,230,242,.16)";c.lineWidth=2;
  const off=(t*210)%56;
  for(let x=-56;x<W+56;x+=56){
    c.beginPath();c.moveTo(x-off,gnd+11);c.lineTo(x-off+26,gnd+11);c.stroke();
  }
  // 달리는 이경호
  drawRunner(c,W*0.31,gnd+2,H*0.30,t);
  // 발밑 먼지
  c.fillStyle="rgba(234,230,242,.10)";
  for(let i=0;i<4;i++){
    const d=((t*180+i*30)%90);
    c.beginPath();c.arc(W*0.31-d,gnd-1-i*2,2.4+i*0.5,0,7);c.fill();
  }
}

/* ═══════════ 저장 ═══════════
   G 안에는 함수를 물고 있는 것(스킬)과 표의 원본을 가리키는 것(장소)이 섞여 있어
   그대로 JSON으로 만들 수 없습니다. 저장할 때 번호로 바꾸고, 불러올 때 되돌립니다.
   전투 중에는 저장하지 않습니다. B(전투판)는 저장 대상이 아니라서,
   안전한 화면에서만 자동으로 기록합니다. */
const SAVE_SLOTS=3, SAVE_VER=3;
const OLD_KEY="ucw.save.v1";
const saveKey=i=>`ucw.save.v3.${i}`;
const curSlot=()=>(G&&G.slot!==undefined&&G.slot!==null)?G.slot:0;
const SAVE_SCENES=CAMPUS_SCENES.concat(["briefing","confirm","instant"]);

function storageOk(){
  try{localStorage.setItem("ucw.t","1");localStorage.removeItem("ucw.t");return true}
  catch(e){return false}
}
function packSave(){
  const d=JSON.parse(JSON.stringify({...G,
    player:null,instants:null,skillOffer:null,offer:null,here:null,lastGain:null}));
  const pi=G.roster.indexOf(G.player);
  d.playerIdx=pi;
  d.playerRaw=pi<0?JSON.parse(JSON.stringify(G.player)):null;
  d.instants=G.instants.map(x=>x.k);
  d.skillOffer=G.skillOffer?G.skillOffer.map(x=>x.k):null;
  d.offer=G.offer?G.offer.map(x=>PLACES.indexOf(x)).filter(i=>i>=0):null;
  d.here=G.here?PLACES.indexOf(G.here):null;
  return{v:SAVE_VER,t:Date.now(),g:d};
}
function unpackSave(sv){
  const d=sv.g;
  d.player=d.playerIdx>=0?d.roster[d.playerIdx]:d.playerRaw;
  d.instants=(d.instants||[]).map(skillOf).filter(Boolean);
  d.skillOffer=d.skillOffer?d.skillOffer.map(skillOf).filter(Boolean):null;
  if(!d.itemSeen)d.itemSeen={};
  d.offer=d.offer?d.offer.map(i=>PLACES[i]).filter(Boolean):null;
  d.here=(d.here===null||d.here===undefined)?null:PLACES[d.here];
  d.lastGain=null;
  delete d.playerIdx;delete d.playerRaw;
  return d;
}
function saveGame(){
  try{localStorage.setItem(saveKey(curSlot()),JSON.stringify(packSave()));return true}
  catch(e){return false}
}
function readSave(i){
  try{
    const t=localStorage.getItem(saveKey(i));
    if(!t)return null;
    const sv=JSON.parse(t);
    return(sv&&sv.v===SAVE_VER&&sv.g&&sv.g.roster)?sv:null;
  }catch(e){return null}
}
function deleteSave(i){try{localStorage.removeItem(saveKey(i))}catch(e){}}
function anySave(){for(let i=0;i<SAVE_SLOTS;i++)if(readSave(i))return true;return false}
/* 파일이 하나뿐이던 시절의 기록을 1번 자리로 옮겨 줍니다 */
function migrateSave(){
  try{
    const t=localStorage.getItem(OLD_KEY);
    if(!t)return;
    if(!localStorage.getItem(saveKey(0))){
      const sv=JSON.parse(t);
      if(sv&&sv.g&&sv.g.roster){sv.v=SAVE_VER;sv.g.slot=0;
        localStorage.setItem(saveKey(0),JSON.stringify(sv))}
    }
    localStorage.removeItem(OLD_KEY);
    for(let i=0;i<SAVE_SLOTS;i++)localStorage.removeItem(`ucw.save.v2.${i}`);
  }catch(e){}
}
function saveLabel(sv){

  return `${where} · 대원 ${g.roster.length}명 · 골드 ${g.gold} · 탐색 ${g.explores}회`;

function saveTime(sv){

  return `${d.getFullYear()}.${z(d.getMonth()+1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}

/* ═══════════ 전투 ═══════════ */
let cv,ctx,W=400,H=340,raf=null,last=0,B=null;
const SWING={up:.30,down:.10,rec:.22};
const SWING_TOTAL=SWING.up+SWING.down+SWING.rec;
const THRUST={up:.18,go:.07,rec:.20};
const THRUST_TOTAL=THRUST.up+THRUST.go+THRUST.rec;
const GUNA={up:.13,go:.05,rec:.17};            // 총 — 겨누고 쏘고 반동
const GUN_TOTAL=GUNA.up+GUNA.go+GUNA.rec;
const HOP_AIR=0.26;
const CRIT_MUL=1.6;              /* 치명타 배율 */
const DODGE_PER_SPD=0.3;         /* 속도 1점당 회피 % */
const SPLASH_RATE=0.5;   // 휘두르기가 주변에 주는 피해 비율
const SPLASH_PAD=2;      // 주 대상보다 조금 더 넓게 훑는다

function blocked(x,y,r,mask){
  if(x<r||x>100-r||y<r||y>100-r)return true;
  for(const o of ROOM.obs){
    if(!(o.lv&mask))continue;
    const cx=Math.max(o.x,Math.min(x,o.x+o.w)),cy=Math.max(o.y,Math.min(y,o.y+o.h));
    if((x-cx)**2+(y-cy)**2<r*r)return true;
  }
  return false;
}
function freeSpot(x,y,r,mask){
  if(!blocked(x,y,r,mask))return{x,y};
  for(let k=1;k<90;k++){
    const a=k*1.1,rad=1+k*0.7;
    const nx=Math.max(r,Math.min(100-r,x+Math.cos(a)*rad));
    const ny=Math.max(r,Math.min(100-r,y+Math.sin(a)*rad));
    if(!blocked(nx,ny,r,mask))return{x:nx,y:ny};
  }
  return{x,y};
}
/* ═══════════ 길찾기 ═══════════
   방을 25×25 칸으로 나누고, 목표 칸에서 BFS로 거리 지도를 만듭니다.
   목표가 직선으로 보이면 그냥 직진하고, 막혀 있으면 지도를 따라 돌아갑니다.
   층(lvm)마다 지나갈 수 있는 칸이 다르므로 마스크별로 따로 계산합니다. */
const GN=25, CELL=100/GN;
let PASS_CACHE=new Map(), FIELD_CACHE=new Map();
function clearPaths(){PASS_CACHE.clear();FIELD_CACHE.clear()}
const cIdx=(cx,cy)=>cy*GN+cx;
const toCell=v=>Math.max(0,Math.min(GN-1,Math.floor(v/CELL)));
/* 몸집을 세 단계로 나눠 각각 다른 통행 지도를 씁니다.
   전부 반지름 3으로 계산하면, 사람이 겨우 지나는 틈을 지도가 "뚫려 있다"고
   알려 주고 덩치 큰 것이 그리로 들어갔다가 끼어 제자리걸음을 합니다. */
const rBucket=r=>r<=3.5?3:(r<=5.5?5:7);
function passGrid(mask,rb){
  const key=mask+"#"+rb;
  let p=PASS_CACHE.get(key);
  if(p)return p;
  p=new Uint8Array(GN*GN);
  for(let cy=0;cy<GN;cy++)for(let cx=0;cx<GN;cx++){
    const x=cx*CELL+CELL/2,y=cy*CELL+CELL/2;
    p[cIdx(cx,cy)]=blocked(x,y,rb,mask)?0:1;
  }
  PASS_CACHE.set(key,p);
  return p;
}
function distField(mask,rb,tx,ty){
  const tcx=toCell(tx),tcy=toCell(ty);
  const key=mask+"#"+rb+":"+tcx+","+tcy;
  let d=FIELD_CACHE.get(key);
  if(d)return d;
  const pass=passGrid(mask,rb);
  d=new Int16Array(GN*GN).fill(-1);
  let s=cIdx(tcx,tcy);
  if(!pass[s]){                       // 목표가 막힌 칸이면 가장 가까운 빈 칸을 쓴다
    let best=-1,bd=1e9;
    for(let cy=0;cy<GN;cy++)for(let cx=0;cx<GN;cx++){
      if(!pass[cIdx(cx,cy)])continue;
      const dd=(cx-tcx)**2+(cy-tcy)**2;
      if(dd<bd){bd=dd;best=cIdx(cx,cy)}
    }
    if(best<0)return d;
    s=best;
  }
  d[s]=0;
  const q=[s];
  for(let h=0;h<q.length;h++){
    const cur=q[h],cx=cur%GN,cy=(cur/GN)|0,nd=d[cur]+1;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const nx=cx+dx,ny=cy+dy;
      if(nx<0||ny<0||nx>=GN||ny>=GN)continue;
      const ni=cIdx(nx,ny);
      if(!pass[ni]||d[ni]>=0)continue;
      if(dx&&dy&&(!pass[cIdx(cx+dx,cy)]||!pass[cIdx(cx,cy+dy)]))continue;  // 모서리 통과 금지
      d[ni]=nd;q.push(ni);
    }
  }
  if(FIELD_CACHE.size>240)FIELD_CACHE.clear();   /* 몸집별로 나뉘어 종류가 늘었습니다 */
  FIELD_CACHE.set(key,d);
  return d;
}
function clearLine(x0,y0,x1,y1,r,mask){
  const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy);
  const steps=Math.max(1,Math.ceil(len/2));
  for(let i=1;i<=steps;i++){
    const q=i/steps;
    if(blocked(x0+dx*q,y0+dy*q,r,mask))return false;
  }
  return true;
}
/* 다음에 밟을 칸을 골라 줍니다.
   force가 켜지면 직선이 뚫려 보여도 무조건 지도를 따릅니다.
   ㄱ자 모서리에서는 직선이 "거의" 뚫린 것처럼 보여 계속 벽을 밀게 되는데,
   제자리걸음이 이어지면 이 쪽으로 넘어옵니다. */
function nextStep(u,tx,ty,force){
  if(!force&&clearLine(u.x,u.y,tx,ty,u.r*0.9,u.lvm))return null;
  const rb=rBucket(u.r);
  const d=distField(u.lvm,rb,tx,ty);
  const cx=toCell(u.x),cy=toCell(u.y);
  const here=d[cIdx(cx,cy)];
  let best=null,bv=(here<0)?1e9:here;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;
    const nx=cx+dx,ny=cy+dy;
    if(nx<0||ny<0||nx>=GN||ny>=GN)continue;
    const v=d[cIdx(nx,ny)];
    if(v<0)continue;
    /* 대각선으로 모서리를 스치며 빠져나가지 못하게 막습니다 */
    if(dx&&dy){
      const pass=passGrid(u.lvm,rb);
      if(!pass[cIdx(cx+dx,cy)]||!pass[cIdx(cx,cy+dy)])continue;
    }
    if(v<bv){bv=v;best=[nx,ny]}
  }
  if(!best)return null;
  return{x:best[0]*CELL+CELL/2,y:best[1]*CELL+CELL/2};
}

function moveTo(u,tx,ty,dt){
  /* 0.2초 넘게 못 나아갔으면 직선을 포기하고 지도를 따릅니다 */
  const way=nextStep(u,tx,ty,(u.stuck||0)>0.20);
  if(way){tx=way.x;ty=way.y}
  const ox=u.x,oy=u.y;
  const vx=tx-u.x,vy=ty-u.y,d=Math.hypot(vx,vy)||1,st=u.vspeed*dt;
  u.face=Math.atan2(vy,vx);
  const nx=u.x+vx/d*st,ny=u.y+vy/d*st;
  if(!blocked(nx,u.y,u.r,u.lvm))u.x=nx;
  if(!blocked(u.x,ny,u.r,u.lvm))u.y=ny;
  if(Math.hypot(u.x-ox,u.y-oy)<st*0.35){
    u.stuck=(u.stuck||0)+dt;
    /* 지도로 갈아타도 안 풀리면 벽을 따라 옆걸음을 칩니다 */
    if(u.stuck>0.45){
      if(u.slide===undefined)u.slide=Math.random()<.5?1:-1;
      const a=u.face+u.slide*Math.PI/2;
      const sx=u.x+Math.cos(a)*st*1.3,sy=u.y+Math.sin(a)*st*1.3;
      if(!blocked(sx,sy,u.r,u.lvm)){u.x=sx;u.y=sy}
      else{u.slide*=-1;
        /* 양옆이 다 막힌 막다른 골목이면 방향을 새로 잡습니다 */
        if(u.stuck>1.5){u.slide=Math.random()<.5?1:-1;u.stuck=0.5}
      }
    }
  }else{u.stuck=0;u.slide=undefined}
}
function separate(){
  const all=[...B.allies,...B.foes].filter(u=>u.hp>0);
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const a=all[i],b=all[j];
    if(!(a.lvm&b.lvm))continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01,min=a.r+b.r;
    if(d<min){
      const p=(min-d)/2,ux=dx/d*p,uy=dy/d*p;
      if(!blocked(a.x-ux,a.y-uy,a.r,a.lvm)){a.x-=ux;a.y-=uy}
      if(!blocked(b.x+ux,b.y+uy,b.r,b.lvm)){b.x+=ux;b.y+=uy}
    }
  }
}
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function makeFighter(p,i,n){
  const d=derive(p);
  const u={ref:p,name:p.name,side:"a",face:-1.57,r:3.2,lvm:HUMAN,
    hp:Math.min(p.hp,d.maxHp),maxHp:d.maxHp,atk:d.atk,aspd:d.aspd,vspeed:d.speed*0.42,
    range:7+d.rng,guard:d.guard,guardVar:0,dodge:d.dodge,crit:d.crit,cool:.3+i*.15,anim:null,color:"#4FC3D9",
    style:d.style,dmgType:d.dmg,broken:[],wid:p.gear.rh,
    wearing:SLOTS.map(s=>({slot:s.k,it:ITEMS[p.gear[s.k]]})).filter(w=>w.it),
    hasW:!!p.gear.rh,hasS:!!p.gear.lh};
  for(const s of G.instants)s.f(u);
  u.dodge=Math.min(60,u.dodge||0);      // 아무리 쌓아도 다 피하지는 못한다
  u.crit=Math.min(80,u.crit||0);
  u.hp=Math.min(u.hp,u.maxHp);
  const rh=ITEMS[p.gear.rh];
  if(rh&&rh.ammo){                       // 총을 든 사람은 탄약이 떨어지면 맨손으로 싸운다
    u.gun={type:rh.ammo,range:u.range,style:"gun",dmg:rh.dmg,n:rh.n};
    u.atkFull=u.atk;
    u.meleeAtk=Math.max(1,+(u.atk-rh.atk).toFixed(1));
  }
  const sp=freeSpot(50+(i-(n-1)/2)*9,90,u.r,u.lvm);
  u.x=sp.x;u.y=sp.y;
  return u;
}
function makeEnemy(key,i,day){
  const E=ENEMIES[key];
  /* 보스는 등장 일차에 맞춰 이미 세게 잡혀 있으므로 날짜 배율을 태우지 않습니다 */
  const hs=(E.boss||E.noScale)?1:Math.pow(1.30,day-1), as=(E.boss||E.noScale)?1:Math.pow(1.20,day-1);
  const spots=[[52,25],[36,22],[20,26],[66,30],[28,34],[46,18],[12,22],[60,16],[76,34],[40,36]];
  const s=spots[i%spots.length];
  /* 튜토리얼에서는 한 대가 1만큼 덜 아픕니다 */
  const soft=G.mode==="tutorial"?1:0;
  const u={key,name:E.n,side:"e",face:1.57,r:E.r,lvm:E.lvm,boss:!!E.boss,exp:E.exp,dmgType:E.dmg,
    hp:Math.round(E.hp*hs),maxHp:Math.round(E.hp*hs),atk:Math.max(1,+(E.atk*as).toFixed(1)-soft),
    aspd:E.aspd,vspeed:E.speed,range:E.range,guard:0,cool:1+i*.5,color:E.c,wig:i*1.3};
  const sp=freeSpot(s[0],s[1],u.r,u.lvm);
  u.x=sp.x;u.y=sp.y;
  return u;
}
/* 좀비에게 물려 죽은 대원이 그 자리에서 일어선다 */
function makeZombieOf(a){
  const E=ENEMIES.zomb;
  return{key:"zomb",name:"좀비 "+a.name,side:"e",face:a.face,r:E.r,lvm:E.lvm,
    exp:E.exp,dmgType:E.dmg,turned:true,
    hp:Math.round(a.maxHp*0.7),maxHp:Math.round(a.maxHp*0.7),
    atk:+(a.atk*0.8).toFixed(1),aspd:E.aspd,vspeed:E.speed,range:E.range,
    guard:0,cool:1.4,color:E.c,wig:0,cp:0,x:a.x,y:a.y};
}
function rollEncounter(day,risk,party){
  /* 적 수는 데려간 인원에 맞춰 조정합니다.
     혼자 들어갔는데 넷이 갈 물량이 나오면 손쓸 방법이 없기 때문입니다. */
  const size=Math.max(1,Math.min(4,party||4));
  const base=2+Math.floor(day/2)+risk;
  const n=Math.max(1,Math.min(6,Math.round(base*(0.42+0.58*size/4)))),out=[];
  const boss=BOSS_DAY[day];
  if(boss){
    out.push(boss);
    const esc=BOSS_ADDS[boss];
    if(esc){for(let i=0;i<esc.count;i++)out.push(esc.key)}
    else for(let i=1;i<Math.max(2,n-1);i++)out.push(Math.random()<.5?"worm":"hopper");
  }else for(let i=0;i<n;i++)out.push(day>=2&&Math.random()<.45?"hopper":"worm");
  return out;
}
function startBattle(list,keys){
  G.fought=true;
  clearPaths();
  preloadFoes(keys.concat(["zomb"]));   /* 좀비화에 대비해 무리도 같이 */
  B={ammo:{...G.ammo},allies:list.map((p,i)=>makeFighter(p,i,list.length)),
     foes:keys.map((k,i)=>makeEnemy(k,i,G.day)),fx:[],shots:[],fallen:[],over:false};
  feed=[];
  const bs=B.foes.find(f=>f.boss);
  say(bs?`${bs.name}이(가) 천천히 몸을 일으킨다. 적 ${keys.length}체.`:`적 ${keys.length}체가 다가온다.`);
}
function say(t){feed.push(t);if(feed.length>3)feed.shift();
  const f=document.getElementById("feed");if(f)f.innerHTML=feed.map(x=>`<div>${x}</div>`).join("")}
function hurt(t,amt,c,type,src){
  if(src)t.lastHitBy=src;
  if(t.dodge&&Math.random()*100<t.dodge){        // 신발이 빠르면 몇 대는 흘린다
    say(`${t.name}이(가) 몸을 틀어 피했다.`);
    B.fx.push({x:t.x,y:t.y,t:"회피",c:"#6BD98F",life:.8,off:0});
    return;
  }
  if(t.wearing&&type){
    for(const w of t.wearing.slice()){
      const ch=w.it.frail&&w.it.frail[type];
      if(ch&&Math.random()<ch){
        say(`${t.name}의 ${w.it.n}이(가) ${type}에 부서졌다.`);
        B.fx.push({x:t.x,y:t.y,t:"파손",c:"#C87878",life:1.1,off:0});
        t.guard=Math.max(0,t.guard-(w.it.guard||0));
        t.broken.push(w.slot);
        t.wearing=t.wearing.filter(x=>x!==w);
        if(w.slot==="lh")t.hasS=false;
      }
    }
  }
  let cut=t.guard||0;
  for(let i=0;i<(t.guardVar||0);i++)if(Math.random()<0.5)cut++;   // 흔들리는 방어
  amt=Math.max(1,amt-cut);
  t.hp=Math.max(0,t.hp-amt);t.flash=.18;
  B.fx.push({x:t.x,y:t.y,t:Math.round(amt),c,life:.85,off:0});
}
function tick(dt){
  const live=B.foes.filter(f=>f.hp>0),lifeA=B.allies.filter(a=>a.hp>0);
  for(const u of lifeA){
    if(u.gun){                            // 남은 탄약에 따라 총/맨손을 오간다
      const has=(B.ammo[u.gun.type]||0)>0;
      if(has){u.style="gun";u.range=u.gun.range;u.atk=u.atkFull;u.dmgType=u.gun.dmg;u.hasW=true}
      else{
        if(!u.dry){u.dry=true;say(`${u.name}의 ${u.gun.n} 탄약이 떨어졌다.`)}
        u.style="swing";u.range=7;u.atk=u.meleeAtk;u.dmgType=DMG.BLUNT;u.hasW=false;
      }
    }
    if(u.anim){
      const a=u.anim,prev=a.t;a.t+=dt;
      const th=u.style==="thrust",gn=u.style==="gun";
      const imp=gn?GUNA.up+GUNA.go*.4:th?THRUST.up+THRUST.go*.9:SWING.up+SWING.down*.7;
      const total=gn?GUN_TOTAL:th?THRUST_TOTAL:SWING_TOTAL;
      if(!a.hit&&prev<imp&&a.t>=imp){
        a.hit=true;
        if(a.tgt&&a.tgt.hp>0&&D(u,a.tgt)<u.range+a.tgt.r){
          const cr=Math.random()*100<(u.crit||0);   // 운이 좋으면 급소가 열린다
          const dmg=cr?u.atk*CRIT_MUL:u.atk;
          hurt(a.tgt,dmg,cr?"#FF8A3D":"#F2D74E",u.dmgType);
          if(cr)B.fx.push({x:a.tgt.x,y:a.tgt.y-4,t:"치명타",c:"#FF8A3D",life:.9,off:0});
          let swept=0;
          if(u.style==="swing"){        // 휘두르면 곁에 있던 것들도 절반씩 맞는다
            for(const o of B.foes){
              if(o===a.tgt||o.hp<=0)continue;
              if(D(u,o)<u.range+o.r+SPLASH_PAD){
                hurt(o,dmg*SPLASH_RATE,"#E9C46A",u.dmgType);swept++;
              }
            }
          }
          say(`${u.name}이(가) ${a.tgt.name}을(를) ${u.style==="gun"?"쐈다":u.dmgType==="찌르기"?"찔렀다":"때렸다"}.`
            +(cr?" 급소에 들어갔다!":"")+(swept?` 옆에 있던 ${swept}체도 휩쓸렸다.`:""));
        }else say(`${u.name}의 공격이 빗나갔다.`);
      }
      if(a.t>=total)u.anim=null;
      continue;
    }
    if(!live.length)continue;
    const t=live.reduce((b,o)=>D(u,o)<D(u,b)?o:b);
    if(D(u,t)>u.range+t.r-1)moveTo(u,t.x,t.y,dt);
    else{u.face=Math.atan2(t.y-u.y,t.x-u.x);u.cool-=dt*u.aspd;
      if(u.cool<=0){
        if(u.gun&&u.style==="gun")B.ammo[u.gun.type]--;   // 한 발 소모
        u.cool=1;u.anim={t:0,hit:false,tgt:t};
      }}
  }
  for(const f of live){
    f.wig+=dt*3;
    if(!lifeA.length)continue;
    const t=lifeA.reduce((b,o)=>D(f,o)<D(f,b)?o:b);
    // 서로 밀어내는 거리(반지름 합)보다 사거리가 짧으면 영영 못 때린다. 상대 덩치를 더해준다.
    const reach=f.range+t.r;
    if(D(f,t)>reach){
      if(f.key==="hopper"){
        f.face=Math.atan2(t.y-f.y,t.x-f.x);
        if(f.air>0){f.air-=dt;moveTo(f,t.x,t.y,dt)}
        else{f.hopCd=(f.hopCd||0)-dt;
          if(f.hopCd<=0){f.air=HOP_AIR;f.hopCd=HOP_AIR+.5+Math.random()*.35}}
      }else if(f.key==="zombie"||f.key==="zomb"){
        // 성한 다리로 밀 때만 앞으로 나가고, 절뚝이는 쪽에서는 거의 멈춘다
        f.cp=(f.cp||0)+dt*2.3;
        f.limp=Math.sin(f.cp);
        const base=f.vspeed;
        f.vspeed=base*(f.limp>0?1.75:0.30);
        moveTo(f,t.x,t.y,dt);
        f.vspeed=base;
      }else if(f.key==="worm"){
        f.cp=(f.cp||0)+dt*3.1;
        const s=Math.max(0,Math.sin(f.cp));f.surge=s*s;
        const base=f.vspeed;f.vspeed=base*(0.12+1.85*f.surge);
        moveTo(f,t.x,t.y,dt);f.vspeed=base;
      }else moveTo(f,t.x,t.y,dt);
    }
    else{f.face=Math.atan2(t.y-f.y,t.x-f.x);f.air=0;f.cool-=dt*f.aspd;
      if(f.cool<=0){f.cool=1;f.strike=.24;
        if(f.key==="spider")B.shots.push({x0:f.x,y0:f.y,x1:t.x,y1:t.y,life:.42,max:.42});
        hurt(t,f.atk,"#F25C5C",f.dmgType,f);
        say(`${f.name}이(가) ${t.name}을(를) 공격했다.`)}}
  }
  separate();
  for(const a of B.allies)if(a.hp<=0&&!a.dead){
    a.dead=true;B.fallen.push(a);
    const by=a.lastHitBy;
    if(by&&(by.key==="zombie"||by.key==="zomb")){
      B.foes.push(makeZombieOf(a));
      say(`${a.name}이(가) 다시 일어선다. 더 이상 우리 편이 아니다.`);
    }else say(`${a.name}이(가) 쓰러졌다. 돌아오지 못한다.`);
  }
  for(const u of [...B.allies,...B.foes]){if(u.flash>0)u.flash-=dt;if(u.strike>0)u.strike-=dt}
  B.fx=B.fx.filter(p=>{p.life-=dt;p.off+=26*dt;return p.life>0});
  if(B.shots)B.shots=B.shots.filter(w=>{w.life-=dt;return w.life>0});
  if(!B.over){
    if(!lifeA.length){B.over=1;stopLoop();setTimeout(()=>{G.scene="fail";render()},600)}
    else if(!live.length){B.over=1;stopLoop();setTimeout(finishBattle,700)}
  }
}

/* ═══════════ 그리기 ═══════════ */
let SX=4,SY=4;
function paint(){
  ctx.clearRect(0,0,W,H);SX=W/100;SY=H/100;
  const px=v=>v*SX,py=v=>v*SY;
  ctx.fillStyle="#22212A";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,255,255,.045)";ctx.lineWidth=1;
  for(let i=1;i<10;i++){
    ctx.beginPath();ctx.moveTo(px(i*10),0);ctx.lineTo(px(i*10),H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,py(i*10));ctx.lineTo(W,py(i*10));ctx.stroke();
  }
  ctx.strokeStyle="rgba(216,71,126,.35)";ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,W-3,H-3);
  ctx.fillStyle="rgba(216,71,126,.30)";ctx.fillRect(px(DOOR.x),py(DOOR.y),px(DOOR.w),py(DOOR.h));
  ctx.fillStyle="rgba(234,230,242,.6)";ctx.font="700 9px system-ui";ctx.textAlign="center";
  ctx.fillText("입구",px(DOOR.x+DOOR.w/2),py(DOOR.y)-3);
  for(const o of ROOM.obs){
    const high=(o.lv&L3)!==0,mid=(o.lv&L2)!==0,low=(o.lv&L1)!==0;
    ctx.fillStyle=high?"#43414F":mid&&low?"#3A3948":"rgba(120,112,140,.32)";
    ctx.fillRect(px(o.x),py(o.y),px(o.w),py(o.h));
    if(!high&&!(mid&&low))ctx.setLineDash([3,3]);
    ctx.strokeStyle="rgba(255,255,255,.26)";ctx.lineWidth=1;
    ctx.strokeRect(px(o.x)+.5,py(o.y)+.5,px(o.w)-1,py(o.h)-1);
    ctx.setLineDash([]);
    if(o.l){ctx.fillStyle="rgba(234,230,242,.5)";ctx.font="700 10px system-ui";ctx.textAlign="center";
      ctx.fillText(o.l,px(o.x+o.w/2),py(o.y+o.h/2)+3.5)}
  }
  for(const f of B.foes)if(f.hp>0)drawFoe(f);
  for(const a of B.allies)if(a.hp>0)drawAlly(a);
  if(B.shots)for(const w of B.shots)drawWeb(w);
  ctx.textAlign="center";ctx.font="800 13px system-ui";
  for(const p of B.fx){ctx.globalAlpha=Math.min(1,p.life*1.6);ctx.fillStyle=p.c;
    ctx.fillText(p.t,px(p.x),py(p.y)-10-p.off)}
  ctx.globalAlpha=1;
}
function drawAlly(u){
  const x=u.x*SX,y=u.y*SY,r=u.r*Math.min(SX,SY);
  ctx.save();ctx.translate(x,y);ctx.save();ctx.rotate(u.face);
  if(u.hasS){ctx.beginPath();ctx.arc(-r*.5,-r*.9,r*.85,0,7);
    ctx.fillStyle="#8F87A6";ctx.fill();ctx.strokeStyle="#B9B2CC";ctx.lineWidth=1.5;ctx.stroke()}
  if(u.hasW&&u.wid==="spray"){
    // 분무기 — 손에 들린 통, 누를 때 앞으로 안개가 퍼진다
    const t=u.anim?u.anim.t:-1;
    const firing=t>=THRUST.up&&t<THRUST.up+THRUST.go+.14;

function drawFoe(f){

      /* 그림 한 장을 세로로 잘게 썰어, 조각마다 어긋나게 그립니다.

         판정 반지름 f.r 은 건드리지 않습니다 — 그림만 커집니다. */

      for(let i=0;i<N;i++){

        const a=mapU(u),b=mapU(un);

function drawWeb(w){
  const p=Math.min(1,(w.max-w.life)/(w.max*0.42));      // 뻗어 나가는 진행도
  const fade=Math.min(1,w.life/w.max*2.2);
  const ex=w.x0+(w.x1-w.x0)*p, ey=w.y0+(w.y1-w.y0)*p;
  let nx=-(w.y1-w.y0), ny=(w.x1-w.x0);
  const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
  ctx.strokeStyle=`rgba(232,232,248,${fade*0.95})`;
  ctx.lineWidth=1.7;ctx.lineCap="round";
  ctx.beginPath();
  for(let i=0;i<=10;i++){                                // 지그재그로 흔들리는 실
    const q=i/10;
    const wob=Math.sin(q*Math.PI*3.2)*1.7*(1-q*0.6);
    const bx=w.x0+(ex-w.x0)*q+nx*wob, by=w.y0+(ey-w.y0)*q+ny*wob;
    i?ctx.lineTo(bx*SX,by*SY):ctx.moveTo(bx*SX,by*SY);
  }
  ctx.stroke();
  if(p>=1){                                              // 착탄 — 들러붙은 거미줄
    const cx=w.x1*SX, cy=w.y1*SY, rr=7+(1-fade)*4;
    ctx.strokeStyle=`rgba(238,238,252,${fade*0.9})`;ctx.lineWidth=1.2;
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3+0.3;
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);ctx.stroke();
    }
    for(const ring of [0.45,0.85]){
      ctx.beginPath();
      for(let i=0;i<=6;i++){
        const a=i*Math.PI/3+0.3;
        const px2=cx+Math.cos(a)*rr*ring, py2=cy+Math.sin(a)*rr*ring;
        i?ctx.lineTo(px2,py2):ctx.moveTo(px2,py2);
      }
      ctx.stroke();
    }
  }
}
function bar(u,x,y,c,r){

function loop(ts){
  if(!last)last=ts;
  const dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(B&&!B.over)tick(dt);
  if(B)paint();
  raf=requestAnimationFrame(loop);

function startLoop(){if(raf)return;last=0;raf=requestAnimationFrame(loop)}
function stopLoop(){if(raf)cancelAnimationFrame(raf);raf=null}
function fitCanvas(){

function grantExp(list,amount){
  const out=[];
  for(const p of list){
    const b=p.lvl;p.exp+=amount;
    while(p.lvl<5&&p.exp>=nextExp(p.lvl)){p.exp-=nextExp(p.lvl);p.lvl++;p.points+=1;
      logAdd(p,`Lv ${p.lvl} 달성`)}
    out.push({p,up:p.lvl-b});
  }
  return out;
}

  const broke=[];
  for(const a of alive){
    a.ref.hp=Math.round(a.hp);
    for(const slot of a.broken){
      const it=ITEMS[a.ref.gear[slot]];
      if(it){broke.push(`${a.ref.name}의 ${it.n}`);logAdd(a.ref,`${it.n} 파손`);a.ref.gear[slot]=null}
    }
  }
  /* 유품 — 사망자의 장비와 배낭이 바닥에 남는다 */
  const relic=[];
  if(dead.length){
    G.deaths+=dead.length;
    for(const d of dead){
      logAdd(d,`${G.day}일차 ${G.here?G.here.n:"게이트"}에서 사망`);
      G.memorial.push({name:d.name,lvl:d.lvl,stats:{...d.stats},
        gear:{...d.gear},where:G.here?G.here.n:"게이트",day:G.day,
        gate:G.gateName||"정문 게이트",log:(d.log||[]).slice()});
      for(const s of SLOTS)if(d.gear[s.k]){relic.push(d.gear[s.k]);d.gear[s.k]=null}
      for(const id of d.bag)relic.push(id);
      d.bag=[];
    }
    G.roster=G.roster.filter(r=>!dead.includes(r));
  }
  if(B.ammo)G.ammo={...B.ammo};                    // 쓴 만큼 줄어든 채로 돌아온다
  const rawFound=G.mode==="tutorial"?[]:rollLoot(G.here,G.day);
  const ammoGot=[];
  const found=rawFound.filter(id=>{
    const it=ITEMS[id];
    if(it.kind==="ammo"){markSeen(id);G.ammo[it.ammo]=(G.ammo[it.ammo]||0)+it.qty;
      ammoGot.push(`${it.n} ${it.qty}발`);return false}
    return true;
  });
  G.ground=[...found.map(id=>({id,src:"수확"})),...relic.map(id=>({id,src:"유품"}))];
  G.lastGain={exp,results:grantExp(alive.map(a=>a.ref),exp),dead,broke,
              boss:(B.foes.find(f=>f.boss)||{}).name||null,found:found.length,relic:relic.length,ammoGot};
  G.scene="reward";render();
}

/* ═══════════ 배낭·장비 조작 ═══════════ */
const bagRoom=p=>BAG_MAX-p.bag.length;
function giveItem(p,id){
  if(bagRoom(p)<=0)return false;
  const it=ITEMS[id];
  if(it.ammo)G.gunSeen[it.ammo]=true;
  markSeen(id);p.bag.push(id);return true;
}
function takeAllGround(list){
  for(const p of list){
    while(bagRoom(p)>0&&G.ground.length){
      giveItem(p,G.ground[0].id);G.ground.shift();
    }
  }
  G.sel=null;
}
function takeToBag(p,idx){
  if(bagRoom(p)<=0)return false;
  const id=G.ground[idx].id, it=ITEMS[id];
  if(it.ammo)G.gunSeen[it.ammo]=true;      // 총을 손에 넣은 시점부터 탄약을 살 수 있다
  markSeen(id);p.bag.push(id);G.ground.splice(idx,1);G.sel=null;return true;
}
/* 장비를 바꾸면 최대 체력만큼 현재 체력도 같이 오르내립니다.
   80/100에 체력 +4를 끼면 84/104가 되고, 벗으면 80/100으로 돌아옵니다.
   벗어서 체력이 0 이하가 되는 경우에는 아예 벗지 못하게 막습니다. */
function tryGear(p,fn){
  const g={...p.gear},bag=p.bag.slice(),hp0=p.hp,before=derive(p).maxHp;
  fn();
  const after=derive(p).maxHp,nhp=hp0+(after-before);
  if(nhp<1){p.gear=g;p.bag=bag;p.hp=hp0;return false}
  p.hp=Math.min(nhp,after);
  return true;
}
const GEAR_LOW="체력이 적어 아이템을 해제할 수 없습니다";
const GEAR_MAJ="전공이 적합하지 않습니다";
/* 화면을 다시 그려도 남도록 body 에 직접 띄웁니다 */
function toast(t){
  const d=document.createElement("div");
  d.className="toast";d.textContent=t;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),2400);
}
/* 성공하면 null, 못 들면 까닭을 돌려줍니다 */
function equipFromBag(p,bagIdx){
  const id=p.bag[bagIdx],it=ITEMS[id];
  if(!it.slot)return null;
  if(!canUse(p,it))return GEAR_MAJ;     // 총기는 전공이 맞아야 든다
  return tryGear(p,()=>{
    const old=p.gear[it.slot];
    p.bag.splice(bagIdx,1);
    p.gear[it.slot]=id;
    if(old)p.bag.push(old);
  })?null:GEAR_LOW;
}
function useItem(p,bi){
  const it=ITEMS[p.bag[bi]];
  if(!it||!it.use)return;
  const m=derive(p).maxHp;
  if(p.hp>=m)return;
  p.hp=Math.min(m,p.hp+it.use.hp);
  p.bag.splice(bi,1);
}
function unequip(p,slot){
  const id=p.gear[slot];
  if(!id||bagRoom(p)<=0)return true;
  return tryGear(p,()=>{p.gear[slot]=null;p.bag.push(id)});
}


/* ═══════════ 미니게임 · 거미 잡기 ═══════════
   줄을 타고 내려오는 거미를 화면에서 눌러 잡습니다. 세 마리를 놓치면 끝. */
let AR=null,araf=null,arlast=0,acv,actx,AW=380,AH=470;
/* 요금을 못 내면 기계가 돌지 않습니다 */
function payFee(kind){
  const f=ARCADE_FEE[kind];
  if(G.gold<f)return false;
  G.gold-=f;return true;
}
function arcadeStop(){if(araf)cancelAnimationFrame(araf);araf=null}
function arcadeStart(){
  AR={kind:"spider",score:0,miss:0,t:0,spawn:.5,list:[],pops:[],over:false};
  acv=document.getElementById("acv");actx=acv.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  AW=acv.clientWidth;AH=Math.round(AW*1.22);
  acv.width=AW*dpr;acv.height=AH*dpr;acv.style.height=AH+"px";
  actx.setTransform(dpr,0,0,dpr,0,0);
  const grab=ev=>{
    if(!AR||AR.over)return;
    ev.preventDefault();
    const rc=acv.getBoundingClientRect();
    const pt=ev.touches?ev.touches[0]:ev;
    const mx=pt.clientX-rc.left,my=pt.clientY-rc.top;
    let best=null,bd=1e9;
    for(const s of AR.list){
      const d=Math.hypot(s.x-mx,s.y-my);
      if(d<s.r+16&&d<bd){bd=d;best=s}
    }
    if(best){
      AR.list=AR.list.filter(s=>s!==best);
      AR.score++;
      AR.pops.push({x:best.x,y:best.y,life:.5,t:"+1"});
    }else AR.pops.push({x:mx,y:my,life:.3,t:"헛손질"});
  };
  acv.onmousedown=grab;acv.ontouchstart=grab;
  arlast=0;arloop();
}
function arloop(ts){
  if(!AR){return}
  if(!arlast)arlast=ts||0;
  const dt=Math.min(.05,((ts||0)-arlast)/1000);arlast=ts||0;
  if(AR.kind==="star"){if(!AR.over)starStep(dt);starPaint()}
  else if(AR.kind==="hunt"){if(!AR.over)huntStep(dt);huntPaint()}
  else{if(!AR.over)arstep(dt);arpaint()}
  araf=requestAnimationFrame(arloop);
}
function arstep(dt){
  AR.t+=dt;
  AR.spawn-=dt;
  const gap=Math.max(0.34,0.95-AR.score*0.022);
  if(AR.spawn<=0){
    AR.spawn=gap;
    AR.list.push({x:24+Math.random()*(AW-48),y:-16,
      vy:66+AR.score*2.6+Math.random()*26,r:15,ph:Math.random()*6,sw:0.6+Math.random()*0.9});
  }
  for(const s of AR.list){s.y+=s.vy*dt;s.ph+=dt*3}
  const gone=AR.list.filter(s=>s.y>AH-14);
  if(gone.length){
    AR.miss+=gone.length;
    for(const g of gone)AR.pops.push({x:g.x,y:AH-24,life:.6,t:"놓침"});
    AR.list=AR.list.filter(s=>s.y<=AH-14);
  }
  AR.pops=AR.pops.filter(p=>{p.life-=dt;p.y-=26*dt;return p.life>0});
  if(AR.miss>=3){AR.over=true;setTimeout(()=>{G.scene="spiderend";render()},700)}
}
function arpaint(){
  actx.clearRect(0,0,AW,AH);
  const g=actx.createLinearGradient(0,0,0,AH);
  g.addColorStop(0,"#241E36");g.addColorStop(1,"#15121F");
  actx.fillStyle=g;actx.fillRect(0,0,AW,AH);
  actx.strokeStyle="rgba(216,71,126,.35)";actx.lineWidth=3;actx.strokeRect(1.5,1.5,AW-3,AH-3);
  // 바닥선
  actx.strokeStyle="rgba(200,120,120,.5)";actx.setLineDash([5,5]);actx.lineWidth=2;
  actx.beginPath();actx.moveTo(0,AH-14);actx.lineTo(AW,AH-14);actx.stroke();actx.setLineDash([]);
  for(const s of AR.list)arSpider(s);
  actx.textAlign="center";actx.font="800 14px system-ui";
  for(const p of AR.pops){
    actx.globalAlpha=Math.min(1,p.life*2.2);
    actx.fillStyle=p.t==="+1"?"#6BD98F":p.t==="놓침"?"#F25C5C":"#968CB0";
    actx.fillText(p.t,p.x,p.y);
  }
  actx.globalAlpha=1;
  actx.textAlign="left";actx.font="800 15px system-ui";actx.fillStyle="#F2D74E";
  actx.fillText(`잡은 수 ${AR.score}`,12,24);
  actx.textAlign="right";actx.fillStyle="#F25C5C";
  actx.fillText(`놓침 ${AR.miss} / 3`,AW-12,24);
}
function arSpider(s){
  const x=s.x,y=s.y,r=s.r,sway=Math.sin(s.ph)*s.sw*4;
  actx.strokeStyle="rgba(255,255,255,.30)";actx.lineWidth=1;
  actx.beginPath();actx.moveTo(x-sway*0.5,0);actx.lineTo(x,y-r*0.9);actx.stroke();
  actx.save();actx.translate(x+sway*0.15,y);
  actx.strokeStyle="#8E6BD9";actx.lineWidth=2.2;actx.lineCap="round";
  // 다리 여덟 개 — 왼쪽 넷, 오른쪽 넷. 무릎을 위로 세웠다가 바깥으로 내린다
  for(const side of [-1,1]){
    for(let k=0;k<4;k++){
      const yo=(-1.15+k*0.75)*r*0.42;
      const w=Math.sin(s.ph*2.4+k*0.9+(side>0?0:1.6))*r*0.18;
      actx.beginPath();
      actx.moveTo(side*r*0.4,yo);
      actx.lineTo(side*r*1.25,yo-r*0.55+w);
      actx.lineTo(side*r*2.0,yo+r*0.40+w);
      actx.stroke();
    }
  }
  actx.beginPath();actx.arc(0,-r*0.15,r*0.85,0,7);actx.fillStyle="#8E6BD9";actx.fill();
  actx.beginPath();actx.arc(0,r*0.6,r*0.5,0,7);actx.fillStyle="#B79BEA";actx.fill();
  actx.fillStyle="#2A2A30";
  for(const e of [-.3,-.1,.1,.3]){actx.beginPath();actx.arc(e*r,r*0.52,r*0.1,0,7);actx.fill()}
  actx.restore();
}
/* 상금은 잡은 만큼. 대신 판마다 요금을 냅니다 */
const ARCADE_FEE={spider:10,star:10,hunt:20};
const arcadePrize=sc=>sc*3;

/* ═══════════ 미니게임 · 별 줍기 ═══════════
   화면을 손가락으로 끌어 좌우로 움직이고, 점프 버튼으로 발판을 오르며 별을 모읍니다. */
const STAR_TIME=45;
function starStart(){
  acv=document.getElementById("acv");actx=acv.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  AW=acv.clientWidth;AH=Math.round(AW*1.28);
  acv.width=AW*dpr;acv.height=AH*dpr;acv.style.height=AH+"px";
  actx.setTransform(dpr,0,0,dpr,0,0);
  const F=AH-18;
  const plat=[
    {x:0,y:F,w:AW},
    {x:22,y:F-104,w:AW*0.30},
    {x:AW-22-AW*0.32,y:F-104,w:AW*0.32},
    {x:AW/2-AW*0.19,y:F-196,w:AW*0.38},
    {x:16,y:F-288,w:AW*0.27},
    {x:AW-16-AW*0.29,y:F-288,w:AW*0.29},
    {x:AW/2-AW*0.16,y:F-378,w:AW*0.32},
  ];
  AR={kind:"star",score:0,t:STAR_TIME,over:false,plat,stars:[],pops:[],
      p:{x:AW/2,y:F-20,vx:0,vy:0,w:15,h:22,ground:true,face:1,squash:0},
      touch:null};
  for(let i=0;i<3;i++)spawnStar();
  let downT=0,downX=0,downY=0,moved=0;
  const at=ev=>{
    const rc=acv.getBoundingClientRect();
    const pt=ev.touches&&ev.touches[0]?ev.touches[0]:ev;
    return{x:pt.clientX-rc.left,y:pt.clientY-rc.top};
  };
  const start=ev=>{
    if(!AR||AR.over)return;
    if(ev.cancelable)ev.preventDefault();
    const q=at(ev);downT=Date.now();downX=q.x;downY=q.y;moved=0;
    AR.drag=true;AR.touch=q.x;
  };
  const move=ev=>{
    if(!AR||AR.over||!AR.drag)return;
    if(ev.cancelable)ev.preventDefault();
    const q=at(ev);
    moved=Math.max(moved,Math.hypot(q.x-downX,q.y-downY));
    AR.touch=q.x;
  };
  const end=ev=>{
    if(!AR||AR.over)return;
    // 짧게 톡 치면 점프. 끌었으면 이동으로만 친다
    if(Date.now()-downT<260&&moved<14)starJump();
    AR.drag=false;AR.touch=null;
  };
  acv.addEventListener("touchstart",start,{passive:false});
  acv.addEventListener("touchmove",move,{passive:false});
  acv.addEventListener("touchend",end);
  acv.addEventListener("touchcancel",end);
  acv.addEventListener("mousedown",start);
  acv.addEventListener("mousemove",move);
  acv.addEventListener("mouseup",end);
  acv.addEventListener("mouseleave",end);
  arlast=0;arloop();
}
function spawnStar(){
  const pl=AR.plat[1+((Math.random()*(AR.plat.length-1))|0)];
  AR.stars.push({x:pl.x+12+Math.random()*Math.max(10,pl.w-24),y:pl.y-20,ph:Math.random()*6});
}
let lastJump=0;
function starJump(){
  if(!AR||AR.kind!=="star"||AR.over)return;
  const now=Date.now();
  if(now-lastJump<130)return;              // 같은 탭이 두 번 들어오는 것 방지
  // 발판을 막 벗어난 직후에도 잠깐은 뛸 수 있게 (코요테 타임)
  if(AR.p.ground||AR.p.coyote>0){
    lastJump=now;
    AR.p.vy=-700;AR.p.ground=false;AR.p.coyote=0;AR.p.squash=-0.25;
  }
}
/* 점프 입력을 여러 경로로 받습니다. 기기마다 들어오는 이벤트가 달라서입니다. */
function bindJump(btn){
  if(!btn)return;
  const fire=e=>{if(e&&e.cancelable)e.preventDefault();starJump()};
  btn.addEventListener("touchstart",fire,{passive:false});
  btn.addEventListener("pointerdown",fire);
  btn.addEventListener("mousedown",fire);
  btn.addEventListener("click",fire);
}
function onKeyJump(e){
  if(G.scene!=="stargame")return;
  if(e.code==="Space"||e.code==="ArrowUp"||e.key===" "){e.preventDefault();starJump()}
}
function starStep(dt){
  const p=AR.p;
  AR.t-=dt;
  if(AR.t<=0){AR.t=0;AR.over=true;setTimeout(()=>{G.scene="starend";render()},600);return}
  // 좌우 이동 — 손가락 위치를 따라간다
  if(AR.touch!==null){
    const d=AR.touch-p.x;
    p.vx=Math.max(-300,Math.min(300,d*7));
    if(Math.abs(d)>3)p.face=d>0?1:-1;
  }else p.vx*=0.82;
  p.x=Math.max(p.w,Math.min(AW-p.w,p.x+p.vx*dt));
  // 중력
  p.vy+=1750*dt;
  const py=p.y;
  p.y+=p.vy*dt;
  p.ground=false;
  for(const pl of AR.plat){
    if(p.vy>=0 && py<=pl.y+1 && p.y>=pl.y && p.x>pl.x-6 && p.x<pl.x+pl.w+6){
      p.y=pl.y;p.vy=0;p.ground=true;
      if(p.squash<0)p.squash=0.3;
    }
  }
  p.coyote=p.ground?0.12:Math.max(0,(p.coyote||0)-dt);
  if(p.y>AH+60){p.x=AW/2;p.y=AH-40;p.vy=0}
  p.squash*=Math.pow(0.02,dt);
  // 별 획득
  for(const st of AR.stars.slice()){
    st.ph+=dt*3;
    if(Math.hypot(st.x-p.x,st.y-(p.y-p.h*0.6))<26){
      AR.stars=AR.stars.filter(x=>x!==st);
      AR.score++;AR.pops.push({x:st.x,y:st.y,life:.6,t:"+1"});
      spawnStar();
    }
  }
  AR.pops=AR.pops.filter(q=>{q.life-=dt;q.y-=28*dt;return q.life>0});
}
function starPaint(){
  const p=AR.p;
  actx.clearRect(0,0,AW,AH);
  const g=actx.createLinearGradient(0,0,0,AH);
  g.addColorStop(0,"#1E1B33");g.addColorStop(1,"#14121D");
  actx.fillStyle=g;actx.fillRect(0,0,AW,AH);
  actx.strokeStyle="rgba(216,71,126,.35)";actx.lineWidth=3;actx.strokeRect(1.5,1.5,AW-3,AH-3);
  // 발판
  for(const pl of AR.plat){
    actx.fillStyle="#3A3550";actx.fillRect(pl.x,pl.y,pl.w,9);
    actx.fillStyle="#5A5178";actx.fillRect(pl.x,pl.y,pl.w,2.5);
  }
  // 별
  for(const st of AR.stars){
    const b=1+Math.sin(st.ph)*0.12;
    actx.save();actx.translate(st.x,st.y+Math.sin(st.ph)*3);actx.scale(b,b);
    actx.beginPath();
    for(let i=0;i<10;i++){
      const rr=i%2?4.5:11,a=-Math.PI/2+i*Math.PI/5;
      actx[i?"lineTo":"moveTo"](Math.cos(a)*rr,Math.sin(a)*rr);
    }
    actx.closePath();actx.fillStyle="#F2D74E";actx.fill();
    actx.restore();
  }
  // 캐릭터
  const sq=1+p.squash, wq=1-p.squash*0.6;
  actx.save();actx.translate(p.x,p.y);
  actx.fillStyle="rgba(0,0,0,.3)";
  actx.beginPath();actx.ellipse(0,-1,p.w*0.9,3.5,0,0,7);actx.fill();
  actx.scale(wq,sq);
  actx.fillStyle="#4FC3D9";
  actx.beginPath();actx.roundRect?actx.roundRect(-p.w/2,-p.h,p.w,p.h,5):actx.rect(-p.w/2,-p.h,p.w,p.h);
  actx.fill();
  actx.beginPath();actx.arc(0,-p.h-6,8,0,7);actx.fillStyle="#4FC3D9";actx.fill();
  actx.strokeStyle="rgba(255,255,255,.85)";actx.lineWidth=1.6;actx.stroke();
  actx.fillStyle="#16203A";
  actx.beginPath();actx.arc(p.face*3,-p.h-7,1.7,0,7);actx.fill();
  actx.restore();
  // HUD
  actx.textAlign="center";actx.font="800 14px system-ui";
  for(const q of AR.pops){actx.globalAlpha=Math.min(1,q.life*2);actx.fillStyle="#F2D74E";
    actx.fillText(q.t,q.x,q.y)}
  actx.globalAlpha=1;
  actx.textAlign="left";actx.font="800 15px system-ui";actx.fillStyle="#F2D74E";
  actx.fillText(`별 ${AR.score}`,12,24);
  actx.textAlign="right";
  actx.fillStyle=AR.t<10?"#F25C5C":"#968CB0";
  actx.fillText(`${AR.t.toFixed(1)}초`,AW-12,24);
}
const starPrize=sc=>sc*4;

/* ═══════════ 미니게임 · 좀비 헌터 ═══════════
   좌우로 움직이며 위에서 내려오는 좀비를 쏩니다. 총알은 0.95초마다 한 발. 한 방이면 죽습니다. */
const GUN_COOL=0.11;
const TANK_EVERY=25;   // 이만큼 잡을 때마다 보라 좀비가 나온다
const TANK_HP=10;      // 열 방을 맞아야 쓰러진다
function huntStart(){
  acv=document.getElementById("acv");actx=acv.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  AW=acv.clientWidth;AH=Math.round(AW*1.26);

function huntStep(dt){
  const h=AR.h;
  AR.t+=dt;
  // 손가락 따라 좌우 이동
  if(AR.touch!==null&&AR.drag){
    const d=AR.touch-h.x;
    h.x=Math.max(h.w,Math.min(AW-h.w,h.x+Math.max(-360,Math.min(360,d*8))*dt));
  }
  // 자동 사격
  AR.cool-=dt;
  if(AR.cool<=0){AR.cool=GUN_COOL;AR.b.push({x:h.x,y:h.y-20,vy:-700})}
  for(const b of AR.b)b.y+=b.vy*dt;
  AR.b=AR.b.filter(b=>b.y>-20);
  // 좀비 등장
  AR.spawn-=dt;
  if(AR.spawn<=0){
    AR.spawn=Math.max(0.42,1.15-AR.score*0.022);
    AR.z.push({x:26+Math.random()*(AW-52),y:-18,r:14,hp:1,
      vy:34+AR.score*1.5+Math.random()*18,ph:Math.random()*6});
  }
  // 25마리마다 보라 좀비
  if(AR.score>=AR.tankAt){
    AR.tankAt+=TANK_EVERY;
    AR.z.push({x:40+Math.random()*(AW-80),y:-30,r:23,hp:TANK_HP,maxHp:TANK_HP,tank:true,
      vy:26+AR.score*0.5,ph:Math.random()*6});
    AR.pops.push({x:AW/2,y:60,life:1.3,t:"보라 좀비 등장",c:"#B79BEA"});
  }
  for(const z of AR.z){z.ph+=dt*4;z.y+=z.vy*dt;if(z.flash>0)z.flash-=dt}
  // 명중 — 한 방이면 죽는다
  for(const b of AR.b.slice()){
    for(const z of AR.z.slice()){
      if(Math.hypot(z.x-b.x,z.y-b.y)<z.r+6){
        AR.b=AR.b.filter(x=>x!==b);
        z.hp=(z.hp||1)-1;
        z.flash=.12;
        if(z.hp<=0){
          AR.z=AR.z.filter(x=>x!==z);
          AR.score+=z.tank?5:1;
          AR.pops.push({x:z.x,y:z.y,life:.6,t:z.tank?"+5":"+1",c:z.tank?"#B79BEA":"#6BD98F"});
        }
        break;
      }
    }
  }
  // 방어선 돌파
  const through=AR.z.filter(z=>z.y>AR.h.y-24);
  if(through.length){
    AR.life-=through.length;
    for(const z of through)AR.pops.push({x:z.x,y:AR.h.y-30,life:.7,t:"물렸다",c:"#F25C5C"});
    AR.z=AR.z.filter(z=>z.y<=AR.h.y-24);
  }
  AR.pops=AR.pops.filter(p=>{p.life-=dt;p.y-=26*dt;return p.life>0});
  if(AR.life<=0){AR.life=0;AR.over=true;setTimeout(()=>{G.scene="huntend";render()},700)}
}
function huntPaint(){

  actx.fillStyle=g;actx.fillRect(0,0,AW,AH);

  actx.beginPath();actx.moveTo(0,-h.w*0.4);actx.lineTo(0,-h.w*1.5);actx.stroke();
  const flash=AR.cool>GUN_COOL-0.09;

  actx.fillText(`처치 ${AR.score}`,12,24);
  actx.textAlign="right";actx.fillStyle="#F25C5C";
  actx.fillText("♥".repeat(AR.life)||"—",AW-12,24);
}
function huntZombie(z){
  const lp=Math.sin(z.ph),r=z.r;
  const body=z.flash>0?"#fff":(z.tank?"#7B4FC4":"#4E9E43");
  const head=z.flash>0?"#fff":(z.tank?"#B79BEA":"#7FCB6B");
  const limb=z.tank?"#5B3796":"#2F6B2A";
  const arm =z.tank?"#9B78D9":"#6FC25C";
  actx.save();actx.translate(z.x,z.y);actx.rotate(Math.PI/2+lp*0.18);
  actx.strokeStyle=limb;actx.lineWidth=r*0.28;actx.lineCap="round";
  actx.beginPath();actx.moveTo(-r*0.2,r*0.45);
  actx.lineTo(-r*1.3-Math.max(0,-lp)*r*0.45,r*0.72);actx.stroke();
  actx.beginPath();actx.moveTo(-r*0.2,-r*0.45);
  actx.lineTo(-r*0.9+lp*r*0.3,-r*0.78);actx.stroke();
  actx.strokeStyle=arm;actx.lineWidth=r*0.25;
  actx.beginPath();actx.moveTo(r*0.2,-r*0.5);actx.lineTo(r*1.5+lp*r*0.18,-r*0.6);actx.stroke();
  actx.beginPath();actx.moveTo(r*0.2,r*0.5);actx.lineTo(r*1.1-lp*r*0.22,r*0.7);actx.stroke();
  actx.beginPath();actx.ellipse(-r*0.15,0,r*0.8,r*0.6,0,0,7);
  actx.fillStyle=body;actx.fill();
  actx.strokeStyle=z.tank?"rgba(40,20,70,.8)":"rgba(20,50,18,.75)";actx.lineWidth=1.3;actx.stroke();
  actx.beginPath();actx.arc(r*0.6,lp*r*0.1,r*0.44,0,7);
  actx.fillStyle=head;actx.fill();actx.stroke();
  actx.fillStyle=z.tank?"#2A1240":"#1E3A1A";
  actx.beginPath();actx.arc(r*0.82,-r*0.15,r*0.09,0,7);actx.fill();
  actx.beginPath();actx.arc(r*0.82,r*0.15,r*0.09,0,7);actx.fill();
  actx.restore();
  if(z.tank){                       // 남은 타격 수
    const w=r*1.8;
    actx.fillStyle="rgba(0,0,0,.55)";actx.fillRect(z.x-w/2,z.y-r-11,w,5);
    actx.fillStyle="#B79BEA";actx.fillRect(z.x-w/2,z.y-r-11,w*(z.hp/z.maxHp),5);
    actx.textAlign="center";actx.font="800 11px system-ui";actx.fillStyle="#D9C7F5";
    actx.fillText(z.hp,z.x,z.y-r-15);
  }
}

function pendingUnlock(){return FACILITIES.find(f=>f.cond(G)&&!G.announced.includes(f.id))}
const lootTotal=()=>Object.entries(G.loot).reduce((s,[id,n])=>s+ITEMS[id].price*n,0);
/* 감정 — 가중치대로 하나를 뽑아 확정 물건으로 바꿉니다 */
function appraise(id){
  const t=ITEMS[id].mystery.into;
  let r=Math.random()*t.reduce((a,x)=>a+x[1],0);
  for(const e of t){if((r-=e[1])<0)return e[0]}
  return t[t.length-1][0];
}

/* 버튼을 누르면 화면을 통째로 다시 그리므로, 그 자리에서 애니메이션을 걸면 곧바로 지워집니다.
   그래서 "무엇을 눌렀고 얼마가 나갔는지"만 적어 두었다가 다시 그린 뒤에 재생합니다. */
let tapFx=null;
function markTap(sel,amount,plus){tapFx={sel,amount,plus:!!plus}}
function playTap(){
  if(!tapFx)return;
  const fx=tapFx;tapFx=null;
  const b=document.querySelector(fx.sel);
  if(!b)return;
  b.classList.add("tapped");
  const ring=document.createElement("span");ring.className="tapring";
  const fly=document.createElement("span");fly.className="costfly"+(fx.plus?" plus":"");
  fly.textContent=(fx.plus?"+":"−")+fx.amount+" G";
  b.appendChild(ring);b.appendChild(fly);
  setTimeout(()=>b.classList.remove("tapped"),280);
  setTimeout(()=>{ring.remove();fly.remove()},1000);
  /* 상단 골드도 한 번 튀게 해서 어디로 갔는지 눈이 따라갑니다 */
  const g=document.getElementById("goldnum");
  if(g){g.classList.add("goldbump");setTimeout(()=>g.classList.remove("goldbump"),420)}
}

        ${faceTag(r)}<div class="hd"><b>${r.name}</b><span>${r.major?majorOf(r.major).n:`Lv ${r.lvl}`}</span></div>
        ${r.major?`<div class="tag">${majorOf(r.major).d} · 이미 정해졌습니다</div>`
          :r.lvl<MAJOR_LV?`<div class="tag">Lv ${MAJOR_LV}이 되어야 전공을 정할 수 있습니다 (현재 Lv ${r.lvl})</div>`
          :`<div class="chips" style="margin-top:6px">${pool.map(m=>
            `<button class="pickb" data-maj="${i}|${m.id}">${m.n}</button>`).join("")}</div>`}
      </div>`).join("")||`<div class="card"><p>명단이 비었습니다.</p></div>`}
      <div class="bar"><span class="tag"></span><button class="ghost" id="bk">캠퍼스로</button></div>`;
    el.querySelectorAll("[data-maj]").forEach(b=>b.onclick=()=>{
      const [i,id]=b.dataset.maj.split("|");
      const r=G.roster[+i];
      if(r.lvl<MAJOR_LV||r.major)return;
      r.major=id;logAdd(r,`${majorOf(id).n} 전공 선택`);render()});
    document.getElementById("bk").onclick=()=>{G.scene="campus";render()};
    return;
  }
  if(S==="tower"){
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">메모리얼 홀</span><span class="tag">새겨진 이름 <b>${G.memorial.length}</b></span></div>
      ${npcBar("tower")}
      <div class="card"><h2>돌아오지 못한 사람들</h2>
      <p>게이트 안에서 잃은 사람들의 기록입니다.</p></div>
      ${G.memorial.length?[...G.memorial].reverse().map(m=>`<div class="app" style="border-left-color:var(--bad)">
        ${faceTag(m)}<div class="hd"><b>${m.name}</b><span>Lv ${m.lvl} · ${m.gate} ${m.day}일차</span></div>
        <div class="tag" style="margin-bottom:8px">${m.where}에서 쓰러짐</div>
        <div class="grid">${STATS.map(s=>`<div class="g">${s.n}<b>${m.stats[s.k]}</b></div>`).join("")}</div>
        <div class="gearline">마지막 장비 · ${SLOTS.map(s=>m.gear[s.k]?ITEMS[m.gear[s.k]].n:null).filter(Boolean).join(", ")||"없음"}</div>
        ${m.log.length?`<div class="tag" style="margin-top:8px">기록</div>
          <div class="rec">${m.log.map(l=>`<div>· ${l}</div>`).join("")}</div>`:""}
      </div>`).join(""):`<div class="card"><p>아직 아무 이름도 새겨지지 않았습니다.</p></div>`}
      <div class="bar"><span class="tag"></span><button class="ghost" id="bk">캠퍼스로</button></div>`;
    document.getElementById("bk").onclick=()=>{G.scene="campus";render()};
    return;
  }
  if(S==="soon"){
    const f=FACILITIES.find(x=>x.id===G.soonName);
    el.innerHTML=logo+`${npcBar(G.soonName)}
      <div class="card"><h2>${f.n}</h2>
      <p>해금은 됐지만 안쪽은 아직 비어 있습니다. ${f.d} 기능이 여기에 들어갈 자리입니다.</p></div>
      <div class="bar"><span class="tag"></span><button class="ghost" id="bk">캠퍼스로</button></div>`;
    document.getElementById("bk").onclick=()=>{G.scene="campus";render()};
    return;
  }
  if(S==="gates"){
    const top=Math.max(1,...G.roster.map(r=>r.lvl));
    const GATES=[
      {n:"정문 게이트",d:"대학가 골목. 게이트 에너지로 변형된 기형 생물이 출몰한다",lv:1,open:true},
      {n:"후문 게이트",d:"상가 지하. 더 큰 것이 있다",lv:5,open:top>=5},
      {n:"강의동 게이트",d:"본관 뒤편. 아직 아무도 못 봤다",lv:10,open:top>=10},
    ];
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">게이트 선택</span><span class="tag">출동 <b>${party().length}</b>명</span></div>
      <div class="card"><h2>어디로 들어갈까</h2>
      <p>하루가 지날 때마다 안쪽의 것들이 강해집니다.<br><br>
      돌아온 사람들 말로는, <b style="color:var(--gate)">사흘째부터 결이 다른 것이 돌아다닌다</b>고 합니다.
      닷새를 넘겨 본 사람은 아직 없습니다.</p></div>
      <div class="bldbg" ${BLD_ART.gate?`style="background-image:url('${artUrl(BLD_ART.gate)}')"`:""}>
      ${GATES.map((g,i)=>`<button class="fac ${g.open?"":"lock"}" ${g.open?`data-g="${i}"`:"disabled"}>
        <span class="ic">${g.open?"🚪":"🔒"}</span>
        <span class="tx"><b>${g.n}</b><span>${g.d} · 권장 Lv ${g.lv}</span></span></button>`).join("")}
      </div>
      <div class="bar"><span class="tag"></span><button class="ghost" id="bk">캠퍼스로</button></div>`;
    el.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      G.pickedGate=GATES[+b.dataset.g].n;G.scene="confirm";render()});
    document.getElementById("bk").onclick=()=>{G.scene="campus";render()};
    return;
  }
  if(S==="confirm"){
    const t=party();
    el.innerHTML=logo+`
      <div class="bar"><span class="tag">${G.pickedGate}</span><span class="tag">출동 <b>${t.length}</b>명</span></div>
      <div class="card"><h2>출동 명단 확인</h2>
      <p>쓰러진 사람은 돌아오지 못하고, 가진 것은 바닥에 남습니다.
      배낭은 한 사람당 ${BAG_MAX}칸입니다.</p></div>
      ${t.map(r=>`<div class="app">${faceTag(r)}<div class="hd"><b>${r.name}</b>
        <span>${r.major?majorOf(r.major).n:"새내기"} · Lv ${r.lvl}</span></div>
        ${statGrid(r)}${invPanel(r,G.roster.indexOf(r),"manage",t)}${gearLine(r)}${hpLine(r)}</div>`).join("")}
      ${t.some(r=>!r.gear.rh)?`<div class="tag" style="color:var(--bad)">맨손인 사람이 있습니다.</div>`:""}
      <div class="tag">탄약 · ${ammoLine()}</div>
      ${t.some(r=>{const g=ITEMS[r.gear.rh];return g&&g.ammo&&(G.ammo[g.ammo]||0)<10})?
        `<div class="tag" style="color:var(--bad)">탄약이 부족한 총이 있습니다. 떨어지면 맨손으로 싸웁니다.</div>`:""}
      <div class="card"><h2>창고에서 꺼내기</h2>
      <p>들어가기 전 마지막입니다. 배낭에 자리가 있어야 넣을 수 있습니다.</p>
      ${Object.entries(G.store).filter(([,n])=>n>0).map(([id,n])=>{const o=G.rowSel==="hand:"+id;
        return `<div class="buyrow tap ${o?"open":""}" data-row="hand:${id}">
        <div><b>${itemIcon(id)}${ITEMS[id].n}</b> × ${n}<br><span class="tag">${ITEMS[id].d}</span></div>
        <span class="caret">${o?"▴":"▾"}</span>
        ${o?`<div class="acts"><span class="tag">누구에게</span>
          <div class="chips">${t.map(r=>`<button class="pickb" data-hand="${id}|${G.roster.indexOf(r)}" ${bagRoom(r)<=0?"disabled":""}>${r.name}</button>`).join("")}</div>
        </div>`:""}</div>`}).join("")||`<div class="tag" style="margin-top:10px">창고가 비었습니다.</div>`}</div>
      <div class="card"><h2>정말 들어가시겠습니까?</h2>
      <p>${G.pickedGate} 안쪽은 아직 아무도 지도를 그리지 못했습니다.</p></div>
      <div class="bar"><button class="ghost" id="no">아니오</button><button id="yes">들어간다</button></div>`;
    el.querySelectorAll("[data-hand]").forEach(b=>b.onclick=()=>{G.rowSel=null;
      const [id,i]=b.dataset.hand.split("|");const r=G.roster[+i];
      if(bagRoom(r)<=0||!(G.store[id]>0))return;
      G.store[id]--; if(G.store[id]<=0)delete G.store[id];
      r.bag.push(id);render()});
    bindInv();
    document.getElementById("no").onclick=()=>{G.scene="gates";render()};
    document.getElementById("yes").onclick=()=>{
      G.mode="run";G.day=1;G.instants=[];G.offer=null;G.ground=[];G.sel=null;
      G.gateName=G.pickedGate;G.scene="gateforce";render()};
    return;
  }
}
addEventListener("keydown",onKeyJump);
addEventListener("resize",()=>{if(G.scene==="battle")fitCanvas()});
bootGame();

</script>
</body>
</html>
