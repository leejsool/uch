<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniverCityHunter</title>
<style>
  :root{
    --bg:#1B1726;--panel:#2A2340;--panel2:#352C4E;--line:#4A3F69;
    --ink:#EAE6F2;--dim:#968CB0;--gate:#D8477E;--mark:#F2D74E;--ok:#6BD98F;--cy:#4FC3D9;--bad:#C87878;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;
    font-family:'Pretendard','Apple SD Gothic Neo',system-ui,'Malgun Gothic',sans-serif;
    padding:12px 12px calc(14px + env(safe-area-inset-bottom));}
  #app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
  .logo{font-size:19px;font-weight:800;letter-spacing:-.03em}
  .logo em{font-style:normal;color:var(--gate)}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tag{font-size:12px;color:var(--dim)}
  .tag b{color:var(--mark)}
  button{font-family:inherit;font-size:14px;font-weight:700;background:transparent;color:var(--mark);
    border:1px solid var(--mark);border-radius:3px;padding:10px 16px;cursor:pointer;transition:background .12s}
  button:hover:not(:disabled),button:focus-visible{background:var(--mark);color:var(--bg)}
  button.ghost{color:var(--dim);border-color:var(--line);font-weight:600}
  button.ghost:hover:not(:disabled),button.ghost:focus-visible{background:var(--line);color:var(--ink)}
  button:disabled{opacity:.3;cursor:not-allowed;background:transparent!important;color:var(--dim)!important;border-color:var(--line)!important}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:15px}
  .card.lock{opacity:.45}   /* 아직 못 여는 창구 — 이름만 보인다 */
  /* 끝난 의뢰 — 회색으로 접혀 제목만. 누르면 펼쳐집니다 */
  .card.done{cursor:pointer;background:var(--bg);border-color:var(--line)}
  .card.done h2{color:var(--dim);margin-bottom:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card.done h2 small{font-size:11px;font-weight:400}
  .card.done.open h2{margin-bottom:7px}
  .card.done p,.card.done .tag{opacity:.8}
  .card h2{font-size:17px;font-weight:800;margin-bottom:7px}
  /* 제목 오른쪽에 버튼을 붙일 때 */
  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
  .cardhead h2{margin-bottom:0}
  .cardhead button{font-size:12.5px;padding:6px 11px;white-space:nowrap}
  .card p,.app p{font-size:13.5px;color:var(--dim);line-height:1.75}

  /* 오프닝 — 배경 그림 위에 나레이션이 쌓입니다. 그림은 INTRO_ART에 경로만 넣으면 됩니다 */
  #intro{position:relative;min-height:min(62vh,560px);display:flex;flex-direction:column;justify-content:flex-end;
    background:var(--panel);background-size:cover;background-position:center 28%;
    border:1px solid var(--line);border-radius:4px;padding:20px;overflow:hidden}
  #intro .scrim{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(20,17,32,.20) 0%,rgba(20,17,32,.45) 38%,rgba(20,17,32,.90) 78%,rgba(20,17,32,.97) 100%)}
  #intro .lines{position:relative;display:flex;flex-direction:column;gap:13px}
  #intro .ln{font-size:14.5px;line-height:1.9;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  #intro .ln.q{color:var(--dim);font-size:13.5px}
  .cursor{display:inline-block;width:7px;height:16px;background:var(--gate);vertical-align:-2px;animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:0}}

  .stat{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
    border-radius:3px;padding:9px 11px;margin-bottom:5px}
  .stat.locked{opacity:.5}
  .stat .nm{flex:1;font-size:13.5px;font-weight:700}
  .stat .nm span{display:block;font-size:11px;font-weight:400;color:var(--dim);margin-top:2px}
  .stat .vl{font-size:16px;font-weight:800;color:var(--mark);min-width:28px;text-align:center}
  .stat button{padding:5px 11px;font-size:15px;line-height:1}
  .derived{font-size:12px;color:var(--dim);line-height:1.8;padding:2px}
  .derived b{color:var(--ink);font-weight:700}

  .place{width:100%;text-align:left;font-family:inherit;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gate);
    border-radius:3px;padding:13px;margin-bottom:7px;cursor:pointer;font-weight:400}
  .place:hover,.place:focus-visible{background:var(--panel2);color:var(--ink)}
  .place h3{font-size:15px;font-weight:800;margin-bottom:4px}
  .place p{font-size:12.5px;color:var(--dim);line-height:1.6}
  .place .risk{font-size:11.5px;color:var(--mark);margin-top:5px;display:block}
  /* 그 장소에서 나올 만한 것. 손에 넣어 본 적 없는 것은 ?? 로 남습니다 */
  .place .finds{font-size:11px;color:var(--dim);margin-top:4px;display:block;line-height:1.7}
  .place .finds i{font-style:normal;border:1px solid var(--line);border-radius:3px;padding:1px 5px;
    margin:0 3px 3px 0;display:inline-block}
  .place .finds .kn{color:var(--ink);border-color:var(--mark)}
  .place .finds .unk{color:var(--dim);opacity:.65}

  .fac{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
    border-radius:3px;padding:12px;margin-bottom:6px;width:100%;text-align:left;
    font-family:inherit;color:var(--ink);cursor:pointer}
  .fac.lock{opacity:.45;cursor:not-allowed}
  .fac.hot{border-color:var(--mark)}
  .fac .ic{width:34px;height:34px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);
    display:grid;place-items:center;font-size:15px;flex:0 0 auto}
  .fac .tx{flex:1}
  .fac .tx b{display:block;font-size:14.5px;font-weight:800}
  .fac .tx span{font-size:11.5px;color:var(--dim);font-weight:400}
  .fac .tx i{font-style:normal;color:var(--mark)}

  .app{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cy);
    border-radius:3px;padding:12px;margin-bottom:7px}
  .app.out{border-left-color:var(--line);opacity:.5}
  .app.sel{border-left-color:var(--mark)}
  /* 얼굴을 왼쪽에 띄우고, 이름과 두 막대가 그 오른쪽으로 흐릅니다 */
  .app .hd{display:flex;align-items:center;gap:8px;margin-bottom:2px;min-height:30px}
  .app .hd b{flex:1 1 auto}
  .app:after{content:"";display:block;clear:both}
  .pf{float:left;width:72px;height:72px;margin:0 11px 7px 0;border-radius:6px;object-fit:cover;
    border:1px solid var(--line);background:#241E36}
  .pf.none{display:block;border-style:dashed}
  .app.mem .pf{filter:grayscale(1) brightness(.9)}   /* 메모리얼 홀 — 돌아오지 못한 사람은 흑백으로 */
  /* 막대와 그 아래 글자는 한 덩어리로 움직입니다. 따로 놀면 줄이 어긋납니다 */
  .barwrap{overflow:hidden}
  .app .hd,.app .grid,.app .inv,.app .gearline{overflow:hidden}
  .app .grid,.app .inv{clear:both}
  .app .hd b{font-size:15px;font-weight:800}
  .app .hd span{font-size:11.5px;color:var(--dim)}
  /* 능력치 6칸을 한 줄에 — 이름 위, 값 아래 */
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
  .g{background:var(--panel2);border-radius:3px;padding:5px 2px;font-size:10px;color:var(--dim);
     line-height:1.3;text-align:center;white-space:nowrap}
  .g b{display:block;font-size:14px;font-weight:800;color:var(--ink);margin-top:1px}
  .g.hi b{color:var(--mark)} .g.lo b{color:var(--bad)} .g.off b{color:var(--dim)}
  .expb{height:5px;background:#221C30;border-radius:3px;overflow:hidden;margin-top:7px}
  .expb i{display:block;height:100%;background:var(--cy)}
  .hpb{height:6px;background:#221C30;border-radius:3px;overflow:hidden;margin-top:6px}
  .hpb i{display:block;height:100%;background:var(--ok)}
  .hpb.low i{background:var(--bad)}
  /* 이름표 — 막대 한 줄: 체력 ▬▬▬ 12 / 20 */
  .srow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);margin-top:5px;overflow:hidden}
  .app .hd b{white-space:nowrap}
  .app .hd span{text-align:right}
  .srow>span:first-child{flex:0 0 auto;width:3.2em}
  .srow>.hpb,.srow>.expb{flex:1 1 auto;margin-top:0}
  .srow>span:last-child{flex:0 0 auto;min-width:4.6em;text-align:right;font-variant-numeric:tabular-nums}
  .gearline{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.6}
  .gearline b{color:var(--ink)}
  .skl{width:100%;text-align:left;font-family:inherit;color:var(--ink);font-weight:400;
    background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:12px;margin-bottom:7px;cursor:pointer}
  .skl:hover,.skl:focus-visible{border-color:var(--mark);background:#463A5F;color:var(--ink)}
  .skl b{display:block;font-size:14.5px;font-weight:800;margin-bottom:3px}
  .skl span{font-size:12px;color:var(--dim)}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--mark)}
  /* 익힌 힘 — 올리거나(데스크톱) 누르면(모바일) 성능이 툴팁으로 뜹니다.
     button:hover 의 노란 배경이 이기지 않도록 클래스를 셋 겹쳐 둡니다 */
  .chips button.chip{position:relative;font-family:inherit;font-weight:600;cursor:pointer;line-height:1.5}
  .chips button.chip:hover,.chips button.chip:focus-visible,.chips button.chip.on{
    background:var(--panel2);color:var(--mark);border-color:var(--mark)}
  .chips .chip .tip{display:none;position:absolute;left:0;bottom:calc(100% + 6px);z-index:40;
    width:max-content;max-width:min(240px,70vw);text-align:left;white-space:normal;
    background:var(--panel);border:1px solid var(--mark);border-radius:4px;padding:7px 9px;
    font-size:11.5px;font-weight:400;color:var(--ink);line-height:1.6;
    box-shadow:0 6px 16px rgba(0,0,0,.55)}
  .chips .chip:hover .tip,.chips .chip:focus-visible .tip,.chips .chip.on .tip{display:block}

  .buyrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:10px;margin-top:8px}
  .buyrow.tap{cursor:pointer}
  .buyrow.open{border-color:var(--mark);background:#332B4A}
  .buyrow .caret{font-size:11px;color:var(--dim);flex:0 0 auto}
  .buyrow b{font-size:14px}
  .buyrow button{padding:7px 12px;font-size:12.5px;white-space:nowrap;position:relative}
  /* 눌렀다는 것이 보이도록 — 버튼이 한 번 눌리고 값이 위로 떠오릅니다 */
  @keyframes tapPulse{0%{transform:scale(1)}30%{transform:scale(.90)}100%{transform:scale(1)}}
  @keyframes costFly{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}
    18%{opacity:1;transform:translate(-50%,0) scale(1)}
    100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
  @keyframes tapRing{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
  .tapped{animation:tapPulse .26s ease;border-color:var(--mark)!important;color:var(--mark)!important}
  .tapring{position:absolute;inset:-2px;border-radius:4px;border:2px solid var(--mark);
    pointer-events:none;animation:tapRing .42s ease-out forwards}
  .costfly{position:absolute;left:50%;top:-4px;font-size:13px;font-weight:700;
    color:var(--bad);pointer-events:none;white-space:nowrap;z-index:5;
    text-shadow:0 1px 3px #000;animation:costFly .95s ease-out forwards}
  .costfly.plus{color:var(--ok)}
  /* 못 하는 까닭을 알리는 짧은 알림 — 화면을 다시 그려도 남습니다 */
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes toastOut{to{opacity:0;transform:translate(-50%,-8px)}}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,0);z-index:60;
    background:#3B2C3E;border:1px solid var(--bad);color:var(--ink);
    padding:11px 18px;border-radius:4px;font-size:13.5px;max-width:86vw;text-align:center;
    box-shadow:0 8px 22px rgba(0,0,0,.55);pointer-events:none;
    animation:toastIn .2s ease, toastOut .45s ease 1.9s forwards}
  /* 한 번만 뜨는 안내창 — 화면을 덮고, 확인을 눌러야 넘어갑니다 */
  .pop{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(12,9,20,.74);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    animation:popIn .18s ease}
  .pop .card{width:100%;max-width:400px;border-color:var(--mark);box-shadow:0 10px 30px rgba(0,0,0,.6)}
  .pop .bar{margin-top:13px}
  /* 본문 자리. 막대 같은 덩어리도 들어갈 수 있게 p 가 아니라 div 입니다 */
  .pop .txt{font-size:13.5px;color:var(--dim);line-height:1.75}
  .pop .txt .app{margin:9px 0 0;background:var(--panel2)}
  .pop .txt .app .hd{margin-bottom:0;min-height:0}
  /* 팝업 대사 — 초상 옆에 말풍선 글 */
  .pop .talkpop{display:flex;align-items:flex-start;gap:12px}
  .pop .talkpop .say{margin:0;flex:1;min-width:0}
  /* 대사 중에 물건을 받는 줄 — 그림을 왼쪽에 크게 */
  .pop .gotitem{display:flex;align-items:center;gap:12px}
  .pop .gotitem .ico{width:52px;height:52px;margin:0;padding:3px;box-sizing:border-box;
    background:#241E36;border-radius:4px;vertical-align:0}
  .pop .gotitem span{color:var(--ink)}
  @keyframes popIn{from{opacity:0}to{opacity:1}}
  @keyframes goldBump{0%,100%{transform:scale(1)}35%{transform:scale(1.25);color:var(--mark)}}
  .goldbump{display:inline-block;animation:goldBump .4s ease}
  .pickb{font-size:12px;font-weight:600;padding:6px 11px;border-radius:3px;
    border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer;font-family:inherit}
  .rec{font-size:11.5px;color:var(--dim);line-height:1.75;margin-top:4px}
  .pickb.on{border-color:var(--mark);color:var(--mark);background:#463A5F}
  /* 출동 명단 — 노랑 출동 · 초록 입원 · 반투명 대기 */
  .pickb.rest{border-color:var(--ok);color:var(--ok);background:#22402F}
  .pickb.rest:disabled{opacity:1;border-color:var(--ok)!important;color:var(--ok)!important;background:#22402F!important}
  .pickb.off{opacity:.45}
  .kd{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:99px;vertical-align:1px}
  .kd.perm{background:#28402F;color:var(--ok)} .kd.inst{background:#4A2438;color:#F08AB0}
  .kd.junk{background:#3A3450;color:var(--dim)}
  .kd.inst.dk{background:#2C1345;color:#C79BF2}   /* 어둠 강화판 */
  .kd.perm.wk{background:#12384A;color:#7FD8F0}   /* 실습동 강화판 */
  .inv{margin-top:9px} .invh{font-size:11px;color:var(--dim);font-weight:700;margin:8px 0 4px}
  .slot{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);
    border-radius:3px;padding:7px 9px;margin-bottom:4px;flex-wrap:wrap}
  .slot.tap{cursor:pointer}
  .slot.open{border-color:var(--mark);background:#332B4A}
  .slot .caret{font-size:11px;color:var(--dim);flex:0 0 auto;margin-left:auto}
  /* 고른 줄에서만 아래로 펼쳐지는 버튼 묶음 — 장비칸과 판매대가 같이 씁니다 */
  .acts{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px;
    padding-top:8px;border-top:1px solid var(--line)}
  .acts .chips{display:flex;flex-wrap:wrap;gap:5px;margin:0}
  .slot.pick{border-color:var(--mark)}
  .slot .sn{font-size:10.5px;color:var(--dim);min-width:44px;flex:0 0 auto}
  .slot .si{flex:1;font-size:12.5px;font-weight:700;line-height:1.35;min-width:0}
  .slot .si small{display:block;font-weight:400;font-size:10.5px;color:var(--dim);margin-top:1px}
  .slot:not(.has) .si{color:var(--dim);font-weight:400}
  .mv{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .mv .mini{font-size:10.5px;padding:3px 7px;color:var(--cy);border-color:#3C5566}
  .mini{font-size:11px;font-weight:600;padding:5px 9px;border-radius:3px;
    border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-family:inherit;flex:0 0 auto}
  .mini:disabled{opacity:.3} .mini.bad{color:#C87878;border-color:#5A3F4A}
  .mini.dk{color:#C79BF2;border-color:#4B2A70;background:#241338}
  .mini.dk small{font-weight:400;font-size:9.5px;opacity:.6;margin-left:3px}
  button.ghost.bad{color:#C87878;border-color:#5A3F4A}
  /* 제목 그림 — 지금은 캔버스로 그립니다. TITLE_ART에 경로를 넣으면 그 그림이 깔립니다 */
  /* 제목 화면 — 세로 그림을 화면 높이에 맞추고 버튼을 그 위에 얹습니다 */
  /* 본진 지도 — 그림 비율을 그대로 지켜야 표지판 자리가 맞습니다 */
  /* 건물 안 — 배경 위에 어두운 막을 덮어 글자가 읽히게 합니다 */
  .bldbg{position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;
    background-size:cover;background-position:center;padding:16px;margin-bottom:2px;
    min-height:min(72vh,660px);display:flex;flex-direction:column;justify-content:center;gap:10px}
  /* 게이트 선택 — 버튼이 셋뿐이라 그림을 위아래로 40% 남짓 덜어냅니다(cover 라 가운데가 남습니다) */
  .bldbg.gatebg{min-height:min(43vh,400px)}
  /* 출동 명단 — 이름 · 초상 · 상태 칸. 누르면 아래에 개요가 펼쳐집니다 */
  .sqgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .sq{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 4px 6px;
    text-align:center;cursor:pointer;min-width:0}
  .sq b{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
  .sq img,.sq .nf{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;background:#241E36}
  .sq .st{display:block;font-size:10px;color:var(--dim);margin-top:3px}
  .sq.on{border-color:var(--mark)} .sq.on .st{color:var(--mark)}
  .sq.off img,.sq.off .nf{opacity:.5}
  .sq.rest{border-color:var(--ok)} .sq.rest .st{color:var(--ok)}
  .sq.open{background:#332B4A;box-shadow:inset 0 0 0 1px var(--mark)}
  .sqd{margin-top:8px}
  .bldbg:before{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(14,11,24,.30) 0%,rgba(14,11,24,.44) 42%,rgba(14,11,24,.64) 100%)}
  .bldbg>*{position:relative}
  .bldbg .fac{background:rgba(22,18,36,.86);border-color:rgba(255,255,255,.18);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    box-shadow:0 3px 14px rgba(0,0,0,.45)}
  .bldbg .fac .tx b{text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .bldbg h2{margin-bottom:11px;text-shadow:0 2px 6px rgba(0,0,0,.9)}
  /* soft — 배경 그림을 흐리게 눌러 두고 그 위에 글과 선택지를 얹습니다(캠프파이어) */
  .bldbg.soft:before{-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
    background:linear-gradient(180deg,rgba(14,11,24,.28) 0%,rgba(14,11,24,.40) 42%,rgba(14,11,24,.62) 100%)}
  .bldbg .card{background:rgba(22,18,36,.80);border-color:rgba(255,255,255,.16);

    box-shadow:0 3px 14px rgba(0,0,0,.45)}
  .bldbg .card h2{margin-bottom:7px}
  .bldbg .place{background:rgba(22,18,36,.84);border-color:rgba(255,255,255,.18);
    border-left-color:var(--gate);margin-bottom:0;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    box-shadow:0 3px 14px rgba(0,0,0,.45)}
  /* 글자색까지 같이 잡습니다 — button:hover 의 검은 글씨가 이기면 배경에 묻혀 안 보입니다 */
  .bldbg .place:hover,.bldbg .place:focus-visible{background:rgba(38,31,60,.92);color:var(--mark)}
  .bldbg .place:hover h3,.bldbg .place:focus-visible h3{color:var(--mark)}
  .bldbg .place h3{text-shadow:0 1px 3px rgba(0,0,0,.7)}
  #map{position:relative;width:100%;aspect-ratio:941/1672;border:1px solid var(--line);
    border-radius:5px;overflow:hidden;background:#1B2A3A}
  #map>img{display:block;width:100%;height:100%;object-fit:fill}
  .pin{position:absolute;display:flex;align-items:center;justify-content:center;
    background:none;border:none;padding:0 4px;cursor:pointer;font-family:inherit;
    font-size:13px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1.1;
    text-shadow:0 1px 3px rgba(0,0,0,.75)}
  .pin.lock{color:rgba(255,255,255,.7)}
  .pin:active{transform:scale(.96)}
  .pin.gate{border-radius:999px;animation:pinglow 2.2s ease-in-out infinite}
  @keyframes pinglow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}
    60%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
  /* 그림 조각 — art 표에 이름을 적으면 이 자리에 들어갑니다 */
  .ico{width:19px;height:19px;object-fit:contain;vertical-align:-4px;margin-right:5px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
  .ico.none{display:inline-block;border:1px dashed var(--line);border-radius:3px;filter:none}
  /* 어둠 강화판 — 원본 그림을 그대로 쓰고 검은 아우라만 덧입힙니다 */
  .ico.dk,.bigart.dk{filter:brightness(.88) contrast(1.12) saturate(.8)
    drop-shadow(0 0 2px #000) drop-shadow(0 0 5px rgba(122,44,200,.9));
    animation:darkpulse 2.4s ease-in-out infinite}
  @keyframes darkpulse{0%,100%{filter:brightness(.88) contrast(1.12) saturate(.8)
      drop-shadow(0 0 2px #000) drop-shadow(0 0 4px rgba(122,44,200,.55))}
    50%{filter:brightness(.84) contrast(1.16) saturate(.75)
      drop-shadow(0 0 3px #000) drop-shadow(0 0 8px rgba(150,60,230,.95))}}
  /* 실습동 강화판 — 같은 그림에 푸른 아우라. 검은 어둠 강화판과 한눈에 갈립니다 */
  .ico.wk,.bigart.wk{filter:brightness(1.06) contrast(1.06) saturate(1.1)
    drop-shadow(0 0 2px rgba(0,30,50,.9)) drop-shadow(0 0 5px rgba(60,190,240,.9));
    animation:workpulse 2.4s ease-in-out infinite}
  @keyframes workpulse{0%,100%{filter:brightness(1.06) contrast(1.06) saturate(1.1)
      drop-shadow(0 0 2px rgba(0,30,50,.9)) drop-shadow(0 0 4px rgba(60,190,240,.55))}
    50%{filter:brightness(1.12) contrast(1.10) saturate(1.15)
      drop-shadow(0 0 3px rgba(0,30,50,.9)) drop-shadow(0 0 8px rgba(90,215,255,.95))}}
  /* 어둠 에너지 결정 — 아직 그림이 없어 마름모로 대신 그립니다.
     clip-path 는 box-shadow 까지 잘라내므로 번짐은 darkpulse 의 drop-shadow 로 냅니다.
     .slot .si .ico 가 배경을 덮어쓰므로 같은 무게로 한 번 더 적습니다. */
  .ico.crys{display:inline-block}
  .ico.crys,.bigart.crys,.slot .si .ico.crys{
    background:radial-gradient(circle at 38% 32%,#C89BFA 0%,#6B2CAE 44%,#170B29 100%);
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);padding:0;
    animation:darkpulse 2.4s ease-in-out infinite}
  /* 목록 안에서는 그림이 왼쪽을 크게 차지하고 글이 그 오른쪽으로 흐릅니다 */
  .slot .si .ico,.buyrow .ico{float:left;width:44px;height:44px;vertical-align:top;
    margin:1px 10px 3px 0;background:#241E36;border-radius:4px;padding:2px}
  .buyrow .ico{width:48px;height:48px}
  /* 탄약처럼 개수가 있는 것은 그림 오른쪽 위에 남은 수를 붙입니다 */
  .icow{position:relative;display:inline-block}
  .slot .si .icow,.buyrow .icow{float:left;margin:1px 10px 3px 0}
  .slot .si .icow .ico,.buyrow .icow .ico{float:none;margin:0}
  .icow .cnt{position:absolute;top:-3px;right:-4px;min-width:16px;padding:0 4px;
    background:var(--mark);color:#1A1526;border-radius:999px;
    font-size:10.5px;font-weight:800;line-height:16px;text-align:center;
    box-shadow:0 1px 3px rgba(0,0,0,.65)}
  .slot .si,.buyrow>div:first-child{overflow:hidden}
  /* 장비 6칸 한 줄 — 부위 · 그림 · 이름 */
  .gear6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin-bottom:4px}
  .gc{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:5px 2px 6px;
    text-align:center;min-width:0}
  .gc.tap{cursor:pointer}
  .gc.open{border-color:var(--mark);background:#332B4A}
  .gc .sn{display:block;font-size:10px;color:var(--dim)}
  .gc .ico{display:block;width:36px;height:36px;margin:3px auto 4px;padding:2px;box-sizing:border-box;
    background:#241E36;border-radius:4px;vertical-align:0}
  .gc .ico.empty{opacity:.35}
  .gc .nm{font-size:10.5px;font-weight:700;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .gc:not(.has) .nm{color:var(--dim);font-weight:400}
  /* 반출·현장 구분 — 이름 뒤에 은은한 색. 반출/현장 딱지(.kd)와 같은 색을 옅게 씁니다 */
  .gc[class*="kind-"] .nm{margin:0 2px;padding:1px 3px;border-radius:3px}
  .gc.kind-perm .nm{background:rgba(40,64,47,.75)}
  .gc.kind-inst .nm{background:rgba(74,36,56,.75)}
  .gc.kind-junk .nm,.gc.kind-ammo .nm{background:rgba(58,52,80,.6)}
  .gc .icow{display:block;width:36px;margin:3px auto 4px}
  .gc .icow .ico{margin:0}
  .gc .sub{display:block;font-size:10px;color:var(--dim);margin-top:2px}
  .gc .sub b{color:var(--mark);font-size:10.5px}
  .bigart{display:block;width:56px;height:56px;object-fit:contain;margin:0 auto 7px;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}
  .bigart.none{border:1px dashed var(--line);border-radius:4px;filter:none}
  .bigico{width:26px;height:26px;object-fit:contain;display:block}
  .face.img{padding:0;background:#221C33}
  .face.img img{width:100%;height:100%;object-fit:cover;border-radius:3px;display:block}
  #titlewrap{position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;
    background:#0E1830;height:calc(100vh - 26px - env(safe-area-inset-bottom));max-height:820px}
  #timg{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 32%}
  #tcv{display:block;width:100%;height:100%}
  #titlewrap .tshade{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;
    background:linear-gradient(180deg,rgba(8,12,26,0) 0%,rgba(8,12,26,.55) 55%,rgba(8,12,26,.88) 100%)}
  #titlewrap .cap{position:absolute;left:0;right:0;bottom:82px;padding:0 18px;text-align:center;pointer-events:none}
  #titlewrap .cap b{display:block;font-size:21px;font-weight:800;letter-spacing:.3px;
    text-shadow:0 2px 8px rgba(0,0,0,.9)}
  #titlewrap .cap span{font-size:11.5px;color:#C8C2D8;text-shadow:0 1px 4px rgba(0,0,0,.9)}
  #play{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);
    padding:14px 46px;font-size:16px;font-weight:800;letter-spacing:.6px;color:#fff;
    border-radius:999px;border:1.5px solid rgba(255,255,255,.6);
    background:rgba(16,26,54,.66);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    box-shadow:0 5px 22px rgba(0,0,0,.55);animation:playpulse 2.4s ease-in-out infinite}
  #play:active{transform:translateX(-50%) scale(.96);animation:none}
  @keyframes playpulse{
    0%,100%{box-shadow:0 5px 22px rgba(0,0,0,.55),0 0 0 0 rgba(255,255,255,.30)}
    55%{box-shadow:0 5px 22px rgba(0,0,0,.55),0 0 0 11px rgba(255,255,255,0)}
  }
  .cmp{font-size:11px;color:var(--dim);line-height:1.7;margin-top:6px;
    border-top:1px dashed var(--line);padding-top:5px}
  .cmp b{color:var(--ink)}
  .du{color:var(--ok);font-weight:700} .dd{color:var(--bad);font-weight:700}
  /* ── NPC · 얼굴 자리는 .face 하나뿐입니다. 나중에 <img>나 <canvas>로 갈아끼우면 됩니다 ── */
  .npc{display:flex;align-items:center;gap:12px;margin-bottom:11px}
  .face{width:74px;height:74px;flex:0 0 auto;border-radius:4px;border:1px solid var(--line);
    background:linear-gradient(160deg,#3B3157,#2A2340);display:grid;place-items:center;font-size:32px}
  .face.sm{width:38px;height:38px;font-size:18px;border-radius:3px}
  .npc .who b{display:block;font-size:15.5px;font-weight:800}
  .npc .who span{font-size:11.5px;color:var(--dim)}
  .say{font-size:14px;line-height:1.85;color:var(--ink)}
  .say:before{content:'\201C';color:var(--gate);margin-right:2px}
  .say:after{content:'\201D';color:var(--gate);margin-left:2px}
  .npcbar{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--gate);border-radius:3px;padding:9px 11px}
  .npcbar .line{flex:1;min-width:0}
  .npcbar .line b{display:block;font-size:12px;font-weight:800;color:var(--mark)}
  .npcbar .line span{font-size:12px;color:var(--dim);line-height:1.5}
  #acv{cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:none}
  #jump{touch-action:manipulation;user-select:none}
  canvas{width:100%;display:block;background:#12101A;border:1px solid var(--line);border-radius:4px;touch-action:manipulation}
  #feed{font-size:12px;color:var(--dim);line-height:1.7;min-height:56px}
  #feed div:last-child{color:var(--ink)}
  :focus-visible{outline:2px solid var(--mark);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ═════════════════════════════════════════════════════
   ▼▼▼ 개발용 스위치 — 정식 배포 전에 false로 바꾸세요 ▼▼▼ */
const DEV_SHOW_UNLOCK=false;
/* ▲▲▲ 여기까지 ▲▲▲ */

const L1=1,L2=2,L3=4;
const HUMAN=L1|L2, CRAWL=L1, HOP=L1|L2, TALL=L1|L2|L3, FLY=L3;

/* 오프닝 — bg는 배경 그림의 열쇳말입니다. 줄이 넘어갈 때마다 배경이 바뀝니다. */
const INTRO=[
  {bg:"gate",   t:"어느 날 아침, 대학 정문 한복판에 다른 세계로 이어진 문이 섰다."},
  {bg:"crowd",  t:"처음 사흘은 다들 설치미술인 줄 알았다. 사진을 찍고, 손을 넣어보고, 웃었다."},
  {bg:"wall",   t:"나흘째, 집에 가려던 사람들이 되돌아왔다. 후문도 담장도 뒷산 길도, 아무것도 없는 자리에서 막혔다."},
  {bg:"trap",   t:"보이지 않는 벽이 캠퍼스를 통째로 둘러쌌다. 수천 명이 그 안에 갇혔다."},
  {bg:"missing",t:"그 뒤로 문 안에 들어간 사람들은 돌아오지 않았다."},
  {bg:"out",    t:"벽에 뚫린 구멍은 그 문 하나뿐이다. 나가려면, 게이트를 돌파해야만 한다."},
];
/* 그림이 준비되면 여기에 경로만 채우면 됩니다. 파일이든 data URL이든 상관없습니다.
   비워 두면 배경 없이 자리만 잡아둔 채로 진행합니다. */
const INTRO_ART={
  _default:"intro/gate.webp",     /* 줄에 맞는 그림이 없을 때 깔리는 배경 */
  gate:"intro/gate.webp",
  crowd:"", wall:"", trap:"", missing:"", out:"",
};
const STATS=[
  {k:"vit",n:"체력",d:"최대 체력",need:1},{k:"maj",n:"전공활용",d:"전공과 관련된 능력",need:2},
  {k:"str",n:"힘",d:"공격력",need:1},{k:"spd",n:"속도",d:"이동 · 회피",need:1},
  {k:"agi",n:"순발력",d:"공격 속도",need:1},{k:"luk",n:"운",d:"치명타",need:1},
];
const openAt=(s,lvl)=>lvl>=s.need;
/* 전공 — MAJOR_LV부터 각 건물의 학과사무실에서 정합니다.
   지금 실제로 고를 수 있는 것은 태권도학과·간호학과·군사학 셋뿐입니다.
   나머지는 그 전공을 맡을 학과사무실이 생기면 되살아납니다. */
const MAJOR_LV=2;
const MAJORS=[
  {id:"soldier",n:"군인",        d:"총기를 다룰 수 있습니다"},
  {id:"police", n:"경찰대학생",   d:"총기를 다룰 수 있습니다"},
  {id:"phil",   n:"철학과",      d:"파티의 의욕을 끌어올립니다"},
  {id:"pe",     n:"체육교육과",   d:"몸으로 버팁니다"},
  {id:"med",    n:"의예과",      d:"응급처치를 압니다"},
  {id:"cs",     n:"컴퓨터공학과", d:"기계를 다룹니다"},
  {id:"dance",  n:"무용과",      d:"몸놀림이 빠릅니다"},
  {id:"arch",   n:"건축학과",    d:"구조를 읽습니다"},
  {id:"lib",    n:"문헌정보학과", d:"약점을 찾아냅니다"},
  /* 학과사무실에서 실제로 고를 수 있는 전공 — 전공 스킬은 차차 붙입니다 */
  {id:"tkd",    n:"태권도학과",   d:"맨몸으로 부딪칩니다"},
  {id:"archery",n:"양궁",        d:"활을 다룹니다"},
  {id:"nurse",  n:"간호학과",     d:"다친 사람을 돌봅니다"},
  {id:"mil",    n:"군사학",      d:"총기를 다룰 수 있습니다"},
  /* 이공대학 계열 — 네 갈래가 저마다 따로 열립니다(SCI_MAJORS) */
  {id:"chem",   n:"화학과",      d:"약품에 밝습니다"},
  {id:"phys",   n:"물리학과",     d:"힘이 실리는 자리를 압니다"},
  {id:"mech",   n:"기계공학과",   d:"손에 잡히는 것은 뜯어 고칩니다"},
  {id:"bio",    n:"생명공학과",   d:"몸이 무엇으로 되어 있는지 압니다"},
  {id:"food",   n:"식품공학과",   d:"먹을 것을 압니다"},
  /* 사범대학 계열 */
  {id:"elem",   n:"초등교육과",   d:"가르치는 법을 압니다"},
];
/* ── 이공대학 계열 전공이 열리는 조건 ──
   이 조건은 게임 안 어디에도 적지 않습니다. 우연히 열리는 것이 이 건물의 연출입니다.
   조건이 하나라도 차면 이공대학 건물의 이름이 지도에 뜹니다(BUILDINGS.sci). */
const SCI_MAJORS=[
  {id:"chem", open:g=>(g.chemKills||0)>=1},
  {id:"phys", open:g=>(g.bookSold||0)>=2},
  {id:"mech", open:g=>["apron","mic","lighter","cutter"].every(k=>!!(g.itemSeen||{})[k])},
  {id:"bio",  open:g=>(g.cleared||[]).includes("front")},
  /* 식품공학과만은 열린 것을 알려 줍니다 — 게이트 안에서 무언가를 먹고 돌아오면 팝업이 뜹니다 */
  {id:"food", open:g=>!!g.foodHeal},
  /* 건축학과 — 게이트 안에서 서로 다른 장소 6곳에 들어가 봤을 때 (G.placesSeen, 방 id 기준) */
  {id:"arch", open:g=>(g.placesSeen||[]).length>=ARCH_PLACES},
];
const ARCH_PLACES=6;
const sciOpen=g=>SCI_MAJORS.filter(m=>m.open(g)).map(m=>m.id);
/* 도서관 서가 — {n:제목, d:본문}. 한 권씩 채워 넣으면 도서관에 그대로 꽂힙니다 */
const LIBRARY=[];
const SCI_IDS=SCI_MAJORS.map(m=>m.id);
/* ── 인문사회대학 계열 전공이 열리는 조건 ── 이공대학과 같은 방식입니다.
   하나라도 차면 건물이 열리고, 학과사무실과 도서관이 같이 켜집니다. */
const HUM_MAJORS=[
  {id:"lib",  open:g=>["planner","ballpen"].every(k=>!!(g.itemSeen||{})[k])},   /* 다이어리 · 볼펜 */
  /* 철학과 — 소주를 마셔 본 적이 있고 Lv2 대원이 있을 때. 열리면 캠퍼스에서 팝업(campusNotes) */
  {id:"phil", open:g=>!!g.sojuDrunk&&topLvl(g)>=MAJOR_LV},
];
/* ── 먹을 것이 남기는 기운 ──
   use.buff 가 붙은 것을 먹으면 그 값이 p.foodBuff 에 실려 **다음 전투 한 번**에만 걸립니다.
   여러 개를 먹으면 더하는 칸은 더하고 배율 칸은 곱합니다. 싸우지 않고 문을 나서면 그대로 깹니다.
   소주의 취기도 이 길을 지납니다(SOJU). */
const BUFF_ADD=["atk","guard","dodge","crit","range","miss"], BUFF_MUL=["aspdM","vspeedM"];
const SOJU={atk:3,aspdM:1.10,miss:0.20};   /* 소주 한 병의 취기 — 다음 전투 한 번 */
function addBuff(p,b){

/* ═══════════ 어둠 강화판 ═══════════
   '어둠 에너지 결정'을 쓰면 현장(inst) 장비가 그 자리에서 강화판으로 바뀝니다.
   반출품은 대상이 아닙니다 — 게이트 안에서만 쓰고 버리는 물건이니 세게 줘도 됩니다.
   아래 표에 **바뀌는 수치만** 적으면 <원본>+ 이름으로 ITEMS 에 자동으로 실립니다.
   설명문(d)도 원본과 같은 어순으로 자동 생성되고, 그림은 원본 것을 그대로 씁니다
   (목록은 .dk 클래스, 전투는 캔버스 그림자로 검은 아우라만 덧그립니다). */
const DARK_UP={
  bottle:   {atk:12},                        /* 깨진 소주병 — 그냥 아프다 */
  cutter:   {atk:10,aspdM:1.55},             /* 커터칼 */

  mic:      {atk:7,aspdM:1.30},              /* 마이크 */
  tray:     {guard:4,aspdM:1.12},            /* 쟁반 */
  signboard:{guard:9,dodge:-3},              /* 입간판 — 무게가 덜 걸린다 */
  doorpanel:{guard:13,hp:16,dodge:-7},       /* 자동차 문짝 */
  helmet:   {guard:4},                       /* 공사장 헬멧 */
  apron:    {guard:4,hp:10,dodge:8},         /* 앞치마 */
  workpants:{guard:9,spdM:0.95},             /* 작업복 바지 — 더 막고, 덜 무겁다 */
  slippers: {dodge:9,crit:6},                /* 삼선 슬리퍼 */
  medkitD:  {use:{pct:0.75}},                /* 침식된 응급 키트 */
  crystal:  {skill:true},                    /* 어둠 에너지 결정 — 결정으로 키우면 힘이 된다 */
};
/* 이름도 id 도 원본 뒤에 + 를 붙입니다 — 커터칼 → 커터칼+.
   나중에 2단 강화를 넣으면 lv 2 로 불러 커터칼++ 를 그대로 만들 수 있습니다. */
const darkId=(id,lv=1)=>id+"+".repeat(lv);
/* 원본 설명문과 같은 어순으로 적습니다 — 무기는 공격력·공속·사거리, 방어구는 피해·체력·회피·치명 */
function darkDesc(it){
  const p=[],pc=v=>`${v<0?"−":"+"}${Math.round(Math.abs(v)*100)}%`;
  const tail=it.kind==="inst"?" · 게이트를 나가면 사라진다":"";
  /* 장비가 아닌 것 — 쓰는 물건은 무엇을 하는지만 적습니다 */
  if(it.skill)return "쓰면 새로운 힘을 하나 익힌다"+tail;
  if(it.use&&it.use.pct)return `쓰면 체력 ${Math.round(it.use.pct*100)}% 회복`+tail;
  if(it.atk){
    p.push(`공격력 +${it.atk}`);
    if(it.aspdM&&it.aspdM!==1)p.push(`공속 ${pc(it.aspdM-1)}`);
    if(it.rng)p.push(`사거리 +${it.rng}`);
    if(it.miss)p.push(`${Math.round(it.miss*100)}% 확률로 빗나감`);
  }else{
    if(it.guard)p.push(`피해 −${it.guard}`);
    if(it.hp)p.push(`체력 +${it.hp}`);
    if(it.dodge)p.push(`회피 ${it.dodge<0?"−"+(-it.dodge):it.dodge}%`);
    if(it.crit)p.push(`치명 +${it.crit}%`);
    if(it.aspdM&&it.aspdM!==1)p.push(`공속 ${pc(it.aspdM-1)}`);
    if(it.spdM&&it.spdM!==1)p.push(`이동 ${pc(it.spdM-1)}`);
  }
  let s=p.join(", ")+(it.dmg?` · ${it.dmg}`:"");
  if(it.frail)s+=` · ${Object.keys(it.frail).join("·")}에 약함`;
  return s;
}
for(const [base,up] of Object.entries(DARK_UP)){
  const b=ITEMS[base], it={...b,...up,n:b.n+"+",dark:base};
  it.d=darkDesc(it);
  ITEMS[darkId(base)]=it;
}

  /* 사마귀 낫+ — 곁에 선 것에게도 **그대로** 베기가 들어갑니다(splash 1.0, 휘두르기 기본은 0.5) */
  scythe:  {atk:9,aspdM:1.25,crit:10,splash:1.0,g:140,
            d:"공격력 +9, 공속 +25%, 치명 +10% · 베기 · 곁의 적도 같은 피해로 휩쓴다"},

const workId=id=>id+"+";
const workCost=id=>(WORK_UP[id]||{}).g||0;
for(const [base,up] of Object.entries(WORK_UP)){
  const b=ITEMS[base], it={...b,...up,n:b.n+"+",base:base};
  delete it.g;                              /* 값은 표에만 두고 물건에는 남기지 않습니다 */
  if(!up.d)it.d=darkDesc(it);               /* 직접 적어 둔 설명이 있으면 그것을 씁니다 */
  ITEMS[workId(base)]=it;
}
/* 강화판은 그림·배치를 원본 것에서 가져옵니다 (어둠은 dark, 실습동은 base) */
const baseOf=id=>(ITEMS[id]&&(ITEMS[id].dark||ITEMS[id].base))||id;
Object.keys(ITEMS).forEach(k=>ITEMS[k].id=k);
/* 매점 판매대에 오를 수 있는 물건 전부. 조건이 붙은 둘은 shopPool() 이 걸러냅니다.
   한 번에 다 오르지는 않습니다 — 자리 수(shopSlots)만큼 무작위로 뽑습니다. */
const SHOP=["jacket","pen","book","spray","cap","upants","bow","healspray","scythe","fkiller","hshield","bhelm"];
const SHOP_AMMO=["ammoP","ammoS","ammoR","ammoA"];
/* 게이트 바닥에서 GOT_SHOP 번 주워 본 반출 장비는 매점 판매대 후보에도 오릅니다(총은 빼고).
   G.gotN[id] 에 주운 횟수를 셉니다(noteGot). 값(price)이 없는 것은 오르지 않습니다 */
const GOT_SHOP=5;
const gotShopOk=id=>{const it=ITEMS[id];
  return !!(it&&it.kind==="perm"&&it.slot&&!(it.ammo&&!it.bow)&&!it.base&&!it.dark&&it.price>0)};
const gotShopIds=()=>Object.keys(G.gotN||{}).filter(id=>G.gotN[id]>=GOT_SHOP&&!SHOP.includes(id)&&gotShopOk(id));
function noteGot(id){
  if(id==="cuffs")G.cuffsGot=true;     /* 경찰대학생 해금 — 게이트에서 수갑을 주워 본 적이 있나 */
  if(!gotShopOk(id))return;
  G.gotN=G.gotN||{};
  G.gotN[id]=(G.gotN[id]||0)+1;
  if(G.gotN[id]===GOT_SHOP&&!SHOP.includes(id))(G.gotNew=G.gotNew||[]).push(id);
}
/* 판매대 자리 — 처음 3칸. '학생회에 투자' 로 한 칸씩, 6칸까지 늘립니다 */
const SHOP_SLOT0=3, SHOP_SLOT_MAX=6, INVEST_COST=[40,120,250];
const shopSlots=()=>Math.min(SHOP_SLOT_MAX,SHOP_SLOT0+(G.invest||0));
const investCost=()=>{const c=INVEST_COST[G.invest||0];return c===undefined?null:c};
/* 오늘 팔 수 있는 후보 */
function shopPool(){
  return SHOP.filter(id=>
    id==="cap"    ? (G.capFrom!=null&&G.explores>=G.capFrom)   /* 한 번 사 본 뒤 다음 탐색부터 */
  : id==="upants" ? !!G.unionOpen                              /* 명단이 두 명이 된 뒤부터 */
  : id==="bow"    ? !!G.bowOpen                                /* 학생회가 활을 만든 뒤부터 */

/* 판매대 채우기. 팔린 것도 G.shopStock 에 남겨 두어야 자리 수가 맞습니다. */
function fillShop(){
  if(!G.shopStock)G.shopStock=[];
  const rest=shopPool().filter(id=>!G.shopStock.includes(id));
  while(G.shopStock.length<shopSlots()&&rest.length)
    G.shopStock.push(rest.splice(Math.floor(Math.random()*rest.length),1)[0]);
}
const rollShop=()=>{G.shopStock=[];fillShop()};

function seenGun(type){
  if(G.gunSeen&&G.gunSeen[type])return true;
  for(const r of G.roster){
    for(const sl of SLOTS){const it=ITEMS[r.gear[sl.k]];if(it&&it.ammo===type){G.gunSeen[type]=true;return true}}
    for(const id of r.bag){const it=ITEMS[id];if(it&&it.ammo===type){G.gunSeen[type]=true;return true}}
    if(r.ammo&&r.ammo[type]>0){G.gunSeen[type]=true;return true}
  }
  return false;
}

const CRYSTAL_RATE=0.10, CRYSTAL_RISK=0.05;

function rollLoot(place,day){
  const out=[];
  const jn=1+((Math.random()<0.45)?1:0);
  for(let i=0;i<jn;i++) out.push(pick(place.junk));
  /* 식품공학과 — 먹을 것이 한 개 더 나올 수 있습니다 */
  const fl=foodLv();
  if(fl){
    const eat=place.junk.filter(id=>ITEMS[id].use&&!ITEMS[id].kit);   /* 약은 먹을 것이 아닙니다 */
    if(eat.length&&Math.random()<FOOD_DROP[fl]*foodRate()) out.push(pick(eat));
  }
  let gn=(Math.random()<0.55?1:0)+(Math.random()<0.25+place.risk*0.1?1:0)+(day>=3&&Math.random()<0.3?1:0);
  for(let i=0;i<gn;i++) out.push(pick(place.gear));
  if(place.special&&Math.random()<place.special.chance) out.push(pick(place.special.ids));
  if(Math.random()<CRYSTAL_RATE+place.risk*CRYSTAL_RISK) out.push("crystal");
  if(place.ammo){
    const a=place.ammo, ids=a.ids||a;
    let n=(a.base!==undefined)?a.base:1;
    for(const q of (a.extra||[0.5])) if(Math.random()<q) n++;
    for(let i=0;i<n;i++) out.push(pick(ids));
  }
  return out;
}

/* 그림이 읽힌 뒤 한 번만 자릅니다 — 몸통(팔다리를 뺀 것)과 팔다리 조각.
   root 는 몸통에 남겨 두는 팔다리 뿌리입니다. 조각이 밀려나도 이음매가 비지 않습니다 */
const zombParts=img=>cutParts(img,ZOMB_LIMBS,ZOMB_BASE);
/* 그림 한 장을 몸통과 팔다리 조각으로 자릅니다. limbs 표마다 한 번만 자르고 그림에 붙여 둡니다 */
function cutParts(img,LIMBS,BASE){
  img._cut=img._cut||new Map();
  if(img._cut.has(LIMBS))return img._cut.get(LIMBS);
  const w=img.naturalWidth,h=img.naturalHeight,k=w/BASE;
  const mk=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;return c};
  const path=(x,poly)=>{x.beginPath();poly.forEach(([a,b],i)=>i?x.lineTo(a*k,b*k):x.moveTo(a*k,b*k));x.closePath()};
  try{
    const body=mk(),bx=body.getContext("2d");
    bx.drawImage(img,0,0);bx.globalCompositeOperation="destination-out";
    const limbs=LIMBS.map(L=>{
      path(bx,L.poly);bx.fill();
      bx.save();bx.globalCompositeOperation="source-over";path(bx,L.root);bx.clip();bx.drawImage(img,0,0);bx.restore();
      bx.globalCompositeOperation="destination-out";
      const c=mk(),x=c.getContext("2d");path(x,L.poly);x.clip();x.drawImage(img,0,0);return c;
    });
    img._cut.set(LIMBS,{body,limbs});
  }catch(e){img._cut.set(LIMBS,null)}
  return img._cut.get(LIMBS);
}
/* ── 좀비 보스 ──
   천천히 쿵쿵 걸어옵니다(반 바퀴마다 한 걸음, 발이 닿을 때 화면이 울립니다).
   붙으면 두 팔을 들고(lift) → 부들부들 힘을 모으고(charge) → 내려찍고(drop) → 숨을 고릅니다(rec).
   내려찍는 자리는 힘을 모으기 시작할 때 그 대원이 서 있던 곳으로 정해지고 바닥에 붉은 원이 차오릅니다.
   원 안에 있는 대원은 모두 맞고, 저마다 회피 판정을 받습니다. */
const ZBOSS_SLAM={lift:.55,charge:1.05,drop:.11,rec:.7,rest:.45,rad:9};
/* 내려찍기는 크게 휘두르는 만큼 몸을 틀 틈이 조금 넓습니다 — 회피율 ×1.2 (최대 75%) */
const ZBOSS_DODGE_MUL=1.2, ZBOSS_DODGE_MAX=75;
/* 내려찍기에 맞으면 잠시 기절 — 이 동안은 움직이지도 때리지도 못하고 머리 위로 별이 돕니다 */
const ZBOSS_STUN=0.7;
const ZBOSS_STEP=2.2;      /* 걸음 박자(초당 위상) */
const ZBOSS_RAISE=2.3;     /* 팔을 드는 각도(라디안) — 머리 위로 치켜든 모양 */
const ZBOSS_BASE=384;
/* 보스 그림(384 기준)의 두 팔. dir 은 드는 방향 — 왼팔은 시계방향, 오른팔은 반시계방향으로 들립니다 */
const ZBOSS_LIMBS=[
  {poly:[[0,50],[70,30],[105,70],[110,120],[96,160],[100,285],[0,285]],px:82,py:80,dir:1,
   root:[[55,35],[105,70],[110,120],[96,160],[62,120]]},
  {poly:[[286,105],[384,92],[384,384],[262,384],[262,300],[286,292]],px:322,py:150,dir:-1,
   root:[[286,105],[322,100],[322,205],[286,205]]},

/* 지금 자세 — arm 은 팔을 든 정도(1 이 다 든 것, 음수는 내려찍어 안쪽으로 꺾인 것) */
function zbossPose(f){
  const S=f.slam, Z=ZBOSS_SLAM;
  if(!S)return{arm:0,lift:0,shake:0,squash:0};
  const u=S.t;
  if(S.ph==="lift"){const e=Math.min(1,u/Z.lift);const k=1-(1-e)*(1-e);return{arm:k,lift:k,shake:0,squash:0}}
  if(S.ph==="charge")return{arm:1,lift:1,shake:.35+.65*Math.min(1,u/Z.charge),squash:0};
  if(S.ph==="drop"){const e=Math.min(1,u/Z.drop);return{arm:1-1.35*e,lift:1-e,shake:0,squash:e}}
  const e=Math.min(1,u/Z.rec);
  return{arm:-.35*(1-e),lift:0,shake:0,squash:1-e};
}
/* 한 틱의 행동. 이 보스는 늘 여기서 끝나므로 true 를 돌려줍니다 */
function zbossStep(f,lifeA,dt){
  const Z=ZBOSS_SLAM;
  let S=f.slam;
  if(!S){
    const t=lifeA.reduce((b,o)=>D(f,o)<D(f,b)?o:b);
    f.face=Math.atan2(t.y-f.y,t.x-f.x);
    if(D(f,t)>f.range+t.r){
      /* 발을 들고 있을 때만 나아갑니다. 반 바퀴가 넘어갈 때 발이 땅에 닿습니다 */
      const c0=f.cp||0;
      f.cp=c0+dt*ZBOSS_STEP;
      if(Math.floor(f.cp/Math.PI)!==Math.floor(c0/Math.PI))B.shake=Math.max(B.shake||0,.12);
      const base=f.vspeed;
      f.vspeed=base*2*Math.abs(Math.sin(f.cp));
      moveTo(f,t.x,t.y,dt);
      f.vspeed=base;
      return true;
    }
    f.cool-=dt;
    if(f.cool>0)return true;
    f.slam={ph:"lift",t:0,tgt:t};
    say(`${f.name}이(가) 두 팔을 높이 치켜든다.`);
    return true;
  }
  S.t+=dt;
  if(S.ph==="lift"&&S.t>=Z.lift){
    const t=S.tgt.hp>0?S.tgt:lifeA.reduce((b,o)=>D(f,o)<D(f,b)?o:b);
    S.ph="charge";S.t=0;S.x=t.x;S.y=t.y;
    f.face=Math.atan2(S.y-f.y,S.x-f.x);
    say(`${f.name}이(가) 부들부들 떨며 힘을 모은다…`);
  }else if(S.ph==="charge"&&S.t>=Z.charge){S.ph="drop";S.t=0}
  else if(S.ph==="drop"&&S.t>=Z.drop){
    S.ph="rec";S.t=0;
    B.shake=.4;
    let hitN=0;
    for(const a of lifeA){
      if(a.hp<=0||Math.hypot(a.x-S.x,a.y-S.y)>Z.rad+a.r)continue;
      if(Math.random()*100<Math.min(ZBOSS_DODGE_MAX,(a.dodge||0)*ZBOSS_DODGE_MUL)){
        B.fx.push({x:a.x,y:a.y-5,t:"간발의 차!",c:"#F2D74E",life:1.3,off:0});
        say(`${a.name}이(가) 내려찍기를 간발의 차로 피했다!`);
        continue;
      }
      /* 회피는 위에서 이미 굴렸으므로 hurt 안에서는 다시 굴리지 않습니다 */
      const dg=a.dodge;a.dodge=0;
      hurt(a,f.atk,"#F25C5C",f.dmgType,f);
      a.dodge=dg;hitN++;
      if(a.hp>0){a.stunT=Math.max(a.stunT||0,ZBOSS_STUN);a.anim=null}
    }
    say(hitN?`${f.name}이(가) 땅을 내려찍었다. 바닥이 갈라진다.`:`${f.name}의 주먹이 빈 바닥을 내려찍었다.`);
  }else if(S.ph==="rec"&&S.t>=Z.rec){f.slam=null;f.cool=Z.rest}
  return true;
}
/* 바닥의 경고 원과 내려찍은 뒤의 충격파 */
function drawSlamMark(f){
  const S=f.slam, Z=ZBOSS_SLAM;
  if(!S||S.x===undefined)return;
  const x=S.x*SX,y=S.y*SY,rx=Z.rad*SX,ry=Z.rad*SY;
  ctx.save();
  if(S.ph==="charge"||S.ph==="drop"){
    const p=S.ph==="drop"?1:Math.min(1,S.t/Z.charge);
    ctx.fillStyle=`rgba(242,60,60,${.10+.12*p})`;
    ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill();
    ctx.fillStyle=`rgba(242,60,60,${.18+.2*p})`;
    ctx.beginPath();ctx.ellipse(x,y,rx*p,ry*p,0,0,7);ctx.fill();
    ctx.strokeStyle=`rgba(255,90,90,${.55+.4*Math.abs(Math.sin(S.t*14))})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.stroke();
  }else if(S.ph==="rec"){
    const e=Math.min(1,S.t/Z.rec);
    ctx.globalAlpha=1-e;
    ctx.strokeStyle="#F2E2C4";ctx.lineWidth=4*(1-e)+1;
    ctx.beginPath();ctx.ellipse(x,y,rx*(.8+e*.9),ry*(.8+e*.9),0,0,7);ctx.stroke();
    ctx.fillStyle="rgba(60,40,30,.35)";
    ctx.beginPath();ctx.ellipse(x,y,rx*.7,ry*.7,0,0,7);ctx.fill();
  }
  ctx.restore();
}
/* 좀비 그림을 원점에 S 크기로 그립니다. c 는 기는 박자 — 전투와 좀비 헌터가 같이 씁니다 */
function zombDraw(g,img,S,c){
  const zp=zombParts(img);
  if(!zp){g.drawImage(img,-S/2,-S/2,S,S);return}
  const k=S/ZOMB_BASE;
  const limb=(L,cv)=>{
    const ph=Math.sin(c+L.ph);
    g.save();
    g.translate((L.px+L.dx*ph)*k-S/2,L.py*k-S/2);g.rotate(L.rot*ph);
    g.drawImage(cv,-L.px*k,-L.py*k,S,S);
    g.restore();
  };
  ZOMB_LIMBS.forEach((L,i)=>{if(L.under)limb(L,zp.limbs[i])});
  g.drawImage(zp.body,-S/2,-S/2,S,S);
  ZOMB_LIMBS.forEach((L,i)=>{if(!L.under)limb(L,zp.limbs[i])});
}

const foodLv=()=>{const s=(G&&G.instants)||[];

const ELEM_EXP=[0,0.25,0.50], ELEM_LOW=0.30;
const elemLv=()=>{const s=(G&&G.instants)||[];
  return s.some(x=>x.k==="m_elem2")?2:s.some(x=>x.k==="m_elem")?1:0};
const skillOf=k=>INSTANTS.find(s=>s.k===k);
/* ═══════════ 전공 스킬의 전공활용 보정 ═══════════
   전공 스킬(maj 가 있는 것)만 보정합니다. 공용 스킬은 그대로입니다.
   그 전공 대원 본인은 제 전공활용으로, 나머지 파티원은 파티에서 그 전공을 가진 사람 중
   가장 높은 전공활용으로 받습니다. 배율은 패시브와 같은 passiveRate 입니다.
   스킬의 f 는 고치지 않습니다 — f 가 몸(u)을 바꾼 만큼(변화량)에 배율을 곱합니다.
   늘어난 칸은 ×배율, 줄어든 칸은 벌칙으로 보고 ×(2−배율)입니다.
   설명(d)의 {n} 은 보정되는 수치, {!n} 은 벌칙, {xn} 은 배수 — 화면에는 n(±차이) 로 나옵니다. */
const SKILL_FIXED=["multi","miss","drunkMiss"];   /* 개수·빗나감은 배율을 먹이지 않습니다. 스킬마다 fixed 로 더 뺄 수 있습니다 */
const SKILL_BASE={knockM:1,chemUp:1};             /* f 가 처음 만드는 칸의 기준값 (없으면 0) */
const SKILL_CAP={combo:0.95,comboAlly:0.95,ammoSave:0.9,zombCut:0.9};
function bestMajRate(maj){
  const who=((G.mode==="tutorial"?[G.player]:party())||[]).filter(p=>p&&hasMaj(p,maj));
  return who.length?Math.max(...who.map(passiveRate)):1;
}
const skillRate=(s,u)=>!s.maj?1:(u&&u.ref&&hasMaj(u.ref,s.maj))?passiveRate(u.ref):bestMajRate(s.maj);
function applySkill(s,u){
  const rate=skillRate(s,u);
  if(rate===1){s.f(u);return}
  const mx=u.maxHp, before={};
  u.maxHp=1e9;                   /* 회복이 최대 체력에 막히면 변화량을 못 재므로 잠시 풀어 둡니다 */
  for(const k in u)if(typeof u[k]==="number")before[k]=u[k];
  s.f(u);
  for(const k in u){
    if(typeof u[k]!=="number"||SKILL_FIXED.includes(k)||(s.fixed&&s.fixed.includes(k)))continue;
    const b=k in before?before[k]:(k in SKILL_BASE?SKILL_BASE[k]:0), d=u[k]-b;
    if(!d)continue;
    u[k]=b+d*(d>0?rate:Math.max(0,2-rate));
    if(k in SKILL_CAP)u[k]=Math.min(SKILL_CAP[k],u[k]);
  }
  u.maxHp=Math.round(mx+(u.maxHp-1e9));
  u.hp=Math.min(u.maxHp,u.hp);
}
/* 설명 글 — rate 가 1 이거나 없으면 표시만 걷어 냅니다 */
function scaleTxt(d,rate){
  return String(d||"").replace(/\{([!x]?)([\d.]+)\}/g,(m,kind,num)=>{
    if(!rate||rate===1)return num;
    const n=+num, dec=Math.max((num.split(".")[1]||"").length,kind==="x"?1:0), p=Math.pow(10,dec);
    const sc=kind==="!"?n*Math.max(0,2-rate):kind==="x"?1+(n-1)*rate:n*rate;
    const dl=Math.round(Math.round(sc*p)-n*p)/p;
    return dl?`${num}(${dl>0?"+":"−"}${Math.abs(dl)})`:num;
  });
}
const skillText=s=>scaleTxt(s.d,s.maj?bestMajRate(s.maj):1);
/* 맛있는 불량식품 — 스킬 f 가 비어 있고 효과는 전리품·먹기에서 걸리므로 배율도 거기서 겁니다 */
const foodRate=()=>bestMajRate("food");
/* 지금까지 쌓인 갈래별 수치. 상위 스킬이 선행을 대체하므로 겹쳐 세지 않습니다 */
function branchSum(){
  const t={};
  for(const s of G.instants)if(!s.maj&&s.br)t[s.br]=(t[s.br]||0)+(s.v||0);
  return t;
}
/* 오늘 나올 수 있는 카드
   · 전공 스킬은 그 전공 대원이 파티에 있을 때만
   · 상위 스킬은 선행 스킬을 가졌을 때만
   · 인내·숙련은 갈래 수치가 찼을 때만 */
function skillPool(){
  const majs=new Set((G.mode==="tutorial"?[G.player]:party()).flatMap(majorsOf));
  const have=new Set(G.instants.map(s=>s.k));
  /* 상위 스킬로 갈아탄 뒤 아래 단계가 다시 나오면 안 됩니다 */
  const past=new Set();
  for(const s of G.instants){let u=s.up;while(u){past.add(u);u=(skillOf(u)||{}).up}}
  const t=branchSum();
  return INSTANTS.filter(s=>{
    if(s.maj&&!majs.has(s.maj))return false;
    if(s.gate&&G.gate!==s.gate)return false;      /* 그 게이트 안에서만 열리는 것 */
    if(have.has(s.k)||past.has(s.k))return false;
    if(s.up&&!have.has(s.up))return false;
    /* needAll — 묶음마다 하나씩은 가지고 있어야 열립니다 (멀티샷) */
    if(s.needAll&&!s.needAll.every(g=>g.some(k=>have.has(k))))return false;
    if(s.req&&!s.req(t))return false;
    return true;
  });
}
/* 상위 스킬을 고르면 선행 스킬을 밀어내고 그 자리에 들어갑니다 */
function learnSkill(s){
  if(s.up)G.instants=G.instants.filter(x=>x.k!==s.up);
  G.instants.push(s);
}
/* EXP_TABLE[l] — Lv l 에서 다음 레벨까지 필요한 경험치. 칸 수가 곧 최고 레벨입니다.
   Lv2(90)는 사마귀를 만나기 직전에 오도록 맞췄습니다. 그 뒤로는 한 칸에 1.5배 남짓씩 늘다가
   Lv10 부근부터 완만해집니다. 정문 게이트를 다 돌면 Lv6 안팎, 지하상가 게이트를 마치면 Lv9~10. */
const EXP_TABLE=[0,90,140,220,340,520,800,1200,1700,2300,3000,3700,4500,5400,6400,7500,8700,10000,11500,13000];
const MAX_LV=EXP_TABLE.length;
const nextExp=l=>EXP_TABLE[l]!==undefined?EXP_TABLE[l]:9999;
/* ── 교육장 셈 ──
   eduMaxLv   지금 열린 사범 전공이 정하는 상한 레벨 (초등교육과만 열려 있으면 2)
   eduTeacher 명단에 있는 초등교육과 대원 중 전공활용이 가장 높은 사람의 배율. 없으면 null
   eduCost    탐색 한 번마다 나가는 교육비 — 초등교육과가 있으면 그만큼 깎입니다
   eduExpGain 탐색 한 번에 받는 경험치 — 전공활용 10 기준으로 '지금 레벨에서 다음 레벨까지' 한 칸
   eduRoom    상한 레벨을 넘겨 올려 주지 않도록, 이번에 줄 수 있는 경험치의 한도 */
const eduMaxLv=g=>Math.max(0,...eduOpen(g||G).map(m=>EDU_LV[m]||0));
function eduTeacher(){
  const who=((G&&G.roster)||[]).filter(r=>hasMaj(r,"elem"));
  return who.length?Math.max(...who.map(passiveRate)):null;
}
const eduOffPct=()=>{const t=eduTeacher();
  return t===null?0:Math.min(EDU_OFF_MAX,Math.round((PASSIVES.elem.eduOff||0)*t))};
const eduExpPct=()=>{const t=eduTeacher();
  return t===null?0:Math.round((PASSIVES.elem.eduExp||0)*t)};
const eduCost=lvl=>Math.max(1,Math.round(EDU_COST_LV*Math.max(1,lvl||1)*(1-eduOffPct()/100)));
const eduExpGain=lvl=>Math.round(nextExp(lvl)*(1+eduExpPct()/100));
function eduRoom(p,cap){
  let need=-p.exp;
  for(let l=p.lvl;l<cap;l++)need+=nextExp(l);
  return Math.max(0,need+nextExp(cap)-1);
}

/* ═══════════ 파생 스탯 ═══════════ */
function worn(p){return SLOTS.map(s=>ITEMS[p.gear[s.k]]).filter(Boolean)}
function derive(p){
  const s=p.stats;
  let atk=2+s.str*0.6,guard=0,hpAdd=0,aspdM=1,spdM=1,dodge=0,critAdd=0;
  /* 풍뎅이 투구를 쓰면 장비가 깎는 회피는 셈하지 않습니다 */
  const keepDodge=worn(p).some(it=>it.keepDodge);
  for(const it of worn(p)){
    atk+=it.atk||0;guard+=it.guard||0;hpAdd+=it.hp||0;
    dodge+=keepDodge?Math.max(0,it.dodge||0):(it.dodge||0);critAdd+=it.crit||0;
    aspdM*=it.aspdM||1;spdM*=it.spdM||1;
  }
  /* 전공 패시브 — 더하는 몫을 먼저, 공격력 %는 합친 공격력에 겁니다 */
  const bareHands=!p.gear.rh&&!p.gear.lh;
  let atkPM=1;
  for(const v of passivesOf(p)){
    for(const o of [v,bareHands&&v.bare].filter(Boolean)){
      hpAdd+=o.hp||0;atk+=o.atk||0;guard+=o.guard||0;dodge+=o.dodge||0;
      spdM*=1+(o.spd||0)/100;aspdM*=1+(o.aspd||0)/100;atkPM*=1+(o.atkP||0)/100;
    }
  }
  atk*=atkPM;
  const rh=ITEMS[p.gear.rh];
  return{maxHp:Math.round(20+s.vit*6+hpAdd),atk:+atk.toFixed(1),
    aspd:+((0.50+s.agi*0.05)*aspdM).toFixed(2),
    speed:Math.round((14+s.spd*3)*spdM),guard,
    dodge:+Math.max(0,Math.min(40,dodge+s.spd*DODGE_PER_SPD)).toFixed(1),
    crit:+Math.max(0,s.luk*0.5+critAdd).toFixed(1),
    style:rh?rh.style:"swing",dmg:rh?rh.dmg:DMG.BLUNT,rng:rh&&rh.rng?rh.rng:0,
    /* 거리별 위력·광역은 무기가 가진 성질이라 스탯과 섞지 않고 그대로 넘깁니다 */
    fall:rh?rh.fall:null,fallBase:rh?rh.atk:0,splash:rh?rh.splash:0,
    /* 활 — 헛나가는 확률과 활인지 여부. 스킬이 여기에 손을 댑니다 */
    miss:(rh&&rh.miss)||0,bow:!!(rh&&rh.bow)};
}
function emptyGear(){const g={};SLOTS.forEach(s=>g[s.k]=null);return g}
/* 착용한 것을 전부 벗겨 매점 창고로 보냅니다. 배낭은 5칸뿐이라 창고로 갑니다. */
function stripGear(p){
  let n=0,kept=0;
  for(const sl of SLOTS){
    const id=p.gear[sl.k];
    if(!id)continue;
    /* 체력이 모자라 못 벗는 것은 그대로 둡니다 */
    if(!tryGear(p,()=>{p.gear[sl.k]=null})){kept++;continue}
    G.store[id]=(G.store[id]||0)+1;n++;
  }
  return{moved:n,kept:kept};
}
function logAdd(p,t){if(!p.log)p.log=[];p.log.push(t);if(p.log.length>24)p.log.shift()}

function rollStudent(){
  const keys=STATS.map(s=>s.k),st={};
  keys.forEach(k=>st[k]=10);
  for(let i=0;i<14;i++){
    const a=keys[(Math.random()*6)|0],b=keys[(Math.random()*6)|0];
    if(a!==b&&st[a]>6&&st[b]<15){st[a]--;st[b]++}
  }
  const d=[-1,0,0,0,1][(Math.random()*5)|0];
  if(d){const k=keys[(Math.random()*6)|0];st[k]=Math.max(6,Math.min(15,st[k]+d))}
  const nm=randName();
  const s={name:nm.name,sex:nm.sex,face:pickFace(nm.sex),
           lvl:1,exp:0,major:null,stats:st,gear:emptyGear(),bag:[],
           ammo:EMPTY_AMMO(),points:0,inParty:true,log:[]};
  s.hp=derive(s).maxHp;
  return s;
}

/* 지원자는 한 명씩 명단에 얹어 가며 뽑습니다.
   세 명을 한꺼번에 만들면 서로의 초상을 못 봐서 같은 얼굴이 겹칩니다. */
function rollApplicants(n){
  G.applicants=[];
  for(let i=0;i<n;i++)G.applicants.push(rollStudent());

}

const pcOf=()=>(G.roster&&G.roster[0])||G.player;

function sayBlock(ln,defId){

  if(who==="na")return `<p>${t}</p>`;
  if(who==="pc"||who==="pc2")return `${pcHead(who==="pc2")}<p class="say">${t}</p>`;

const sayName=ln=>{
  const who=Array.isArray(ln)?ln[0]:null;

};
/* 팝업으로 이어지는 대사. 마지막 줄에서 onDone 이 돕니다 */
function popupTalk(lines,onDone){
  let i=0;
  const step=()=>{
    if(i>=lines.length){if(onDone)onDone();return}
    const ln=lines[i++],last=i>=lines.length;
    const who=Array.isArray(ln)?ln[0]:null, t=Array.isArray(ln)?ln[1]:ln;
    /* 나레이션은 글만, 말하는 사람이 있으면 초상을 옆에 붙입니다 */
    const face=!who||who==="na"?"":who==="pc"?pcFace():who==="pc2"?pc2Face():npcFace(who);
    popup(sayName(ln)||"　",face?`<div class="talkpop">${face}<p class="say">${t}</p></div>`:t,
          last?"확인":"계속",step,true);
  };
  step();
}

   나중에 ITEM_ART에 줄을 추가하면 그 자리에 그대로 들어갑니다. */
/* 어둠 강화판은 그림을 따로 만들지 않고 원본 것을 가져다 검은 아우라(.dk)만 덧입힙니다.
   그림이 없는 것은 마름모(.crys)나 빈 칸(.none)으로 대신 그립니다. */
const artOf=id=>ITEM_ART[baseOf(id)];
const darkCls=id=>!ITEMS[id]?"":ITEMS[id].dark?" dk":ITEMS[id].base?" wk":"";
const noArtCls=id=>ITEMS[id]&&ITEMS[id].crystal?"crys":"none";
const itemIcon=id=>artOf(id)
  ?`<img class="ico${darkCls(id)}" src="${artUrl(artOf(id))}" alt="">`
  :`<span class="ico ${noArtCls(id)}"></span>`;
/* 개수가 붙는 그림 — 탄약 뭉치에 남은 발수를 오른쪽 위에 얹습니다 */
/* 화살은 뭉치에 남은 양에 따라 그림이 바뀝니다 — 70% 이상 대량, 30% 미만 소량, 그 사이 중간.
   [소량, 중간, 대량] 순서. 한 발짜리를 5개·10개 겹쳐 만든 그림입니다 */
const AMMO_STACK_ART={ammoA:["item/ammoA-s.png","item/ammoA-m.png","item/ammoA-l.png"]};
const stackIcon=(id,n)=>{
  const set=AMMO_STACK_ART[id], q=ITEMS[id]&&ITEMS[id].qty;
  if(!set||n==null||!q)return itemIcon(id);
  const r=n/q;
  return `<img class="ico" src="${artUrl(set[r>=0.7?2:r<0.3?0:1])}" alt="">`;
};
const itemIconN=(id,n)=>`<span class="icow">${stackIcon(id,n)}${
  n===undefined||n===null?"":`<b class="cnt">${n}</b>`}</span>`;
/* itemArt 는 64px 큰 그림용입니다. 튜토리얼 전용 화면을 걷어낸 뒤로 쓰는 곳이 없습니다 */
const itemArt=id=>artOf(id)
  ?`<img class="bigart${darkCls(id)}" src="${artUrl(artOf(id))}" alt="">`
  :`<span class="bigart ${noArtCls(id)}"></span>`;
const facIcon=(id,fb)=>FAC_ART[id]?`<img class="bigico" src="${artUrl(FAC_ART[id])}" alt="">`:fb;

/* 전투용 아이템 이미지 — 손장비를 대원 손에 그릴 때 쓴다. 다 읽히기 전엔 null. */
const ISPR={};
function itemSprite(id){
  const rel=artOf(id);        /* 강화판은 원본 그림을 그대로 씁니다 */
  if(!rel)return null;
  let s=ISPR[id];
  if(s===undefined){
    s=new Image();s.ok=false;s.done=false;
    s.onload=()=>{s.ok=true;s.done=true};s.onerror=()=>{s.done=true};
    s.src=artUrl(rel);if(s.complete)s.done=true;ISPR[id]=s;
  }
  return s.ok?s:null;
}

/* ═══════════ 제목 그림 ═══════════
   그림이 준비되면 TITLE_ART에 경로만 넣으면 됩니다. 비어 있으면 아래 코드로 그립니다. */
const TITLE_ART=ART+"title.webp";
let traf=null,tcv=null,tctx=null,timg=null;
function titleStop(){if(traf)cancelAnimationFrame(traf);traf=null}
function titleStart(){
  titleStop();
  tcv=document.getElementById("tcv");
  if(!tcv)return;
  try{tctx=tcv.getContext("2d")}catch(e){tctx=null}
  if(!tctx)return;
  if(TITLE_ART&&!timg){timg=new Image();timg.src=TITLE_ART}
  const dpr=window.devicePixelRatio||1;
  const W=tcv.clientWidth||360,H=230;
  tcv.width=W*dpr;tcv.height=H*dpr;
  tctx.setTransform(dpr,0,0,dpr,0,0);
  let last=0,t=0;
  const loop=ts=>{
    const dt=last?Math.min(.05,(ts-last)/1000):0;last=ts;t+=dt;
    drawTitle(W,H,t);
    traf=requestAnimationFrame(loop);
  };
  traf=requestAnimationFrame(loop);
}
/* 달리는 사람 — 다리와 팔을 사인파로 흔듭니다 */
function drawRunner(c,x,y,s,t){
  const ph=t*11, bob=Math.abs(Math.sin(ph))*s*0.07;
  c.save();c.translate(x,y-bob);
  c.lineCap="round";c.lineJoin="round";
  const hipY=-s*0.52, shY=-s*1.02;
  // 뒤쪽 다리
  const legs=(a,col)=>{
    const knee=[Math.sin(a)*s*0.42, hipY+s*0.34-Math.abs(Math.cos(a))*s*0.10];
    const foot=[Math.sin(a-0.9)*s*0.60, hipY+s*0.74];
    c.strokeStyle=col;c.lineWidth=s*0.17;
    c.beginPath();c.moveTo(0,hipY);c.lineTo(knee[0],knee[1]);c.lineTo(foot[0],foot[1]);c.stroke();
  };
  const arms=(a,col)=>{
    const el2=[Math.sin(a)*s*0.34, shY+s*0.28];
    const hd=[Math.sin(a+0.7)*s*0.50, shY+s*0.16];
    c.strokeStyle=col;c.lineWidth=s*0.14;
    c.beginPath();c.moveTo(0,shY);c.lineTo(el2[0],el2[1]);c.lineTo(hd[0],hd[1]);c.stroke();
    return hd;
  };
  legs(ph+Math.PI,"#2B4A5E");
  arms(ph,"#2E6F82");
  // 몸통
  c.strokeStyle="#4FC3D9";c.lineWidth=s*0.30;
  c.beginPath();c.moveTo(-s*0.03,shY);c.lineTo(s*0.03,hipY);c.stroke();
  legs(ph,"#3A6480");
  const hand=arms(ph+Math.PI,"#4FC3D9");
  // 손에 들린 국자
  c.save();c.translate(hand[0],hand[1]);c.rotate(-0.5+Math.sin(ph)*0.35);
  c.strokeStyle="#C9C2D8";c.lineWidth=s*0.08;
  c.beginPath();c.moveTo(0,0);c.lineTo(s*0.46,-s*0.10);c.stroke();
  c.beginPath();c.arc(s*0.54,-s*0.12,s*0.11,0,7);c.fillStyle="#D8D2E4";c.fill();
  c.restore();
  // 머리
  c.beginPath();c.arc(s*0.07,shY-s*0.24,s*0.20,0,7);
  c.fillStyle="#E8C9A8";c.fill();
  c.beginPath();c.arc(s*0.05,shY-s*0.30,s*0.20,3.5,6.4);
  c.fillStyle="#2A2436";c.fill();
  c.restore();
}
function drawTitle(W,H,t){
  const c=tctx;
  if(TITLE_ART&&timg&&timg.complete&&timg.naturalWidth){
    const r=Math.max(W/timg.naturalWidth,H/timg.naturalHeight);
    const w=timg.naturalWidth*r,h=timg.naturalHeight*r;
    c.drawImage(timg,(W-w)/2,(H-h)/2,w,h);return;
  }
  const sky=c.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#251F38");sky.addColorStop(1,"#14111E");
  c.fillStyle=sky;c.fillRect(0,0,W,H);
  const gnd=H*0.80;
  // 게이트 빛무리
  const gx=W*0.76,gy=gnd-H*0.16;
  const pulse=0.50+0.14*Math.sin(t*1.7);
  const gl=c.createRadialGradient(gx,gy,3,gx,gy,H*0.62);
  gl.addColorStop(0,`rgba(158,116,242,${pulse})`);
  gl.addColorStop(.45,"rgba(124,91,217,.20)");
  gl.addColorStop(1,"rgba(124,91,217,0)");
  c.fillStyle=gl;c.fillRect(0,0,W,H);
  // 건물 실루엣
  c.fillStyle="#1B1728";
  const bl=[[0.02,.30],[0.14,.44],[0.29,.26],[0.42,.38],[0.55,.22],[0.90,.34]];
  for(const b of bl){
    const bw=W*0.13,bh=H*b[1],bx=W*b[0];
    c.fillRect(bx,gnd-bh,bw,bh);
    c.fillStyle="rgba(242,215,78,.13)";
    for(let i=0;i<3;i++)for(let j=0;j<2;j++)
      c.fillRect(bx+bw*(.20+j*.42),gnd-bh+bh*(.16+i*.24),bw*.18,bh*.10);
    c.fillStyle="#1B1728";
  }
  // 게이트
  c.save();c.translate(gx,gy);
  c.beginPath();
  c.moveTo(-30,H*0.16);c.lineTo(-30,-H*0.10);
  c.quadraticCurveTo(0,-H*0.30,30,-H*0.10);c.lineTo(30,H*0.16);c.closePath();
  const gg=c.createLinearGradient(0,-H*0.28,0,H*0.16);
  gg.addColorStop(0,`rgba(198,168,255,${0.30+0.10*Math.sin(t*2.3)})`);
  gg.addColorStop(1,"rgba(90,62,160,.55)");
  c.fillStyle=gg;c.fill();
  c.strokeStyle=`rgba(206,180,255,${0.55+0.20*Math.sin(t*2.3)})`;c.lineWidth=2.4;c.stroke();
  c.restore();
  // 지면
  c.fillStyle="#100D18";c.fillRect(0,gnd,W,H-gnd);
  c.strokeStyle="rgba(234,230,242,.16)";c.lineWidth=2;
  const off=(t*210)%56;
  for(let x=-56;x<W+56;x+=56){
    c.beginPath();c.moveTo(x-off,gnd+11);c.lineTo(x-off+26,gnd+11);c.stroke();
  }
  // 달리는 이경호
  drawRunner(c,W*0.31,gnd+2,H*0.30,t);
  // 발밑 먼지
  c.fillStyle="rgba(234,230,242,.10)";
  for(let i=0;i<4;i++){
    const d=((t*180+i*30)%90);
    c.beginPath();c.arc(W*0.31-d,gnd-1-i*2,2.4+i*0.5,0,7);c.fill();
  }
}

/* ═══════════ 저장 ═══════════
   G 안에는 함수를 물고 있는 것(스킬)과 표의 원본을 가리키는 것(장소)이 섞여 있어
   그대로 JSON으로 만들 수 없습니다. 저장할 때 번호로 바꾸고, 불러올 때 되돌립니다.
   전투 중에는 저장하지 않습니다. B(전투판)는 저장 대상이 아니라서,
   안전한 화면에서만 자동으로 기록합니다. */
const SAVE_SLOTS=3, SAVE_VER=3;
const OLD_KEY="ucw.save.v1";
const saveKey=i=>`ucw.save.v3.${i}`;
const curSlot=()=>(G&&G.slot!==undefined&&G.slot!==null)?G.slot:0;
const SAVE_SCENES=CAMPUS_SCENES.concat(["briefing","confirm","instant"]);

function storageOk(){
  try{localStorage.setItem("ucw.t","1");localStorage.removeItem("ucw.t");return true}
  catch(e){return false}
}
function packSave(){
  const d=JSON.parse(JSON.stringify({...G,
    player:null,instants:null,skillOffer:null,offer:null,here:null,lastGain:null}));
  const pi=G.roster.indexOf(G.player);
  d.playerIdx=pi;
  d.playerRaw=pi<0?JSON.parse(JSON.stringify(G.player)):null;
  d.instants=G.instants.map(x=>x.k);
  d.skillOffer=G.skillOffer?G.skillOffer.map(x=>x.k):null;
  d.offer=G.offer?G.offer.map(x=>PLACES.indexOf(x)).filter(i=>i>=0):null;
  d.here=G.here?PLACES.indexOf(G.here):null;
  return{v:SAVE_VER,t:Date.now(),g:d};
}
function unpackSave(sv){
  const d=sv.g;
  d.player=d.playerIdx>=0?d.roster[d.playerIdx]:d.playerRaw;
  d.instants=(d.instants||[]).map(skillOf).filter(Boolean);
  d.skillOffer=d.skillOffer?d.skillOffer.map(skillOf).filter(Boolean):null;
  if(!d.itemSeen)d.itemSeen={};
  /* 신재혁 전용 초상이 없던 저장본 — 어나니머스로 들어온 신재혁에게 초상을 줍니다 */
  for(const r of [...(d.roster||[]),...(d.memorial||[])])
    if(r&&r.name==="신재혁"&&(!r.face||r.face===FACE_ART.anon.m))r.face=FACE_ART.shin;
  /* 메모리얼 홀에 얼굴을 적지 않던 시절의 사망자 — 누구 얼굴이었는지 남은 기록이 없어 어나니머스로 둡니다 */
  for(const m of (d.memorial||[]))if(m&&!m.face)m.face=FACE_ART.anon[m.sex||"m"];
  /* 지운 초상이나 남의 전용 초상을 가진 사람 — 남은 풀에서 새 얼굴을, 없으면 어나니머스를 줍니다 */
  {
    const bad=r=>r&&r.face&&(FACE_GONE.includes(r.face)||(FACE_OWNER[r.face]&&FACE_OWNER[r.face]!==r.name));
    const people=[...(d.roster||[]),...(d.memorial||[]),...(d.applicants||[])].filter(Boolean);
    const used=new Set([...(d.facesUsed||[]),...people.map(r=>r.face)]);
    for(const r of people)if(bad(r)){
      const sex=r.sex||"m";
      const pool=(FACE_ART[sex]||[]).filter(f=>!used.has(f)&&!FACE_OWNER[f]);
      r.face=pool.length?pool[(Math.random()*pool.length)|0]:FACE_ART.anon[sex];
      used.add(r.face);
      if(d.facesUsed&&!isAnon(r.face))d.facesUsed.push(r.face);
    }
    if(d.facesUsed)d.facesUsed=d.facesUsed.filter(f=>!FACE_GONE.includes(f));
  }
  if(!d.tips)d.tips={};                  /* 안내창 기록이 없던 저장본 */
  /* 수갑 기록이 없던 저장본 — 이미 들고 온 수갑이 있으면 주운 것으로 칩니다 */
  if(d.cuffsGot===undefined)d.cuffsGot=!!((d.itemSeen||{}).cuffs||(d.loot||{}).cuffs||(d.store||{}).cuffs
    ||(d.roster||[]).some(r=>r&&(r.bag||[]).includes("cuffs")));
  if(!d.shopSold)d.shopSold=[];          /* 매점 재고 기록이 없던 저장본 */
  if(d.shopDay===undefined)d.shopDay=-1;
  if(!d.cleared)d.cleared=[];            /* 게이트 클리어 기록이 없던 저장본 */
  if(!d.gate)d.gate="front";
  if(d.chemKills===undefined)d.chemKills=0;
  /* 정원·출입 인가가 없던 저장본 — 그 시절에 쓰던 값(명단 그대로, 4인 출입)으로 둡니다 */
  if(d.dorm===undefined)d.dorm=Math.max(DORM_START,(d.roster||[]).length);
  if(d.squad===undefined)d.squad=SQUAD_MAX;
  /* 전공 정원·복수전공이 없던 저장본 */
  if(!d.majorCap)d.majorCap={};
  if(d.dualOpen===undefined)d.dualOpen=false;
  if(d.bookSold===undefined)d.bookSold=0;
  /* 이번 판에 새로 생긴 칸들 — 없던 저장본은 빈 값으로 채웁니다 */
  if(!d.gateDay)d.gateDay={};
  if(!d.bossKilled)d.bossKilled={};
  if(!d.questDone)d.questDone=[];
  if(d.bowKills===undefined)d.bowKills=0;
  if(d.kitFrom===undefined)d.kitFrom=null;
  /* 탄약이 본부에 쌓이던 시절의 저장본 — 쌓여 있던 것을 창고의 뭉치로 바꿉니다 */
  if(d.ammo){
    d.store=d.store||{};
    for(const t of Object.keys(AMMO_ID)){
      const n=Math.floor((d.ammo[t]||0)/ammoQty(t));
      if(n>0)d.store[AMMO_ID[t]]=(d.store[AMMO_ID[t]]||0)+n;
    }
    delete d.ammo;
  }
  for(const r of [...(d.roster||[]),d.playerRaw].filter(Boolean))
    if(!r.ammo)r.ammo=EMPTY_AMMO();
  /* 양손 무기가 생기기 전의 저장본 — 활·총과 왼손을 같이 든 사람은 왼손 것을 배낭(자리 없으면 창고)으로 */
  for(const r of (d.roster||[]))
    if(r&&r.gear&&twoHand(r.gear.rh)&&r.gear.lh){
      const lh=r.gear.lh;r.gear.lh=null;
      if(bagRoom(r)>0)r.bag.push(lh);else{d.store=d.store||{};d.store[lh]=(d.store[lh]||0)+1}
      r.hp=Math.max(1,Math.min(r.hp,derive(r).maxHp));
    }
  d.offer=d.offer?d.offer.map(i=>PLACES[i]).filter(Boolean):null;
  d.here=(d.here===null||d.here===undefined)?null:PLACES[d.here];
  d.lastGain=null;
  delete d.playerIdx;delete d.playerRaw;
  return d;
}
function saveGame(){
  try{localStorage.setItem(saveKey(curSlot()),JSON.stringify(packSave()));return true}
  catch(e){return false}
}
function readSave(i){
  try{
    const t=localStorage.getItem(saveKey(i));
    if(!t)return null;
    const sv=JSON.parse(t);
    return(sv&&sv.v===SAVE_VER&&sv.g&&sv.g.roster)?sv:null;
  }catch(e){return null}
}
function deleteSave(i){try{localStorage.removeItem(saveKey(i))}catch(e){}}
function anySave(){for(let i=0;i<SAVE_SLOTS;i++)if(readSave(i))return true;return false}
/* 파일이 하나뿐이던 시절의 기록을 1번 자리로 옮겨 줍니다 */
function migrateSave(){
  try{
    const t=localStorage.getItem(OLD_KEY);
    if(!t)return;
    if(!localStorage.getItem(saveKey(0))){
      const sv=JSON.parse(t);
      if(sv&&sv.g&&sv.g.roster){sv.v=SAVE_VER;sv.g.slot=0;
        localStorage.setItem(saveKey(0),JSON.stringify(sv))}
    }
    localStorage.removeItem(OLD_KEY);
    for(let i=0;i<SAVE_SLOTS;i++)localStorage.removeItem(`ucw.save.v2.${i}`);
  }catch(e){}
}
function saveLabel(sv){
  const g=sv.g;
  const where=g.scene==="instant"?`게이트 ${g.day}일차 진행 중`:g.mode==="tutorial"?"튜토리얼":"본진";
  return `${where} · 대원 ${g.roster.length}명 · 골드 ${g.gold} · 탐색 ${g.explores}회`;
}
function saveTime(sv){
  const d=new Date(sv.t),z=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}.${z(d.getMonth()+1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}

let G,feed=[];
function bootGame(){migrateSave();G={scene:"title"};feed=[];armBack();render()}
function newGame(slot){

function knockBack(u,t,amt){
  if(t.boss||t.hp<=0)return;
  amt*=(u&&u.knockM)||1;
  const dx=t.x-u.x, dy=t.y-u.y, d=Math.hypot(dx,dy)||1;
  const nx=t.x+dx/d*amt, ny=t.y+dy/d*amt;
  if(!blocked(nx,t.y,t.r,t.lvm))t.x=nx;
  if(!blocked(t.x,ny,t.r,t.lvm))t.y=ny;
}

function blocked(x,y,r,mask){
  if(x<r||x>100-r||y<r||y>100-r)return true;
  for(const o of ROOM.obs){
    if(o.mul)continue;                       // mul 있는 칸은 벽이 아니라 감속 지대
    if(!(o.lv&mask))continue;
    const cx=Math.max(o.x,Math.min(x,o.x+o.w)),cy=Math.max(o.y,Math.min(y,o.y+o.h));
    if((x-cx)**2+(y-cy)**2<r*r)return true;
  }
  return false;
}
/* 감속·가속 지대 — mul 있는 사각형 안에 중심이 들어가면 이동 속도에 곱해진다. lv 로 대상 층 선택. */
/* 건축학과 해금 — 게이트 안에서 들어가 본 장소(방 id)를 적어 둡니다 */
function seePlace(pl){
  G.placesSeen=G.placesSeen||[];
  if(pl&&!G.placesSeen.includes(pl.room))G.placesSeen.push(pl.room);
}
/* noSlow — 구조 파악+. 느리게 만드는 칸(mul<1)만 건너뜁니다 */
function terrainMul(x,y,mask,noSlow){
  let m=1;
  for(const o of ROOM.obs){
    if(!o.mul||!(o.lv&mask))continue;
    if(noSlow&&o.mul<1)continue;
    if(x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h)m*=o.mul;
  }
  return m;
}
function freeSpot(x,y,r,mask){
  if(!blocked(x,y,r,mask))return{x,y};
  for(let k=1;k<90;k++){
    const a=k*1.1,rad=1+k*0.7;
    const nx=Math.max(r,Math.min(100-r,x+Math.cos(a)*rad));
    const ny=Math.max(r,Math.min(100-r,y+Math.sin(a)*rad));
    if(!blocked(nx,ny,r,mask))return{x:nx,y:ny};
  }
  return{x,y};
}
/* 설 수 있는 자리이면서 **대원 쪽과 이어져 있는** 자리를 찾습니다.
   빈 자리이기만 하면 된다고 보면, 덩치 큰 것이 사방 막힌 주머니에 떨어져 영영 못 나옵니다 —
   음식점 위쪽은 좀비(r6.2)가 설 수 있는 데가 주머니뿐이었습니다.
   distField 가 -1 인 칸은 대원 자리에서 닿지 않는 칸입니다. */
function reachSpot(x,y,r,mask){
  const AS=spawnAt().a;
  const gx=AS.reduce((s,p)=>s+p[0],0)/AS.length, gy=AS.reduce((s,p)=>s+p[1],0)/AS.length;
  const d=distField(mask,rBucket(r),gx,gy);
  const ok=(px,py)=>!blocked(px,py,r,mask)&&d[cIdx(toCell(px),toCell(py))]>=0;
  if(ok(x,y))return{x,y};
  for(let k=1;k<200;k++){
    const a=k*1.1,rad=1+k*0.55;
    const nx=Math.max(r,Math.min(100-r,x+Math.cos(a)*rad));
    const ny=Math.max(r,Math.min(100-r,y+Math.sin(a)*rad));
    if(ok(nx,ny))return{x:nx,y:ny};
  }
  return freeSpot(x,y,r,mask);     /* 정말 아무 데도 없으면 예전처럼 */
}
